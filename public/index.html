<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Heiz-Hawara</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#bb005d" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = localStorage.getItem('thm');
        if (t == 'light' || t == 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* ===== Stile ====================================================================================
         Aufbau: Farben (Design-Tokens, hell/dunkel) → Grundelemente → Bausteine → Layout je Bildschirmgröße.
         Klassennamen sind bewusst kurz. Wichtigste Abkürzungen:
           .mu  = muted (gedämpfter Text)        .er  = error (Fehlerfarbe)       .tag = kleines Etikett
           .kt  = Kurztext (Titel einer Karte)   .cl  = clickable (Karte anklickbar)  .dn = done (erledigt, blasser)
           .it  = item (ein Prüfobjekt, Monteur) .li  = Listenzeile (ein Prüfobjekt, Dispo, nur Ansicht)
           .ob  = Button-Reihe (OK / Nicht OK)   .ed  = Editor für den Nicht-OK-Text   .cfm = Rückfrage „Alles OK“
           .zt  = Zeile der Zeitkarte            .qk  = Schnellwahl-Buttons            .flt = Filterleiste (Dispo)
           .mkr = Zeile „Abhaken“ (Dispo)        .g*  = Fortschrittsgrafik aller Teams (Dispo)
           .vg* = Vergleichsseite (Dispo)        .dlg = Dialog
         Farb-Variablen: --bg Hintergrund, --card Karte, --tx Text, --mu gedämpft, --ac/--act Akzent (Wiener-Netze-Magenta),
         --bd Rahmen, --er Fehler, --ok erledigt/OK, --nk Nicht OK, --g1/--g2/--gt Balken (in Arbeit/erledigt/offen).
         ================================================================================================= */
      /* ---- Schrift: Inter (eigene Dateien in /fonts, kein Abruf von Fremdservern, funktioniert offline). Lizenz: OFL, siehe fonts/LICENSE-Inter.txt.
         Das Skript zeichnet die Seite erst, wenn die Schrift geladen ist (siehe fontsLoaded), sonst würde der Text beim Nachladen springen. ---- */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/inter-medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/inter-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/inter-bold.woff2') format('woff2');
      }
      /* ---- Farben: hell (Standard), dunkel per Systemeinstellung oder Schalter (data-theme am <html>) ----
         --acs = sehr helle Tönung des Akzents (Hover/Auswahl), --ring = Fokusring, --r/--rc = Rundung Bedienelemente/Karten,
         --sh1/--sh2 = Schatten (Karte / schwebendes Element) */
      :root {
        --bg: #f3f3f7;
        --card: #fff;
        --tx: #18181d;
        --mu: #62616c;
        --ac: #bb005d;
        --act: #bb005d;
        --bd: #e3e2ea;
        --er: #c4320a;
        --ok: #067647;
        --run: #0b62c4;
        --nk: #c4320a;
        --gb1: #b45309;
        --gb2: #c2410c;
        --gb3: #c4320a;
        --g1: #5fb085;
        --g2: #067647;
        --gt: #e3e2e9;
        --acs: color-mix(in srgb, var(--ac) 7%, var(--card));
        --ring: color-mix(in srgb, var(--ac) 30%, transparent);
        --r: 12px;
        --rc: 14px;
        --sh1: 0 1px 2px rgba(24, 24, 29, 0.05), 0 1px 3px rgba(24, 24, 29, 0.04);
        --sh2: 0 8px 22px rgba(24, 24, 29, 0.12);
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #111115;
          --card: #1b1b21;
          --tx: #ececf1;
          --mu: #a2a1ac;
          --ac: #d1176f;
          --act: #f06baa;
          --bd: #2b2b34;
          --er: #f2704f;
          --ok: #15803d;
          --run: #2563eb;
          --nk: #d0421a;
          --gb1: #fbbf24;
          --gb2: #fb923c;
          --gb3: #d0421a;
          --g1: #2e6e4c;
          --g2: #22a35a;
          --gt: #33333c;
          --sh1: 0 1px 2px rgba(0, 0, 0, 0.35);
          --sh2: 0 8px 22px rgba(0, 0, 0, 0.45);
        }
      }
      :root[data-theme='dark'] {
        --bg: #111115;
        --card: #1b1b21;
        --tx: #ececf1;
        --mu: #a2a1ac;
        --ac: #d1176f;
        --act: #f06baa;
        --bd: #2b2b34;
        --er: #f2704f;
        --ok: #15803d;
        --run: #2563eb;
        --nk: #d0421a;
        --gb1: #fbbf24;
        --gb2: #fb923c;
        --gb3: #d0421a;
        --g1: #2e6e4c;
        --g2: #22a35a;
        --gt: #33333c;
        --sh1: 0 1px 2px rgba(0, 0, 0, 0.35);
        --sh2: 0 8px 22px rgba(0, 0, 0, 0.45);
      }
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* ---- Grundlayout ---- */
      html {
        scroll-padding-top: calc(var(--toph, 52px) + 8px);
        overflow-anchor: none;
      }
      /* Schriftgröße ändern: die Seite wechselt sofort und blendet vom alten zum neuen Bild über (siehe changeFontScale).
         font-size selbst wird bewusst nicht animiert – bei jedem Zwischenschritt würden Texte neu umbrechen und die Seite springen. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.22s;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          1rem/1.45 'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-size-adjust: 100%;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 8px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
        /* Einblendungen schieben Karten seitlich herein: der Überstand darf die Seite nicht breiter machen (sonst lässt sie
           sich während der Animation seitlich verschieben und wackelt). clip statt hidden, damit „sticky“ weiter klappt. */
        overflow-x: clip;
      }
      body[data-w='n'] main {
        max-width: 560px;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 8px 0 16px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap; /* bei großer Schrift auf schmalem Handy rutscht der Knopf unter die Überschrift, statt über den Rand zu ragen */
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .bar h1 {
        margin: 0;
      }
      .bar button {
        white-space: nowrap;
        flex: 0 0 auto;
      }
      /* ---- Bedienelemente ---- */
      button,
      select,
      input[type='search'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 14px;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
        font-weight: 500;
        box-shadow: var(--sh1);
      }
      /* Knöpfe ohne eigenen Hintergrund (Link, Hell/Dunkel, Schließen-Kreuz) bekommen keinen Schatten */
      button.lk,
      .thm,
      .msg.dx > .x,
      .grows .grow {
        box-shadow: none;
      }
      button.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 1px 2px color-mix(in srgb, var(--ac) 45%, transparent);
      }
      button.big {
        display: block;
        width: 100%;
        padding: 18px;
        font-size: 1.125rem;
        margin-bottom: 10px;
        text-align: left;
      }
      button.er {
        color: var(--er);
      }
      /* ---- Karten, Etiketten, Meldungen, Statusfarben ---- */
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--rc);
        box-shadow: var(--sh1);
        padding: 12px 14px;
        margin-bottom: 10px;
        overflow-wrap: break-word;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tag {
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 1px 8px;
        color: var(--mu);
      }
      /* gleich breite Ziffern nur für reine Zahlen (Auftragsnummer, Prozent, Zähler): bei „FW-IH01“ oder „M-0021-02“ würden die Bindestriche zu breit */
      .row > b,
      .prg .pp,
      .prg .pn {
        font-variant-numeric: tabular-nums;
      }
      .kt {
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 6px 0 2px;
      }
      .mu {
        color: var(--mu);
        font-size: 0.875rem;
      }
      /* Zeile „N Aufträge · Standort …“ über der Liste: immer genau eine Zeile (ändert sich der Text, springt die Liste nicht) */
      .cnt {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg {
        padding: 10px 12px;
        border-radius: var(--r);
        border: 1px solid var(--bd);
        box-shadow: var(--sh1);
        margin-bottom: 12px;
        background: var(--card);
      }
      .msg.er {
        color: var(--er);
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .tools input {
        flex: 1;
        min-width: 0;
      }
      label.ck {
        display: block;
        margin: 10px 0;
        font-size: 0.875rem;
        color: var(--mu);
      }
      .card.cl {
        cursor: pointer;
      }
      .chev {
        margin-left: auto;
        color: var(--mu);
        font-size: 0.875rem;
      }
      .li {
        padding: 8px 0;
        border-top: 1px solid var(--bd);
      }
      .card button.pri {
        margin-top: 10px;
      }
      .mu.er {
        color: var(--er);
      }
      .tag.st-ok {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      /* gestartet (Start gedrückt): blau; erledigt: grün (st-ok). Die Karte trägt dazu eine farbige Kante links – als innerer Schatten, damit
         sich Breite und Umbruch nicht ändern, wenn ein Auftrag live gestartet oder erledigt wird */
      .tag.st-run {
        background: var(--run);
        border-color: var(--run);
        color: #fff;
      }
      .tag.st-nok {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      .tag.st-teil {
        border-color: var(--ac);
        color: var(--act);
      }
      .tag.st-zf {
        background: rgba(196, 50, 10, 0.14);
        border-color: var(--nk);
        color: var(--er);
        font-weight: 700;
      }
      /* Gebrechen (Meldung mit Codierung „Gebrechen leicht/mittel/stark“): Etikett mit der Schwere und eine farbige Kante an Karte bzw. Meldung.
         Stufen: 1 leicht (gelb), 2 mittel (orange), 3 stark (rot, Etikett gefüllt). Die Kante ist wie beim überfälligen Auftrag ein Rahmen links. */
      .tag.gb {
        font-weight: 600;
        color: var(--c);
        border-color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, var(--card));
      }
      .tag.gb-1 {
        --c: var(--gb1);
      }
      .tag.gb-2 {
        --c: var(--gb2);
      }
      .tag.gb-3 {
        --c: var(--gb3);
        color: #fff;
        background: var(--gb3);
      }
      .card.gb-c1 {
        border-left: 4px solid var(--gb1);
      }
      .card.gb-c2 {
        border-left: 4px solid var(--gb2);
      }
      .card.gb-c3 {
        border-left: 4px solid var(--gb3);
      }
      .it.gbi {
        padding-left: 8px;
      }
      .it.gb-c1 {
        border-left: 3px solid var(--gb1);
      }
      .it.gb-c2 {
        border-left: 3px solid var(--gb2);
      }
      .it.gb-c3 {
        border-left: 3px solid var(--gb3);
      }
      .nokbox {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--nk);
        font-size: 0.875rem;
      }
      .nokbox b {
        color: var(--er);
      }
      /* ---- Filter-Chips ---- */
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .chip.nk.on {
        background: var(--nk);
        border-color: var(--nk);
      }
      .chips.ab {
        align-items: center;
      }
      /* ---- Prüfobjekte: Monteur (.it) mit OK / Nicht OK, Rückfrage „Alles OK“ (.cfm) ---- */
      .it {
        padding: 10px 0;
        border-top: 1px solid var(--bd);
      }
      .it .t {
        margin-bottom: 8px;
        word-break: break-word;
      }
      .it .t .orig {
        font-size: 0.75rem;
        color: var(--mu);
        opacity: 0.8;
        margin-top: 2px;
      }
      .ob {
        display: flex;
        gap: 8px;
      }
      .ob button {
        flex: 1;
        padding: 12px 8px;
      }
      .ob button.ok.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .ob button.nk.on {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      /* abgehakter Auftrag (Monteur): Prüfobjekte nur ansehen */
      .ob button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .lockn {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-color: var(--ac);
      }
      button.allok {
        display: block;
        width: 100%;
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        padding: 14px;
        font-size: 1.0625rem;
        margin: 10px 0;
      }
      .cfm {
        margin: 10px 0;
        padding: 12px;
        border: 2px solid var(--ok);
        border-radius: var(--r);
      }
      .cfm .ob {
        margin-top: 10px;
      }
      .cfm button {
        padding: 14px 8px;
        font-size: 1rem;
      }
      .cfm button.yes {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .mk {
        display: inline-block;
        width: 1.4em;
      }
      /* ---- Tabs der Disponentenansicht, Texteingaben ---- */
      /* Tabs: füllen immer die ganze Breite, nichts wird abgeschnitten und nichts muss gewischt werden. Am Handy drei Zeilen (3 + 3 + 2 Tabs,
         jede Zeile in gleich breite Tabs geteilt), ab 52 em Breite eine Zeile mit acht gleich breiten Tabs (siehe @media unten).
         Die Breite hängt nicht vom Text ab (flex-basis 0): wird der aktive Tab fett oder ändert sich die Zahl am Tab „Disposition“,
         bleiben die Nachbarn stehen. Nur wenn ein Text sonst nicht hineinpasste, wird sein Tab breiter (min-width: auto) statt ihn zu kappen.
         Die Schrift schrumpft auf sehr schmalen Handys (320 px) von 14 auf 12 px, damit auch „Disposition (123)“ in seine Zeile passt. */
      .tabs {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }
      .tabs .trow {
        display: flex;
        gap: 6px;
      }
      .tabs button {
        flex: 1 1 0;
        white-space: nowrap;
        padding: 10px 6px;
        font-size: clamp(0.75rem, 3.7vw, 0.875rem);
      }
      /* erste Zeile (Übersicht, Disposition, Fortschritt): „Disposition (n)“ ist der längste Text und bekommt etwas mehr Platz */
      .tabs .trow:first-child button:nth-child(2) {
        flex-grow: 1.35;
      }
      .tabs button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 1px 2px color-mix(in srgb, var(--ac) 45%, transparent);
      }
      /* ab 52 em alle acht Tabs in einer Zeile (die Zeilen lösen sich auf: display: contents); darunter bleiben es drei Zeilen – acht Tabs mit
         „Disposition (123)“ brauchen etwa 780 px */
      @media (min-width: 52em) {
        .tabs {
          display: flex;
        }
        .tabs .trow {
          display: contents;
        }
        .tabs button,
        .tabs .trow:first-child button:nth-child(2) {
          flex: 1 1 0;
          padding: 10px;
        }
      }
      /* ---- Chat (Team <-> Disponent) ----
         Die Seite selbst rollt im Chat nicht: <main> ist genau so hoch wie der Bildschirm (body[data-chat]), der Verlauf (.cthr) rollt in sich,
         Eingabe (.ccomp) steht fest darunter. Neue Nachrichten verändern so nur den Verlauf, nie die Seite (kein Anker, kein Springen), und
         Kopfzeile und Tabs bleiben immer erreichbar. Der Verlauf steht unten (erstes Kind: margin-top auto; justify-content: flex-end verlöre
         beim Rollen den Anfang). */
      body[data-chat] main {
        box-sizing: border-box;
        height: calc(100vh - var(--toph, 52px));
        height: calc(100dvh - var(--toph, 52px));
        display: flex;
        flex-direction: column;
        padding-bottom: 8px;
      }
      body[data-chat] main > * {
        flex: 0 0 auto;
      }
      body[data-chat] main > .cwrap {
        flex: 1 1 0;
        min-height: 12rem;
      }
      body[data-chat] .made {
        display: none;
      }
      .cwrap {
        display: flex;
        gap: 12px;
        min-height: 0;
      }
      .clist {
        flex: 0 0 18rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-height: 0;
        padding: 1px;
      }
      .crow {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 8px;
        align-items: baseline;
        width: 100%;
        text-align: left;
        padding: 9px 12px;
        flex: 0 0 auto;
      }
      .crow.on {
        border-color: var(--ac);
        background: var(--acs);
      }
      .crow .crn {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crow.un .crn {
        color: var(--act);
      }
      .crow .crt,
      .crow .crp {
        font-size: 0.8125rem;
        color: var(--mu);
      }
      .crow .crp {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crow.un .crp {
        color: var(--tx);
        font-weight: 500;
      }
      /* Zähler: nimmt immer denselben Platz ein (unsichtbar bei 0), damit die Zeile nicht breiter oder höher wird, wenn eine Nachricht kommt */
      .cbadge {
        display: inline-block;
        box-sizing: border-box;
        min-width: 1.5rem;
        padding: 0 6px;
        border-radius: 10px;
        background: var(--ac);
        color: #fff;
        font-size: 0.75rem;
        font-weight: 700;
        line-height: 1.4rem;
        text-align: center;
        visibility: hidden;
      }
      .cbadge.on {
        visibility: visible;
      }
      .cpane {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--rc);
        box-shadow: var(--sh1);
        overflow: hidden;
      }
      .cpane.chat1 {
        min-height: 12rem;
      }
      body[data-chat] main > .cpane {
        flex: 1 1 0;
      }
      .chead {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--bd);
        min-height: 2.75rem;
        box-sizing: border-box;
      }
      .chead b {
        flex: 0 0 auto;
        font-size: 1.0625rem;
        white-space: nowrap;
      }
      .chead .mu {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chead .cback {
        display: none;
        padding: 6px 10px;
        flex: 0 0 auto;
      }
      .cthr {
        flex: 1 1 0;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 10px 14px;
      }
      .cthr > :first-child {
        margin-top: auto;
      }
      .cday {
        align-self: center;
        flex: 0 0 auto;

      .dlg {
        border: 1px solid var(--bd);
        border-radius: 18px;
        padding: 0;
        background: var(--card);
        color: var(--tx);
        width: min(calc(100vw - 32px), 26rem);
        max-width: none;
        box-shadow: var(--sh2), 0 18px 48px rgba(0, 0, 0, 0.22);
      }
      .dlg::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      .dlg-b {
        padding: 18px;
      }
      .dlg-t {
        font-size: 1.125rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .dlg p {
        margin: 8px 0;
      }
      .dlg ul {
        margin: 6px 0 10px;
        padding-left: 1.2em;
      }
      .dlg li {
        margin: 4px 0;
        color: var(--er);
        font-weight: 600;
      }
      .dlg .ob {
        flex-wrap: wrap;
        margin-top: 14px;
      }
      .dlg .ob button {
        flex: 1 1 10rem;
        padding: 12px 10px;
      }
      /* ---- Fortschritt aller Teams (Disponent) ---- */
      .gbar {
        display: flex;
        gap: 2px;
        height: 16px;
        min-width: 0;
      }
      .gbar.big {
        height: 20px;
        margin: 10px 0 12px;
      }
      .gbar span {
        flex: 0 1 0;
        min-width: 3px;
      }
      .gbar span:last-child {
        border-radius: 0 4px 4px 0;
      }
      .g2 {
        background: var(--g2);
      }
      .g1 {
        background: var(--g1);
      }
      .g0 {
        background: var(--gt);
      }
      .sw {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 2px;
        margin-right: 6px;
        vertical-align: -1px;
      }
      .sw.g0 {
        box-shadow: inset 0 0 0 1px var(--mu);
      }
      .ghero {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-top: 4px;
      }
      .gp {
        font-size: 3rem;
        font-weight: 700;
        line-height: 1.05;
      }
      .gkpi {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr));
        gap: 8px;
      }
      .kpi {
        background: var(--bg);
        border-radius: 8px;
        padding: 8px 10px;
      }
      .kv {
        font-size: 1.25rem;
        font-weight: 700;
        margin-top: 2px;
      }
      .kv.er {
        color: var(--er);
      }
      .ghead {
        display: flex;
        gap: 8px 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .ghead .chips {
        margin: 0;
      }
      .gsub {
        display: flex;
        gap: 8px 16px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin: 10px 0 4px;
      }
      .gsub .chips {
        margin: 0;
        align-items: center;
      }
      .glg {
        display: flex;
        gap: 6px 14px;
        flex-wrap: wrap;
        font-size: 0.875rem;
        color: var(--mu);
      }
      .grows {
        display: grid;
        grid-template-columns: fit-content(40%) minmax(3rem, 1fr) max-content auto;
        column-gap: 12px;
        margin-top: 4px;
      }
      .grr {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1/-1;
        align-items: center;
      }
      .grr + .grr {
        border-top: 1px solid var(--bd);
      }
      .grows .grow {
        display: grid;
        grid-template-columns: subgrid;
        grid-column: 1/4;
        align-items: center;
        padding: 10px 6px;
        margin: 0 -6px;
        background: none;
        border: 0;
        border-radius: 0;
        color: var(--tx);
        text-align: left;
        font: inherit;
      }
      .gn {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .gv {
        text-align: right;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
      }
      .gnk {
        display: block;
        font-size: 0.75rem;
        color: var(--er);
        font-weight: 600;
      }
      .gtw {
        overflow-x: auto;
        margin-top: 8px;
      }
      .gt {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
        font-size: 0.875rem;
      }
      .gt th,
      .gt td {
        padding: 8px 10px;
        border-bottom: 1px solid var(--bd);
        text-align: left;
        white-space: nowrap;
      }
      .gt th {
        color: var(--mu);
        font-weight: 600;
      }
      .gt .n {
        text-align: right;
      }
      .gt tfoot td {
        font-weight: 700;
        border-bottom: 0;
      }
      .gt tbody tr {
        cursor: pointer;
      }
      .gt .er {
        color: var(--er);
      }
      .tip {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 20;
        display: none;
        pointer-events: none;
        background: var(--card);
        color: var(--tx);
        border: 1px solid var(--bd);
        border-radius: 8px;
        padding: 8px 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        font-size: 0.875rem;
        min-width: 9rem;
      }
      .tip .tr {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-top: 3px;
      }
      .tip .lk {
        display: inline-block;
        width: 12px;
        height: 3px;
        border-radius: 2px;
      }
      .tip .er {
        color: var(--er);
      }
      @media (hover: hover) {
        .grows .grow:not(:disabled):hover {
          filter: none;
          background: var(--bg);
        }
        .gt tbody tr:hover {
          background: var(--bg);
        }
      }
      @media (max-width: 599px) {
        .grows {
          display: block;
        }
        .grr {
          grid-template-columns: minmax(0, 1fr) auto;
          column-gap: 8px;
        }
        .grows .grow {
          grid-column: 1;
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          grid-template-areas: 'n v' 'b b';
          gap: 6px 12px;
        }
        .grows .gn {
          grid-area: n;
        }
        .grows .gv {
          grid-area: v;
        }
        .grows .gbar {
          grid-area: b;
        }
      }
      @media (min-width: 1100px) {
        .gpage {
          display: grid;
          grid-template-columns: minmax(0, 24rem) minmax(0, 1fr);
          gap: 16px;
          align-items: start;
          margin-bottom: 16px; /* Abstand zur Karte darunter (Gaswarngerät); die Karten im Raster haben keinen eigenen */
        }
        .gpage > .card {
          margin: 0;
        }
      }
      /* ---- Nachrichten / Push ---- */
      .gmsg {
        padding: 8px 10px;
        font-size: 1.05rem;
        line-height: 1.2;
      }
      .gmsg.on {
        border-color: var(--ac);
        background: color-mix(in srgb, var(--ac) 10%, var(--card));
      }
      .gms {
        display: block;
        font-size: 0.75rem;
        color: var(--mu);
        margin-top: 1px;
      }
      .mdlg {
        border-top: 6px solid var(--ac);
      }
      /* ---- Gaswarngerät (Bestätigung je Team) ---- */
      .gasl {
        margin: 4px 0 8px;
      }
      .gasl.ok {
        color: var(--ok);
        font-weight: 600;
      }
      .gasnav {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }
      .gasnav input[type='date'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 9px 12px;
      }
      .gasg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(12rem, 1fr));
        gap: 8px;
        margin: 8px 0;
      }
      .gast {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 8px 10px;
        border: 1px solid var(--bd);
        border-radius: 8px;
        font-size: 0.875rem;
      }
      .gast.ok span {
        color: var(--ok);
      }
      .gast.no {
        border-color: var(--er);
      }
      .gast.no span {
        color: var(--er);
        font-weight: 600;
      }
      .gast.ok span .mu {
        color: var(--mu);
      }
      .mtx {
        font-size: 1.125rem;
        font-weight: 600;
        white-space: pre-wrap;
        overflow-wrap: break-word;
      }
      .dlg p:empty {
        display: none;
      }
      .dlg textarea {
        margin: 8px 0 4px;
      }
      .amsg {
        margin: 8px 0;
        padding: 8px 10px;
        border: 1px solid var(--ac);
        border-radius: 8px;
        font-size: 0.875rem;
      }
      .amsg > div {
        margin-top: 2px;
        white-space: pre-wrap;
      }
      .amsg button {
        margin-top: 8px;
        padding: 6px 10px;
        font-size: 0.875rem;
      }
      .msg.er > button {
        display: block;
        margin: 10px 0 0;
        padding: 8px 14px;
      }
      .msg.er > .mu {
        margin-top: 4px;
      }
      .msg.dx {
        position: relative;
        padding-right: 44px;
      }
      .msg.dx > .x {
        position: absolute;
        top: 4px;
        right: 4px;
        margin: 0;
        padding: 6px 10px;
        background: none;
        border: 0;
        color: var(--mu);
        font-size: 1rem;
        line-height: 1;
      }
      .msg.pb {
        display: flex;
        gap: 8px 12px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .msg.pb button {
        margin: 0;
        padding: 8px 14px;
        font-size: 0.875rem;
      }
      .top.sc {
        box-shadow:
          0 1px 0 var(--bd),
          0 4px 12px rgba(0, 0, 0, 0.06);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 16px);
        width: max-content;
        max-width: min(calc(100vw - 32px), 32rem);
        background: var(--tx);
        color: var(--bg);
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-size: 0.9375rem;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 30;
        cursor: pointer;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      /* ---- Vergleichsseite (Disponent) ---- */
      .fpick {
        display: inline-block;
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 14px;
        cursor: pointer;
      }
      .fpick input {
        display: none;
      }
      .fnm {
        margin: 8px 0 0;
        word-break: break-all;
      }
      /* Upload: der Dateiname steht immer in einer Zeile (gekürzt) – die Auswahl einer Datei ändert die Höhe der Karte nicht */
      .fnm.one {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        word-break: normal;
      }
      .fpick.off {
        opacity: 0.5;
        cursor: default;
      }
      .fpick.off:active {
        transform: none;
        filter: none;
      }
      .ugrid button.pri:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .vgbtn {
        display: block;
        width: 100%;
        margin: 0 0 12px;
        padding: 12px;
      }
      .vgbtn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .vgsum.bad {
        border-color: var(--er);
      }
      .vgsum.bad > b {
        color: var(--er);
      }
      .vgsum.good {
        border-color: var(--ok);
      }
      .vgsum.good > b {
        color: var(--ok);
      }
      .vgt tbody tr {
        cursor: default;
      }
      .vgt td.wr {
        white-space: normal;
        min-width: 12rem;
      }
      .vgt td.vk {
        white-space: normal;
        min-width: 11rem;
      }
      .vgt tr.vg-fehlt td.vk,
      .vgt tr.vg-noch td.vk {
        color: var(--er);
        font-weight: 600;
      }
      .vgt tr.vg-fehlt,
      .vgt tr.vg-noch {
        background: color-mix(in srgb, var(--er) 8%, var(--card));
      }
      .vgt tr.vg-ok td.vk {
        color: var(--mu);
      }
      /* ---- Geräteübersicht (Disponent): .dv = Gerätekarte, .dv-dot = Punkt „online“ ---- */
      .dv.off {
        opacity: 0.75;
      }
      .dv a {
        color: var(--act);
      }
      .dv-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mu);
        margin-right: 6px;
        vertical-align: 1px;
      }
      .dv-dot.on {
        background: var(--ok);
      }
      .dv-actions {
        margin-top: auto;
        padding-top: 10px;
        flex-wrap: wrap;
      }
      input.dv-name {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 12px;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
      }
      /* ---- Skeleton-Platzhalter (während etwas lädt): .sk = grauer, pulsierender Balken, .sk-btn = Schaltfläche ---- */
      .sk {
        background: linear-gradient(
          90deg,
          var(--bd) 25%,
          color-mix(in srgb, var(--bd) 45%, var(--card)) 37%,
          var(--bd) 63%
        );
        background-size: 400% 100%;
        border-radius: 6px;
        margin: 8px 0;
        animation: sk-shimmer 1.4s ease infinite;
      }
      .sk-btn {
        height: 3.5rem;
        border-radius: var(--r);
        margin: 0 0 10px;
      }
      .row .sk,
      .chips .sk,
      .ob .sk {
        margin: 0;
      }
      .chips .sk {
        border-radius: 20px;
      }
      .ob .sk {
        border-radius: var(--r);
      }
      .ob > .sk {
        flex: 1;
      }
      @keyframes sk-shimmer {
        from {
          background-position: 100% 50%;
        }
        to {
          background-position: 0 50%;
        }
      }
      /* ---- Bedienung: sanfte Rückmeldung bei Tippen/Hover (Seitenwechsel: siehe animateView) ---- */
      button,
      select,
      .chip,
      .fpick {
        transition:
          background-color 0.15s,
          border-color 0.15s,
          color 0.15s,
          filter 0.15s,
          transform 0.12s,
          box-shadow 0.15s,
          opacity 0.15s;
      }
      button:not(:disabled):active,
      .fpick:active {
        transform: scale(0.96);
        filter: brightness(0.92);
      }
      .chip.on {
        box-shadow: 0 1px 4px color-mix(in srgb, var(--ac) 35%, transparent);
      }
      @media (hover: hover) {
        .card.cl {
          transition:
            border-color 0.15s,
            transform 0.15s,
            box-shadow 0.15s;
        }
        .card.cl:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }
        .card.cl:active {
          transform: scale(0.99);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
        button,
        select,
        .chip,
        .fpick,
        .card.cl {
          transition: none;
        }
        button:not(:disabled):active,
        .fpick:active,
        .card.cl:hover,
        .card.cl:active {
          transform: none;
        }
      }
      /* ---- Signatur unten rechts: immer sichtbar, Größe unabhängig von der Schriftgröße (px statt rem) ---- */
      .made {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 4;
        font-size: 11px;
        line-height: 1.2;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 3px 9px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
        pointer-events: none;
        user-select: none;
      }
      /* ---- Disposition (Disponent): Gantt-Diagramm, Offen-Liste, Bearbeiten-Fenster ----
         .gtb = Werkzeugleiste · .gtp = Raster (breit: Offen-Liste links, Diagramm rechts; schmal untereinander) · .gt = Diagramm ·
         .gt-names = Teamspalte (steht still) · .gt-scroll = Zeitachse (seitlich wischbar) · .gt-row = eine Zeile je Team (schlank mit
         einem Auftrag, mit jedem weiteren gleichzeitigen eine Bahn dicker; Höhe inline, Wechsel gleitet: ganttRowsAnimate) · .gt-bar = ein disponierter Auftrag · .gt-pc = Karte „noch offen“ ·
         .gt-sheet = Bearbeiten-Fenster (fest am unteren Rand, verändert das Layout nicht) */
      .gtb {
        margin-bottom: 12px;
      }
      .gtb .chips {
        margin-bottom: 8px;
      }
      /* Zeile unter den Auftragsarten: Suche + „Extra-Fenster“ – oder, wenn die Liste im Extra-Fenster steht, ein Hinweis + zwei Knöpfe.
         Beide Zustände sind gleich hoch (die Zeile nimmt die Höhe der Knöpfe), darunter springt nichts. */
      .gtt .gtt-note {
        flex: 1 1 0;
        align-self: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gtt button {
        flex: 0 0 auto;
        white-space: nowrap;
      }
      /* Liste im Extra-Fenster: das Diagramm hat die ganze Breite */
      .gtp.solo {
        grid-template-columns: minmax(0, 1fr);
      }
      /* ---- Extra-Fenster (eigenes Dokument, Stile kopiert): Kopf mit Suche klebt oben, darunter die Karten, Hinweis fest unten ---- */
      body.gtw {
        padding-bottom: 5.5rem;
      }
      /* Kopf: Überschrift, Auftragsart und Suche stehen in einer Zeile, wenn das Fenster breit genug ist, sonst untereinander */
      .gtw-top {
        position: sticky;
        top: 0;
        z-index: 3;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 14px;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        padding: 10px 14px;
      }
      .gtw-ph {
        flex: 0 1 auto;
        min-width: 0;
      }
      .gtw-top .gt-ph {
        min-height: 2.25rem; /* mit und ohne „Alle Vorschläge übernehmen“ gleich hoch */
        margin: 0;
        gap: 4px 14px;
        justify-content: flex-start;
      }
      .gtw-chips {
        flex: 0 1 auto;
        min-width: 0;
      }
      .gtw-top .chips {
        margin: 0;
      }
      .gtw-top input[type='search'] {
        flex: 1 1 14rem;
        min-width: 12rem;
        box-sizing: border-box;
        margin: 0;
      }
      .gtw-top .gt-pf {
        flex: 1 1 100%;
        margin: 0;
      }
      .gtw-body {
        padding: 12px 14px 0;
      }
      /* Karten: so viele Spalten, wie ins Fenster passen (jede mindestens 25rem breit, dann ist die Karte flach mit Knopf rechts);
         ein schmales Fenster hat eine Spalte, ein breites Fenster nutzt die Breite, statt wenige Karten ganz breit zu ziehen */
      body.gtw .gt-pool {
        max-height: none;
        overflow: visible;
        padding: 0;
        margin: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 25rem), 1fr));
      }
      body.gtw .gt-pool > .gt-empty {
        grid-column: 1 / -1;
      }
      .gtw-more {
        margin-top: 10px;
      }
      .gtw-toast {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 5;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: var(--r);
        border: 1px solid var(--bd);
        background: var(--card);
        box-shadow: var(--sh2);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
      }
      .gtw-toast.on {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .gtw-toast.er {
        color: var(--er);
      }
      @media (prefers-reduced-motion: no-preference) {
        .gtw-toast {
          transition:
            opacity 0.2s,
            transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
      }
      .gtp {
        display: grid;
        gap: 12px;
        align-items: start;
        /* Platz für das Bearbeiten-Fenster unter dem Inhalt: bleibt immer gleich, damit sich beim Öffnen und Schließen nichts verschiebt */
        padding-bottom: 21rem;
      }
      .gtp > * {
        min-width: 0;
      }
      .gt-ph {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 8px;
      }
      .gt-ph b {
        font-size: 1.0625rem;
      }
      .gt-ph button {
        padding: 6px 12px;
        font-size: 0.875rem;
      }
      .gt-pool {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      /* Offen-Liste in der Seite: .gt-pp ist die Zelle im Raster, darin .gt-pps mit Kopf, Filtern und den Karten. Kopf und Filter stehen
         fest, die Karten rollen darunter (schmal: in einem Bereich von höchstens 34 rem, damit die Liste das Diagramm darunter nicht immer
         weiter nach unten schiebt; breit: bis zum Bildschirmrand, siehe unten) */
      .gt-pp {
        min-height: 0;
      }
      .gt-pps {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .gt-pps > * {
        flex: 0 0 auto;
      }
      .gt-pps .gt-pool {
        flex: 0 1 auto;
        max-height: min(70vh, 34rem);
        overflow-x: hidden;
        overflow-y: auto;
        padding: 3px;
        margin: -3px;
      }
      /* unsichtbare Marke am Ende der Liste: kommt sie in die Nähe, lädt die Liste die nächste Portion (poolWatchMore) */
      .gt-more {
        flex: 0 0 auto;
        height: 1px;
        margin-top: -8px;
        pointer-events: none;
      }
      /* Team, Termin (Sortierung) und Zeitraum der Offen-Liste. Jedes Feld ist ein Kasten mit kleiner Beschriftung; die Felder sind immer
         gleich hoch (der Zeitraum wird mit ✕ aufgehoben, das Feld bleibt). Schmal stehen sie untereinander. */
      .gt-pf {
        container-type: inline-size; /* (ein Container formatiert nur seine Kinder: das Raster liegt darum eine Ebene tiefer) */
        margin: 0 0 8px;
      }
      .gt-pfg {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .pf {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        box-sizing: border-box;
        border: 1px solid var(--bd);
        border-radius: var(--r);
        background: var(--card);
        padding: 0 6px 0 10px;
      }
      .pf:focus-within {
        border-color: var(--ac);
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--ac) 30%, transparent);
      }
      .pf > span {
        flex: 0 0 auto;
        color: var(--mu);
        font-size: 0.75rem;
      }
      .pf select,
      .pf input {
        flex: 1 1 0;
        min-width: 0;
        width: 100%;
        box-sizing: border-box;
        border: 0;
        border-radius: 0;
        background: transparent;
        color: var(--tx);
        font: inherit;
        font-size: 0.8125rem;
        padding: 7px 0;
        outline: none;
      }
      .pf-range {
        grid-column: 1 / -1;
        gap: 8px;
        padding-right: 4px;
      }
      /* „Von“ und „Bis“: je Beschriftung und Datumsfeld */
      .pf-d {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1 1 0;
        min-width: 0;
      }
      .pf-d > span {
        flex: 0 0 auto;
        min-width: 1.75rem; /* „Von“ und „Bis“ gleich breit: die Datumsfelder beginnen untereinander an derselben Stelle */
        color: var(--mu);
        font-size: 0.75rem;
      }
      .pf-d + .pf-d {
        border-left: 1px solid var(--bd);
        padding-left: 8px;
      }
      .pf-range input {
        min-width: 5.75rem;
      }
      .pf-x {
        flex: 0 0 auto;
        padding: 2px 8px;
        border: 0;
        background: transparent;
        box-shadow: none;
        color: var(--mu);
      }
      .pf-x:disabled {
        opacity: 0.35;
        cursor: default;
      }
      /* sehr schmal (Handy mit 320 px, große Schrift): „Von“ und „Bis“ untereinander, ✕ rechts daneben */
      @container (max-width: 21rem) {
        .pf-range {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0 8px;
        }
        .pf-d + .pf-d {
          border-left: 0;
          padding-left: 0;
        }
        .pf-x {
          grid-column: 2;
          grid-row: 1 / span 2;
        }
      }
      @container (max-width: 19rem) {
        .gt-pfg {
          grid-template-columns: minmax(0, 1fr);
        }
      }
      /* Touch (Handy, Tablet): die Felder haben 16 px Schrift – mit weniger zoomt iOS beim Antippen in die Seite hinein – und stehen
         dafür untereinander (sonst ginge das Datum nicht hinein) */
      @media (pointer: coarse) {
        .pf select,
        .pf input {
          font-size: 1rem;
          padding: 9px 0;
        }
        @container (max-width: 30rem) {
          .gt-pfg {
            grid-template-columns: minmax(0, 1fr);
          }
          .pf-range {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 0 8px;
          }
          .pf-d + .pf-d {
            border-left: 0;
            padding-left: 0;
          }
          .pf-x {
            grid-column: 2;
            grid-row: 1 / span 2;
          }
        }
      }
      @container (min-width: 48rem) {
        .gt-pfg {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr);
        }
        .pf-range {
          grid-column: auto;
        }
      }
      /* Karte „noch offen“, flach: oben Nummer, Art, Team und der Knopf rechts, dann der Kurztext (rechts davon die Statusmarken), dann
         Adresse und SAP-Termin. Die Karte ist ein eigener Container: wie sie sich zusammenzieht, richtet sich nach ihrer Breite, nicht
         nach der des Fensters – in der Seite, im Extra-Fenster und beim Ausgleiten gleich. */
      .gt-pc {
        margin: 0;
        padding: 8px 12px;
        cursor: pointer;
        user-select: none;
        touch-action: pan-y;
        container-type: inline-size;
      }
      .gt-pc.sel {
        border-color: var(--ac);
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--ac) 35%, transparent),
          var(--sh1);
      }
      .gt-pcb {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 2px 10px;
        align-items: center;
      }
      .gt-pc .row {
        grid-row: 1;
        grid-column: 1;
        gap: 3px 5px;
      }
      .gt-pc .gt-go {
        grid-row: 1;
        grid-column: 2;
      }
      /* Kurztext links, Statusmarken rechts (bei mehreren untereinander), eine Zeile über beide Spalten */
      .gt-tr {
        grid-row: 2;
        grid-column: 1 / -1;
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      .gt-tr .kt {
        flex: 1 1 auto;
        min-width: 0;
      }
      .gt-st {
        flex: 0 0 auto;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 3px 4px;
        max-width: 12rem;
      }
      .gt-pc .row > b {
        font-size: 0.9375rem;
        white-space: nowrap; /* die Nummer bricht nie am Bindestrich um (65900008-0010) */
      }
      .gt-pc .tag {
        padding: 0 7px;
      }
      /* Art und Team in der Kopfzeile etwas kleiner (so bleibt die Zeile mit Nummer und Knopf einzeilig); die Statusmarken behalten ihre Größe */
      .gt-pc .row .tag {
        font-size: 0.6875rem;
      }
      .gt-pc .kt {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.3;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
      }
      .gt-meta {
        grid-row: 3;
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 0 0.9em;
        font-size: 0.8125rem;
        line-height: 1.35;
      }
      .gt-pc .mu,
      .gt-pc .gt-sap {
        font-size: inherit;
        margin: 0;
      }
      .gt-pc .gt-go {
        margin: 0;
        padding: 4px 9px;
        font-size: 0.8125rem;
        white-space: nowrap;
      }
      .gt-pc .gt-go:disabled {
        opacity: 0.55;
        cursor: default;
      }
      @container (max-width: 27rem) {
        .gt-kw {
          display: none;
        }
      }
      @media (pointer: coarse) {
        .gt-pc .gt-go {
          padding: 8px 12px;
        }
      }
      .gt-empty {
        padding: 12px 14px;
        border: 1px dashed var(--bd);
        border-radius: var(--rc);
      }
      .gt {
        padding: 0;
        overflow: hidden;
        margin: 0;
      }
      .gt-top {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--bd);
      }
      .gt-top button {
        padding: 6px 12px;
        font-size: 0.875rem;
        flex: 0 0 auto;
      }
      /* schmal: der Zeitraum steht in einer eigenen Zeile unter den Knöpfen (sonst bliebe von ihm nur „08.1…“) */
      .gt-top {
        flex-wrap: wrap;
      }
      .gt-range {
        order: 9;
        flex: 1 0 100%;
        min-width: 0;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-seg {
        display: flex;
        flex: 0 0 auto;
        margin-left: auto;
      }
      @media (min-width: 700px) {
        .gt-top {
          flex-wrap: nowrap;
        }
        .gt-range {
          order: 0;
          flex: 1 1 0;
        }
        .gt-seg {
          margin-left: 0;
        }
      }
      .gt-seg button {
        border-radius: 0;
        box-shadow: none;
      }
      .gt-seg button:first-child {
        border-radius: var(--r) 0 0 var(--r);
      }
      .gt-seg button + button {
        margin-left: -1px;
      }
      .gt-seg button:last-child {
        border-radius: 0 var(--r) var(--r) 0;
      }
      .gt-seg button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        position: relative;
      }
      /* ---- Zoom-Balken über dem Diagramm: − / Regler / + , Anpassen, Vollbild ----
         Regler und Beschriftung haben feste Maße (der Text darf nichts umbrechen); die Marken zeigen, wo Monat, Woche und Tag liegen */
      .gt-zb {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--bd);
      }
      .gt-zs {
        flex: 1 1 100%;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .gt-zr {
        flex: 1 1 100%;
        min-width: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-end;
        gap: 6px 8px;
      }
      .gt-zl {
        display: none;
      }
      .gt-zb button {
        padding: 6px 12px;
        font-size: 0.875rem;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .gt-zb .gt-zbtn {
        width: 2.25rem;
        padding: 4px 0;
        font-size: 1.125rem;
        line-height: 1.2;
        text-align: center;
      }
      .gt-fs.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .gt-zt {
        position: relative;
        flex: 1 1 0;
        min-width: 5rem;
        height: 30px;
        cursor: pointer;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        border-radius: 8px;
      }
      .gt-zt:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 2px;
      }
      .gt-zt::before,
      .gt-zt::after {
        content: '';
        position: absolute;
        left: 9px;
        top: 50%;
        height: 4px;
        margin-top: -2px;
        border-radius: 2px;
        pointer-events: none;
      }
      .gt-zt::before {
        right: 9px;
        background: var(--bd);
      }
      .gt-zt::after {
        width: calc((100% - 18px) * var(--p));
        background: var(--ac);
      }
      .gt-zk {
        position: absolute;
        top: 50%;
        left: calc(9px + (100% - 18px) * var(--p));
        width: 2px;
        height: 14px;
        margin: -7px 0 0 -1px;
        border-radius: 1px;
        background: var(--mu);
        opacity: 0.6;
        pointer-events: none;
      }
      .gt-zh {
        position: absolute;
        top: 50%;
        left: calc(9px + (100% - 18px) * var(--p));
        width: 18px;
        height: 18px;
        margin: -9px 0 0 -9px;
        box-sizing: border-box;
        border-radius: 50%;
        background: var(--card);
        border: 2px solid var(--ac);
        box-shadow: var(--sh1);
        pointer-events: none;
      }
      @media (min-width: 700px) {
        .gt-zs {
          flex: 1 1 18rem;
        }
        .gt-zr {
          flex: 0 0 auto;
          flex-wrap: nowrap;
        }
        .gt-zl {
          display: block;
          flex: 0 0 9rem;
          text-align: right;
          font-size: 0.8125rem;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
      }
      /* ---- Vollbild: das Diagramm liegt fest über der ganzen Seite und nimmt den ganzen Bildschirm ein. Die Teamzeilen rollen darin,
         die Seite dahinter bleibt stehen (sie rollt nicht mit). Die Karte deckt sie sofort ab; nur ihr Inhalt blendet ein ---- */
      html.gt-full {
        overflow: hidden;
      }
      .gt.full {
        position: fixed;
        inset: 0;
        z-index: 12;
        display: flex;
        flex-direction: column;
        margin: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
      .gt.full .gt-top,
      .gt.full .gt-zb,
      .gt.full .gt-leg {
        flex: 0 0 auto;
      }
      .gt.full .gt-body {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      /* Hinweise (Rückgängig, Fehler …) schweben oben über den Teamzeilen, ohne etwas zu verschieben */
      .gt-toast {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 6;
        width: min(36rem, calc(100% - 24px));
        display: flex;
        flex-direction: column;
        gap: 8px;
        pointer-events: none;
      }
      .gt-toast .msg {
        margin: 0;
        pointer-events: auto;
        box-shadow: var(--sh2);
      }
      .gt.full .gt-wrap {
        flex: 1 1 auto;
        min-height: 0;
        align-items: flex-start;
        overflow-x: hidden;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* (Bearbeiten-Fenster offen: Platz unter den untersten Zeilen, damit sie sich darüber heben lassen) */
      .gt.full.gsel .gt-wrap {
        padding-bottom: 13rem;
      }
      html.gt-full .gt-sheet {
        z-index: 14;
      }
      html.gt-full .gt-tip,
      html.gt-full .gt-ghost {
        z-index: 15;
      }
      .gt-wrap {
        display: flex;
      }
      .gt-names {
        flex: 0 0 var(--gnw);
        border-right: 1px solid var(--bd);
        background: var(--card);
        position: relative;
        z-index: 2;
      }
      .gt-corner {
        height: var(--gth);
        box-sizing: border-box;
        border-bottom: 1px solid var(--bd);
        padding: 0 8px;
        display: flex;
        align-items: flex-end;
        padding-bottom: 4px;
        font-size: 0.75rem;
        color: var(--mu);
      }
      .gt-name {
        height: var(--grh);
        box-sizing: border-box;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        border-bottom: 1px solid var(--bd);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
      }
      .gt-name span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-name .gt-n {
        font-weight: 500;
        font-size: 0.6875rem;
        color: var(--mu);
        flex: 0 0 auto;
      }
      .gt-name.sap {
        color: var(--act);
        background: var(--acs);
      }
      .gt-name.tgt,
      .gt-row.tgt {
        background-color: color-mix(in srgb, var(--ac) 12%, var(--card));
      }
      .gt-scroll {
        flex: 1 1 0;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
      }
      .gt-in {
        position: relative;
        width: var(--giw);
      }
      .gt-head {
        position: relative;
        height: var(--gth);
        box-sizing: border-box;
        border-bottom: 1px solid var(--bd);
      }
      .gt-day {
        position: absolute;
        top: 0;
        height: 50%;
        box-sizing: border-box;
        border-left: 1px solid var(--bd);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
      }
      /* der Tag steht am linken Rand der sichtbaren Zeitachse, solange man in seinem Bereich wischt */
      .gt-day span {
        position: sticky;
        left: 6px;
        display: inline-block;
        padding: 4px 0 0 6px;
      }
      /* Monat: ein schmales Feld je Tag über die ganze Kopfhöhe – Wochentag (klein) und Tag des Monats */
      .gt-day.mo {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        font-size: 0.6875rem;
        line-height: 1.2;
      }
      .gt-day.mo i {
        font-style: normal;
        font-weight: 500;
      }
      .gt-day.mo b {
        font-size: 0.8125rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .gt-day.we {
        color: var(--mu);
      }
      /* Wochenende: leicht getönt hinter den Zeilen (greift nicht in Bedienung und Layout ein) */
      .gt-wk {
        position: absolute;
        background: color-mix(in srgb, var(--mu) 8%, transparent);
        pointer-events: none;
      }
      .gt-day.td {
        color: var(--act);
      }
      .gt-hr {
        position: absolute;
        bottom: 0;
        height: 50%;
        box-sizing: border-box;
        border-left: 1px solid var(--bd);
        padding: 5px 0 0 3px;
        font-size: 0.6875rem;
        color: var(--mu);
        overflow: hidden;
        white-space: nowrap;
      }
      .gt-row {
        position: relative;
        height: var(--grh);
        box-sizing: border-box;
        border-bottom: 1px solid var(--bd);
        /* senkrechte Linien: Tage (kräftig) und Stunden */
        background-image:
          linear-gradient(to right, var(--bd) 1px, transparent 1px), linear-gradient(to right, color-mix(in srgb, var(--bd) 55%, transparent) 1px, transparent 1px);
        background-size:
          var(--gdp) 100%,
          var(--ghp) 100%;
      }
      .gt-now {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--er);
        opacity: 0.7;
        pointer-events: none;
        z-index: 1;
      }
      .gt-bar {
        --bc: var(--ac);
        position: absolute;
        box-sizing: border-box;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 8px 0 6px;
        border-radius: 6px;
        background: var(--bc);
        border: 1px solid color-mix(in srgb, var(--bc) 65%, #000);
        color: #fff;
        font-size: 0.75rem;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        box-shadow: var(--sh1);
      }
      .gt-bar.ent {
        --bc: var(--nk);
      }
      /* gestartet (blau) und erledigt (grün): die Farbe zeigt den Stand statt der Auftragsart (Art und Stand stehen im Hinweistext) */
      .gt-bar.run {
        --bc: var(--run);
      }
      .gt-bar.fin {
        --bc: var(--ok);
      }
      .gt-bar b {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .gt-bar span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-bar.sel,
      .gt-bar.drag {
        z-index: 3;
        box-shadow:
          0 0 0 2px var(--card),
          0 0 0 4px var(--tx);
      }
      .gt-bar.drag {
        cursor: grabbing;
        opacity: 0.92;
      }
      .gt-bar.cf {
        box-shadow: 0 0 0 2px var(--gb1);
      }
      .gt-bar.sel.cf {
        box-shadow:
          0 0 0 2px var(--card),
          0 0 0 4px var(--gb1);
      }
      .gt-bar.late {
        border-style: dashed;
      }
      .gt-bar.draft {
        background: color-mix(in srgb, var(--bc) 16%, var(--card));
        border: 2px dashed var(--bc);
        color: var(--tx);
        z-index: 4;
      }
      .gt-bar.gh {
        opacity: 0.4;
      }
      .gt-bar.cl {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .gt-bar.cr {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
      }
      /* Ränder zum Ändern der Länge: links der Beginn, rechts das Ende. Immer da (ändern weder Größe noch Lage des Balkens), schmale
         Balken lassen ihrer Mitte mindestens ein Drittel zum Verschieben. Sichtbar beim Darüberfahren, beim gewählten Auftrag, beim
         Entwurf und beim Ziehen; der Zeiger wird am Rand immer zum Doppelpfeil. */
      .gt-lz,
      .gt-rz {
        position: absolute;
        top: 0;
        bottom: 0;
        width: min(10px, 33%);
        cursor: ew-resize;
        touch-action: none;
        opacity: 0;
      }
      .gt-lz {
        left: 0;
        background: linear-gradient(to left, transparent, rgba(255, 255, 255, 0.45));
      }
      .gt-rz {
        right: 0;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.45));
      }
      .gt-bar.draft .gt-lz {
        background: linear-gradient(to left, transparent, color-mix(in srgb, var(--bc) 35%, transparent));
      }
      .gt-bar.draft .gt-rz {
        background: linear-gradient(to right, transparent, color-mix(in srgb, var(--bc) 35%, transparent));
      }
      .gt-bar.sel .gt-lz,
      .gt-bar.sel .gt-rz,
      .gt-bar.draft .gt-lz,
      .gt-bar.draft .gt-rz,
      .gt-bar.drag .gt-lz,
      .gt-bar.drag .gt-rz {
        opacity: 1;
      }
      .gt-bar.drag.rz {
        cursor: ew-resize;
      }
      @media (hover: hover) {
