          );
        const filterActive = !!(
          teamFilter ||
          statusFilter ||
          markedFilter ||
          reportedFilter ||
          searchText.trim()
        );
        const actions = el('div', { class: 'acts' });
        actions.append(
          el(
            'button',
            {
              class: 'dl',
              disabled: busy || !view().length ? 'disabled' : null,
              onclick: () => exportXlsx(view())
            },
            `⬇ Excel exportieren (${view().length} Aufträge${filterActive ? ', gefiltert' : ''})`
          )
        );
        const toMark = view()
          .filter(r => markState(r.auftrag) !== 1)
          .map(r => r.auftrag);
        if (toMark.length)
          actions.append(
            armMarkAll
              ? el(
                  'button',
                  {
                    class: 'dl',
                    onclick: () => {
                      armMarkAll = false;
                      setMarks(toMark, true);
                    }
                  },
                  `Wirklich ${toMark.length} Aufträge abhaken?`
                )
              : el(
                  'button',
                  {
                    class: 'dl',
                    onclick: () => {
                      armMarkAll = true;
                      render();
                    }
                  },
                  `☑ Alle angezeigten abhaken (${toMark.length})`
                )
          );
        // Abgehakte ein-/ausblenden (Wahl bleibt im Gerät gespeichert)
        const setMarkedFilter = k => {
          markedFilter = k;
          armMarkAll = false;
          try {
            localStorage.setItem('dha', markedFilter);
          } catch (x) {}
          render();
        };
        const setMarkedFilterQuiet = k => {
          markedFilter = k;
          try {
            localStorage.setItem('dha', markedFilter);
          } catch (x) {}
        };
        panel.append(
          el(
            'div',
            { class: 'chips ab' },
            el('span', { class: 'mu' }, 'Abgehakte:'),
            [
              ['', 'Anzeigen'],
              ['hide', `Ausblenden (${markedCount})`],
              ['only', `Nur abgehakte (${anyMarkedCount})`]
            ].map(([k, l]) =>
              el(
                'button',
                { class: 'chip' + (markedFilter === k ? ' on' : ''), onclick: () => setMarkedFilter(k) },
                l
              )
            )
          ),
          sortChips(),
          actions
        );
        // aktive Filter als Kurzzeile (nur am Handy sichtbar, wenn die Filter zugeklappt sind)
        const reportedNames = { h: 'Heute', g: 'Gestern', 7: 'Letzte 7 Tage', m: 'Dieser Monat', z: 'Zeitraum' },
          statusNames = { nok: 'Nicht OK', done: 'Erledigt', teil: 'In Arbeit', offen: 'Offen' },
          active = [
            teamFilter && [`Team ${teamFilter}`, () => (teamFilter = '')],
            statusFilter && [`Status ${statusNames[statusFilter]}`, () => (statusFilter = '')],
            reportedFilter && [
              `Rückgemeldet ${reportedNames[reportedFilter]}`,
              () => {
                reportedFilter = '';
                reportedFrom = '';
                reportedTo = '';
              }
            ],
            markedFilter && [
              markedFilter === 'hide' ? 'Abgehakte ausgeblendet' : 'Nur abgehakte',
              () => setMarkedFilterQuiet('')
            ]
          ].filter(Boolean);
        app.append(
          el(
            'div',
            { class: 'srow', 'data-k': 'sr' },
            searchBox(v => {
              searchText = v;
              armMarkAll = false;
              render();
            }),
            el(
              'button',
              {
                class: 'fbtn' + (active.length ? ' on' : ''),
                'aria-expanded': dispoFiltersOpen ? 'true' : 'false',
                onclick: () => {
                  dispoFiltersOpen = !dispoFiltersOpen;
                  render();
                }
              },
              `⚙ Filter${active.length ? ' (' + active.length + ')' : ''} ${dispoFiltersOpen ? '▴' : '▾'}`
            )
          ),
          ...(active.length
            ? [
                el(
                  'div',
                  { class: 'fsum chips' },
                  active.map(([label, reset]) =>
                    el(
                      'button',
                      {
                        class: 'chip on',
                        title: 'Filter lösen',

                          armMarkAll = false;
                          render();

                      },
                      label + ' ✕'
                    )
                  )
                )
              ]
            : []),
          panel,
          orderList(view(), true)
        );
        // Hinweis nur wenn zutreffend – app.append() würde false/null sonst als Text anzeigen
        if (markedFilter === 'hide' && markedCount > 0)
          app.lastChild.before(
            el(
              'p',
              { class: 'mu' },
              markedCount === 1
                ? '1 abgehakter Auftrag ist ausgeblendet.'
                : `${markedCount} abgehakte Aufträge sind ausgeblendet.`

      // ---- Geräteübersicht (Disponent) ----
      // Warum ein Gerät keine Benachrichtigungen bekommt, aus seinem Push-Status („Berechtigung|Detail“, siehe pushSyncOnce); leer, wenn unbekannt
      function pushReason(pstat) {
        const text = String(pstat || ''),
          cut = text.indexOf('|'),
          permission = cut < 0 ? text : text.slice(0, cut),
          detail = cut < 0 ? '' : text.slice(cut + 1);
        if (permission === 'default') return 'noch nicht aktiviert – der Monteur muss „Aktivieren“ tippen';
        if (permission === 'denied') return 'im Browser blockiert (Freigabe in den Einstellungen von Browser bzw. Handy)';
        if (permission === 'granted') return detail ? 'Einrichtung fehlgeschlagen: ' + detail : 'erlaubt, das Abo kommt gleich';
        if (permission === 'unsupported')
          return detail === 'insecure'
            ? 'der Browser verlangt eine sichere Verbindung (HTTPS)'
            : detail === 'ios-home'
              ? 'iPhone/iPad: die App muss erst zum Home-Bildschirm hinzugefügt werden'
              : 'der Browser kann keine Benachrichtigungen';
        return '';
      }
      // Kurzbeschreibung des Geräts aus dem User-Agent des Browsers: „Android · Chrome“
      function deviceKind(ua) {
        const text = String(ua || ''),
          system = /iPhone|iPad|iPod/.test(text)
            ? 'iPhone/iPad'
            : /Android/.test(text)
              ? 'Android'
              : /Windows/.test(text)
                ? 'Windows'
                : /Mac OS X/.test(text)
                  ? 'Mac'
                  : /Linux/.test(text)
                    ? 'Linux'
                    : 'Gerät',
          browser = /Edg\//.test(text)
            ? 'Edge'
            : /OPR\/|Opera/.test(text)
              ? 'Opera'
              : /Firefox|FxiOS/.test(text)
                ? 'Firefox'
                : /SamsungBrowser/.test(text)
                  ? 'Samsung Internet'
                  : /Chrome|CriOS/.test(text)
                    ? 'Chrome'
                    : /Safari/.test(text)
                      ? 'Safari'
                      : '';
        return browser ? system + ' · ' + browser : system;
      }
      // „gerade eben“, „vor 5 Min“, „vor 3 Std“, sonst Datum und Uhrzeit (seen = Zeitpunkt, now = Serverzeit)
      function agoText(seen, now) {
        const minutes = Math.floor((now - seen) / 60000);
        if (minutes < 1) return 'gerade eben';
        if (minutes < 60) return `vor ${minutes} Min`;
        if (minutes < 1440) return `vor ${Math.floor(minutes / 60)} Std`;
        return formatDateTime(seen);
      }
      // Lädt die Geräteliste vom Server (GET /api/devices) und zeichnet neu. Das hält auch die Standortabfrage am Leben
      // (?locate=1, 90 Sekunden) – nur diese Seite fragt Standorte ab. refresh = true: sofort neue Abfragerunde.
      async function loadDevices(refresh = false) {
        try {
          const response = await api('GET', '/api/devices?locate=1' + (refresh ? '&refresh=1' : ''));
          deviceList = response.devices;
          deviceListOffset = response.now - Date.now();
          deviceListError = '';
        } catch (e) {
          deviceListError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      // Spitzname speichern (leer = entfernen)
      async function renameDevice(did, name) {
        try {
          await api('POST', '/api/devices/name', { did, name });
          deviceRenameId = null;
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadDevices();
      }
      // Gerät ausloggen: der Server meldet es sofort ab (Rolle/Team weg, Tokens ungültig); das Gerät selbst kehrt zum Startbildschirm
      // zurück, sobald es sich beim Server meldet (bei offener App sofort)
      async function logoutDevice(did) {
        deviceLogoutArmed = null;
        try {
          await api('POST', '/api/devices/logout', { did });
          infoMsg =
            'Gerät ausgeloggt – es kehrt zum Startbildschirm zurück, sobald es sich beim Server meldet.';
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadDevices();
      }
      // Test-Benachrichtigung an ein Gerät (POST /api/devices/test-push): Der Server sagt, was der Push-Dienst geantwortet hat. Angenommen heißt
      // nur „beim Push-Dienst angekommen“ – erscheint sie am Gerät nicht, liegt es dort (Mitteilungen des Browsers/Handys, Fokus-Modus, Browser zu).
      // Das Ergebnis erscheint als Kurzmeldung unten am Bildschirm (toast): sichtbar, wo auch immer der Disponent in der langen Liste steht, und ohne
      // dass sich etwas verschiebt (ein Hinweis oben läge außerhalb des Bildschirms – die Seite hält die angetippte Karte fest). Danach lädt die
      // Liste neu (ein abgelaufenes Abo ist dann weg).
      async function testDevicePush(device) {
        if (deviceTestBusy) return;
        deviceTestBusy = device.did;
        render();
        const name = `„${device.name || deviceKind(device.ua)}“`;
        try {
          const r = await api('POST', '/api/devices/test-push', { did: device.did });
          if (r.ok)
            toast(`✓ Test an ${name} vom Push-Dienst (${r.host}) angenommen. Erscheint sie am Gerät nicht, blockiert es dort: Mitteilungen des Browsers, Fokus-Modus oder Browser geschlossen.`);
          else if (r.gone)
            toast(`⚠ Das Push-Abo von ${name} ist abgelaufen (${r.status || 'ungültig'}) und wurde gelöscht. Das Gerät meldet sich beim nächsten Öffnen der App neu an.`);
          else if (r.status === 401 || r.status === 403)
            toast(`⚠ Der Push-Dienst (${r.host}) lehnt den Server ab (${r.status}): Das Abo von ${name} gehört zu anderen Server-Schlüsseln. Am Gerät die App neu laden und Benachrichtigungen neu aktivieren.`);
          else if (r.status) toast(`⚠ Der Push-Dienst (${r.host}) hat die Test-Benachrichtigung an ${name} nicht angenommen (${r.status}).`);
          else toast(`⚠ Der Push-Dienst (${r.host}) ist vom Server aus nicht erreichbar: ${r.error}`);
        } catch (e) {
          toast('⚠ ' + (e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e)));
        }
        deviceTestBusy = null;
        await loadDevices();
      }
      // ein Gerät gilt als online, wenn es sich in den letzten 2 Minuten beim Server gemeldet hat
      const DEVICE_ONLINE_MS = 2 * 60e3;
      // Die Monteur-Geräte antworten auf die Standortabfrage innerhalb weniger Sekunden: Liste nach 3, 8 und 15 Sekunden nachladen
      function reloadDevicesSoon() {
        for (const ms of [3000, 8000, 15000])
          setTimeout(() => {
            if (dispoTab === 'dv' && deviceRenameId === null && !document.hidden) loadDevices();
          }, ms);
      }
      // Standortzeile einer Gerätekarte: Karten-Link mit Genauigkeit und Alter, oder der Grund, warum es keinen gibt
      function locationLine(device, now) {
        if (device.locError)
          return el(
            'div',
            { class: 'mu' },
            '📍 ' +
              (device.locError === 'denied'
                ? 'Standort nicht freigegeben'
                : device.locError === 'unavailable'
                  ? 'Standort nicht verfügbar'
                  : 'Standort: keine Antwort (Zeitüberschreitung)') +
              ' · ' +
              agoText(device.locAt, now)
          );
        if (device.lat == null)
          return el(
            'div',
            { class: 'mu' },
            now - device.seen < DEVICE_ONLINE_MS
              ? '📍 Standort: noch keine Antwort'
              : '📍 Gerät ist offline – Standort unbekannt (nur geöffnete Geräte antworten)'
          );
        const url = `https://www.openstreetmap.org/?mlat=${device.lat}&mlon=${device.lon}#map=17/${device.lat}/${device.lon}`;
        return el(
          'div',
          { class: 'mu' },
          '📍 ',
          el('a', { href: url, target: '_blank', rel: 'noopener' }, 'Auf Karte öffnen'),
          ` · ±${device.acc} m · ${agoText(device.locAt, now)}`
        );
      }
      /**
       * Dispo-Tab „Geräte“: alle Geräte der letzten 30 Tage mit Rolle/Team (wo angemeldet), Spitzname, zuletzt aktiv und
       * Push-Status. Je Gerät: Spitzname vergeben und „Ausloggen“ (mit Rückfrage). Die Liste lädt beim Öffnen des Tabs und
       * erneuert sich alle 20 Sekunden.
       */
      function drawDevices() {
        if (deviceList === null) {
          app.append(deviceListError ? el('p', { class: 'mu er' }, deviceListError) : skeletonGrid(4));
          return;
        }
        const now = Date.now() + deviceListOffset,
          isOnline = device => now - device.seen < DEVICE_ONLINE_MS,
          loggedIn = deviceList.filter(device => device.role).length,
          online = deviceList.filter(isOnline).length;
        app.append(
          el(
            'div',
            { class: 'card' },
            el('b', {}, 'Geräte'),
            el(
              'p',
              { class: 'mu' },
              `${deviceList.length} ${deviceList.length === 1 ? 'Gerät' : 'Geräte'} in den letzten 30 Tagen · ${loggedIn} angemeldet · ${online} online`
            ),
            el(
              'p',
              { class: 'mu' },
              'Hier siehst du, welches Gerät wo angemeldet ist, und kannst Geräten einen Spitznamen geben. „Ausloggen“ meldet ein Gerät sofort ab: Es kehrt zum Startbildschirm zurück (bei geöffneter App gleich, sonst beim nächsten Öffnen), bei Disponenten wird die Anmeldung sofort ungültig. Monteure können sich danach wieder anmelden.'
            ),
            el(
              'p',
              { class: 'mu' },
              'Standorte werden nur abgefragt, solange diese Seite offen ist – und nur von Monteur-Geräten, die gerade geöffnet sind und den Standort freigeben.'
            ),
            el(
              'button',
              {
                class: 'pri',
                onclick: () => {
                  loadDevices(true);
                  reloadDevicesSoon();
                }
              },
              '📍 Standorte jetzt aktualisieren'
            ),
            deviceListError && el('p', { class: 'mu er' }, deviceListError)
          )
        );
        // Team-Filter: alle Teams der Monteur-Geräte (mit Anzahl Geräte und davon online), dazu Disponenten und „ohne Team“
        const DEV_DISPO = '\u0000d',
          DEV_NOTEAM = '\u0000n',
          matchesDeviceTeam = device =>
            !deviceTeamFilter ||
            (deviceTeamFilter === DEV_DISPO
              ? device.role === 'dispo'
              : deviceTeamFilter === DEV_NOTEAM
                ? device.role === 'monteur' && !device.team
                : device.role === 'monteur' && device.team === deviceTeamFilter),
          deviceTeams = new Map();
        let dispoDevices = 0,
          noTeamDevices = 0;
        for (const device of deviceList) {
          if (device.role === 'dispo') dispoDevices++;
          else if (device.role === 'monteur' && !device.team) noTeamDevices++;
          else if (device.role === 'monteur') {
            const c = deviceTeams.get(device.team) || [0, 0];
            c[0]++;
            if (isOnline(device)) c[1]++;
            deviceTeams.set(device.team, c);
          }
        }
        // gewähltes Team gibt es nicht mehr (z. B. Gerät hat gewechselt): Filter aufheben
        if (
          deviceTeamFilter &&
          deviceTeamFilter !== DEV_DISPO &&
          deviceTeamFilter !== DEV_NOTEAM &&
          !deviceTeams.has(deviceTeamFilter)
        )
          deviceTeamFilter = '';
        const deviceOpt = (value, label) =>
          el('option', { value, ...(value === deviceTeamFilter ? { selected: 'selected' } : {}) }, label);
        app.append(
          el(
            'div',
            { class: 'flt', 'data-k': 'fl' },
            el('span', { class: 'mu' }, 'Team'),
            el(
              'select',
              {
                onchange: e => {
                  deviceTeamFilter = e.target.value;
                  deviceLogoutArmed = null;
                  render();
                }
              },
              deviceOpt('', `Alle Geräte (${deviceList.length})`),
              [...deviceTeams]
                .sort((a, b) => naturalCompare(a[0], b[0]))
                .map(([t, c]) => deviceOpt(t, `${t} (${c[0]} · ${c[1]} online)`)),
              noTeamDevices > 0 && deviceOpt(DEV_NOTEAM, `Monteur ohne Team (${noTeamDevices})`),
              dispoDevices > 0 && deviceOpt(DEV_DISPO, `Disponenten (${dispoDevices})`)
            ),
            deviceTeamFilter &&
              el(
                'button',
                {
                  class: 'rs',
                  onclick: () => {
                    deviceTeamFilter = '';
                    deviceLogoutArmed = null;
                    render();
                  }
                },
                '✕ Teamfilter aufheben'
              )
          )
        );
        // angemeldete Geräte zuerst, innerhalb davon online vor offline und das zuletzt aktive
        const sorted = deviceList
          .filter(matchesDeviceTeam)
          .sort(
            (a, b) =>
              (b.role ? 1 : 0) - (a.role ? 1 : 0) || isOnline(b) - isOnline(a) || b.seen - a.seen
          );
        if (!sorted.length) app.append(el('p', { class: 'mu' }, 'Keine Geräte in diesem Team.'));
        app.append(
          el(
            'div',
            { class: 'grid', 'data-list': '1' },
            sorted.map(device => {
              const kind = deviceKind(device.ua),
                where = device.role === 'dispo' ? 'Disponent' : device.role === 'monteur' ? 'Monteur' : 'Abgemeldet',
                online = isOnline(device),
                renaming = deviceRenameId === device.did;
              return el(
                'div',
                { class: 'card dv' + (device.role ? '' : ' off'), 'data-k': 'd' + device.did },
                el(
                  'div',
                  { class: 'row' },
                  el('b', {}, device.name || kind),
                  device.did === deviceId && el('span', { class: 'tag' }, 'Dieses Gerät'),
                  el('span', { class: 'tag ' + (online ? 'st-ok' : '') }, online ? '● Online' : '○ Offline'),
                  el('span', { class: 'tag ' + (device.role === 'dispo' ? 'st-teil' : '') }, where),
                  device.role === 'monteur' &&
                    el(
                      'span',
                      { class: 'tag ' + (device.team ? 'st-teil' : 'st-zf') },
                      '👥 ' + (device.team || 'kein Team gewählt')
                    ),
                  device.kick && el('span', { class: 'tag st-zf' }, '⏳ Gerät noch nicht informiert')
                ),
                el(
                  'div',
                  { class: 'mu' },
                  (device.name ? kind + ' · ' : '') + 'Kennung …' + device.did.slice(-4)
                ),
                device.usr &&
                  el('div', { class: 'mu' }, '👤 ' + (device.uname ? `${device.uname} (${device.usr})` : device.usr)),
                el(
                  'div',
                  { class: 'mu' },
                  el('span', { class: 'dv-dot' + (online ? ' on' : '') }),
                  online ? 'Online – gerade aktiv' : 'Offline – zuletzt aktiv ' + agoText(device.seen, now)
                ),
                device.role === 'monteur' &&
                  el(
                    'div',
                    { class: 'mu' },
                    device.push
                      ? '🔔 Benachrichtigungen an'
                      : '🔕 ohne Benachrichtigungen' + (pushReason(device.pstat) ? ' – ' + pushReason(device.pstat) : '')
                  ),
                device.role === 'monteur' && locationLine(device, now),
                device.first &&
                  el('div', { class: 'mu' }, 'Erstmals gesehen: ' + formatDateTime(device.first)),
                renaming
                  ? el(
                      'div',
                      { class: 'ed' },
                      el('input', {
                        class: 'dv-name',
                        type: 'text',
                        maxlength: '40',
                        'data-keep': 'dn',
                        placeholder: 'Spitzname, z. B. „Handy Max“',
                        value: deviceRenameText,
                        oninput: e => {
                          deviceRenameText = e.target.value;
                        },
                        onkeydown: e => {
                          if (e.key === 'Enter') renameDevice(device.did, deviceRenameText);
                        }
                      }),
                      el(
                        'div',
                        { class: 'ob' },
                        el(
                          'button',
                          { class: 'sv', onclick: () => renameDevice(device.did, deviceRenameText) },
                          'Speichern'
                        ),
                        el(
                          'button',
                          {
                            onclick: () => {
                              deviceRenameId = null;
                              render();
                            }
                          },
                          'Abbrechen'
                        )
                      )
                    )
                  : el(
                      'div',
                      { class: 'ob dv-actions' },
                      el(
                        'button',
                        {
                          onclick: () => {
                            deviceRenameId = device.did;
                            deviceRenameText = device.name || '';
                            deviceLogoutArmed = null;
                            render();
                            const field = app.querySelector('[data-keep="dn"]');
                            if (field) field.focus();
                          }
                        },
                        device.name ? 'Umbenennen' : 'Spitzname geben'
                      ),
                      device.push &&
                        el(
                          'button',
                          {
                            disabled: deviceTestBusy ? 'disabled' : null,
                            title: 'Schickt diesem Gerät eine Test-Benachrichtigung und zeigt, ob der Push-Dienst sie annimmt',
                            onclick: () => testDevicePush(device)
                          },
                          '🔔 Test senden'
                        ),
                      device.role &&
                        !device.kick &&
                        (deviceLogoutArmed === device.did
                          ? [
                              el(
                                'button',
                                { class: 'er', onclick: () => logoutDevice(device.did) },
                                'Wirklich ausloggen?'
                              ),
                              el(
                                'button',
                                {
                                  onclick: () => {
                                    deviceLogoutArmed = null;
                                    render();
                                  }
                                },
                                'Abbrechen'
                              )
                            ]
                          : el(
                              'button',
                              {
                                class: 'er',
                                onclick: () => {
                                  deviceLogoutArmed = device.did;
                                  render();
                                }
                              },
                              'Ausloggen'
                            ))
                    )
              );
            })
          )
        );
      }
      // ---- Benutzerverwaltung (Disponent) ----
      // userList: Benutzer vom Server (null = noch nicht geladen) · userNow: Serverzeit · userSearch / userTeamFilter: Filter ·
      // userEdit: SAP-User des Benutzers im Bearbeiten-Modus ('new' = neuer Benutzer) mit den Eingaben in userForm ·
      // userError: Fehlertext des Formulars · userArmed: „del:<SAP>“ / „reset:<SAP>“ nach dem ersten Tipp (zweiter bestätigt) ·
      // userLogFor / userLogRows: Benutzer, dessen Protokoll aufgeklappt ist, und dessen Einträge
      let userList = null,
        userListError = '',
        userNow = 0,
        userSearch = '',
        userTeamFilter = '',
        userEdit = null,
        userForm = { sap: '', last: '', first: '', team: '', active: true, lock: false },
        userError = '',
        userArmed = null,
        userLogFor = null,
        userLogRows = null;
      // lädt die Benutzerliste (GET /api/users) und zeichnet neu
      async function loadUsers() {
        try {
          const r = await api('GET', '/api/users');
          userList = r.users;
          userNow = r.now;
          userListError = '';
        } catch (e) {
          userListError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      // speichert das Formular: neuer Benutzer (POST) oder Änderung (PUT); der SAP-User eines bestehenden Benutzers bleibt
      async function saveUserForm() {
        const isNew = userEdit === 'new',
          form = { ...userForm, sap: userForm.sap.trim().toUpperCase() };
        if (isNew && !/^[A-Z0-9]{2,20}$/.test(form.sap)) {
          userError = 'SAP-User: 2–20 Buchstaben oder Ziffern.';
          return render();
        }
        if (!form.last.trim()) {
          userError = 'Bitte den Nachnamen eingeben.';
          return render();
        }
        try {
          await api(
            isNew ? 'POST' : 'PUT',
            isNew ? '/api/users' : '/api/users/' + encodeURIComponent(userEdit),
            isNew
              ? form
              : { last: form.last, first: form.first, team: form.team, active: form.active, lock: form.lock }
          );
          userEdit = null;
          userError = '';
          infoMsg = isNew ? `Benutzer ${form.sap} angelegt – Startpasswort gilt.` : 'Benutzer gespeichert';
        } catch (e) {
          userError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
          return render();
        }
        await loadUsers();
      }
      // Schnelländerung direkt an der Karte (Team wählen oder Teamwechsel erlauben/sperren), gilt sofort auf dem Gerät des Monteurs
      async function quickUserChange(u, changes, message) {
        try {
          await api('PUT', '/api/users/' + encodeURIComponent(u.sap), changes);
          infoMsg = message;
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadUsers();
      }
      // Passwort zurücksetzen / Benutzer löschen (je nach Aktion), danach Liste neu laden
      async function userAction(kind, sap) {
        userArmed = null;
        try {
          if (kind === 'reset') {
            await api('POST', `/api/users/${encodeURIComponent(sap)}/reset`);
            infoMsg = `Passwort von ${sap} auf das Startpasswort zurückgesetzt – bisherige Anmeldungen enden.`;
          } else {
            await api('DELETE', '/api/users/' + encodeURIComponent(sap));
            infoMsg = `Benutzer ${sap} gelöscht.`;
            if (userLogFor === sap) userLogFor = null;
          }
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadUsers();
      }
      // klappt das Protokoll eines Benutzers auf/zu
      async function toggleUserLog(sap) {
        if (userLogFor === sap) {
          userLogFor = null;
          return render();
        }
        userLogFor = sap;
        userLogRows = null;
        render();
        try {
          userLogRows = (await api('GET', `/api/users/${encodeURIComponent(sap)}/log`)).log;
        } catch (e) {
          userLogRows = [];
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      const LOG_KINDS = {
        login: 'Angemeldet',
        ergebnis: 'Ergebnis gespeichert',
        gas: 'Gaswarngerät bestätigt',
        ack: 'Nachricht bestätigt'
      };
      /**
       * Dispo-Tab „Benutzer“: alle Monteur-Benutzer (SAP-User, Name, Team) mit letzter Anmeldung und Geräten. Anlegen, Ändern
       * (Name, Team, sperren), Passwort auf das Startpasswort zurücksetzen, Löschen (jeweils mit Rückfrage) und das Protokoll
       * des Benutzers (Anmeldungen, Ergebnisse, Gaswarngerät, Bestätigungen).
       */
      function drawUsers() {
        if (userList === null) {
          app.append(userListError ? el('p', { class: 'mu er' }, userListError) : skeletonGrid(4));
          return;
        }
        const teams = [...new Set([...userList.map(u => u.team).filter(Boolean), ...teamList.map(([t]) => t)])].sort(
            naturalCompare
          ),
          query = userSearch.trim().toLowerCase(),
          shown = userList.filter(
            u =>
              (!userTeamFilter || (userTeamFilter === '\u0000n' ? !u.team : u.team === userTeamFilter)) &&
              (!query || `${u.first} ${u.last} ${u.sap}`.toLowerCase().includes(query))
          ),
          recent = userList.filter(u => u.loginAt && userNow - u.loginAt < 30 * 864e5).length;
        const startNew = () => {
          userEdit = 'new';
          userForm = {
            sap: '',
            last: '',
            first: '',
            team: userTeamFilter && userTeamFilter !== '\u0000n' ? userTeamFilter : '',
            active: true,
            lock: false
          };
          userError = '';
          render();
          const n = app.querySelector('[data-keep="us"]');
          if (n) n.focus();
        };
        const field = (label, key, extra = {}) => [
          el('label', {}, label),
          el('input', {
            type: 'text',
            value: userForm[key],
            maxlength: key === 'sap' ? '20' : '60',
            autocapitalize: key === 'sap' ? 'characters' : null,
            autocomplete: 'off',
            spellcheck: 'false',
            oninput: e => {
              userForm[key] = e.target.value;
            },
            ...extra
          })
        ];
        const form = () =>
          el(
            'form',
            {
              class: 'ufm',
              onsubmit: e => {
                e.preventDefault();
                saveUserForm();
              }
            },
            userEdit === 'new' && field('SAP-User (Anmeldename)', 'sap', { 'data-keep': 'us' }),
            field('Nachname', 'last'),
            field('Vorname', 'first'),
            field('Team', 'team', { list: 'uteams', placeholder: 'z. B. FW-IH01' }),
            el('datalist', { id: 'uteams' }, teams.map(t => el('option', { value: t }))),
            el(
              'label',
              {},
              el('input', {
                type: 'checkbox',
                checked: userForm.lock ? null : 'checked',
                onchange: e => {
                  userForm.lock = !e.target.checked;
                }
              }),
              ' Darf sein Team selbst wechseln (Haken weg = Team fest zugewiesen)'
            ),
            userEdit !== 'new' &&
              el(
                'label',
                {},
                el('input', {
                  type: 'checkbox',
                  checked: userForm.active ? 'checked' : null,
                  onchange: e => {
                    userForm.active = e.target.checked;
                  }
                }),
                ' Benutzer ist aktiv (Haken weg = gesperrt)'
              ),
            userError && el('p', { class: 'mu er' }, userError),
            el(
              'div',
              { class: 'ob' },
              el('button', { class: 'sv', type: 'submit' }, 'Speichern'),
              el(
                'button',
                {
                  type: 'button',
                  onclick: () => {
                    userEdit = null;
                    userError = '';
                    render();
                  }
                },
                'Abbrechen'
              )
            )
          );
        app.append(
          el(
            'div',
            { class: 'card', 'data-k': 'uh' },
            el('b', {}, 'Benutzer'),
            el(
              'p',
              { class: 'mu' },
              `${userList.length} ${userList.length === 1 ? 'Benutzer' : 'Benutzer'} · ${recent} in den letzten 30 Tagen angemeldet`
            ),
            el(
              'p',
              { class: 'mu' },
              'Alle Monteure melden sich mit ihrem SAP-User und dem Passwort an. Das Team hier wird beim Anmelden automatisch gewählt (der Monteur kann es danach wechseln). „Passwort zurücksetzen“ setzt das Startpasswort, alle bisherigen Anmeldungen des Benutzers enden dabei.'
            ),
            userEdit === 'new' ? form() : el('button', { class: 'pri', onclick: startNew }, '＋ Neuer Benutzer'),
            userListError && el('p', { class: 'mu er' }, userListError)
          ),
          el(
            'div',
            { class: 'flt', 'data-k': 'fl' },
            el('span', { class: 'mu' }, 'Team'),
            el(
              'select',
              {
                onchange: e => {
                  userTeamFilter = e.target.value;
                  userArmed = null;
                  render();
                }
              },
              el('option', { value: '' }, `Alle (${userList.length})`),
              teams.map(t =>
                el(
                  'option',
                  { value: t, ...(t === userTeamFilter ? { selected: 'selected' } : {}) },
                  `${t} (${userList.filter(u => u.team === t).length})`
                )
              ),
              userList.some(u => !u.team) &&
                el(
                  'option',
                  { value: '\u0000n', ...(userTeamFilter === '\u0000n' ? { selected: 'selected' } : {}) },
                  `Ohne Team (${userList.filter(u => !u.team).length})`
                )
            ),
            userTeamFilter &&
              el(
                'button',
                {
                  class: 'rs',
                  onclick: () => {
                    userTeamFilter = '';
                    render();
                  }
                },
                '✕ Teamfilter aufheben'
              )
          ),
          el(
            'div',
            { class: 'tools' },
            el('input', {
              type: 'search',
              'data-keep': 'usr',
              placeholder: 'Suchen (Name, SAP-User)',
              value: userSearch,
              oninput: e => {
                userSearch = e.target.value;
                render();
              }

      }

      //   · Nachrichten kommen mit dem Abgleich (response.chat) und live ({ k: 'c', row }); sie werden NICHT mit render() gezeichnet, sondern an den

      const CHAT_MAX = 1000,

        chatRetryTimer = null,
        chatScrollRaf = 0,
        chatToastAt = 0,
        chatToastTeam = '', // Team der Kurzmeldung, die gerade steht (wird ausgeblendet, sobald der Chat gelesen ist)
        chatStats = null;

          localStorage.setItem('chatq', JSON.stringify(chatQueue));

      const chatSide = () => (session.role === 'dispo' ? 'd' : 'm');
      const chatMe = () => (userInfo && userInfo.sap) || '';
      const chatIsMine = m => (session.role === 'dispo' ? m.side === 'd' : m.side === 'm' && m.usr === chatMe());
      const chatRoleKey = () => (session.role === 'dispo' ? 'd' : 'm:' + chatMe());
      const chatCanSend = x => (x.side === 'd' ? !!dispoToken : !!userToken);

      const chatTeamNow = () => (session.role === 'dispo' ? chatTeam : session.team || '');

      // Nachrichten eines Teams, die älteste zuerst
      const chatList = team => [...chatMsgs.values()].filter(m => m.team === team).sort((a, b) => a.id - b.id);

      function chatInfo() {

      };
      const chatCount = n => (n > 99 ? '99+' : String(n));

      const chatTeams = () =>

      function chatItems(team) {

          out = [];

          prevDay = '';

          if (day !== prevDay) {

            prevDay = day;
            prev = null;
          }
          const isMine = chatIsMine(row.m),
            showName = !isMine && (!prev || prev.side !== row.m.side || prev.usr !== row.m.usr || row.m.at - prev.at > 5 * 60e3);
          out.push({ ...row, type: 'msg', mine: isMine, showName, sig: [row.pending, row.err, showName, row.m.name, row.m.text, row.m.at].join('|') });
          prev = row.m;
        }
        if (!out.length) out.push({ type: 'empty', key: 'ce', sig: session.role });
        return out;
      }
      function chatNode(it) {
        if (it.type === 'day') return el('div', { class: 'cday', 'data-k': it.key, 'data-sig': it.sig }, it.label);
        if (it.type === 'empty')
          return el(
            'p',
            { class: 'mu cempty', 'data-k': it.key, 'data-sig': it.sig },
            session.role === 'dispo' ? 'Noch keine Nachrichten. Schreib dem Team etwas.' : 'Noch keine Nachrichten. Schreib dem Disponenten, wenn du Fragen hast.'
          );
        const m = it.m,
          status = it.mine ? (it.err ? '⚠' : it.pending ? '⏳' : '✓') : '';
        return el(
          'div',
          { class: 'cmsg' + (it.mine ? ' me' : '') + (it.pending ? ' pend' : '') + (it.err ? ' fail' : ''), 'data-k': it.key, 'data-sig': it.sig },
          it.showName && el('div', { class: 'cby' }, m.side === 'd' ? 'Disponent' : m.name || m.usr || 'Monteur'),
          el(
            'div',
            { class: 'cbub' },
            m.text,
            el('span', { class: 'cmeta' }, timeText(m.at), status && el('span', { class: 'cst', title: it.err ? 'Nicht gesendet' : it.pending ? 'Wird gesendet, sobald Netz da ist' : 'Gesendet' }, status))
          ),
          it.err &&
            el(
              'div',
              { class: 'cfail' },
              'Nicht gesendet: ' + it.err,
              el('button', { onclick: () => chatRetry(m.cid) }, 'Erneut senden'),

      // Verlauf auf den Soll-Stand bringen, ohne unveränderte Nachrichten anzufassen: vorhandene bleiben als Element stehen, neue kommen dazu,

      function chatReconcile(thr, items) {
        const old = new Map([...thr.children].map(n => [n.dataset.k, n])),
          fresh = [];
        items.forEach((it, i) => {
          let n = old.get(it.key);
          if (n && n.dataset.sig === it.sig) old.delete(it.key);
          else {
            const made = chatNode(it);
            if (n) {
              n.replaceWith(made);
              old.delete(it.key);
            } else fresh.push(made);
            n = made;

          if (thr.children[i] !== n) thr.insertBefore(n, thr.children[i] || null);

      }
      const chatAtBottom = thr => thr.scrollHeight - thr.scrollTop - thr.clientHeight < 40;
      function chatToBottom(smooth) {

        chatPill = false;

        if (chatAutoRead()) chatPatchBadges();
      }
      // Verlauf des geöffneten Teams als gelesen markieren – nur wenn der Verlauf unten steht und die Seite sichtbar ist. true = hat sich geändert
      function chatAutoRead() {
        if (!chatShown() || document.hidden || !chatPinned) return false;

        for (const m of chatMsgs.values()) if (m.team === team && m.id > last) last = m.id;

      // Rollen im Verlauf: merkt, ob er unten steht, blendet „Neue Nachrichten“ aus und markiert als gelesen
      function chatOnScroll(e) {

        });
      }
      // vor render(): Rollstelle des Verlaufs merken, danach wiederherstellen (steht er unten, bleibt er unten; sonst an derselben Stelle)
      const chatSnapshot = () => {

      };
      function chatRestore(snap) {

      // die bisherigen Nachrichten gleiten dabei nach oben (statt zu springen), die neuen blenden ein. Sonst bleibt alles stehen und
      // „↓ Neue Nachrichten“ erscheint.
      function chatThreadPatch(thr) {

          if (!reduce && Math.abs(dy) > 1)

        } else if (fresh.some(n => !n.classList.contains('me'))) {

      const chatRowSig = team => {

      function chatRowContent(team) {

          m = last.get(team),
          n = unread.get(team) || 0;
        return [
          el('span', { class: 'crn' }, team),
          el('span', { class: 'crt' }, m ? (chatDayKey(m.at) === today() ? timeText(m.at) : chatDayLabel(m.at)) : ''),
          el('span', { class: 'crp' }, m ? chatPreviewOf(m) : 'Noch keine Nachrichten'),
          el('span', { class: 'cbadge' + (n ? ' on' : '') }, n ? chatCount(n) : '0')

      }
      function chatListPatch() {

      function chatTitleSync() {

      }
      // Nachrichten übernehmen (Abgleich, Live, Antwort des Servers). full = der Server schickt den ganzen Verlauf (ersetzt den bisherigen);
      // notify = neue Nachrichten der Gegenseite melden (Kurzmeldung, Ton). Rückgabe: die neuen Nachrichten
      function chatApply(rows, { full = false, notify = false } = {}) {
        const cut = Date.now() - CHAT_KEEP_MS,
          added = [];
        if (full) chatMsgs = new Map();
        for (const r of rows || []) {
          if (!r || !r.id || !(r.at >= cut) || chatMsgs.has(r.id)) continue;
          chatMsgs.set(r.id, r);
          added.push(r);
        }
        for (const [id, m] of chatMsgs) if (m.at < cut) chatMsgs.delete(id);
        if (added.length || full) chatVer++;
        // erstes Mal auf diesem Gerät: alles bisher Geschriebene gilt als gelesen (sonst stünde „Chat (87)“ an einem neuen Handy)
        if (full && !chatReadAll[chatRoleKey()]) {
          for (const m of chatMsgs.values()) chatSetRead(m.team, m.id);
          chatReadAll[chatRoleKey()] = chatReadAll[chatRoleKey()] || {};
        }
        if (notify && added.length) chatNotify(added);
        return added;
      }
      // Kurzmeldung + Ton für neue Nachrichten, die gerade niemand sieht
      function chatNotify(rows) {
        if (!(session.role === 'dispo' ? dispoUnlocked : !!userToken)) return;
        const open = team => chatShown() && chatTeamNow() === team && !document.hidden && chatPinned,
          unseen = rows.filter(m => !chatIsMine(m) && Date.now() - m.at < 5 * 60e3 && !open(m.team));
        if (!unseen.length || Date.now() - chatToastAt < 1500) return;
        chatToastAt = Date.now();
        const m = unseen[unseen.length - 1];
        chatToastTeam = unseen.every(x => x.team === m.team) ? m.team : '';
        const who = session.role === 'dispo' ? `${m.team} · ${m.name || 'Monteur'}` : m.side === 'd' ? 'Disponent' : m.name || 'Kollege',
          text = unseen.length > 1 ? `💬 ${unseen.length} neue Chat-Nachrichten` : `💬 ${who}: ${m.text.replace(/\s+/g, ' ').trim().slice(0, 90)}`;
        toast(text, () => chatGo(m.team));
        playChatSound();
      }
      // zum Chat (eines Teams) wechseln – Tipp auf die Kurzmeldung oder die Benachrichtigung
      function chatGo(team) {
        if (openOrder) return; // (ein offener Auftrag wird nicht mitten in der Arbeit verlassen)
        if (session.role === 'dispo' && dispoUnlocked) {
          dispoTab = 'ch';
          chatTeam = team;
          uploadToken = '';
          chatPinned = true;
          render();
          chatToBottom();
        } else if (session.role === 'monteur' && userToken && session.team) {
          if (viewKind !== 'chat') openKind('chat');
          chatToBottom();
        }
      }
      // sanfter Doppelton (steigend) bei neuer Nachricht; nur wenn der Browser Ton schon erlaubt hat (siehe unlockAudio)
      function playChatSound() {
        if (!audioCtx || audioCtx.state !== 'running') return;
        try {
          const t0 = audioCtx.currentTime + 0.02,
            master = audioCtx.createGain();
          master.gain.value = 0.12;
          master.connect(audioCtx.destination);
          for (const [freq, start] of [[659, 0], [880, 0.12]]) {
            const osc = audioCtx.createOscillator(),
              env = audioCtx.createGain(),
              at = t0 + start;
            osc.type = 'sine';
            osc.frequency.value = freq;
            env.gain.setValueAtTime(0.0001, at);
            env.gain.exponentialRampToValueAtTime(1, at + 0.02);
            env.gain.exponentialRampToValueAtTime(0.0001, at + 0.25);
            osc.connect(env);
            env.connect(master);
            osc.start(at);
            osc.stop(at + 0.27);
          }
        } catch (e) {}
      }
      // ---- Senden ----
      function chatSend(team) {
        const text = (chatDraft[team] || '').replace(/\r\n?/g, '\n').trim();
        if (!text || text.length > CHAT_MAX) return;
        chatQueue.push({ cid: crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 20) : Math.random().toString(36).slice(2, 12) + Date.now().toString(36), team, side: chatSide(), text, at: Date.now() });
        chatSaveQueue();
        chatDraft[team] = '';
        const ta = app.querySelector('.cin');
        if (ta) {
          ta.value = '';
          const send = app.querySelector('.csend');
          if (send) send.disabled = true;
        }
        chatVer++;
        chatPatchAll();
        chatFlush();
      }
      // Warteschlange abarbeiten (der Reihe nach). Kein Netz / Serverfehler / Anmeldung abgelaufen: bleibt liegen und wird später erneut versucht;
      // eine abgelehnte Nachricht (4xx) bekommt den Fehler und wartet auf „Erneut senden“ oder „Verwerfen“
      async function chatFlush() {
        if (chatBusy) {
          chatAgain = true;
          return;
        }
        chatBusy = true;
        let retryIn = 0;
        try {
          for (;;) {
            const q = chatQueue.find(x => !x.err && chatCanSend(x));
            if (!q) break;
            try {
              const r = await api('POST', '/api/chat', { team: q.team, text: q.text, cid: q.cid, side: q.side }, 15000);
              chatQueue = chatQueue.filter(x => x !== q);
              chatSaveQueue();
              chatApply([r.msg]);
              serverReachable = true;
            } catch (e) {
              if (e.status === 429) retryIn = 8000;
              else if (e.status && e.status >= 400 && e.status < 500 && e.status !== 401 && e.status !== 408) {
                q.err = errorMessageOf(e);
                chatSaveQueue();
                chatVer++;
              } else retryIn = 6000; // kein Netz, Serverfehler, nicht angemeldet
              if (!q.err) break;
            }
            chatPatchAll();
          }
        } finally {
          chatBusy = false;
        }
        chatPatchAll();
        clearTimeout(chatRetryTimer);
        chatRetryTimer = null;
        if (retryIn) chatRetryTimer = setTimeout(chatFlush, retryIn);
        else if (chatAgain) {
          chatAgain = false;
          chatFlush();
        }
      }
      function chatRetry(cid) {
        const q = chatQueue.find(x => x.cid === cid);
        if (!q) return;
        delete q.err;
        chatSaveQueue();
        chatVer++;
        chatPatchAll();
        chatFlush();
      }
      function chatDiscard(cid) {
        chatQueue = chatQueue.filter(x => x.cid !== cid);
        chatSaveQueue();
        chatVer++;
        chatPatchAll();
      }
      // ---- Zeichnen ----
      function chatComposer(team) {
        const send = () => chatSend(team),
          ta = el('textarea', {
            class: 'cin',
            'data-keep': 'chat',
            rows: '1',
            maxlength: String(CHAT_MAX),
            enterkeyhint: 'send',
            autocomplete: 'off',
            'aria-label': 'Nachricht schreiben',
            placeholder: session.role === 'dispo' ? `Nachricht an ${team} …` : 'Nachricht schreiben …',
            value: chatDraft[team] || '',
            oninput: e => {
              chatDraft[team] = e.target.value;
              const btn = app.querySelector('.csend');
              if (btn) btn.disabled = !e.target.value.trim();
              // wächst das Feld, wandert der Verlauf mit nach oben (er steht sonst hinter der Eingabe)
              if (chatPinned) requestAnimationFrame(() => chatToBottom());
            },
            onkeydown: e => {
              // Enter sendet am Rechner (Umschalt+Enter: neue Zeile), am Handy macht Enter eine neue Zeile; Strg/Cmd+Enter sendet überall
              if (e.key !== 'Enter' || e.isComposing) return;
              if (e.ctrlKey || e.metaKey || (!e.shiftKey && matchMedia('(pointer: fine)').matches)) {
                e.preventDefault();
                send();
              }
            }
          });
        return el(
          'div',
          { class: 'ccomp' },
          el('button', { class: 'cpill' + (chatPill ? ' on' : ''), onclick: () => chatToBottom(true) }, '↓ Neue Nachrichten'),
          ta,
          el('button', { class: 'pri csend', disabled: (chatDraft[team] || '').trim() ? null : '', onclick: send }, 'Senden')
        );
      }
      // Verlauf mit Eingabe: head = Kopf (Teamname bzw. Titel)
      function chatPane(team, head, extra = '') {
        return el(
          'div',
          { class: 'cpane' + extra },
          head,
          el('div', { class: 'cthr', 'data-team': team, role: 'log', 'aria-label': 'Chat', onscroll: chatOnScroll }, chatItems(team).map(chatNode)),
          chatComposer(team)
        );
      }
      // Monteur: Verlauf des eigenen Teams mit dem Disponenten
      function drawChatView() {
        chatAutoRead();
        document.body.dataset.chat = '1';
        app.append(
          chatPane(
            session.team,
            el('div', { class: 'chead' }, el('b', {}, '💬 Chat'), el('span', { class: 'mu' }, `Disponent und Team ${session.team}`)),
            ' chat1'
          )
        );
      }
      // Disponent: Tab „Chat“ – links die Teams (mit Zähler und letzter Nachricht), rechts der Verlauf des gewählten Teams
      function drawChatTab() {
        chatAutoRead();
        document.body.dataset.chat = '1';
        const teams = chatTeams(),
          team = chatTeam && teams.includes(chatTeam) ? chatTeam : '';
        if (team !== chatTeam) chatTeam = team;
        const rows = teams.map(t =>
          el(
            'button',
            { class: 'crow' + (t === team ? ' on' : '') + (chatInfo().unread.get(t) ? ' un' : ''), 'data-k': 'cl-' + t, 'data-team': t, 'data-sig': chatRowSig(t), onclick: () => chatOpenTeam(t) },
            ...chatRowContent(t)
          )
        );
        app.append(
          el(
            'div',
            { class: 'cwrap' + (team ? ' t' : '') },
            el('div', { class: 'clist' }, rows.length ? rows : el('p', { class: 'mu' }, dataReady ? 'Noch keine Teams.' : 'Teams werden geladen …')),
            team
              ? chatPane(
                  team,
                  el(
                    'div',
                    { class: 'chead' },
                    el('button', { class: 'cback', onclick: chatCloseTeam }, '← Teams'),
                    el('b', {}, team),
                    el('span', { class: 'mu' }, 'Alle Monteure des Teams sehen die Unterhaltung')
                  )
                )
              : el('div', { class: 'cpane' }, el('div', { class: 'chead' }, el('span', { class: 'mu' }, 'Team links wählen, um zu schreiben.')), el('div', { class: 'cthr' }))
          )
        );
      }
      function chatOpenTeam(team) {
        chatTeam = team;
        chatPinned = true;
        chatPill = false;
        render();
        chatToBottom();
      }
      function chatCloseTeam() {
        chatTeam = '';
        render();
      }
      // Monteur: Kachel auf der Startseite
      const chatTilePreview = () => {
        const m = chatInfo().last.get(session.team);
        return m ? chatPreviewOf(m) : 'Noch keine Nachrichten';
      };
      function chatTile() {
        const n = chatTotalUnread();
        return el(
          'button',
          { class: 'big kind chat', 'data-k': 'kd-chat', onclick: () => openKind('chat') },
          el('span', { class: 'ki' }, '💬'),
          el(
            'span',
            { class: 'kb' },
            el('span', { class: 'kn' }, 'Chat mit dem Disponenten'),
            el('span', { class: 'mu cprev' }, chatTilePreview()),
            el('span', { class: 'mu sm' }, 'Fragen, Hinweise, Rückmeldungen')
          ),
          el('span', { class: 'cbadge' + (n ? ' on' : '') }, n ? chatCount(n) : '0')
        );
      }
      // Disponent: Kopfzeile + Tabs (Übersicht, Disposition, Fortschritt | Chat, Upload, Vergleich | Geräte, Benutzer) und je nach Tab die passende Ansicht.
      // Die Tabs füllen die ganze Breite: am Handy drei Zeilen (3 + 3 + 2), breit eine (siehe CSS .tabs) – nichts wird abgeschnitten oder gewischt
      function drawDispo(back) {
        chatAutoRead(); // (vor den Tabs: die Zahl am Tab „Chat“ zählt den gerade geöffneten Verlauf nicht mit)
        // tab(Schlüssel, Beschriftung, Zustand setzen, nach dem Neuzeichnen)
        const tab = (key, label, setState, afterDraw) =>
          el(
            'button',
            {
              class: dispoTab === key ? 'on' : null,
              'data-tab': key,
              onclick: () => {
                setState();
                render();
                if (afterDraw) afterDraw();
              }
            },
            label
          );
        const tabs = [
          tab('ue', 'Übersicht', () => {
            dispoTab = 'ue';
            uploadToken = '';
          }),
          tab('di', 'Disposition' + (openDispatchCount() ? ` (${openDispatchCount()})` : ''), () => {
            if (dispoTab !== 'di') {
              gSel = '';
              gDraft = null;
              gArmAll = false;
            }
            dispoTab = 'di';
            uploadToken = '';
          }),
          tab('st', 'Fortschritt', () => {
            dispoTab = 'st';
            uploadToken = '';
          }),
          tab(
            'ch',
            chatTabLabel(),
            () => {
              if (dispoTab !== 'ch') {
                chatPinned = true;
                chatPill = false;
              }
              dispoTab = 'ch';
              uploadToken = '';
            },
            () => chatToBottom()
          ),
          tab(
            'up',
            'Upload',
            () => {
              if (dispoTab !== 'up') {
                dispoTab = 'up';
                uploadToken = '';
                uploadPinInput = '';
                uploadPinError = false;
                uploadPick = {};
                uploadKeep = {};
              }
            },
            () => {
              const n = app.querySelector('[data-keep="u"]');
              if (n) n.focus();
            }
          ),
          tab('vg', 'Vergleich', () => {
            dispoTab = 'vg';
            uploadToken = '';
          }),
          tab(
            'dv',
            'Geräte',
            () => {
              dispoTab = 'dv';
              uploadToken = '';
              deviceRenameId = null;
              deviceLogoutArmed = null;
            },
            () => {
              loadDevices();
              reloadDevicesSoon();
            }
          ),
          tab(
            'us',
            'Benutzer',
            () => {
              dispoTab = 'us';
              uploadToken = '';
              userEdit = null;
              userArmed = null;
              userLogFor = null;
            },
            loadUsers
          )
        ];
        app.append(
          el('div', { class: 'bar' }, el('h1', {}, 'Disponent'), back),
          el(
            'div',
            { class: 'tabs' },
            el('div', { class: 'trow' }, ...tabs.slice(0, 3)),
            el('div', { class: 'trow' }, ...tabs.slice(3, 6)),
            el('div', { class: 'trow' }, ...tabs.slice(6))
          )
        );
        if (dispoTab === 'ch') {
          drawChatTab();
          return;
        }
        if (dispoTab === 'us') {
          drawUsers();
          return;
        }
        if (dispoTab === 'di') {
          drawDispoPlan();
          return;
        }
        if (dispoTab === 'dv') {
          drawDevices();
          return;
        }
        if (dispoTab === 'vg') {
          drawComparison();
          return;
        }
        if (dispoTab === 'st') {
          drawDispoProgress();
          return;
        }
        if (dispoTab === 'up' && !uploadToken) {
          drawUploadPinPrompt();
          return;
        }
        if (dispoTab === 'up') {
          drawUploadTab();
          return;
        }
        drawDispoOverview();
      }

      /** Baut die komplette Seite aus dem Zustand: Meldungen, dann je nach Zustand Detail, Start, PIN, Team, Monteur- oder Dispo-Ansicht. */
      function draw() {
        applyFontScale();
        hideTooltip();
        document.body.dataset.w =
          !openOrder && (!session.role || (session.role === 'dispo' && !dispoUnlocked)) ? 'n' : '';
        // Chat: die Seite rollt nicht, der Verlauf rollt in sich (siehe CSS body[data-chat]; setzen drawChatView und drawChatTab)
        delete document.body.dataset.chat;
        app.replaceChildren();
        drawStatusBanners();
        if (openOrder) {
          drawOrderDetail();
          return;
        }
        if (!session.role) {
          drawRoleChoice();
          return;
        }
        const back = el('button', { onclick: () => switchRole(null) }, '← Start');
        if (session.role === 'dispo' && !dispoUnlocked) {
          drawDispoLogin(back);
          return;
        }
        // Monteure müssen sich anmelden (SAP-User + Passwort); danach gilt das Team aus der Benutzerverwaltung
        if (session.role === 'monteur' && !userToken) {
          drawMonteurLogin(back);
          return;
        }
        if (session.role === 'monteur' && !session.team) {
          drawTeamPicker(back);
          return;
        }
        // Team gibt es (noch) nicht bei den Aufträgen (z. B. „Springer“): Team wählen lassen
        if (
          session.role === 'monteur' &&
          !(userInfo && userInfo.lock) &&
          dataReady &&
          teamList.length &&
          !teamList.some(([t]) => t === session.team)
        ) {
          drawTeamPicker(back, session.team);
          return;
        }
        if (session.role === 'monteur') {
          drawMonteurList(back);
          return;
        }
        drawDispo(back);
      }

      // ---- Start ----
      // Ungesendete Eingaben aus dem Gerät laden, auf Netz-/Sichtbarkeitswechsel reagieren, erstmals zeichnen und abgleichen
      loadOutbox();
      addEventListener('online', () => {
        serverReachable = true;
        if (outbox.size) sendAllPending();
        if (chatQueue.length) chatFlush();
        poll();
      });
      addEventListener('offline', () => {
        serverReachable = false;
        render();
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (outbox.size) sendAllPending();
          if (chatQueue.length) chatFlush();
          if (chatShown() && chatAutoRead()) chatPatchBadges(); // (was im Hintergrund ankam, wird jetzt gesehen)
          // nach dem Hintergrund ist die Verbindung oft stumm tot: neu aufbauen, wenn lange nichts kam
          if (live.ctrl && Date.now() - live.last > 45000) live.ctrl.abort();
          syncLive();
          if (liveDirty) renderLive();
          poll();
        }
      });
      // Sicherheitsnetz: steht die Live-Verbindung, reicht ein Abgleich alle 90 Sekunden, sonst alle 30
      setInterval(() => {
        if (!document.hidden && Date.now() - lastPollAt > (live.ok ? 90000 : 30000) - 2000) poll();
      }, 15000);
      // Geräteübersicht offen: alle 20 Sekunden neu laden (nicht während ein Spitzname getippt wird)
      setInterval(() => {
        if (
          dispoTab === 'dv' &&
          dispoUnlocked &&
          session.role === 'dispo' &&
          !document.hidden &&
          deviceRenameId === null
        )
          loadDevices();
      }, 20000);
      // Erst zeichnen, wenn die Schrift (Inter, vier Schnitte à ~24 KB) geladen ist: sonst springt der Text beim Nachladen um
      // (andere Zeichenbreiten -> neue Umbrüche). Höchstens 700 ms warten (dann gilt vorübergehend die Systemschrift, font-display: swap).
      const fontsLoaded =
        document.fonts && document.fonts.load
          ? Promise.race([
              Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 1rem Inter`))).catch(() => {}),
              new Promise(resolve => setTimeout(resolve, 700))
            ])
          : Promise.resolve();
      // Tipp auf eine Chat-Benachrichtigung bei geschlossener App öffnet die Seite mit ?chat=1: nach dem ersten Abgleich zum Chat
      let wantChat = /[?&]chat=1\b/.test(location.search);
      if (wantChat)
        try {
          history.replaceState(history.state, '', location.pathname);
        } catch (e) {}
      fontsLoaded.then(() => {
        render();
        poll().then(() => {
          sendAllPending();
          prefetchChecklists();
          pushSync(false);
          if (wantChat && session.role === 'monteur') chatGo(session.team);
          wantChat = false;
        });
        syncLive();
        if (chatQueue.length) chatFlush();
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        // Push angekommen / bestätigt -> sofort abgleichen
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data && e.data.t === 'msg') poll();
          // Tipp auf eine Chat-Benachrichtigung: zum Chat
          if (e.data && e.data.t === 'chat') {
            poll();
            if (session.role === 'monteur') chatGo(session.team);
          }
        });
      }
    </script>
  </body>
</html>
