<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aufträge nach Team</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#bb005d" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="preload" href="/fonts/inter-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-semibold.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      try {
        var t = localStorage.getItem('thm');
        if (t == 'light' || t == 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* ===== Stile ====================================================================================
         Aufbau: Farben (Design-Tokens, hell/dunkel) → Grundelemente → Bausteine → Layout je Bildschirmgröße.
         Klassennamen sind bewusst kurz. Wichtigste Abkürzungen:
           .mu  = muted (gedämpfter Text)        .er  = error (Fehlerfarbe)       .tag = kleines Etikett
           .kt  = Kurztext (Titel einer Karte)   .cl  = clickable (Karte anklickbar)  .dn = done (erledigt, blasser)
           .it  = item (ein Prüfobjekt, Monteur) .li  = Listenzeile (ein Prüfobjekt, Dispo, nur Ansicht)
           .ob  = Button-Reihe (OK / Nicht OK)   .ed  = Editor für den Nicht-OK-Text   .cfm = Rückfrage „Alles OK“
           .zt  = Zeile der Zeitkarte            .qk  = Schnellwahl-Buttons            .flt = Filterleiste (Dispo)
           .mkr = Zeile „Abhaken“ (Dispo)        .g*  = Fortschrittsgrafik aller Teams (Dispo)
           .vg* = Vergleichsseite (Dispo)        .dlg = Dialog
         Farb-Variablen: --bg Hintergrund, --card Karte, --tx Text, --mu gedämpft, --ac/--act Akzent (Wiener-Netze-Magenta),
         --bd Rahmen, --er Fehler, --ok erledigt/OK, --nk Nicht OK, --g1/--g2/--gt Balken (in Arbeit/erledigt/offen).
         ================================================================================================= */
      /* ---- Schrift: Inter (eigene Dateien in /fonts, kein Abruf von Fremdservern, funktioniert offline). Lizenz: OFL, siehe fonts/LICENSE-Inter.txt.
         Das Skript zeichnet die Seite erst, wenn die Schrift geladen ist (siehe fontsLoaded), sonst würde der Text beim Nachladen springen. ---- */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/inter-regular.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url('/fonts/inter-medium.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 600;
        font-display: swap;
        src: url('/fonts/inter-semibold.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('/fonts/inter-bold.woff2') format('woff2');
      }
      /* ---- Farben: hell (Standard), dunkel per Systemeinstellung oder Schalter (data-theme am <html>) ----
         --acs = sehr helle Tönung des Akzents (Hover/Auswahl), --ring = Fokusring, --r/--rc = Rundung Bedienelemente/Karten,
         --sh1/--sh2 = Schatten (Karte / schwebendes Element) */
      :root {
        --bg: #f3f3f7;
        --card: #fff;
        --tx: #18181d;
        --mu: #62616c;
        --ac: #bb005d;
        --act: #bb005d;
        --bd: #e3e2ea;
        --er: #c4320a;
        --ok: #067647;
        --nk: #c4320a;
        --gb1: #b45309;
        --gb2: #c2410c;
        --gb3: #c4320a;
        --g1: #5fb085;
        --g2: #067647;
        --gt: #e3e2e9;
        --acs: color-mix(in srgb, var(--ac) 7%, var(--card));
        --ring: color-mix(in srgb, var(--ac) 30%, transparent);
        --r: 12px;
        --rc: 14px;
        --sh1: 0 1px 2px rgba(24, 24, 29, 0.05), 0 1px 3px rgba(24, 24, 29, 0.04);
        --sh2: 0 8px 22px rgba(24, 24, 29, 0.12);
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #111115;
          --card: #1b1b21;
          --tx: #ececf1;
          --mu: #a2a1ac;
          --ac: #d1176f;
          --act: #f06baa;
          --bd: #2b2b34;
          --er: #f2704f;
          --ok: #15803d;
          --nk: #d0421a;
          --gb1: #fbbf24;
          --gb2: #fb923c;
          --gb3: #d0421a;
          --g1: #2e6e4c;
          --g2: #22a35a;
          --gt: #33333c;
          --sh1: 0 1px 2px rgba(0, 0, 0, 0.35);
          --sh2: 0 8px 22px rgba(0, 0, 0, 0.45);
        }
      }
      :root[data-theme='dark'] {
        --bg: #111115;
        --card: #1b1b21;
        --tx: #ececf1;
        --mu: #a2a1ac;
        --ac: #d1176f;
        --act: #f06baa;
        --bd: #2b2b34;
        --er: #f2704f;
        --ok: #15803d;
        --nk: #d0421a;
        --gb1: #fbbf24;
        --gb2: #fb923c;
        --gb3: #d0421a;
        --g1: #2e6e4c;
        --g2: #22a35a;
        --gt: #33333c;
        --sh1: 0 1px 2px rgba(0, 0, 0, 0.35);
        --sh2: 0 8px 22px rgba(0, 0, 0, 0.45);
      }
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* ---- Grundlayout ---- */
      html {
        scroll-padding-top: calc(var(--toph, 52px) + 8px);
        overflow-anchor: none;
      }
      /* Schriftgröße ändern: die Seite wechselt sofort und blendet vom alten zum neuen Bild über (siehe changeFontScale).
         font-size selbst wird bewusst nicht animiert – bei jedem Zwischenschritt würden Texte neu umbrechen und die Seite springen. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.22s;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          1rem/1.45 'Inter',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-size-adjust: 100%;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 8px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
        /* Einblendungen schieben Karten seitlich herein: der Überstand darf die Seite nicht breiter machen (sonst lässt sie
           sich während der Animation seitlich verschieben und wackelt). clip statt hidden, damit „sticky“ weiter klappt. */
        overflow-x: clip;
      }
      body[data-w='n'] main {
        max-width: 560px;
      }
      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 8px 0 16px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap; /* bei großer Schrift auf schmalem Handy rutscht der Knopf unter die Überschrift, statt über den Rand zu ragen */
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .bar h1 {
        margin: 0;
      }
      .bar button {
        white-space: nowrap;
        flex: 0 0 auto;
      }
      /* ---- Bedienelemente ---- */
      button,
      select,
      input[type='search'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 14px;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
        font-weight: 500;
        box-shadow: var(--sh1);
      }
      /* Knöpfe ohne eigenen Hintergrund (Link, Hell/Dunkel, Schließen-Kreuz) bekommen keinen Schatten */
      button.lk,
      .thm,
      .msg.dx > .x,
      .grows .grow {
        box-shadow: none;
      }
      button.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 1px 2px color-mix(in srgb, var(--ac) 45%, transparent);
      }
      button.big {
        display: block;
        width: 100%;
        padding: 18px;
        font-size: 1.125rem;
        margin-bottom: 10px;
        text-align: left;
      }
      button.er {
        color: var(--er);
      }
      /* ---- Karten, Etiketten, Meldungen, Statusfarben ---- */
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--rc);
        box-shadow: var(--sh1);
        padding: 12px 14px;
        margin-bottom: 10px;
        overflow-wrap: break-word;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tag {
        font-size: 0.75rem;
        font-weight: 500;
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 1px 8px;
        color: var(--mu);
      }
      /* gleich breite Ziffern nur für reine Zahlen (Auftragsnummer, Prozent, Zähler): bei „FW-IH01“ oder „M-0021-02“ würden die Bindestriche zu breit */
      .row > b,
      .prg .pp,
      .prg .pn {
        font-variant-numeric: tabular-nums;
      }
      .kt {
        font-size: 1.0625rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 6px 0 2px;
      }
      .mu {
        color: var(--mu);
        font-size: 0.875rem;
      }
      /* Zeile „N Aufträge · Standort …“ über der Liste: immer genau eine Zeile (ändert sich der Text, springt die Liste nicht) */
      .cnt {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg {
        padding: 10px 12px;
        border-radius: var(--r);
        border: 1px solid var(--bd);
        box-shadow: var(--sh1);
        margin-bottom: 12px;
        background: var(--card);
      }
      .msg.er {
        color: var(--er);
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .tools input {
        flex: 1;
        min-width: 0;
      }
      label.ck {
        display: block;
        margin: 10px 0;
        font-size: 0.875rem;
        color: var(--mu);
      }
      .card.cl {
        cursor: pointer;
      }
      .chev {
        margin-left: auto;
        color: var(--mu);
        font-size: 0.875rem;
      }
      .li {
        padding: 8px 0;
        border-top: 1px solid var(--bd);
      }
      .card button.pri {
        margin-top: 10px;
      }
      .mu.er {
        color: var(--er);
      }
      .tag.st-ok {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .tag.st-nok {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      .tag.st-teil {
        border-color: var(--ac);
        color: var(--act);
      }
      .tag.st-zf {
        background: rgba(196, 50, 10, 0.14);
        border-color: var(--nk);
        color: var(--er);
        font-weight: 700;
      }
      /* Gebrechen (Meldung mit Codierung „Gebrechen leicht/mittel/stark“): Etikett mit der Schwere und eine farbige Kante an Karte bzw. Meldung.
         Stufen: 1 leicht (gelb), 2 mittel (orange), 3 stark (rot, Etikett gefüllt). Die Kante ist wie beim überfälligen Auftrag ein Rahmen links. */
      .tag.gb {
        font-weight: 600;
        color: var(--c);
        border-color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, var(--card));
      }
      .tag.gb-1 {
        --c: var(--gb1);
      }
      .tag.gb-2 {
        --c: var(--gb2);
      }
      .tag.gb-3 {
        --c: var(--gb3);
        color: #fff;
        background: var(--gb3);
      }
      .card.gb-c1 {
        border-left: 4px solid var(--gb1);
      }
      .card.gb-c2 {
        border-left: 4px solid var(--gb2);
      }
      .card.gb-c3 {
        border-left: 4px solid var(--gb3);
      }
      .it.gbi {
        padding-left: 8px;
      }
      .it.gb-c1 {
        border-left: 3px solid var(--gb1);
      }
      .it.gb-c2 {
        border-left: 3px solid var(--gb2);
      }
      .it.gb-c3 {
        border-left: 3px solid var(--gb3);
      }
      .nokbox {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--nk);
        font-size: 0.875rem;
      }
      .nokbox b {
        color: var(--er);
      }
      /* ---- Filter-Chips ---- */
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
        font-weight: 500;
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .chip.nk.on {
        background: var(--nk);
        border-color: var(--nk);
      }
      .chips.ab {
        align-items: center;
      }
      /* ---- Prüfobjekte: Monteur (.it) mit OK / Nicht OK, Rückfrage „Alles OK“ (.cfm) ---- */
      .it {
        padding: 10px 0;
        border-top: 1px solid var(--bd);
      }
      .it .t {
        margin-bottom: 8px;
        word-break: break-word;
      }
      .it .t .orig {
        font-size: 0.75rem;
        color: var(--mu);
        opacity: 0.8;
        margin-top: 2px;
      }
      .ob {
        display: flex;
        gap: 8px;
      }
      .ob button {
        flex: 1;
        padding: 12px 8px;
      }
      .ob button.ok.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .ob button.nk.on {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      /* abgehakter Auftrag (Monteur): Prüfobjekte nur ansehen */
      .ob button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .lockn {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-color: var(--ac);
      }
      button.allok {
        display: block;
        width: 100%;
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        padding: 14px;
        font-size: 1.0625rem;
        margin: 10px 0;
      }
      .cfm {
        margin: 10px 0;
        padding: 12px;
        border: 2px solid var(--ok);
        border-radius: var(--r);
      }
      .cfm .ob {
        margin-top: 10px;
      }
      .cfm button {
        padding: 14px 8px;
        font-size: 1rem;
      }
      .cfm button.yes {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .mk {
        display: inline-block;
        width: 1.4em;
      }
      /* ---- Tabs der Disponentenansicht, Texteingaben ---- */
      /* Tabs: nebeneinander, am Handy seitlich wischbar (nichts wird abgeschnitten), der aktive Tab wird in die Mitte gerückt */
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tabs button {
        flex: 1 0 auto;
        white-space: nowrap;
        padding: 10px 14px;
        font-size: 0.875rem;
      }
      .tabs button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        font-weight: 600;
        box-shadow: 0 1px 2px color-mix(in srgb, var(--ac) 45%, transparent);
      }
      .tools select {
        flex: 1;
        min-width: 0;
      }
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
      }
      .ed {
        margin-top: 8px;
      }
      .ob button.sv {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .nk1 {
        margin-top: 4px;
      }
      .tmr {
        margin-bottom: 12px;
      }
      /* überfälliger Auftrag: roter Balken links an der Karte */
      .card.due {
        border-left: 4px solid var(--er);
      }
      /* Dispo-Filter: breit immer sichtbar; am Handy zugeklappt hinter „Filter“, oben nur Suche und die aktiven Filter */
      .fbtn {
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .fbtn.on {
        border-color: var(--ac);
        color: var(--ac);
      }
      .fsum {
        margin: 0 0 10px;
      }
      @media (max-width: 699px) {
        .fp.closed {
          display: none;
        }
        .srow {
          display: flex;
          gap: 8px;
          align-items: flex-start;
        }
        .srow .tools {
          flex: 1 1 auto;
          min-width: 0;
        }
      }
      @media (min-width: 700px) {
        .fbtn,
        .fsum {
          display: none;
        }
      }
      /* Liste: Marke am Ende, bei deren Annäherung die Liste automatisch länger wird (ohne IntersectionObserver ein Button) */
      .more {
        min-height: 1px;
        text-align: center;
        margin: 6px 0 16px;
      }
      .more button {
        min-width: 16rem;
      }
      /* Benutzer: Link-Schaltfläche (.lk), Benutzerzeile (.uline) und Karten der Benutzerverwaltung (.ucard) */
      button.lk {
        border: none;
        background: none;
        color: var(--act);
        padding: 0;
        text-decoration: underline;
        font-size: inherit;
      }
      .uline {
        margin: -4px 0 10px;
      }
      /* Mit Benachrichtigungs-Hinweis/-Glocke kann die Zeile umbrechen: zwei Zeilen reservieren, damit die Seite nicht springt,
         wenn die Glocke erscheint oder verschwindet */
      @media (max-width: 600px) {
        .uline.two {
          min-height: 2.8em;
        }
      }
      .ulog {
        margin: 6px 0 0;
        padding-left: 0;
        list-style: none;
        max-height: 14rem;
        overflow: auto;
      }
      .ulog li {
        font-size: 0.8125rem;
        color: var(--mu);
        padding: 2px 0;
      }
      .ucard.off {
        opacity: 0.7;
      }
      .uq {
        margin-top: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .uq select {
        flex: 1 1 10rem;
        min-width: 0;
      }
      .uq button {
        flex: 0 0 auto;
      }
      .ufm label {
        display: block;
        font-size: 0.875rem;
        color: var(--mu);
        margin: 8px 0 2px;
      }
      .ufm input[type='text'],
      .lgn input {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .lgn label {
        display: block;
        font-size: 0.875rem;
        color: var(--mu);
        margin: 10px 0 2px;
      }
      .lgn button {
        width: 100%;
        margin-top: 14px;
      }
      .tmr p {
        margin: 6px 0;
      }
      /* Zeitkarte: „Mit wem gearbeitet?“ – Auswahlfeld füllt die Kartenbreite */
      .wp select {
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0 12px;
      }
      .wp .chips {
        margin: 4px 0 0;
      }
      .it .nokbox {
        margin-top: 8px;
      }
      input[type='password'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 14px;
        font-size: 1.375rem;
        letter-spacing: 0.4em;
        width: 100%;
        box-sizing: border-box;
        margin: 10px 0;
      }
      button.dl {
        display: block;
        width: 100%;
        margin-bottom: 12px;
      }
      input.tm,
      select.tm {
        font: inherit;
        font-size: 1.25rem;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px;
        width: 72px;
        text-align: center;
        box-sizing: border-box;
      }
      select.tm {
        width: 84px;
        padding: 10px 6px;
      }
      /* ---- Zeitkarte (Datum, Beginn, Dauer) ---- */
      .zt {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .qk {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .qk button {
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      input.dt {
        font: inherit;
        font-size: 1.125rem;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 9px 10px;
        box-sizing: border-box;
        flex: 1;
        min-width: 9.375rem;
      }

        position: fixed;
        left: 50%;
        bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 16px);
        width: max-content;
        max-width: min(calc(100vw - 32px), 32rem);
        background: var(--tx);
        color: var(--bg);
        padding: 12px 16px;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        font-size: 0.9375rem;
        line-height: 1.35;
        opacity: 0;
        pointer-events: none;
        transition:
          opacity 0.2s,
          transform 0.2s;
        z-index: 30;
        cursor: pointer;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
        pointer-events: auto;
      }
      /* ---- Vergleichsseite (Disponent) ---- */
      .fpick {
        display: inline-block;
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 14px;
        cursor: pointer;
      }
      .fpick input {
        display: none;
      }
      .fnm {
        margin: 8px 0 0;
        word-break: break-all;
      }
      .vgbtn {
        display: block;
        width: 100%;
        margin: 0 0 12px;
        padding: 12px;
      }
      .vgbtn:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .vgsum.bad {
        border-color: var(--er);
      }
      .vgsum.bad > b {
        color: var(--er);
      }
      .vgsum.good {
        border-color: var(--ok);
      }
      .vgsum.good > b {
        color: var(--ok);
      }
      .vgt tbody tr {
        cursor: default;
      }
      .vgt td.wr {
        white-space: normal;
        min-width: 12rem;
      }
      .vgt td.vk {
        white-space: normal;
        min-width: 11rem;
      }
      .vgt tr.vg-fehlt td.vk,
      .vgt tr.vg-noch td.vk {
        color: var(--er);
        font-weight: 600;
      }
      .vgt tr.vg-fehlt,
      .vgt tr.vg-noch {
        background: color-mix(in srgb, var(--er) 8%, var(--card));
      }
      .vgt tr.vg-ok td.vk {
        color: var(--mu);
      }
      /* ---- Geräteübersicht (Disponent): .dv = Gerätekarte, .dv-dot = Punkt „online“ ---- */
      .dv.off {
        opacity: 0.75;
      }
      .dv a {
        color: var(--act);
      }
      .dv-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mu);
        margin-right: 6px;
        vertical-align: 1px;
      }
      .dv-dot.on {
        background: var(--ok);
      }
      .dv-actions {
        margin-top: auto;
        padding-top: 10px;
        flex-wrap: wrap;
      }
      input.dv-name {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 10px 12px;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
      }
      /* ---- Skeleton-Platzhalter (während etwas lädt): .sk = grauer, pulsierender Balken, .sk-btn = Schaltfläche ---- */
      .sk {
        background: linear-gradient(
          90deg,
          var(--bd) 25%,
          color-mix(in srgb, var(--bd) 45%, var(--card)) 37%,
          var(--bd) 63%
        );
        background-size: 400% 100%;
        border-radius: 6px;
        margin: 8px 0;
        animation: sk-shimmer 1.4s ease infinite;
      }
      .sk-btn {
        height: 3.5rem;
        border-radius: var(--r);
        margin: 0 0 10px;
      }
      .row .sk,
      .chips .sk,
      .ob .sk {
        margin: 0;
      }
      .chips .sk {
        border-radius: 20px;
      }
      .ob .sk {
        border-radius: var(--r);
      }
      .ob > .sk {
        flex: 1;
      }
      @keyframes sk-shimmer {
        from {
          background-position: 100% 50%;
        }
        to {
          background-position: 0 50%;
        }
      }
      /* ---- Bedienung: sanfte Rückmeldung bei Tippen/Hover (Seitenwechsel: siehe animateView) ---- */
      button,
      select,
      .chip,
      .fpick {
        transition:
          background-color 0.15s,
          border-color 0.15s,
          color 0.15s,
          filter 0.15s,
          transform 0.12s,
          box-shadow 0.15s,
          opacity 0.15s;
      }
      button:not(:disabled):active,
      .fpick:active {
        transform: scale(0.96);
        filter: brightness(0.92);
      }
      .chip.on {
        box-shadow: 0 1px 4px color-mix(in srgb, var(--ac) 35%, transparent);
      }
      @media (hover: hover) {
        .card.cl {
          transition:
            border-color 0.15s,
            transform 0.15s,
            box-shadow 0.15s;
        }
        .card.cl:hover {
          transform: translateY(-2px);
          box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
        }
        .card.cl:active {
          transform: scale(0.99);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sk {
          animation: none;
        }
        button,
        select,
        .chip,
        .fpick,
        .card.cl {
          transition: none;
        }
        button:not(:disabled):active,
        .fpick:active,
        .card.cl:hover,
        .card.cl:active {
          transform: none;
        }
      }
      /* ---- Signatur unten rechts: immer sichtbar, Größe unabhängig von der Schriftgröße (px statt rem) ---- */
      .made {
        position: fixed;
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(6px + env(safe-area-inset-bottom, 0px));
        z-index: 4;
        font-size: 11px;
        line-height: 1.2;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 3px 9px;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
        pointer-events: none;
        user-select: none;
      }
      /* ---- Disposition (Disponent): Gantt-Diagramm, Offen-Liste, Bearbeiten-Fenster ----
         .gtb = Werkzeugleiste · .gtp = Raster (breit: Offen-Liste links, Diagramm rechts; schmal untereinander) · .gt = Diagramm ·
         .gt-names = Teamspalte (steht still) · .gt-scroll = Zeitachse (seitlich wischbar) · .gt-row = eine Zeile je Team (feste Höhe:
         überschneidende Aufträge teilen sie sich, nichts wächst) · .gt-bar = ein disponierter Auftrag · .gt-pc = Karte „noch offen“ ·
         .gt-sheet = Bearbeiten-Fenster (fest am unteren Rand, verändert das Layout nicht) */
      .gtb {
        margin-bottom: 12px;
      }
      .gtb .chips {
        margin-bottom: 8px;
      }
      /* Zeile unter den Auftragsarten: Suche + „Extra-Fenster“ – oder, wenn die Liste im Extra-Fenster steht, ein Hinweis + zwei Knöpfe.
         Beide Zustände sind gleich hoch (die Zeile nimmt die Höhe der Knöpfe), darunter springt nichts. */
      .gtt .gtt-note {
        flex: 1 1 0;
        align-self: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gtt button {
        flex: 0 0 auto;
        white-space: nowrap;
      }
      /* Liste im Extra-Fenster: das Diagramm hat die ganze Breite */
      .gtp.solo {
        grid-template-columns: minmax(0, 1fr);
      }
      /* ---- Extra-Fenster (eigenes Dokument, Stile kopiert): Kopf mit Suche klebt oben, darunter die Karten, Hinweis fest unten ---- */
      body.gtw {
        padding-bottom: 5.5rem;
      }
      .gtw-top {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--bg);
        border-bottom: 1px solid var(--bd);
        padding: 12px 14px 10px;
      }
      .gtw-top .gt-ph {
        min-height: 2.25rem; /* mit und ohne „Alle Vorschläge übernehmen“ gleich hoch */
        margin-bottom: 6px;
      }
      .gtw-top .chips {
        margin-bottom: 8px;
      }
      .gtw-top input[type='search'] {
        display: block;
        width: 100%;
        box-sizing: border-box;
      }
      .gtw-body {
        padding: 12px 14px 0;
      }
      body.gtw .gt-pool {
        max-height: none;
        overflow: visible;
        padding: 0;
        margin: 0;
      }
      .gtw-more {
        margin-top: 10px;
      }
      .gtw-toast {
        position: fixed;
        left: 10px;
        right: 10px;
        bottom: 10px;
        z-index: 5;
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: var(--r);
        border: 1px solid var(--bd);
        background: var(--card);
        box-shadow: var(--sh2);
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
      }
      .gtw-toast.on {
        opacity: 1;
        transform: none;
        pointer-events: auto;
      }
      .gtw-toast.er {
        color: var(--er);
      }
      @media (prefers-reduced-motion: no-preference) {
        .gtw-toast {
          transition:
            opacity 0.2s,
            transform 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
      }
      .gtp {
        display: grid;
        gap: 12px;
        align-items: start;
        /* Platz für das Bearbeiten-Fenster unter dem Inhalt: bleibt immer gleich, damit sich beim Öffnen und Schließen nichts verschiebt */
        padding-bottom: 21rem;
      }
      .gtp > * {
        min-width: 0;
      }
      .gt-ph {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin: 0 0 8px;
      }
      .gt-ph b {
        font-size: 1.0625rem;
      }
      .gt-ph button {
        padding: 6px 12px;
        font-size: 0.875rem;
      }
      .gt-pool {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .gt-pc {
        margin: 0;
        cursor: pointer;
        user-select: none;
        touch-action: pan-y;
      }
      .gt-pc.sel {
        border-color: var(--ac);
        box-shadow:
          0 0 0 2px color-mix(in srgb, var(--ac) 35%, transparent),
          var(--sh1);
      }
      .gt-pc .gt-sap {
        font-size: 0.875rem;
        margin-top: 4px;
      }
      .gt-pc .gt-go {
        margin-top: 8px;
        padding: 8px 12px;
        font-size: 0.875rem;
      }
      .gt-pc .gt-go:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .gt-empty {
        padding: 12px 14px;
        border: 1px dashed var(--bd);
        border-radius: var(--rc);
      }
      .gt {
        padding: 0;
        overflow: hidden;
        margin: 0;
      }
      .gt-top {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px;
        border-bottom: 1px solid var(--bd);
      }
      .gt-top button {
        padding: 6px 12px;
        font-size: 0.875rem;
        flex: 0 0 auto;
      }
      /* schmal: der Zeitraum steht in einer eigenen Zeile unter den Knöpfen (sonst bliebe von ihm nur „08.1…“) */
      .gt-top {
        flex-wrap: wrap;
      }
      .gt-range {
        order: 9;
        flex: 1 0 100%;
        min-width: 0;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-seg {
        display: flex;
        flex: 0 0 auto;
        margin-left: auto;
      }
      @media (min-width: 700px) {
        .gt-top {
          flex-wrap: nowrap;
        }
        .gt-range {
          order: 0;
          flex: 1 1 0;
        }
        .gt-seg {
          margin-left: 0;
        }
      }
      .gt-seg button {
        border-radius: 0;
        box-shadow: none;
      }
      .gt-seg button:first-child {
        border-radius: var(--r) 0 0 var(--r);
      }
      .gt-seg button + button {
        margin-left: -1px;
      }
      .gt-seg button:last-child {
        border-radius: 0 var(--r) var(--r) 0;
      }
      .gt-seg button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
        position: relative;
      }
      .gt-wrap {
        display: flex;
      }
      .gt-names {
        flex: 0 0 var(--gnw);
        border-right: 1px solid var(--bd);
        background: var(--card);
        position: relative;
        z-index: 2;
      }
      .gt-corner {
        height: var(--gth);
        box-sizing: border-box;
        border-bottom: 1px solid var(--bd);
        padding: 0 8px;
        display: flex;
        align-items: flex-end;
        padding-bottom: 4px;
        font-size: 0.75rem;
        color: var(--mu);
      }
      .gt-name {
        height: var(--grh);
        box-sizing: border-box;
        padding: 0 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
        border-bottom: 1px solid var(--bd);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
      }
      .gt-name span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-name .gt-n {
        font-weight: 500;
        font-size: 0.6875rem;
        color: var(--mu);
        flex: 0 0 auto;
      }
      .gt-name.sap {
        color: var(--act);
        background: var(--acs);
      }
      .gt-name.tgt,
      .gt-row.tgt {
        background-color: color-mix(in srgb, var(--ac) 12%, var(--card));
      }
      .gt-scroll {
        flex: 1 1 0;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        scrollbar-width: thin;
      }
      .gt-in {
        position: relative;
        width: var(--giw);
      }
      .gt-head {
        position: relative;
        height: var(--gth);
        box-sizing: border-box;
        border-bottom: 1px solid var(--bd);
      }
      .gt-day {
        position: absolute;
        top: 0;
        height: 50%;
        box-sizing: border-box;
        border-left: 1px solid var(--bd);
        font-size: 0.8125rem;
        font-weight: 600;
        white-space: nowrap;
      }
      /* der Tag steht am linken Rand der sichtbaren Zeitachse, solange man in seinem Bereich wischt */
      .gt-day span {
        position: sticky;
        left: 6px;
        display: inline-block;
        padding: 4px 0 0 6px;
      }
      /* Monat: ein schmales Feld je Tag über die ganze Kopfhöhe – Wochentag (klein) und Tag des Monats */
      .gt-day.mo {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1px;
        font-size: 0.6875rem;
        line-height: 1.2;
      }
      .gt-day.mo i {
        font-style: normal;
        font-weight: 500;
      }
      .gt-day.mo b {
        font-size: 0.8125rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .gt-day.we {
        color: var(--mu);
      }
      /* Wochenende: leicht getönt hinter den Zeilen (greift nicht in Bedienung und Layout ein) */
      .gt-wk {
        position: absolute;
        background: color-mix(in srgb, var(--mu) 8%, transparent);
        pointer-events: none;
      }
      .gt-day.td {
        color: var(--act);
      }
      .gt-hr {
        position: absolute;
        bottom: 0;
        height: 50%;
        box-sizing: border-box;
        border-left: 1px solid var(--bd);
        padding: 5px 0 0 3px;
        font-size: 0.6875rem;
        color: var(--mu);
        overflow: hidden;
        white-space: nowrap;
      }
      .gt-row {
        position: relative;
        height: var(--grh);
        box-sizing: border-box;
        border-bottom: 1px solid var(--bd);
        /* senkrechte Linien: Tage (kräftig) und Stunden */
        background-image:
          linear-gradient(to right, var(--bd) 1px, transparent 1px), linear-gradient(to right, color-mix(in srgb, var(--bd) 55%, transparent) 1px, transparent 1px);
        background-size:
          var(--gdp) 100%,
          var(--ghp) 100%;
      }
      .gt-now {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        margin-left: -1px;
        background: var(--er);
        opacity: 0.7;
        pointer-events: none;
        z-index: 1;
      }
      .gt-bar {
        --bc: var(--ac);
        position: absolute;
        box-sizing: border-box;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 0 8px 0 6px;
        border-radius: 6px;
        background: var(--bc);
        border: 1px solid color-mix(in srgb, var(--bc) 65%, #000);
        color: #fff;
        font-size: 0.75rem;
        line-height: 1.2;
        white-space: nowrap;
        overflow: hidden;
        cursor: grab;
        touch-action: none;
        user-select: none;
        box-shadow: var(--sh1);
      }
      .gt-bar.ent {
        --bc: var(--nk);
      }
      .gt-bar b {
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .gt-bar span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-bar.sel,
      .gt-bar.drag {
        z-index: 3;
        box-shadow:
          0 0 0 2px var(--card),
          0 0 0 4px var(--tx);
      }
      .gt-bar.drag {
        cursor: grabbing;
        opacity: 0.92;
      }
      .gt-bar.cf {
        box-shadow: 0 0 0 2px var(--gb1);
      }
      .gt-bar.sel.cf {
        box-shadow:
          0 0 0 2px var(--card),
          0 0 0 4px var(--gb1);
      }
      .gt-bar.late {
        border-style: dashed;
      }
      .gt-bar.draft {
        background: color-mix(in srgb, var(--bc) 16%, var(--card));
        border: 2px dashed var(--bc);
        color: var(--tx);
        z-index: 4;
      }
      .gt-bar.gh {
        opacity: 0.4;
      }
      .gt-bar.cl {
        border-top-left-radius: 0;
        border-bottom-left-radius: 0;
      }
      .gt-bar.cr {
        border-top-right-radius: 0;
        border-bottom-right-radius: 0;
      }
      .gt-rz {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        width: 10px;
        cursor: ew-resize;
        touch-action: none;
        background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.45));
      }
      .gt-bar.draft .gt-rz {
        background: linear-gradient(to right, transparent, color-mix(in srgb, var(--bc) 35%, transparent));
      }
      .gt-leg {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        padding: 8px 12px;
        font-size: 0.8125rem;
        color: var(--mu);
        border-top: 1px solid var(--bd);
      }
      .gt-leg i {
        display: inline-block;
        width: 0.8em;
        height: 0.8em;
        border-radius: 3px;
        margin-right: 5px;
        vertical-align: -0.05em;
        background: var(--ac);
      }
      .gt-leg i.ent {
        background: var(--nk);
      }
      .gt-leg i.dr {
        background: transparent;
        border: 2px dashed var(--ac);
        box-sizing: border-box;
      }
      .gt-tip,
      .gt-ghost {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 9;
        pointer-events: none;
        font-size: 0.8125rem;
        user-select: none;
      }
      .gt-tip {
        background: var(--tx);
        color: var(--card);
        border-radius: 8px;
        padding: 4px 8px;
        white-space: nowrap;
        box-shadow: var(--sh2);
      }
      .gt-ghost {
        background: var(--ac);
        color: #fff;
        border-radius: 6px;
        padding: 3px 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        box-shadow: var(--sh2);
        opacity: 0.92;
      }
      .gt-ghost.ent {
        background: var(--nk);
      }
      .gt-sheet {
        position: fixed;
        z-index: 7;
        left: max(8px, env(safe-area-inset-left));
        right: max(8px, env(safe-area-inset-right));
        bottom: calc(8px + env(safe-area-inset-bottom, 0px));
        max-width: 46rem;
        margin: 0 auto;
        box-sizing: border-box;
        max-height: calc(100vh - 72px);
        overflow-y: auto;
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--rc);
        box-shadow:
          var(--sh2),
          0 12px 36px rgba(0, 0, 0, 0.18);
        padding: 12px 14px;
      }
      .gt-sheet .gt-sh {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .gt-sheet .gt-x {
        flex: 0 0 auto;
        padding: 4px 10px;
        box-shadow: none;
      }
      .gt-f {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        margin: 10px 0;
      }
      .gt-f > .mu {
        font-size: 0.875rem;
      }
      .gt-f select {
        grid-column: 2 / -1;
        width: 100%;
        min-width: 0;
      }
      .gt-f input {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: var(--r);
        padding: 8px 10px;
      }
      .gt-sheet .qk {
        margin: 4px 0 8px;
        align-items: center;
      }
      /* die Beschriftung der Dauer hat eine eigene Zeile: ändert sich ihr Text, bricht nichts anders um (das Fenster bleibt gleich hoch) */
      .gt-dur {
        flex: 1 0 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gt-sheet .gt-btns {
        display: flex;

      const el = (tag, props, ...children) => {

        teamFilter = '',

      // ---- Schriftgröße (nur Monteur) ----
      // Schriftgröße (nur Monteur-Ansicht, je Gerät gespeichert): skaliert alle rem-Schriftgrößen, Abstände bleiben gleich
      const FONT_SCALES = [1, 1.15, 1.3, 1.5];
      let fontScale = 1;
      try {
        fontScale = +localStorage.getItem('fz') || 1;
      } catch (e) {}
      if (!FONT_SCALES.includes(fontScale)) fontScale = 1;
      // setzt die Basisschriftgröße der Seite (16 px × Faktor) – nur in der Monteur-Ansicht
      const applyFontScale = () => {
        document.documentElement.style.fontSize =
          session.role === 'monteur' && fontScale !== 1 ? 16 * fontScale + 'px' : '';
      };
      // eine Stufe größer (+1) oder kleiner (-1), im Gerät gespeichert. Die Seite wird in einem Schritt neu gezeichnet; die
      // Schaltflächen „A−“/„A+“ (data-k="fz") bleiben dabei an derselben Bildschirmstelle – auch ganz oben auf der Seite –,
      // damit man gleich nochmal tippen kann und nichts wegspringt. Wo der Browser es kann (View Transitions), blendet das
      // alte Bild zum neuen über; sonst (und bei „weniger Bewegung“) wechselt die Seite ohne Übergang.
      // (font-size per CSS zu animieren, lässt Texte in jedem Zwischenschritt neu umbrechen: die Seite ruckelt und springt.)
      const changeFontScale = direction => {
        const index = FONT_SCALES.indexOf(fontScale) + direction;
        if (index < 0 || index >= FONT_SCALES.length) return;
        fontScale = FONT_SCALES[index];
        try {
          localStorage.setItem('fz', fontScale);
        } catch (e) {}
        const redraw = () => {
          lastTapKey = 'fz'; // der Tipp liegt beim Überblenden schon zurück (siehe click-Listener) – Anker selbst setzen
          holdAtTop = true;
          quietRender = true;
          try {
            render();
          } finally {
            lastTapKey = null;
            holdAtTop = false;
            quietRender = false;
          }
        };
        if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.startViewTransition(redraw);
        else redraw();
      };
      // Schaltflächen „A−“ / „A+“; sperren an den Enden der Skala
      const fontScaleButtons = () => {
        const i = FONT_SCALES.indexOf(fontScale),
          p = ` (aktuell ${Math.round(fontScale * 100)} %)`;
        return el(
          'div',
          { class: 'fzg' + (fontScale !== 1 ? ' on' : ''), role: 'group', 'aria-label': 'Schriftgröße', 'data-k': 'fz' },
          el(
            'button',
            {
              title: 'Schrift kleiner' + p,
              'aria-label': 'Schrift kleiner' + p,
              disabled: i <= 0 ? 'disabled' : null,
              onclick: () => changeFontScale(-1)
            },
            'A−'
          ),
          el(
            'button',
            {
              title: 'Schrift größer' + p,
              'aria-label': 'Schrift größer' + p,
              disabled: i >= FONT_SCALES.length - 1 ? 'disabled' : null,
              onclick: () => changeFontScale(1)
            },
            'A+'
          )
        );
      };
      // ---- Hell/Dunkel ----
      // Hell/Dunkel: ohne eigene Wahl folgt die App der Einstellung des Handys; Wahl wird je Gerät gespeichert
      const darkMediaQuery = matchMedia('(prefers-color-scheme: dark)');
      let themeChoice = '';
      try {
        themeChoice = localStorage.getItem('thm') || '';
      } catch (e) {}
      if (themeChoice !== 'light' && themeChoice !== 'dark') themeChoice = '';
      // true, wenn gerade dunkel dargestellt wird (eigene Wahl, sonst Systemeinstellung)
      const isDark = () => (themeChoice ? themeChoice === 'dark' : darkMediaQuery.matches);
      // Schalter „Dunkel“ in der Kopfzeile
      const themeSwitch = el(
        'button',
        {
          class: 'thm',
          role: 'switch',
          'aria-label': 'Dunkelmodus',
          onclick: () => {
            themeChoice = isDark() ? 'light' : 'dark';
            try {
              localStorage.setItem('thm', themeChoice);
            } catch (e) {}
            applyTheme();
          }
        },
        el('span', {}, '☾ Dunkel'),
        el('span', { class: 'sw' })
      );
      // wendet die Wahl an: data-theme am <html>, Klasse .dk (für Logo/Hover), Statusleistenfarbe des Browsers
      function applyTheme() {
        const root = document.documentElement,
          dark = isDark();
        if (themeChoice) root.dataset.theme = themeChoice;
        else delete root.dataset.theme;
        root.classList.toggle('dk', dark);
        themeSwitch.setAttribute('aria-checked', String(dark));
        const metaTag = document.querySelector('meta[name="theme-color"]');
        if (metaTag) metaTag.content = dark ? '#111115' : '#bb005d';
      }
      // Logo: public/logo.png (sonst logo.svg); fehlt die Datei, bleibt nur der Schalter
      const logo = el('img', {
        class: 'logo',
        src: '/logo.png',
        alt: 'Wiener Netze',
        onerror: () => {
          if (!logo.dataset.f) {
            logo.dataset.f = '1';
            logo.src = '/logo.svg';
          } else logo.remove();
        }
      });
      // Kopfzeile (Logo + Schalter); ihre Höhe wird für die klebende Auftragszeile in --toph gehalten
      const topBar = document.getElementById('top');
      topBar.append(logo, themeSwitch);
      // Höhe der Kopfzeile merken (für die darunter klebende Auftragszeile); beim Scrollen dezente Trennlinie
      const updateTopBarHeight = () =>
        document.documentElement.style.setProperty('--toph', topBar.offsetHeight + 'px');
      if (window.ResizeObserver) new ResizeObserver(updateTopBarHeight).observe(topBar);
      updateTopBarHeight();
      addEventListener('scroll', () => topBar.classList.toggle('sc', scrollY > 2), { passive: true });
      applyTheme();
      darkMediaQuery.addEventListener
        ? darkMediaQuery.addEventListener('change', applyTheme)
        : darkMediaQuery.addListener(applyTheme);
      // ---- Hilfsfunktionen ----
      // Deutsche, "natürliche" Sortierung (Zahlen als Zahlen: 2 < 10)
      const naturalCompare = (a, b) => String(a).localeCompare(String(b), 'de', { numeric: true });
      // Text aus einer Exception (oder beliebigem Wert)
      const errorMessageOf = e => (e && e.message ? e.message : String(e));

      // ---- Skeleton-Platzhalter (während etwas lädt) ----
      // Graue, sanft pulsierende Platzhalter in der Form des späteren Inhalts – statt „Lade …“ oder einer leeren Seite.
      // Der äußere Container meldet sich Screenreadern als „Lade …“ (role=status), die einzelnen Teile sind dekorativ
      // (aria-hidden). Stellt das System „weniger Bewegung“ ein, steht die Animation still (siehe CSS .sk).
      const skeletonBar = (width = '100%', height = '1em') =>
        el('div', { class: 'sk', 'aria-hidden': 'true', style: `width:${width};height:${height}` });
      // Platzhalter für Container: Screenreader hören „Lade …“
      const skeletonBox = (cls, ...children) =>
        el('div', { class: cls, role: 'status', 'aria-busy': 'true', 'aria-label': 'Lade …' }, ...children);
      // Platzhalter einer Auftrags-/Gerätekarte: Etiketten, Titel, zwei Textzeilen
      const skeletonCard = () =>
        el(
          'div',
          { class: 'card', 'aria-hidden': 'true' },
          el('div', { class: 'row' }, skeletonBar('5.5rem', '1.5rem'), skeletonBar('4rem', '1.5rem')),
          skeletonBar('70%', '1.2em'),
          skeletonBar('50%'),
          skeletonBar('35%')
        );
      // Raster aus count Platzhalter-Karten (gleiches Raster wie die echte Liste)
      const skeletonGrid = (count = 6) =>
        skeletonBox('grid', ...Array.from({ length: count }, () => skeletonCard()));
      // Platzhalter einer Seite mit Fortschrittskarte, Filter-Chips und Kartenliste (Monteur-Liste, Dispo-Übersicht)
      const skeletonPage = () =>
        skeletonBox(
          '',
          el(
            'div',
            { class: 'card', 'aria-hidden': 'true' },
            skeletonBar('30%', '1.8rem'),
            skeletonBar('100%', '14px'),
            skeletonBar('55%')
          ),
          el(
            'div',
            { class: 'chips', 'aria-hidden': 'true' },
            ...[0, 1, 2, 3].map(() => skeletonBar('5rem', '2rem'))
          ),
          el(
            'div',
            { class: 'grid', 'aria-hidden': 'true' },
            ...Array.from({ length: 6 }, () => skeletonCard())
          )
        );
      // Platzhalter der Teamauswahl: count große Schaltflächen
      const skeletonButtons = (count = 4) =>
        skeletonBox(
          'tgrid',
          ...Array.from({ length: count }, () => el('div', { class: 'sk sk-btn', 'aria-hidden': 'true' }))
        );
      // Platzhalter der Prüfobjekte: je Eintrag eine Textzeile und zwei Schaltflächen
      const skeletonChecklist = () =>
        skeletonBox(
          '',
          ...Array.from({ length: 4 }, () =>
            el(
              'div',
              { class: 'it', 'aria-hidden': 'true' },
              skeletonBar('85%', '1.1em'),
              el('div', { class: 'ob' }, skeletonBar('100%', '2.8rem'), skeletonBar('100%', '2.8rem'))
            )
          )
        );
      // Platzhalter einer Ergebnistabelle (Vergleich)
      const skeletonTable = () =>
        skeletonBox(
          'card',
          ...[0, 1, 2, 3, 4, 5].map(i => skeletonBar(i === 0 ? '100%' : i % 2 ? '90%' : '75%', '1.2em'))
        );

      // ---- Upload (Disponent) ----
      // Vier SAP-Dateien, jede im eigenen Feld und in beliebiger Reihenfolge: Aufträge, Vorgänge, Meldungen, Prüflose. Der Server setzt
      // die Aufträge aus Aufträgen + Vorgängen zusammen (Reparatur: jeder Vorgang ein Auftrag), Meldungen und Prüflose hängen daran.
      // part: Feld im Tab „Upload“ (UPLOAD_PARTS)
      const UPLOAD_PARTS = {
        auftraege: { name: 'Aufträge', url: '/api/orders', meta: () => uploadMeta, wipe: 'orders', wiped: 'Alle Aufträge gelöscht' },
        vorgaenge: { name: 'Vorgänge', url: '/api/vorgaenge', meta: () => vorgMeta, wipe: 'vorg', wiped: 'Alle Vorgänge gelöscht' },
        meldungen: { name: 'Meldungen', url: '/api/meldungen', meta: () => melMeta, wipe: 'mel', wiped: 'Alle Meldungen gelöscht' }
      };
      /**
       * Eine Excel-Datei (bzw. mehrere derselben Art) lesen (im Web Worker) und hochladen. keep = true: nur ergänzen/aktualisieren,
       * sonst ersetzt die Datei die Einträge der enthaltenen Teams (Aufträge, Meldungen) bzw. Aufträge (Vorgänge) – siehe server.js.
       */
      async function uploadSource(part, files, keep) {
        const { name, url } = UPLOAD_PARTS[part];
        busy = true;
        errorMsg = '';
        infoMsg = 'Lese Datei …';
        render();
        try {
          const bufs = [];
          for (const f of files) bufs.push(await f.arrayBuffer());
          const r = await runExcelWorker({ type: 'orders', wanted: part, bufs }, bufs);
          infoMsg = 'Speichere …';
          render();
          const answer = await api('POST', url, { rows: r.rows, keep, hasLart: r.hasLart, files: files.map(f => f.name).join(', ') }, 120000);
          await poll();
          const total = o => Object.values(o || {}).reduce((a, n) => a + n, 0),
            kinds = KINDS.filter(x => answer.counts && answer.counts[x.k]).map(x => kindCount(x.k, answer.counts[x.k]));
          if (part === 'auftraege')
            infoMsg =
              `Aufträge gespeichert: ${kinds.join(' · ') || 'keine'}` +
              (answer.planned ? ` · ${answer.planned} geplante Vorgänge/Aufträge (Team mit „P“) noch nicht angezeigt` : '') +
              (r.skip ? ` · ${r.skip} Zeilen ohne Team übersprungen` : '') +
              (total(answer.ignored)
                ? ` · ${total(answer.ignored) === 1 ? '1 Auftrag' : total(answer.ignored) + ' Aufträge'} anderer Auftragsarten übergangen (${Object.entries(answer.ignored)
                    .map(([art, n]) => `${n}× ${art}`)
                    .join(', ')})`
                : '') +
              (answer.counts && answer.counts.rep + answer.counts.ent > 0 && !answer.steps
                ? ' · Für Reparaturen fehlt noch die Vorgänge-Excel'
                : '');
          else if (part === 'vorgaenge')
            infoMsg =
              `${answer.count} Vorgänge zu ${answer.orders} Aufträgen gespeichert` +
              (kinds.length ? ` · jetzt: ${kinds.join(' · ')}` : '') +
              (answer.planned ? ` · ${answer.planned} geplante Vorgänge (Team mit „P“) noch nicht angezeigt` : '');
          else infoMsg = `${kindCount('mel', answer.count)} gespeichert`;
        } catch (e) {
          infoMsg = '';
          errorMsg = errorMessageOf(e);
        }
        busy = false;
        render();
      }
      // Eine Dateiart löschen (braucht den Upload-PIN): part = 'orders' | 'vorg' | 'mel' | 'pruef'
      async function wipePart(part) {
        const spec = part === 'pruef' ? { url: '/api/pruef', wiped: 'Alle Prüfobjekte gelöscht' } : Object.values(UPLOAD_PARTS).find(x => x.wipe === part);
        busy = true;
        armWipe = '';
        render();
        try {
          await api('DELETE', spec.url);
          if (part === 'pruef') checklistsByOrder.clear();
          await poll();
          infoMsg = spec.wiped;
        } catch (e) {
          errorMsg = errorMessageOf(e);
        }
        busy = false;
        render();
      }

      /**
       * Prüflos-Excel(s) lesen und hochladen: Spalten „Auftrag“ + „Kurztext des Prüfobjektes“.
       * Aufträge, die in der Datei vorkommen, bekommen ihre Prüfobjekt-Liste ersetzt (POST /api/pruef).
       */
      async function uploadChecklists(files) {
        busy = true;
        errorMsg = '';
        infoMsg = 'Lese Datei … (läuft im Hintergrund)';
        render();
        try {
          const by = {};
          let n = 0;
          for (const f of files) {
            const buf = await f.arrayBuffer();
            const r = await runExcelWorker({ type: 'pruef', buf }, [buf]);
            for (const [a, l] of Object.entries(r.by)) {
              (by[a] = by[a] || []).push(...l);
              n += l.length;
            }
          }
          const cnt = Object.keys(by).length;
          if (!cnt)
            throw new Error(
              'Keine Prüfobjekte gefunden (Spalten „Auftrag" und „Kurztext des Prüfobjektes" nötig)'
            );
          infoMsg = 'Speichere …';
          render();
          await api(
            'POST',
            '/api/pruef',
            { by, files: files.map(f => f.name).join(', '), count: n, orders: cnt },
            120000
          );
          checklistsByOrder.clear();
          await poll();
          infoMsg = `${n} Prüfobjekte zu ${cnt} Aufträgen gespeichert`;
        } catch (e) {
          infoMsg = '';
          errorMsg = errorMessageOf(e);
        }
        busy = false;
        render();
      }
      // ---- Prüfobjekt-Texte lesbar machen (nur Monteur-Ansicht; Dispo und Export zeigen den Originaltext) ----
      // Beispiele aus den Prüflosen:
      //   „VL 1210 Am Spitz DN125 RL“           -> Verteilleitung 1210 Am Spitz DN125 – Rücklauf
      //   „AL UHM001 1210 Am Spitz 8 VL“        -> Abzweigleitung Schacht UHM001 1210 Am Spitz 8 – Vorlauf
      //   „KH RL AL 1210 Am Spitz 8 SHM911“     -> Kugelhahn am Rücklauf der Abzweigleitung 1210 Am Spitz 8 im Schacht SHM911
      // Kürzel: VL/AL = Verteil-/Abzweigleitung (am Anfang), VL/RL = Vor-/Rücklauf (hinten), KH = Kugelhahn,
      // Ü = Überlauf, E = Entleerung. Schachtbezeichnung = 3 Buchstaben + 3 Ziffern (z. B. SHM911).
      const LINE_NAMES = { VL: 'Verteilleitung', AL: 'Abzweigleitung' },
        FLOW_NAMES = { VL: 'Vorlauf', RL: 'Rücklauf' },
        PART_NAMES = { KH: 'Kugelhahn', E: 'Entleerung', Ü: 'Überlauf' },
        SHAFT_PATTERN = /^[A-Z]{3}\d{3}$/;
      /**
       * Wandelt den Kurztext eines Prüfobjekts in einen lesbaren Satz um. Erkennt zwei Muster:
       *   1) Leitung:  <VL|AL> <Ort/Schacht …> <VL|RL>
       *   2) Bauteil:  <KH|Ü|E> <VL|RL> <VL|AL> <Ort …> [Schacht]
       * Alles andere kommt unverändert zurück (der Monteur sieht dann den Originaltext).
       */
      function humanizeChecklistText(text) {
        const words = String(text).trim().split(/\s+/),
          shaftLabel = x => (SHAFT_PATTERN.test(x) ? 'Schacht ' + x : x);
        // „VL 1210 Am Spitz DN125 RL“ / „AL UHM001 1210 Am Spitz 8 VL“
        if (LINE_NAMES[words[0]] && FLOW_NAMES[words[words.length - 1]] && words.length > 2)
          return `${LINE_NAMES[words[0]]} ${words.slice(1, -1).map(shaftLabel).join(' ')} – ${FLOW_NAMES[words[words.length - 1]]}`;
        // „KH RL AL 1210 Am Spitz 8 SHM911“ (Bauteil, Vor-/Rücklauf, Leitungsart, Ort, Schacht)
        const part = PART_NAMES[words[0].toUpperCase()],
          flow = FLOW_NAMES[words[1]],
          lineType = LINE_NAMES[words[2]];
        if (part && flow && lineType && words.length > 3) {
          const shaft = SHAFT_PATTERN.test(words[words.length - 1]) ? words.pop() : '',
            place = words.slice(3).join(' ');
          return `${part} am ${flow} der ${lineType}${place ? ' ' + place : ''}${shaft ? ' im Schacht ' + shaft : ''}`;
        }
        return text;
      }
      // ---- Excel-Export ----
      // Anzeigetexte der Status-Werte (siehe orderStatus)
      const STATUS_LABELS = { done: 'Erledigt', teil: 'In Arbeit', offen: 'Offen' };
      /**
       * Excel-Export der übergebenen Aufträge (Disponent): holt die Prüfobjekt-Listen vom Server, baut zwei Tabellen
       * (Blatt „Aufträge“: eine Zeile je Auftrag; Blatt „Prüfobjekte“: eine Zeile je Prüfobjekt) und lässt die Datei im
       * Web Worker erzeugen. Die Spalte „Abgehakt am“ wird auch vom Vergleich (drawComparison) gelesen.
       * Veraltete Bewertungen (Prüfliste wurde nach der Bewertung geändert) werden als „veraltet“ gekennzeichnet.
       */
      async function exportXlsx(rows) {
        busy = true;
        errorMsg = '';
        infoMsg = 'Erstelle Excel …';
        render();
        try {
          const lists = new Map(
            Object.entries(
              (await api('POST', '/api/pruef/get', { ids: rows.map(order => order.auftrag) }, 120000)).map
            )
          );
          const orderRows = [
            [
              'Auftrag',
              'Team (Verantw. Arb. Pl.)',
              'Techn. Platz',
              'Auftragsart',
              'PLZ',
              'Straße',
              'Kurztext',
              'Eckstarttermin',
              'Eckendtermin',
              'Status',
              'Prüfergebnis',
              'Prüfobjekte gesamt',
              'OK',
              'Nicht OK',
              'Offen',
              'Durchgeführt am',
              'Beginn (Uhrzeit)',
              'Dauer (Min)',
              'Dauer (Std)',
              'Zeit zurückgemeldet am',
              'Zeit zurückgemeldet von',
              'Gearbeitet mit',
              'Nicht OK – Prüfobjekt → Text',
              'Hinweis',
              'Abgehakt am',
              'Zuletzt gespeichert von',
              'Auftragsart (App)',
              'Vorgang',
              'Vorgang Kurztext',
              'Uhrzeit von',
              'Uhrzeit bis',
              'Meldung(en)'
            ]
          ];
          // Daueraufträge: jeder Tageseintrag eine Zeile (Blatt „Zeiteinträge“); beim Auftrag stehen die Summen
          const entryRows = [
            ['Auftrag', 'Team', 'Kurztext', 'Durchgeführt am', 'Beginn (Uhrzeit)', 'Dauer (Min)', 'Dauer (Std)', 'Gearbeitet mit', 'Eingetragen von', 'Eingetragen am']
          ];
          const checklistRows = [
            [
              'Auftrag',
              'Team',
              'Auftrag Kurztext',
              'Pos.',
              'Prüfobjekt (Kurztext)',
              'Ergebnis',
              'Text bei Nicht OK'
            ]
          ];
          for (const order of rows) {
            const items = lists.get(order.auftrag) || [],
              status = orderStatus(order),
              count = items.length,
              valid = !!(status.s && count > 0 && status.n === count && status.s.length === count),
              stale = !!(status.s && count > 0 && !valid),
              total = count || status.n;
            orderRows.push([
              orderNr(order),
              order.team,
              order.tp,
              order.art,
              order.plz,
              order.str,
              order.kurz,
              order.start,
              order.ende,
              // Status und Prüfergebnis gibt es nur bei Wartungen
              orderKind(order) !== 'war' ? '' : STATUS_LABELS[stale && status.st === 'done' ? 'teil' : status.st],
              orderKind(order) !== 'war'
                ? ''
                : status.nx > 0
                  ? status.op > 0
                    ? 'Nicht OK (unvollständig)'
                    : 'Nicht OK'
                  : status.n > 0 && !status.op
                    ? 'OK'
                    : status.ok > 0
                      ? 'unvollständig'
                      : '',
              total,
              status.ok,
              status.nx,
              Math.max(0, total - status.ok - status.nx),
              isoToExcelDate(performedDate(status)),
              timeToExcelFraction(status.von),
              status.min != null ? status.min : null,
              status.min != null ? Math.round((status.min / 60) * 100) / 100 : null,
              status.tat ? new Date(status.tat).toLocaleString('de-AT') : null,
              status.tu ? userLabel(status.tu) : null,
              status.mit && status.mit.length ? status.mit.map(userLabel).join(', ') : null,
              status.nok.map(z => (z.m ? `${z.t} → ${z.m}` : z.t)).join(' | '),
              stale
                ? 'Prüfliste seit der Bewertung geändert'
                : status.cnt
                  ? `${status.cnt} Tageseinträge – siehe Blatt „Zeiteinträge“`
                  : '',
              markState(order.auftrag)
                ? new Date(marks.get(order.auftrag).at).toLocaleString('de-AT') +
                  (markState(order.auftrag) === 2 ? ' (danach geändert)' : '')
                : null,
              status.u ? userLabel(status.u) : null,
              kindInfo(orderKind(order)).name,
              order.vg || '',
              order.vtxt || '',
              order.uhr || '',
              order.uhr2 || '',
              meldungenOf(order).map(m => `${m.nr}: ${m.txt}`).join(' | ') || order.mel || ''
            ]);
            for (const e of status.ein || [])
              entryRows.push([
                orderNr(order),
                order.team,
                order.kurz,
                isoToExcelDate(performedDate(e)),
                timeToExcelFraction(e.von),
                e.min,
                Math.round((e.min / 60) * 100) / 100,
                e.mit && e.mit.length ? e.mit.map(userLabel).join(', ') : null,
                e.tu ? userLabel(e.tu) : null,
                e.tat ? new Date(e.tat).toLocaleString('de-AT') : null
              ]);
            items.forEach((t, i) => {
              const itemMark = valid ? status.s[i] : '-',
                z = valid ? status.nok.find(z => z.i === i) : null;
              checklistRows.push([
                orderNr(order),
                order.team,
                order.kurz,
                i + 1,
                t,
                stale ? 'veraltet' : itemMark === 'o' ? 'OK' : itemMark === 'x' ? 'Nicht OK' : 'Offen',
                z ? z.m : ''
              ]);
            });
          }
          const out = await runExcelWorker({
            type: 'xlsx',
            A: orderRows,
            P: checklistRows,
            E: entryRows.length > 1 ? entryRows : null,

        timeWithAuto = session.role === 'monteur' && !(existingResult && existingResult.min != null);

            checklistsByOrder.set(order.auftrag, items);

      const resultOf = orderNo => {

          const list = entriesOf(orderNo);

            const last = list[list.length - 1];

              a: orderNo,
              team: last.team,
              n: 0,
              ok: 0,
              nx: 0,
              s: '',
              nok: [],
              min: list.reduce((sum, e) => sum + e.min, 0),
              dat: performedDate(last),

      /**

          return { s: '-'.repeat(count), T: {} };
        const nokTexts = {};

      // ---- Zeitrückmeldung: Felder min (Minuten), tat (Zeitpunkt), dat (Datum), von (Beginn) im selben Ergebnis-Dokument ----
      // Die Dauer wird nur in Viertelstunden zurückgemeldet. roundUpQuarter: nächsthöherer Viertelstundenwert (mindestens 15)
      const roundUpQuarter = minutes => Math.max(15, Math.ceil(minutes / 15) * 15);

      const clockText = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');

        }
      } catch (e) {}
      // Vorauswahl: alle Benutzer, deren Team dieses Team ist. Gilt nicht als Änderung (kein „nicht gespeichert“-Hinweis).
      function applyDefaultWith(order) {
        const list = colleagueCache.get(order.team);
        if (!timeWithAuto || !list || !openOrder || openOrder.auftrag !== order.auftrag) return;

        const clean = timeFormSnapshot() === timeFormAtOpen;
        timeWith = list.filter(c => c.team === order.team).map(c => c.sap);
        if (clean) timeFormAtOpen = timeFormSnapshot();
      }
      async function loadColleagues(team) {
        try {
          const list = (await api('GET', '/api/colleagues?team=' + encodeURIComponent(team))).list;
          colleagueCache.set(team, list);
          for (const c of list) userNames.set(c.sap, c.name);

      /**

      // Kennung eines neuen Tageseintrags (Kleinbuchstaben und Ziffern, 7 Zeichen)
      const newEntryId = () => (Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 5)).padEnd(7, '0');
      // key: Schlüssel des Ergebnisses – der Auftrag selbst, bei einem Dauerauftrag der Tageseintrag („Auftrag#Kennung“; leer = neuer)
      function storeTime(order, items, minutes, date, start, key = '') {
        if (isLocked(order.auftrag)) return denyLocked();
        const dau = orderKind(order) === 'dau';

        else if (!(minutes > 0)) infoMsg = '🗑 Zeit gelöscht';

        };

        delete doc.tat;
        delete doc.dat;

        render();
        sendPending(key);
      }
      // Prüft die Eingaben der Zeitkarte (Datum nicht leer/zukünftig, Beginn, Dauer 1 Min – 24 Std) und speichert sie
      function validateAndStoreTime(order, items, key = '') {
        const minutes = (parseInt(timeHours || '0', 10) || 0) * 60 + (parseInt(timeMinutes || '0', 10) || 0);
        const fail = message => {
          timeError = message;
          playErrorSound();
          render();
        };
        timeStart = roundQuarterHHMM(timeStart); // auch ein getippter Wert wird auf die Viertelstunde gerundet
        if (!/^\d{4}-\d{2}-\d{2}$/.test(timeDate)) return fail('Bitte ein Datum wählen.');
        if (timeDate > today()) return fail('Das Datum liegt in der Zukunft.');
        if (!/^\d{2}:\d{2}$/.test(timeStart || '')) return fail('Bitte die Beginn-Uhrzeit angeben.');
        if (minutes < 15 || minutes > 1440)
          return fail('Bitte eine Dauer zwischen 15 Minuten und 24 Stunden eingeben.');
        if (minutes % 15 !== 0) return fail('Die Dauer wird in Viertelstunden angegeben (15, 30, 45 Min …).');
        timeError = '';

      // ---- Start / Ende: der Monteur kann beim Arbeitsbeginn „Start“ und am Ende „Ende“ drücken ----
      // „Ende“ speichert Datum, Beginn und Dauer wie die Zeitkarte. Der Start wird je Gerät gemerkt (localStorage), auch wenn die

      let runningTimers = {};

      const saveTimers = () => {

        } catch (e) {}
      };
      const timerStartOf = orderNo => +runningTimers[orderNo] || 0;

      const elapsedMinutes = start => Math.max(0, Math.floor((Date.now() - start) / 60000));
      const startTimer = order => {

        const minutes = Math.max(15, Math.ceil((Date.now() - start) / 900000) * 15);

      // Löscht die erfasste Zeit (Felder leeren und Zeitangaben im Ergebnis entfernen)
      function deleteTime(order, items, key = '') {

        timeError = '';
        timeStart = '';

      // Kopf der Karte bei einem Dauerauftrag: Summe und die Tageseinträge (neueste zuerst); der Monteur kann sie ändern

      // (siehe animateView). entrySeen: Einträge der letzten Zeichnung, entrySeenOrder: zu welchem Auftrag.
      const entryFresh = new Map();

            { class: 'zlist' },

              e.tu && el('div', { class: 'mu' }, '👤 ' + userLabel(e.tu)),

       * Karte „Zeit“: zeigt die erfasste Zeit mit Hinweisen, warum der Auftrag noch nicht „erledigt“ ist.
       * Für den Monteur (isMonteur) zusätzlich Eingabefelder: Datum (Heute/Gestern), Beginn (Jetzt), Dauer
       * (Schnellwahl + Stunden/Minuten) und Speichern/Löschen.
       */
      function timeCard(order, isMonteur) {
        // Dauerauftrag: mehrere Tageseinträge. Das Formular unten gilt dann für einen neuen Eintrag oder den gerade bearbeiteten (entryKey)
        const dau = orderKind(order) === 'dau',
          entry = dau && entryKey ? rawResult(entryKey) : null,
          result = dau ? entry : resultOf(order.auftrag),
          key = dau ? entryKey : order.auftrag,
          items = checklist.st === 'ok' ? checklist.list : null,
          hasTime = !!(result && result.min != null);
        const timePanel = el(
          'div',
          { class: 'card', 'data-zeit': '1', 'data-k': 'zc' },

            ? entriesHead(order, isMonteur)
            : [
                el('b', {}, 'Zeit'),
                el(
                  'p',
                  { class: 'mu' },
                  hasTime
                    ? `Durchgeführt am ${formatIsoDate(performedDate(result)) || '–'}${result.von ? ' · ab ' + result.von + ' Uhr' : ''} · Dauer ${formatMinutes(result.min)}`
                    : 'Noch keine Zeit zurückgemeldet.'
                ),
                hasTime && result.tu && el('p', { class: 'mu' }, '👤 Zeit zurückgemeldet von ' + userLabel(result.tu)),
                hasTime && result.mit && el('p', { class: 'mu' }, '👥 Gearbeitet mit: ' + userNamesText(result.mit)),
                result &&
                  result.u &&
                  result.u !== result.tu &&
                  el('p', { class: 'mu' }, '👤 Zuletzt gespeichert von ' + userLabel(result.u))
              ])
        );
        // abgehakt (Monteur): nur ansehen – keine Hinweise zum Ausfüllen, keine Eingabe von Zeit und Kollegen
        if (isMonteur && isLocked(order.auftrag)) return timePanel;
        if (dau) {
          // keine Hinweise zu „erledigt“: ein Dauerauftrag läuft weiter
        } else if (hasTime && !timeComplete(result))
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },

        else if (!hasTime && result && result.n > 0 && result.ok + result.nx === result.n)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },

        else if (hasTime && orderStatus(order).op > 0)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              `Zeit erfasst – für „Erledigt“ ${orderStatus(order).op === 1 ? 'fehlt noch 1 Prüfobjekt' : 'fehlen noch ' + orderStatus(order).op + ' Prüfobjekte'}.`

        if (!isMonteur) return timePanel;
        const numberInput = (k, v, set) =>
          el('input', {
            class: 'tm',
            type: 'text',

        // Auswahl der Kollegen: Teammitglieder (und wer zuletzt in diesem Team war) als Schalter, alle weiteren über das Auswahlfeld
        const withPicker = order => {
          const list = colleagueCache.get(order.team) || [],
            near = list.filter(c => c.team === order.team || c.here),
            nearSaps = new Set(near.map(c => c.sap)),
            others = list.filter(c => !nearSaps.has(c.sap) && !timeWith.includes(c.sap)),
            shown = [...near.map(c => c.sap), ...timeWith.filter(x => !nearSaps.has(x))],
            toggle = sap => {

          return el(
            'div',
            { class: 'wp', 'data-k': 'zw' },
            shown.length
              ? el(
                  'div',
                  { class: 'chips' },
                  shown.map(sap =>
                    el(
                      'button',
                      {
                        class: 'chip' + (timeWith.includes(sap) ? ' on' : ''),
                        'aria-pressed': timeWith.includes(sap) ? 'true' : 'false',
                        onclick: () => toggle(sap)
                      },
                      (timeWith.includes(sap) ? '✓ ' : '') + userShort(sap)
                    )
                  )
                )
              : el('p', { class: 'mu' }, list.length ? 'Keine weiteren Personen im Team.' : 'Kollegen werden geladen …'),
            others.length > 0 &&
              el(
                'select',
                {
                  'aria-label': 'Weitere Person hinzufügen',
                  onchange: e => {
                    if (!e.target.value) return;
                    timeWithAuto = false;
                    timeWith = [...timeWith, e.target.value];
                    render();
                  }
                },
                el('option', { value: '' }, '＋ Weitere Person …'),
                others.map(c => el('option', { value: c.sap }, c.name + (c.team ? ` (${c.team})` : '')))
              )
