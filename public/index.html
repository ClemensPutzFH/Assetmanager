          panel,
          orderList(view(), true)
        );
        // Hinweis nur wenn zutreffend – app.append() würde false/null sonst als Text anzeigen
        if (markedFilter === 'hide' && markedCount > 0)
          app.lastChild.before(
            el(
              'p',
              { class: 'mu' },
              markedCount === 1
                ? '1 abgehakter Auftrag ist ausgeblendet.'
                : `${markedCount} abgehakte Aufträge sind ausgeblendet.`
            )
          );
      }

      // ---- Geräteübersicht (Disponent) ----
      // Kurzbeschreibung des Geräts aus dem User-Agent des Browsers: „Android · Chrome“
      function deviceKind(ua) {
        const text = String(ua || ''),
          system = /iPhone|iPad|iPod/.test(text)
            ? 'iPhone/iPad'
            : /Android/.test(text)
              ? 'Android'
              : /Windows/.test(text)
                ? 'Windows'
                : /Mac OS X/.test(text)
                  ? 'Mac'
                  : /Linux/.test(text)
                    ? 'Linux'
                    : 'Gerät',
          browser = /Edg\//.test(text)
            ? 'Edge'
            : /OPR\/|Opera/.test(text)
              ? 'Opera'
              : /Firefox|FxiOS/.test(text)
                ? 'Firefox'
                : /SamsungBrowser/.test(text)
                  ? 'Samsung Internet'
                  : /Chrome|CriOS/.test(text)
                    ? 'Chrome'
                    : /Safari/.test(text)
                      ? 'Safari'
                      : '';
        return browser ? system + ' · ' + browser : system;
      }
      // „gerade eben“, „vor 5 Min“, „vor 3 Std“, sonst Datum und Uhrzeit (seen = Zeitpunkt, now = Serverzeit)
      function agoText(seen, now) {
        const minutes = Math.floor((now - seen) / 60000);
        if (minutes < 1) return 'gerade eben';
        if (minutes < 60) return `vor ${minutes} Min`;
        if (minutes < 1440) return `vor ${Math.floor(minutes / 60)} Std`;
        return formatDateTime(seen);
      }
      // Lädt die Geräteliste vom Server (GET /api/devices) und zeichnet neu. Das hält auch die Standortabfrage am Leben
      // (?locate=1, 90 Sekunden) – nur diese Seite fragt Standorte ab. refresh = true: sofort neue Abfragerunde.
      async function loadDevices(refresh = false) {
        try {
          const response = await api('GET', '/api/devices?locate=1' + (refresh ? '&refresh=1' : ''));
          deviceList = response.devices;
          deviceListOffset = response.now - Date.now();
          deviceListError = '';
        } catch (e) {
          deviceListError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      // Spitzname speichern (leer = entfernen)
      async function renameDevice(did, name) {
        try {
          await api('POST', '/api/devices/name', { did, name });
          deviceRenameId = null;
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadDevices();
      }
      // Gerät ausloggen: der Server meldet es sofort ab (Rolle/Team weg, Tokens ungültig); das Gerät selbst kehrt zum Startbildschirm
      // zurück, sobald es sich beim Server meldet (bei offener App sofort)
      async function logoutDevice(did) {
        deviceLogoutArmed = null;
        try {
          await api('POST', '/api/devices/logout', { did });
          infoMsg =
            'Gerät ausgeloggt – es kehrt zum Startbildschirm zurück, sobald es sich beim Server meldet.';
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadDevices();
      }
      // Standortzeile einer Gerätekarte: Karten-Link mit Genauigkeit und Alter, oder der Grund, warum es keinen gibt
      function locationLine(device, now) {
        if (device.locError)
          return el(
            'div',
            { class: 'mu' },
            '📍 ' +
              (device.locError === 'denied'
                ? 'Standort nicht freigegeben'
                : device.locError === 'unavailable'
                  ? 'Standort nicht verfügbar'
                  : 'Standort: keine Antwort (Zeitüberschreitung)') +
              ' · ' +
              agoText(device.locAt, now)
          );
        if (device.lat == null) return el('div', { class: 'mu' }, '📍 Standort: noch keine Antwort');
        const url = `https://www.openstreetmap.org/?mlat=${device.lat}&mlon=${device.lon}#map=17/${device.lat}/${device.lon}`;
        return el(
          'div',
          { class: 'mu' },
          '📍 ',
          el('a', { href: url, target: '_blank', rel: 'noopener' }, 'Auf Karte öffnen'),
          ` · ±${device.acc} m · ${agoText(device.locAt, now)}`
        );
      }
      /**
       * Dispo-Tab „Geräte“: alle Geräte der letzten 30 Tage mit Rolle/Team (wo angemeldet), Spitzname, zuletzt aktiv und
       * Push-Status. Je Gerät: Spitzname vergeben und „Ausloggen“ (mit Rückfrage). Die Liste lädt beim Öffnen des Tabs und
       * erneuert sich alle 20 Sekunden.
       */
      function drawDevices() {
        if (deviceList === null) {
          app.append(deviceListError ? el('p', { class: 'mu er' }, deviceListError) : skeletonGrid(4));
          return;
        }
        const now = Date.now() + deviceListOffset,
          isOnline = device => now - device.seen < 2 * 60e3,
          loggedIn = deviceList.filter(device => device.role).length,
          online = deviceList.filter(isOnline).length;
        app.append(
          el(
            'div',
            { class: 'card' },
            el('b', {}, 'Geräte'),
            el(
              'p',
              { class: 'mu' },
              `${deviceList.length} ${deviceList.length === 1 ? 'Gerät' : 'Geräte'} in den letzten 30 Tagen · ${loggedIn} angemeldet · ${online} online`
            ),
            el(
              'p',
              { class: 'mu' },
              'Hier siehst du, welches Gerät wo angemeldet ist, und kannst Geräten einen Spitznamen geben. „Ausloggen“ meldet ein Gerät sofort ab: Es kehrt zum Startbildschirm zurück (bei geöffneter App gleich, sonst beim nächsten Öffnen), bei Disponenten wird die Anmeldung sofort ungültig. Monteure können sich danach wieder anmelden.'
            ),
            el(
              'p',
              { class: 'mu' },
              'Standorte werden nur abgefragt, solange diese Seite offen ist – und nur von Monteur-Geräten, die gerade geöffnet sind und den Standort freigeben.'
            ),
            el(
              'button',
              {
                class: 'pri',
                onclick: () => {
                  loadDevices(true);
                  // Geräte antworten innerhalb weniger Sekunden
                  setTimeout(() => {
                    if (dispoTab === 'dv') loadDevices();
                  }, 6000);
                }
              },
              '📍 Standorte jetzt aktualisieren'
            ),
            deviceListError && el('p', { class: 'mu er' }, deviceListError)
          )
        );
        // Team-Filter: alle Teams der Monteur-Geräte (mit Anzahl Geräte und davon online), dazu Disponenten und „ohne Team“
        const DEV_DISPO = '\u0000d',
          DEV_NOTEAM = '\u0000n',
          matchesDeviceTeam = device =>
            !deviceTeamFilter ||
            (deviceTeamFilter === DEV_DISPO
              ? device.role === 'dispo'
              : deviceTeamFilter === DEV_NOTEAM
                ? device.role === 'monteur' && !device.team
                : device.role === 'monteur' && device.team === deviceTeamFilter),
          deviceTeams = new Map();
        let dispoDevices = 0,
          noTeamDevices = 0;
        for (const device of deviceList) {
          if (device.role === 'dispo') dispoDevices++;
          else if (device.role === 'monteur' && !device.team) noTeamDevices++;
          else if (device.role === 'monteur') {
            const c = deviceTeams.get(device.team) || [0, 0];
            c[0]++;
            if (isOnline(device)) c[1]++;
            deviceTeams.set(device.team, c);
          }
        }
        // gewähltes Team gibt es nicht mehr (z. B. Gerät hat gewechselt): Filter aufheben
        if (
          deviceTeamFilter &&
          deviceTeamFilter !== DEV_DISPO &&
          deviceTeamFilter !== DEV_NOTEAM &&
          !deviceTeams.has(deviceTeamFilter)
        )
          deviceTeamFilter = '';
        const deviceOpt = (value, label) =>
          el('option', { value, ...(value === deviceTeamFilter ? { selected: 'selected' } : {}) }, label);
        app.append(
          el(
            'div',
            { class: 'flt', 'data-k': 'fl' },
            el('span', { class: 'mu' }, 'Team'),
            el(
              'select',
              {
                onchange: e => {
                  deviceTeamFilter = e.target.value;
                  deviceLogoutArmed = null;
                  render();
                }
              },
              deviceOpt('', `Alle Geräte (${deviceList.length})`),
              [...deviceTeams]
                .sort((a, b) => naturalCompare(a[0], b[0]))
                .map(([t, c]) => deviceOpt(t, `${t} (${c[0]} · ${c[1]} online)`)),
              noTeamDevices > 0 && deviceOpt(DEV_NOTEAM, `Monteur ohne Team (${noTeamDevices})`),
              dispoDevices > 0 && deviceOpt(DEV_DISPO, `Disponenten (${dispoDevices})`)
            ),
            deviceTeamFilter &&
              el(
                'button',
                {
                  class: 'rs',
                  onclick: () => {
                    deviceTeamFilter = '';
                    deviceLogoutArmed = null;
                    render();
                  }
                },
                '✕ Teamfilter aufheben'
              )
          )
        );
        // angemeldete Geräte zuerst, innerhalb davon online vor offline und das zuletzt aktive
        const sorted = deviceList
          .filter(matchesDeviceTeam)
          .sort(
            (a, b) =>
              (b.role ? 1 : 0) - (a.role ? 1 : 0) || isOnline(b) - isOnline(a) || b.seen - a.seen
          );
        if (!sorted.length) app.append(el('p', { class: 'mu' }, 'Keine Geräte in diesem Team.'));
        app.append(
          el(
            'div',
            { class: 'grid', 'data-list': '1' },
            sorted.map(device => {
              const kind = deviceKind(device.ua),
                where = device.role === 'dispo' ? 'Disponent' : device.role === 'monteur' ? 'Monteur' : 'Abgemeldet',
                online = isOnline(device),
                renaming = deviceRenameId === device.did;
              return el(
                'div',
                { class: 'card dv' + (device.role ? '' : ' off'), 'data-k': 'd' + device.did },
                el(
                  'div',
                  { class: 'row' },
                  el('b', {}, device.name || kind),
                  device.did === deviceId && el('span', { class: 'tag' }, 'Dieses Gerät'),
                  el('span', { class: 'tag ' + (online ? 'st-ok' : '') }, online ? '● Online' : '○ Offline'),
                  el('span', { class: 'tag ' + (device.role === 'dispo' ? 'st-teil' : '') }, where),
                  device.role === 'monteur' &&
                    el(
                      'span',
                      { class: 'tag ' + (device.team ? 'st-teil' : 'st-zf') },
                      '👥 ' + (device.team || 'kein Team gewählt')
                    ),
                  device.kick && el('span', { class: 'tag st-zf' }, '⏳ Gerät noch nicht informiert')
                ),
                el(
                  'div',
                  { class: 'mu' },
                  (device.name ? kind + ' · ' : '') + 'Kennung …' + device.did.slice(-4)
                ),
                device.usr &&
                  el('div', { class: 'mu' }, '👤 ' + (device.uname ? `${device.uname} (${device.usr})` : device.usr)),
                el(
                  'div',
                  { class: 'mu' },
                  el('span', { class: 'dv-dot' + (online ? ' on' : '') }),
                  online ? 'Online – gerade aktiv' : 'Offline – zuletzt aktiv ' + agoText(device.seen, now)
                ),
                device.role === 'monteur' &&
                  el(
                    'div',
                    { class: 'mu' },
                    device.push ? '🔔 Benachrichtigungen an' : '🔕 ohne Benachrichtigungen'
                  ),
                device.role === 'monteur' && locationLine(device, now),
                device.first &&
                  el('div', { class: 'mu' }, 'Erstmals gesehen: ' + formatDateTime(device.first)),
                renaming
                  ? el(
                      'div',
                      { class: 'ed' },
                      el('input', {
                        class: 'dv-name',
                        type: 'text',
                        maxlength: '40',
                        'data-keep': 'dn',
                        placeholder: 'Spitzname, z. B. „Handy Max“',
                        value: deviceRenameText,
                        oninput: e => {
                          deviceRenameText = e.target.value;
                        },
                        onkeydown: e => {
                          if (e.key === 'Enter') renameDevice(device.did, deviceRenameText);
                        }
                      }),
                      el(
                        'div',
                        { class: 'ob' },
                        el(
                          'button',
                          { class: 'sv', onclick: () => renameDevice(device.did, deviceRenameText) },
                          'Speichern'
                        ),
                        el(
                          'button',
                          {
                            onclick: () => {
                              deviceRenameId = null;
                              render();
                            }
                          },
                          'Abbrechen'
                        )
                      )
                    )
                  : el(
                      'div',
                      { class: 'ob dv-actions' },
                      el(
                        'button',
                        {
                          onclick: () => {
                            deviceRenameId = device.did;
                            deviceRenameText = device.name || '';
                            deviceLogoutArmed = null;
                            render();
                            const field = app.querySelector('[data-keep="dn"]');
                            if (field) field.focus();
                          }
                        },
                        device.name ? 'Umbenennen' : 'Spitzname geben'
                      ),
                      device.role &&
                        !device.kick &&
                        (deviceLogoutArmed === device.did
                          ? [
                              el(
                                'button',
                                { class: 'er', onclick: () => logoutDevice(device.did) },
                                'Wirklich ausloggen?'
                              ),
                              el(
                                'button',
                                {
                                  onclick: () => {
                                    deviceLogoutArmed = null;
                                    render();
                                  }
                                },
                                'Abbrechen'
                              )
                            ]
                          : el(
                              'button',
                              {
                                class: 'er',
                                onclick: () => {
                                  deviceLogoutArmed = device.did;
                                  render();
                                }
                              },
                              'Ausloggen'
                            ))
                    )
              );
            })
          )
        );
      }
      // ---- Benutzerverwaltung (Disponent) ----
      // userList: Benutzer vom Server (null = noch nicht geladen) · userNow: Serverzeit · userSearch / userTeamFilter: Filter ·
      // userEdit: SAP-User des Benutzers im Bearbeiten-Modus ('new' = neuer Benutzer) mit den Eingaben in userForm ·
      // userError: Fehlertext des Formulars · userArmed: „del:<SAP>“ / „reset:<SAP>“ nach dem ersten Tipp (zweiter bestätigt) ·
      // userLogFor / userLogRows: Benutzer, dessen Protokoll aufgeklappt ist, und dessen Einträge
      let userList = null,
        userListError = '',
        userNow = 0,
        userSearch = '',
        userTeamFilter = '',
        userEdit = null,
        userForm = { sap: '', last: '', first: '', team: '', active: true, lock: false },
        userError = '',
        userArmed = null,
        userLogFor = null,
        userLogRows = null;
      // lädt die Benutzerliste (GET /api/users) und zeichnet neu
      async function loadUsers() {
        try {
          const r = await api('GET', '/api/users');
          userList = r.users;
          userNow = r.now;
          userListError = '';
        } catch (e) {
          userListError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      // speichert das Formular: neuer Benutzer (POST) oder Änderung (PUT); der SAP-User eines bestehenden Benutzers bleibt
      async function saveUserForm() {
        const isNew = userEdit === 'new',
          form = { ...userForm, sap: userForm.sap.trim().toUpperCase() };
        if (isNew && !/^[A-Z0-9]{2,20}$/.test(form.sap)) {
          userError = 'SAP-User: 2–20 Buchstaben oder Ziffern.';
          return render();
        }
        if (!form.last.trim()) {
          userError = 'Bitte den Nachnamen eingeben.';
          return render();
        }
        try {
          await api(
            isNew ? 'POST' : 'PUT',
            isNew ? '/api/users' : '/api/users/' + encodeURIComponent(userEdit),
            isNew
              ? form
              : { last: form.last, first: form.first, team: form.team, active: form.active, lock: form.lock }
          );
          userEdit = null;
          userError = '';
          infoMsg = isNew ? `Benutzer ${form.sap} angelegt – Startpasswort gilt.` : 'Benutzer gespeichert';
        } catch (e) {
          userError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
          return render();
        }
        await loadUsers();
      }
      // Schnelländerung direkt an der Karte (Team wählen oder Teamwechsel erlauben/sperren), gilt sofort auf dem Gerät des Monteurs
      async function quickUserChange(u, changes, message) {
        try {
          await api('PUT', '/api/users/' + encodeURIComponent(u.sap), changes);
          infoMsg = message;
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadUsers();
      }
      // Passwort zurücksetzen / Benutzer löschen (je nach Aktion), danach Liste neu laden
      async function userAction(kind, sap) {
        userArmed = null;
        try {
          if (kind === 'reset') {
            await api('POST', `/api/users/${encodeURIComponent(sap)}/reset`);
            infoMsg = `Passwort von ${sap} auf das Startpasswort zurückgesetzt – bisherige Anmeldungen enden.`;
          } else {
            await api('DELETE', '/api/users/' + encodeURIComponent(sap));
            infoMsg = `Benutzer ${sap} gelöscht.`;
            if (userLogFor === sap) userLogFor = null;
          }
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadUsers();
      }
      // klappt das Protokoll eines Benutzers auf/zu
      async function toggleUserLog(sap) {
        if (userLogFor === sap) {
          userLogFor = null;
          return render();
        }
        userLogFor = sap;
        userLogRows = null;
        render();
        try {
          userLogRows = (await api('GET', `/api/users/${encodeURIComponent(sap)}/log`)).log;
        } catch (e) {
          userLogRows = [];
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      const LOG_KINDS = {
        login: 'Angemeldet',
        ergebnis: 'Ergebnis gespeichert',
        gas: 'Gaswarngerät bestätigt',
        ack: 'Nachricht bestätigt'
      };
      /**
       * Dispo-Tab „Benutzer“: alle Monteur-Benutzer (SAP-User, Name, Team) mit letzter Anmeldung und Geräten. Anlegen, Ändern
       * (Name, Team, sperren), Passwort auf das Startpasswort zurücksetzen, Löschen (jeweils mit Rückfrage) und das Protokoll
       * des Benutzers (Anmeldungen, Ergebnisse, Gaswarngerät, Bestätigungen).
       */
      function drawUsers() {
        if (userList === null) {
          app.append(userListError ? el('p', { class: 'mu er' }, userListError) : skeletonGrid(4));
          return;
        }
        const teams = [...new Set([...userList.map(u => u.team).filter(Boolean), ...teamList.map(([t]) => t)])].sort(
            naturalCompare
          ),
          query = userSearch.trim().toLowerCase(),
          shown = userList.filter(
            u =>
              (!userTeamFilter || (userTeamFilter === '\u0000n' ? !u.team : u.team === userTeamFilter)) &&
              (!query || `${u.first} ${u.last} ${u.sap}`.toLowerCase().includes(query))
          ),
          recent = userList.filter(u => u.loginAt && userNow - u.loginAt < 30 * 864e5).length;
        const startNew = () => {
          userEdit = 'new';
          userForm = {
            sap: '',
            last: '',
            first: '',
            team: userTeamFilter && userTeamFilter !== '\u0000n' ? userTeamFilter : '',
            active: true,
            lock: false
          };
          userError = '';
          render();
          const n = app.querySelector('[data-keep="us"]');
          if (n) n.focus();
        };
        const field = (label, key, extra = {}) => [
          el('label', {}, label),
          el('input', {
            type: 'text',
            value: userForm[key],
            maxlength: key === 'sap' ? '20' : '60',
            autocapitalize: key === 'sap' ? 'characters' : null,
            autocomplete: 'off',
            spellcheck: 'false',
            oninput: e => {
              userForm[key] = e.target.value;
            },
            ...extra
          })
        ];
        const form = () =>
          el(
            'form',
            {
              class: 'ufm',
              onsubmit: e => {
                e.preventDefault();
                saveUserForm();
              }
            },
            userEdit === 'new' && field('SAP-User (Anmeldename)', 'sap', { 'data-keep': 'us' }),
            field('Nachname', 'last'),
            field('Vorname', 'first'),
            field('Team', 'team', { list: 'uteams', placeholder: 'z. B. FW-IH01' }),
            el('datalist', { id: 'uteams' }, teams.map(t => el('option', { value: t }))),
            el(
              'label',
              {},
              el('input', {
                type: 'checkbox',
                checked: userForm.lock ? null : 'checked',
                onchange: e => {
                  userForm.lock = !e.target.checked;
                }
              }),
              ' Darf sein Team selbst wechseln (Haken weg = Team fest zugewiesen)'
            ),
            userEdit !== 'new' &&
              el(
                'label',
                {},
                el('input', {
                  type: 'checkbox',
                  checked: userForm.active ? 'checked' : null,
                  onchange: e => {
                    userForm.active = e.target.checked;
                  }
                }),
                ' Benutzer ist aktiv (Haken weg = gesperrt)'
              ),
            userError && el('p', { class: 'mu er' }, userError),
            el(
              'div',
              { class: 'ob' },
              el('button', { class: 'sv', type: 'submit' }, 'Speichern'),
              el(
                'button',
                {
                  type: 'button',
                  onclick: () => {
                    userEdit = null;
                    userError = '';
                    render();
                  }
                },
                'Abbrechen'
              )
            )
          );
        app.append(
          el(
            'div',
            { class: 'card', 'data-k': 'uh' },
            el('b', {}, 'Benutzer'),
            el(
              'p',
              { class: 'mu' },
              `${userList.length} ${userList.length === 1 ? 'Benutzer' : 'Benutzer'} · ${recent} in den letzten 30 Tagen angemeldet`
            ),
            el(
              'p',
              { class: 'mu' },
              'Alle Monteure melden sich mit ihrem SAP-User und dem Passwort an. Das Team hier wird beim Anmelden automatisch gewählt (der Monteur kann es danach wechseln). „Passwort zurücksetzen“ setzt das Startpasswort, alle bisherigen Anmeldungen des Benutzers enden dabei.'
            ),
            userEdit === 'new' ? form() : el('button', { class: 'pri', onclick: startNew }, '＋ Neuer Benutzer'),
            userListError && el('p', { class: 'mu er' }, userListError)
          ),
          el(
            'div',
            { class: 'flt', 'data-k': 'fl' },
            el('span', { class: 'mu' }, 'Team'),
            el(
              'select',
              {
                onchange: e => {
                  userTeamFilter = e.target.value;
                  userArmed = null;
                  render();
                }
              },
              el('option', { value: '' }, `Alle (${userList.length})`),
              teams.map(t =>
                el(
                  'option',
                  { value: t, ...(t === userTeamFilter ? { selected: 'selected' } : {}) },
                  `${t} (${userList.filter(u => u.team === t).length})`
                )
              ),
              userList.some(u => !u.team) &&
                el(
                  'option',
                  { value: '\u0000n', ...(userTeamFilter === '\u0000n' ? { selected: 'selected' } : {}) },
                  `Ohne Team (${userList.filter(u => !u.team).length})`
                )
            ),
            userTeamFilter &&
              el(
                'button',
                {
                  class: 'rs',
                  onclick: () => {
                    userTeamFilter = '';
                    render();
                  }
                },
                '✕ Teamfilter aufheben'
              )
          ),
          el(
            'div',
            { class: 'tools' },
            el('input', {
              type: 'search',
              'data-keep': 'usr',
              placeholder: 'Suchen (Name, SAP-User)',
              value: userSearch,
              oninput: e => {
                userSearch = e.target.value;
                render();
              }
            })
          ),
          ...(shown.length ? [] : [el('p', { class: 'mu' }, 'Keine Benutzer gefunden.')]),
          el(
            'div',
            { class: 'grid', 'data-list': '1' },
            shown.map(u => {
              const editing = userEdit === u.sap;
              return el(
                'div',
                { class: 'card ucard' + (u.active ? '' : ' off'), 'data-k': 'u' + u.sap },
                el(
                  'div',
                  { class: 'row' },
                  el('b', {}, `${u.first} ${u.last}`.trim()),
                  el('span', { class: 'tag' }, u.sap),
                  el('span', { class: 'tag ' + (u.team ? 'st-teil' : 'st-zf') }, '👥 ' + (u.team || 'kein Team')),
                  u.lock && u.team && el('span', { class: 'tag' }, '🔒 Team fest'),
                  !u.active && el('span', { class: 'tag st-nok' }, 'gesperrt')
                ),
                el(
                  'div',
                  { class: 'mu' },
                  u.loginAt ? 'Zuletzt angemeldet ' + agoText(u.loginAt, userNow) : 'Noch nie angemeldet'
                ),
                el(
                  'div',
                  { class: 'mu' },
                  u.devs
                    ? `📱 ${u.devs} ${u.devs === 1 ? 'Gerät' : 'Geräte'}` + (u.seen ? ' · zuletzt aktiv ' + agoText(u.seen, userNow) : '')
                    : '📱 kein Gerät'
                ),
                // Schnellauswahl: Team direkt ändern (der Disponent darf das immer) und Teamwechsel durch den Monteur erlauben/sperren
                !editing &&
                  el(
                    'div',
                    { class: 'ob uq' },
                    el(
                      'select',
                      {
                        'aria-label': 'Team von ' + u.sap,
                        onchange: e =>
                          quickUserChange(
                            u,
                            { team: e.target.value },
                            e.target.value ? `${u.sap}: Team ${e.target.value}` : `${u.sap}: kein Team`
                          )
                      },
                      el('option', { value: '', ...(u.team ? {} : { selected: 'selected' }) }, '— kein Team —'),
                      [...new Set([...teams, ...(u.team ? [u.team] : [])])].sort(naturalCompare).map(t =>
                        el('option', { value: t, ...(t === u.team ? { selected: 'selected' } : {}) }, t)
                      )
                    ),
                    el(
                      'button',
                      {
                        class: u.lock ? 'er' : null,
                        title: 'Darf der Monteur sein Team selbst wechseln?',
                        onclick: () =>
                          quickUserChange(
                            u,
                            { lock: !u.lock },
                            u.lock
                              ? `${u.sap}: darf das Team wieder selbst wechseln`
                              : `${u.sap}: Team fest zugewiesen (kein Teamwechsel)`
                          )
                      },
                      u.lock ? '🔒 Team fest' : '🔓 Wechsel erlaubt'
                    )
                  ),
                editing
                  ? form()
                  : el(
                      'div',
                      { class: 'ob dv-actions' },
                      el(
                        'button',
                        {
                          onclick: () => {
                            userEdit = u.sap;
                            userForm = {
                              sap: u.sap,
                              last: u.last,
                              first: u.first,
                              team: u.team || '',
                              active: u.active,
                              lock: !!u.lock
                            };
                            userError = '';
                            userArmed = null;
                            render();
                          }
                        },
                        'Bearbeiten'
                      ),
                      userArmed === 'reset:' + u.sap
                        ? [
                            el('button', { class: 'er', onclick: () => userAction('reset', u.sap) }, 'Wirklich zurücksetzen?'),
                            el(
                              'button',
                              {
                                onclick: () => {
                                  userArmed = null;
                                  render();
                                }
                              },
                              'Abbrechen'
                            )
                          ]
                        : el(
                            'button',
                            {
                              onclick: () => {
                                userArmed = 'reset:' + u.sap;
                                render();
                              }
                            },
                            'Passwort zurücksetzen'
                          ),
                      el('button', { onclick: () => toggleUserLog(u.sap) }, userLogFor === u.sap ? 'Protokoll ausblenden' : 'Protokoll'),
                      userArmed === 'del:' + u.sap
                        ? [
                            el('button', { class: 'er', onclick: () => userAction('del', u.sap) }, 'Wirklich löschen?'),
                            el(
                              'button',
                              {
                                onclick: () => {
                                  userArmed = null;
                                  render();
                                }
                              },
                              'Abbrechen'
                            )
                          ]
                        : el(
                            'button',
                            {
                              class: 'er',
                              onclick: () => {
                                userArmed = 'del:' + u.sap;
                                render();
                              }
                            },
                            'Löschen'
                          )
                    ),
                userLogFor === u.sap &&
                  (userLogRows === null
                    ? el('p', { class: 'mu' }, 'Lade …')
                    : userLogRows.length
                      ? el(
                          'ul',
                          { class: 'ulog' },
                          userLogRows.map(l =>
                            el(
                              'li',
                              {},
                              `${formatDateTime(l.at)} · ${LOG_KINDS[l.kind] || l.kind}` +
                                (l.ref ? ' · ' + (l.kind === 'ergebnis' ? 'Auftrag ' : '') + l.ref : '') +
                                (l.info ? ' · ' + l.info : '') +
                                (l.did ? ' · Gerät …' + l.did.slice(-4) : '')
                            )
                          )
                        )
                      : el('p', { class: 'mu' }, 'Noch keine Einträge.'))
              );
            })
          )
        );
      }
      // Disponent: Kopfzeile + Tabs (Übersicht, Fortschritt, Upload, Vergleich, Geräte, Benutzer) und je nach Tab die passende Ansicht
      function drawDispo(back) {
        app.append(
          el('div', { class: 'bar' }, el('h1', {}, 'Disponent'), back),
          el(
            'div',
            { class: 'tabs' },
            el(
              'button',
              {
                class: dispoTab === 'ue' ? 'on' : null,
                onclick: () => {
                  dispoTab = 'ue';
                  uploadToken = '';
                  render();
                }
              },
              'Übersicht'
            ),
            el(
              'button',
              {
                class: dispoTab === 'st' ? 'on' : null,
                onclick: () => {
                  dispoTab = 'st';
                  uploadToken = '';
                  render();
                }
              },
              'Fortschritt'
            ),
            el(
              'button',
              {
                class: dispoTab === 'up' ? 'on' : null,
                onclick: () => {
                  if (dispoTab !== 'up') {
                    dispoTab = 'up';
                    uploadToken = '';
                    uploadPinInput = '';
                    uploadPinError = false;
                  }
                  render();
                  const n = app.querySelector('[data-keep="u"]');
                  if (n) n.focus();
                }
              },
              'Upload'
            ),
            el(
              'button',
              {
                class: dispoTab === 'vg' ? 'on' : null,
                onclick: () => {
                  dispoTab = 'vg';
                  uploadToken = '';
                  render();
                }
              },
              'Vergleich'
            ),
            el(
              'button',
              {
                class: dispoTab === 'dv' ? 'on' : null,
                onclick: () => {
                  dispoTab = 'dv';
                  uploadToken = '';
                  deviceRenameId = null;
                  deviceLogoutArmed = null;
                  render();
                  loadDevices();
                  // die Monteur-Geräte antworten auf die Standortabfrage innerhalb weniger Sekunden
                  setTimeout(() => {
                    if (dispoTab === 'dv') loadDevices();
                  }, 6000);
                }
              },
              'Geräte'
            ),
            el(
              'button',
              {
                class: dispoTab === 'us' ? 'on' : null,
                onclick: () => {
                  dispoTab = 'us';
                  uploadToken = '';
                  userEdit = null;
                  userArmed = null;
                  userLogFor = null;
                  render();
                  loadUsers();
                }
              },
              'Benutzer'
            )
          )
        );
        // aktiven Tab in die Mitte der wischbaren Leiste rücken (die Leiste wird bei jedem Zeichnen neu gebaut): sie gleitet dorthin
        // und startet dabei am alten Stand statt zu springen; bleibt der Tab gleich, bleibt auch der Stand (man wischt vielleicht gerade)
        const tabBar = app.querySelector('.tabs'),
          activeTab = tabBar && tabBar.querySelector('button.on');
        if (activeTab) {
          const target = activeTab.offsetLeft - (tabBar.clientWidth - activeTab.offsetWidth) / 2;
          if (tabsLeft === null) tabBar.scrollLeft = target;
          else {
            tabBar.scrollLeft = tabsLeft;
            // gleitet zum neuen Tab; zeichnet die App währenddessen nochmal (Daten kommen), gleitet sie weiter statt stehenzubleiben
            if (tabsShown !== dispoTab || performance.now() - tabsSince < 500)
              tabBar.scrollTo({
                left: target,
                behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
              });
          }
          if (tabsShown !== dispoTab) tabsSince = performance.now();
          tabsShown = dispoTab;
        }
        if (dispoTab === 'us') {
          drawUsers();
          return;
        }
        if (dispoTab === 'dv') {
          drawDevices();
          return;
        }
        if (dispoTab === 'vg') {
          drawComparison();
          return;
        }
        if (dispoTab === 'st') {
          drawDispoProgress();
          return;
        }
        if (dispoTab === 'up' && !uploadToken) {
          drawUploadPinPrompt();
          return;
        }
        if (dispoTab === 'up') {
          drawUploadTab();
          return;
        }
        drawDispoOverview();
      }

      /** Baut die komplette Seite aus dem Zustand: Meldungen, dann je nach Zustand Detail, Start, PIN, Team, Monteur- oder Dispo-Ansicht. */
      function draw() {
        applyFontScale();
        hideTooltip();
        document.body.dataset.w =
          !openOrder && (!session.role || (session.role === 'dispo' && !dispoUnlocked)) ? 'n' : '';
        app.replaceChildren();
        drawStatusBanners();
        if (openOrder) {
          drawOrderDetail();
          return;
        }
        if (!session.role) {
          drawRoleChoice();
          return;
        }
        const back = el('button', { onclick: () => switchRole(null) }, '← Start');
        if (session.role === 'dispo' && !dispoUnlocked) {
          drawDispoLogin(back);
          return;
        }
        // Monteure müssen sich anmelden (SAP-User + Passwort); danach gilt das Team aus der Benutzerverwaltung
        if (session.role === 'monteur' && !userToken) {
          drawMonteurLogin(back);
          return;
        }
        if (session.role === 'monteur' && !session.team) {
          drawTeamPicker(back);
          return;
        }
        // Team gibt es (noch) nicht bei den Aufträgen (z. B. „Springer“): Team wählen lassen
        if (
          session.role === 'monteur' &&
          !(userInfo && userInfo.lock) &&
          dataReady &&
          teamList.length &&
          !teamList.some(([t]) => t === session.team)
        ) {
          drawTeamPicker(back, session.team);
          return;
        }
        if (session.role === 'monteur') {
          drawMonteurList(back);
          return;
        }
        drawDispo(back);
      }

      // ---- Start ----
      // Ungesendete Eingaben aus dem Gerät laden, auf Netz-/Sichtbarkeitswechsel reagieren, erstmals zeichnen und abgleichen
      loadOutbox();
      addEventListener('online', () => {
        serverReachable = true;
        if (outbox.size) sendAllPending();
        poll();
      });
      addEventListener('offline', () => {
        serverReachable = false;
        render();
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (outbox.size) sendAllPending();
          // nach dem Hintergrund ist die Verbindung oft stumm tot: neu aufbauen, wenn lange nichts kam
          if (live.ctrl && Date.now() - live.last > 45000) live.ctrl.abort();
          syncLive();
          if (liveDirty) renderLive();
          poll();
        }
      });
      // Sicherheitsnetz: steht die Live-Verbindung, reicht ein Abgleich alle 90 Sekunden, sonst alle 30
      setInterval(() => {
        if (!document.hidden && Date.now() - lastPollAt > (live.ok ? 90000 : 30000) - 2000) poll();
      }, 15000);
      // Geräteübersicht offen: alle 20 Sekunden neu laden (nicht während ein Spitzname getippt wird)
      setInterval(() => {
        if (
          dispoTab === 'dv' &&
          dispoUnlocked &&
          session.role === 'dispo' &&
          !document.hidden &&
          deviceRenameId === null
        )
          loadDevices();
      }, 20000);
      render();
      poll().then(() => {
        sendAllPending();
        prefetchChecklists();
        pushSync(false);
      });
      syncLive();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        // Push angekommen / bestätigt -> sofort abgleichen
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data && e.data.t === 'msg') poll();
        });
      }
    </script>
  </body>
</html>
