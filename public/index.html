            hints.push(
              'Der Push-Dienst des Browsers (bei Chrome/Android: Google) ist nicht erreichbar. Häufig sperrt ein Firmen-WLAN oder Proxy ihn – mit mobilen Daten erneut versuchen.'
            );
            hints.push(
              /Android/.test(userAgent)
                ? 'Handy ohne Google-Dienste (z. B. neuere Huawei)? Dann Firefox verwenden.'
                : 'Private/Inkognito-Fenster und in andere Programme eingebaute Browser können keine Push-Benachrichtigungen – in Chrome, Edge oder Firefox öffnen.'
            );
          }
          return el(
            'div',
            { class: 'msg er' },
            el('b', {}, 'Benachrichtigungen konnten nicht eingerichtet werden.'),
            el('div', { class: 'mu' }, 'Meldung des Browsers: ' + pushError),
            hints.map(x => el('div', { class: 'mu' }, '• ' + x)),
            el(
              'div',
              { class: 'mu' },
              'Nachrichten vom Disponenten erscheinen trotzdem, solange die App offen ist.'
            ),
            el('button', { class: 'pri', onclick: () => pushSync(true) }, 'Erneut versuchen')
          );
        }
        if (Notification.permission === 'denied')
          return el(
            'div',
            { class: 'msg' },
            '🔕 Benachrichtigungen sind blockiert – Nachrichten vom Disponenten siehst du nur bei geöffneter App. Freigeben in den Einstellungen von Browser bzw. Handy.'
          );
        return el(
          'div',
          { class: 'msg pb' },
          el(
            'span',
            {},
            '🔔 Benachrichtigungen aktivieren, damit dich Nachrichten vom Disponenten auch bei geschlossener App erreichen.'
          ),
          el('button', { class: 'pri', onclick: () => pushSync(true) }, 'Aktivieren')
        );
      }
      // ---- Tooltip, Suche, Zurück ----
      // Tooltip (nur Maus) – alle Werte stehen zusätzlich in Beschriftung und Tabelle
      const tooltip = el('div', { class: 'tip' });
      document.body.append(tooltip);
      // zeigt die Werte eines Teams neben dem Mauszeiger (bleibt im sichtbaren Bereich)
      function showTooltip(event, stats, percentDone, openCount, perWeek) {
        if (event.pointerType !== 'mouse') return;
        tooltip.replaceChildren(
          el('div', { class: 'mu' }, stats.team),
          ...[
            ['g2', `${formatNumber(stats.done)} (${percentDone} %)`, 'Erledigt'],
            ['g1', formatNumber(stats.teil), 'In Arbeit'],
            ['g0', formatNumber(openCount), 'Offen']
          ].map(([k, v, l]) =>
            el(
              'div',
              { class: 'tr' },
              el('i', { class: 'lk ' + k }),
              el('b', {}, v),
              el('span', { class: 'mu' }, l)
            )
          ),
          stats.nok > 0 &&
            el(
              'div',
              { class: 'tr' },
              el('b', { class: 'er' }, '✗ ' + formatNumber(stats.nok)),
              el('span', { class: 'mu' }, 'Nicht OK')
            ),
          perWeek > 0 &&
            el(
              'div',
              { class: 'mu', style: 'margin-top:4px' },
              `≥ ${formatNumber(perWeek)} Prüfungen / Woche nötig`
            )
        );
        tooltip.style.display = 'block';
        const w = tooltip.offsetWidth,
          h = tooltip.offsetHeight;
        let x = event.clientX + 14,
          y = event.clientY + 14;
        if (x + w > innerWidth - 8) x = event.clientX - w - 14;
        if (y + h > innerHeight - 8) y = event.clientY - h - 14;
        tooltip.style.transform = `translate(${Math.max(8, x)}px,${Math.max(8, y)}px)`;
      }
      function hideTooltip() {
        tooltip.style.display = 'none';
      }
      // Suchfeld; extra = zusätzliches Element davor (z. B. Schriftgrößen-Schalter)
      const searchBox = (onInput, extra) =>
        el(
          'div',
          { class: 'tools' },
          extra,
          el('input', {
            type: 'search',
            'data-keep': 's',
            placeholder: 'Suchen (Auftrag, Kurztext, Straße …)',
            value: searchText,
            oninput: e => onInput(e.target.value)
          })
        );
      // Schließt die Detailansicht, springt zur gemerkten Scroll-Position und nimmt den History-Eintrag zurück
      const closeOrder = () => {
        openOrder = null;
        armAllOk = false;
        editIndex = null;
        render();
        scrollTo(0, listScrollY);
        if (history.state && history.state.a) history.back();
      };
      // ---- Verlassen-Warnung ----
      // Monteur verlässt einen angefangenen, aber unvollständigen Auftrag (oder hat ungespeicherte Eingaben) -> nachfragen
      // Momentaufnahme der Zeit-Eingaben: unterscheidet gespeicherte von ungespeicherten Eingaben
      const timeFormSnapshot = () => [timeHours, timeMinutes, timeDate, timeStart, [...timeWith].sort().join(',')].join('|');
      let timeFormAtOpen = '';
      /**
       * Prüft beim Verlassen eines Auftrags (Monteur), was noch fehlt: offene Prüfobjekte, fehlende/unvollständige Zeit,
       * ungespeicherte Zeit- oder Nicht-OK-Eingaben. Reines Ansehen löst keine Warnung aus.
       * Ergebnis: null oder { it: [[Text, CSS-Selektor der Stelle]], uns: es gehen ungespeicherte Eingaben verloren }.
       */
      function unsavedWarnings() {
        const order = openOrder;
        if (!order || session.role !== 'monteur') return null;
        if (isLocked(order.auftrag)) return null; // abgehakt: es gibt nichts mehr auszufüllen
        const result = resultOf(order.auftrag),
          checklistItems = checklist.st === 'ok' ? checklist.list : null,
          warnings = [];
        let unsaved = false;
        if (result && ((result.ok | 0) + (result.nx | 0) > 0 || result.min != null)) {
          // nur wenn schon etwas erfasst wurde (reines Ansehen -> kein Hinweis)
          const count = checklistItems ? checklistItems.length : result.n | 0,
            // ohne Prüfobjekte (Reparatur, Entstörung, Dauerauftrag) gibt es nichts zu prüfen
            valid = orderKind(order) !== 'war' || !checklistItems || !!(result.s && result.n === count && result.s.length === count);
          if (!valid) warnings.push(['Die Prüfliste wurde geändert – bitte neu prüfen', '.pcard .it']);
          else {
            const openCount = Math.max(0, count - (result.ok | 0) - (result.nx | 0));
            if (openCount > 0)
              warnings.push([
                openCount === 1 ? '1 Prüfobjekt ist noch offen' : `${openCount} Prüfobjekte sind noch offen`,
                '.pcard [data-op]'
              ]);
          }
          if (!timeComplete(result))
            warnings.push([
              result.min != null ? 'Bei der Zeit fehlt die Beginn-Uhrzeit' : 'Die Zeitrückmeldung fehlt',
              '[data-zeit]'
            ]);
        }
        if (
          timeFormAtOpen &&
          timeFormSnapshot() !== timeFormAtOpen &&
          ((result && result.min != null) || timeHours || timeMinutes || timeStart)
        ) {
          unsaved = true;
          warnings.unshift(['Die eingegebene Zeit ist noch nicht gespeichert', '[data-zeit]']);
        }
        // „■ Ende“ gedrückt, aber die Frage nach der Endrückmeldung ist noch offen: die Zeit ist nicht gespeichert (der Timer läuft weiter)
        if (stopAsk && stopAsk.a === order.auftrag && timerStartOf(order.auftrag)) {
          unsaved = true;
          warnings.unshift(['Die gestoppte Zeit ist noch nicht gespeichert (Endrückmeldung?)', '.tmr']);
        }
        if (editIndex !== null && checklistItems) {
          const m = editText.trim();
          if (m && m !== (currentChecklistState(order.auftrag, checklistItems).T[editIndex] || '')) {
            unsaved = true;
            warnings.unshift(['Der Nicht-OK-Text ist noch nicht gespeichert', '[data-keep="e"]']);
          }
        }
        return warnings.length ? { it: warnings, uns: unsaved } : null;
      }
      // Dialog „Noch nicht alles ausgefüllt“ (Weiter ausfüllen / Trotzdem zur Liste)
      const leaveDialog = el('dialog', { class: 'dlg' });
      document.body.append(leaveDialog);
      let leaveDialogTarget = null;
      // Tipp neben das Fenster = bleiben
      leaveDialog.addEventListener('click', e => {
        if (e.target === leaveDialog) leaveDialog.close();
      });
      leaveDialog.addEventListener('close', () => {
        if (leaveDialog.returnValue === 'go') {
          closeOrder();
          return;
        }
        const t = leaveDialogTarget && app.querySelector(leaveDialogTarget);
        if (t) t.scrollIntoView({ behavior: 'smooth', block: 'center' }); // zur fehlenden Stelle springen
      });
      // Zeigt die Warnung (ohne <dialog>-Unterstützung per confirm()); „Weiter ausfüllen“ springt zur ersten fehlenden Stelle
      function askBeforeLeaving(info) {
        playErrorSound();
        leaveDialogTarget = info.it[0][1];
        if (typeof leaveDialog.showModal !== 'function') {
          if (
            confirm(
              'Noch nicht alles ausgefüllt:\n– ' +
                info.it.map(x => x[0]).join('\n– ') +
                '\n\nTrotzdem zurück zur Liste?'
            )
          )
            closeOrder();
          return;
        }
        leaveDialog.returnValue = '';
        leaveDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'dlgt' },
            el('div', { class: 'dlg-t', id: 'dlgt' }, 'Noch nicht alles ausgefüllt'),
            el('p', {}, 'Bei diesem Auftrag fehlt noch:'),
            el(
              'ul',
              {},
              info.it.map(([t]) => el('li', {}, t))
            ),
            el(
              'p',
              { class: 'mu' },
              info.uns
                ? 'Nicht gespeicherte Eingaben gehen verloren, wenn du jetzt zurückgehst.'
                : 'Deine bisherigen Eingaben sind gespeichert.'
            ),
            el(
              'div',
              { class: 'ob' },
              el('button', { class: 'sv', onclick: () => leaveDialog.close('stay') }, 'Weiter ausfüllen'),
              el('button', { onclick: () => leaveDialog.close('go') }, 'Trotzdem zur Liste')
            )
          )
        );

        leaveDialog.querySelector('.sv').focus();
      }

      addEventListener('popstate', () => {
        // Zurück-Taste in der Liste einer Auftragsart: zurück zur Startseite (Monteur). Steht der Verlauf noch auf der Liste (state.k),
        // kommt das Ereignis vom Schließen eines Auftrags und die Liste bleibt.
        if (!openOrder) {
          if (viewKind && session.role === 'monteur' && !(history.state && history.state.k)) {
            viewKind = '';
            searchText = '';
            render();
            scrollTo(0, 0);
          }
          return;
        }
        const i = leaveDialog.open ? null : unsavedWarnings();
        // Zurück-Taste/-Geste: erst nachfragen
        if (leaveDialog.open || i) {
          history.pushState({ a: openOrder.auftrag }, '');
          if (i) askBeforeLeaving(i);

      // Esc-Druck den neuen Dialog gleich wieder

          editIndex = null;
          render();
        } else if (armAllOk) {
          armAllOk = false;
          render();
        } else setTimeout(requestBack, 0);
      });
      // Rolle/Team wählen (oder mit null zurück zum Start). Setzt alle Filter und Eingaben zurück, merkt die Wahl im Gerät
      // und startet Abgleich, Vorab-Laden und Push-Anmeldung.
      const switchRole = (role, team) => {
        session = { role, team: team || null };
        if (role === 'monteur' && team && userInfo) {
          userInfo.last = team; // beim nächsten Einstieg gleich wieder dieses Team
          saveUser();
        }
        searchText = '';
        teamFilter = '';
        chatTeam = '';
        viewKind = role === 'dispo' ? 'war' : ''; // Monteur: Startseite mit der Auswahl der Auftragsart, Disponent: Wartung
        deviceTeamFilter = '';
        monteurFilter = 'open';
        reportedFilter = '';
        reportedFrom = '';
        reportedTo = '';
        armMarkAll = false;
        undoInfo = null;
        openOrder = null;
        editIndex = null;
        dispoUnlocked = false;
        dispoToken = '';
        pinInput = '';
        pinError = false;
        uploadToken = '';
        uploadPinInput = '';
        uploadPinError = false;
        uploadPick = {};
        uploadKeep = {};
        deviceList = null;
        deviceRenameId = null;
        deviceLogoutArmed = null;
        saveSession();
        syncLive(); // Live-Verbindung gilt immer nur für Rolle, Team und Anmeldung des Geräts
        render();
        scrollTo(0, 0); // neue Ansicht (Start, Team, Liste) beginnt oben, nicht an der Scroll-Stelle der vorherigen
        poll();
        prefetchChecklists();
        pushSync(false);
      };

      // ---- Standort melden (Monteur-Gerät) ----
      // locating: gerade läuft eine Standortbestimmung · lastLocationAt: Zeitpunkt der letzten Meldung ·
      // lastLocateRound: Abfragerunde, auf die zuletzt geantwortet wurde · locateRoundSeen: Abfragerunde, die der letzte
      // Abgleich gemeldet hat (0 = keine aktiv, null = noch kein Abgleich seit dem App-Start)
      let locating = false,
        lastLocationAt = 0,
        lastLocateRound = 0,
        locateRoundSeen = null;
      /**
       * Meldet den Standort an den Disponenten – aber nur, wenn er danach fragt: Der Server meldet beim Abgleich `locate`,
       * solange der Disponent die Geräteübersicht offen hat. Es antworten nur geöffnete Monteur-Geräte (nicht im
       * Hintergrund), höchstens einmal pro Minute – außer bei einer neuen Abfragerunde. Der Browser fragt den Monteur
       * beim ersten Mal um Erlaubnis; wird sie verweigert, sieht der Disponent „nicht freigegeben“. Löst der Disponent
       * die Abfrage neu aus, während die App läuft, erscheint eine Kurzmeldung (announce); beim App-Start gibt es keine.
       * Es wird nur der jeweils letzte Standort gespeichert.
       */
      function reportLocationIfAsked(round, announce) {
        if (session.role !== 'monteur' || document.hidden) return;
        // eine Abfrage läuft noch (höchstens 30 s lang, dann gilt sie als hängend, siehe watchdog)
        if (locating && Date.now() - lastLocationAt < 30000) return;
        const newRound = round !== lastLocateRound;
        if (!newRound && Date.now() - lastLocationAt < 60000) return;
        locating = true;
        lastLocateRound = round;
        lastLocationAt = Date.now();
        if (announce) toast('📍 Der Disponent hat deinen Standort abgefragt.');
        let watchdog = 0;
        const send = body => {
          clearTimeout(watchdog);
          return api('POST', '/api/devices/location', { did: deviceId, ...body })
            .catch(() => {})
            .finally(() => {
              locating = false;
            });
        };
        // Manche Browser melden gar nichts zurück, wenn die Frage nach der Erlaubnis nur weggewischt wird: dann sieht der
        // Disponent „keine Antwort“ statt ewig nichts, und spätere Abfragen sind nicht blockiert (kommt die Position doch noch, wird sie nachgesendet)
        watchdog = setTimeout(() => send({ error: 'timeout' }), 30000);
        if (!navigator.geolocation) return send({ error: 'unavailable' });
        navigator.geolocation.getCurrentPosition(
          position =>
            send({
              lat: position.coords.latitude,
              lon: position.coords.longitude,
              acc: Math.round(position.coords.accuracy)
            }),
          error =>
            send({ error: error.code === 1 ? 'denied' : error.code === 2 ? 'unavailable' : 'timeout' }),
          { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
        );
      }
      /**
       * Der Disponent hat dieses Gerät in der Geräteübersicht ausgeloggt (der Server meldet das beim Abgleich): zurück zum
       * Startbildschirm. switchRole(null) setzt Anmeldung und Eingaben zurück und meldet dem Server „abgemeldet“ – damit ist
       * die Abmeldung erledigt. Danach kann man sich wieder anmelden.
       */
      function forcedLogout() {
        userToken = '';
        userInfo = null;
        saveUser();
        switchRole(null);
        infoMsg = 'Dieses Gerät wurde vom Disponenten abgemeldet.';
        render();
      }
      // ---- Disposition (Disponent): Gantt-Diagramm ----
      // Reparaturen und Entstörungen muss der Disponent disponieren: Team + Zeitraum (von bis). Erst dann sehen Monteure den Auftrag (Server:
      // POST /api/dispo). Der Tab „Disposition“ zeigt links die noch offenen Aufträge (mit dem Vorschlag aus SAP) und rechts das Diagramm:
      // eine Zeile je Team, die Zeitachse läuft seitlich (Tag: 3 Tage à 48 px je Stunde, Woche: 7 Tage à 14 px je Stunde, Monat: ein Kalendermonat
      // à 36 px je Tag). Die Offen-Liste lässt sich in ein Extra-Fenster auslagern (zwei Bildschirme, siehe „Extra-Fenster für die Offen-Liste“).
      // Bedienung:
      //   · Offen-Liste: „Vorschlag übernehmen“ (SAP-Team und -Termin) oder die Karte antippen → Bearbeiten-Fenster (Team, Beginn, Ende);
      //     mit der Maus lässt sich die Karte auch auf eine Teamzeile ziehen. „Alle Vorschläge übernehmen“ (mit Rückfrage) für alle gelisteten.
      //   · Diagramm: Balken ziehen (Zeit und Team), am rechten Rand die Länge ändern, antippen → Bearbeiten-Fenster. Ist ein Auftrag gewählt,
      //     setzt ein Tipp in eine Zeile den Entwurf dorthin (der Balken ist gestrichelt, gespeichert wird mit „Disponieren“).
      //   · Überschneidungen im selben Team sind erlaubt, werden aber markiert (gelber Rand, Hinweis im Fenster); die Zeile behält ihre Höhe,

       * Scroll-Stelle der Liste in der Seite: render() baut die Liste jedes Mal neu auf – dabei stünde sie wieder oben. Darum merkt sich
       * poolScrollSnap vor dem Neuzeichnen die oberste sichtbare Karte (samt Abstand zum oberen Rand der Liste), poolScrollRestore stellt sie
       * danach wieder an dieselbe Stelle (verschwindet die Karte, gilt die alte Scroll-Stelle). Nach einer Änderung von Filter oder
       * Sortierung (gPoolTop) beginnt die Liste oben.
       */
      function poolScrollSnap() {
        const list = app.querySelector('.gt-pool');
        if (!list || !list.scrollTop) return null;
        const top = list.getBoundingClientRect().top;
        for (const c of list.children) {
          const r = c.getBoundingClientRect();
          if (c.dataset.k && r.bottom > top) return { key: c.dataset.k, off: r.top - top, y: list.scrollTop };
        }
        return { key: '', off: 0, y: list.scrollTop };
      }
      function poolScrollRestore(snap) {
        const list = app.querySelector('.gt-pool');
        if (!list || gPoolTop || !snap) return;
        const n = snap.key && list.querySelector('[data-k="' + snap.key + '"]');
        list.scrollTop = n ? n.getBoundingClientRect().top - list.getBoundingClientRect().top - snap.off : snap.y;
      }
      function ganttPool() {
        const all = poolOrders(),
          shown = poolShown(all),
          withSuggestion = all.filter(suggestSlot),
          inner = el('div', { class: 'gt-pps' });
        inner.append(poolHead(all, withSuggestion), poolFilters());
        if (!all.length) {
          inner.append(poolEmpty());
          poolWatchMore(null, null, false);
        } else {
          const more = shown.length < all.length,
            mark = el('div', { class: 'gt-more', 'aria-hidden': 'true' }),
            list = el('div', { class: 'gt-pool', 'data-list': '1' }, shown.map(o => poolCard(o)));
          if (more) list.append(mark);
          inner.append(list);
          poolWatchMore(list, mark, more);
        }
        // (.gt-pp ist die Zelle im Raster, so hoch wie die Zeile; darin klebt .gt-pps – nur so kann die Liste beim Scrollen mitkleben)
        return el('div', { class: 'gt-pp' }, inner);
      }
      // alle gelisteten Vorschläge auf einmal übernehmen
      function disposeAll(list) {
        gArmAll = false;
        if (gSel && list.some(o => o.auftrag === gSel)) {
          gSel = '';
          gDraft = null;
        }
        dispoSave(
          list.map(o => ({ a: o.auftrag, ...suggestSlot(o) })),
          `${list.length} ${list.length === 1 ? 'Auftrag' : 'Aufträge'} disponiert (Vorschlag aus SAP)`
        );
      }
      // ---- Extra-Fenster für die Offen-Liste (zwei Bildschirme: links die Aufträge, rechts das Diagramm) ----
      // Der Knopf „⧉ Extra-Fenster“ öffnet ein zweites Browserfenster mit der Liste der noch nicht disponierten Aufträge (Auftragsart,
      // Suche, Team, Termin, Zeitraum, „Vorschlag übernehmen“, „Alle Vorschläge übernehmen“, Antippen öffnet das Bearbeiten-Fenster im Hauptfenster; die
      // Liste lädt am Fensterrand von selbst nach, siehe poolWatchMore und ui.io). Das Hauptfenster
      // zeigt dann das Diagramm über die ganze Breite. Das Extra-Fenster ist kein zweites Programm: seinen Inhalt baut das Hauptfenster
      // in dessen Dokument (poolWinSync am Ende von render()), alle Knöpfe laufen in der Seite des Hauptfensters – beide zeigen darum immer
      // denselben Stand, ohne Abgleich. Schließt man das Hauptfenster oder meldet sich ab, schließt das Extra-Fenster mit; schließt man das
      // Extra-Fenster, steht die Liste wieder im Hauptfenster („Liste wieder hier“ tut dasselbe).
      // Karten lassen sich mit dem Ziehen des Browsers (HTML5: dragstart/dragover/drop) auf eine Teamzeile ziehen – das geht über Fenster-
      // und Bildschirmgrenzen hinweg, anders als das Ziehen mit Zeigerereignissen, das an der Fenstergrenze endet.
      // Nur am Rechner: ab 1000 px Breite und mit Maus (am Handy und Tablet gibt es keine zwei Fenster nebeneinander).
      const poolWinSupported = () => typeof window.open === 'function' && innerWidth >= 1000 && matchMedia('(hover: hover)').matches;
      function poolWinReset() {
        clearInterval(gPoolTimer);
        try {
          if (gPoolUi && gPoolUi.io) gPoolUi.io.disconnect();
        } catch (e) {}
        gPoolWin = null;
        gPoolUi = null;
        gPoolDirty = false;
      }
      // Ist das Extra-Fenster noch da (nicht geschlossen und nicht auf eine andere Seite gewechselt)? Sonst wird es vergessen.
      function poolWinAlive() {
        if (gPoolWin) {
          let gone = true;
          try {
            gone = gPoolWin.closed || !gPoolUi || gPoolWin.document !== gPoolUi.doc;
          } catch (e) {}
          if (gone) poolWinReset();
        }
        return !!gPoolWin;
      }
      function openPoolWin() {
        if (poolWinAlive()) return focusPoolWin();
        let w = null;
        try {
          w = window.open('', 'dispo-pool', `popup=yes,width=520,height=${Math.max(480, Math.min(860, (screen.availHeight || 940) - 80))}`);
        } catch (e) {}
        if (!w) {
          errorMsg = 'Das Extra-Fenster wurde vom Browser blockiert – bitte Pop-ups für diese Seite erlauben.';
          render();
          return;
        }
        try {
          poolWinBuild(w);
        } catch (e) {
          try {
            w.close();
          } catch (x) {}
          poolWinReset();
          errorMsg = 'Das Extra-Fenster lässt sich nicht öffnen.';
          render();
          return;
        }
        // (schließt jemand das Fenster, steht die Liste gleich wieder im Hauptfenster)
        w.addEventListener('pagehide', () =>
          setTimeout(() => {
            if (gPoolWin === w && !poolWinAlive()) render();
          }, 120)
        );
        gPoolTimer = setInterval(() => {
          if (!poolWinAlive()) render();
        }, 1000);
        render();
      }
      function focusPoolWin() {
        try {
          gPoolWin.focus();
        } catch (e) {}
      }
      function closePoolWin(redraw = true) {
        const w = gPoolWin;
        poolWinReset();
        try {
          if (w) w.close();
        } catch (e) {}
        if (redraw) render();
      }
      addEventListener('pagehide', () => closePoolWin(false));
      // Baut das leere Gerüst im neuen Fenster: Dokument mit Doctype (sonst Quirks-Modus), die Stile der Seite, Kopf mit Suche, Liste
      function poolWinBuild(w) {
        const d = w.document;
        d.open();
        d.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><base href="${location.origin}/"><title>Offene Aufträge – Disposition</title></head><body class="gtw"></body></html>`);
        d.close();
        for (const st of document.querySelectorAll('head style')) d.head.append(d.importNode(st, true));
        d.head.append(el('link', { rel: 'icon', href: '/icon-192.png' }));
        const ui = {
          doc: d,
          ph: el('div', { class: 'gtw-ph' }),
          chips: el('div', { class: 'gtw-chips' }),
          search: poolSearch(),
          filters: poolFilters(),
          list: el('div', { class: 'gt-pool', 'data-list': '1' }),
          more: el('div', { class: 'gtw-more' }),
          mark: el('div', { class: 'gt-more', 'aria-hidden': 'true' }),
          // (die Marke am Ende der Liste gehört zum Fenster: ihr Beobachter muss aus dem Fenster stammen, sonst misst er das Hauptfenster)
          io: typeof w.IntersectionObserver === 'function' ? new w.IntersectionObserver(entries => entries.some(e => e.isIntersecting) && poolLoadMore(), { rootMargin: '0px 0px 600px 0px' }) : null,
          toast: el('div', { class: 'gtw-toast', role: 'status' })
        };
        if (ui.io) ui.io.observe(ui.mark);
        d.body.append(el('div', { class: 'gtw-top' }, ui.ph, ui.chips, ui.search, ui.filters), el('div', { class: 'gtw-body' }, ui.list, ui.more), ui.toast);
        gPoolUi = ui;
        gPoolWin = w;
        poolWinSync();
      }
      // Gleicht das Extra-Fenster mit dem Stand ab (am Ende von render()). Karten, die sich nicht geändert haben, bleiben als Element
      // stehen (laufende Animationen, Fokus); Suchfeld und Kopf bleiben, nur ihr Inhalt wird ersetzt; verschwundene Karten gleiten aus,
      // die übrigen rücken weich nach (wie in der Seite, siehe animateRemoved).
      function poolWinSync() {
        if (!gPoolWin || !poolWinAlive()) return;
        if (session.role !== 'dispo' || !dispoUnlocked) return closePoolWin(false);
        // Zieht gerade jemand eine Karte aus dem Fenster, darf die Karte nicht ersetzt werden (das Ziehen bräche ab): erst danach
        if (gDrag && gDrag.native) {
          gPoolDirty = true;
          return;
        }
        gPoolDirty = false;
        const ui = gPoolUi,
          d = ui.doc,
          root = document.documentElement,
          all = poolOrders(),
          shown = ui.io ? all.slice(0, gPoolMax) : all,
          withSuggestion = all.filter(suggestSlot),
          snap = snapshotList(d.body);
        d.documentElement.className = root.className;
        if (root.dataset.theme) d.documentElement.dataset.theme = root.dataset.theme;
        else delete d.documentElement.dataset.theme;
        d.title = (all.length ? `(${all.length}) ` : '') + 'Offene Aufträge – Disposition';
        ui.ph.replaceChildren(poolHead(all, withSuggestion));
        ui.chips.replaceChildren(dispatchKindChips());
        if (ui.search.value !== gSearch) ui.search.value = gSearch;
        poolFiltersFill(ui.filters);
        const old = new Map([...ui.list.children].filter(n => n.dataset.k).map(n => [n.dataset.k, n]));
        const cards = shown.map(o => {
          const card = poolCard(o, true),
            prev = old.get(card.dataset.k);
          return prev && prev.outerHTML === card.outerHTML ? prev : card;
        });
        ui.list.replaceChildren(...(all.length ? cards : [poolEmpty()]));
        // Die Marke steht nur, solange noch Karten fehlen. Auch wenn sie stehen bleibt, schaut der Beobachter neu hin (unobserve/observe):
        // ist das Fenster höher als die geladenen Karten, kommt gleich die nächste Portion, bis es gefüllt ist.
        const hasMore = shown.length < all.length;
        ui.more.replaceChildren(...(hasMore ? [ui.mark] : []));
        if (ui.io) {
          ui.io.unobserve(ui.mark);
          if (hasMore) ui.io.observe(ui.mark);
        }
        if (gPoolTop) gPoolWin.scrollTo(0, 0);
        animateRemoved(snap, true, d.body);
        // Hinweis unten (fest, ohne Einfluss auf die Liste): Fehler oder „Rückgängig“ der letzten Disposition
        const note = errorMsg ? { t: errorMsg, er: true } : gUndo ? { t: gUndo.txt } : null;
        if (note && ui.toast.dataset.t !== note.t) {
          ui.toast.dataset.t = note.t;
          ui.toast.replaceChildren(el('span', {}, note.t), !note.er && el('button', { onclick: undoDispo }, 'Rückgängig'));
        }
        ui.toast.className = 'gtw-toast' + (note ? ' on' : '') + (note && note.er ? ' er' : '');
        if (!note) delete ui.toast.dataset.t;
      }

      // ---- Details-Fenster: Doppelklick auf einen Auftrag (Karte der Offen-Liste, Balken im Diagramm) oder „ⓘ“ im Bearbeiten-Fenster ----
      // Öffnet ein eigenes Browserfenster mit allem zum Auftrag: Auftragsdaten, Disposition (Team, Zeitraum, Überschneidung, SAP-Termin und
      // -Team), Zeitrückmeldung, Meldungen, externe Firmen. Es ist EIN Fenster für alle Aufträge (ein weiterer Doppelklick zeigt den nächsten
      // darin) und wie das Extra-Fenster kein zweites Programm: das Hauptfenster baut den Inhalt in dessen Dokument (infoWinSync am Ende von
      // render()), es bleibt also aktuell (Disposition, Zeitrückmeldung, Meldungen, Dunkelmodus). Es ist nur zum Ansehen; „Im Diagramm
      // bearbeiten“ holt den Auftrag ins Bearbeiten-Fenster des Hauptfensters. Der Zweite Klick eines Doppelklicks wählt den Auftrag nur aus
      // (sonst schlösse er das Bearbeiten-Fenster, das der erste Klick geöffnet hat).
      function infoWinReset() {
        gInfoWin = null;
        gInfoUi = null;
      }
      // Ist das Fenster noch da (nicht geschlossen und nicht auf eine andere Seite gewechselt)? Sonst wird es vergessen.
      function infoWinAlive() {
        if (gInfoWin) {
          let gone = true;
          try {
            gone = gInfoWin.closed || !gInfoUi || gInfoWin.document !== gInfoUi.doc;
          } catch (e) {}
          if (gone) infoWinReset();
        }
        return !!gInfoWin;
      }
      function closeInfoWin() {
        const w = gInfoWin;
        infoWinReset();
        try {
          if (w) w.close();
        } catch (e) {}
      }
      addEventListener('pagehide', closeInfoWin);
      // ev: das auslösende Ereignis – das Fenster muss von dem Fenster aus geöffnet werden, in dem geklickt wurde (Extra-Fenster oder Hauptfenster),
      // sonst hält der Browser es für ein Pop-up ohne Anlass und blockt es
      function openInfoWin(a, ev) {
        if (!ordersMap.get(a)) return;
        gInfoA = a;
        if (infoWinAlive()) {
          infoWinSync();
          try {
            gInfoWin.focus();
          } catch (e) {}
          return;
        }
        let w = null;
        try {
          w = ((ev && ev.view && typeof ev.view.open === 'function' ? ev.view : window)).open('', 'dispo-auftrag', `popup=yes,width=600,height=${Math.max(480, Math.min(860, (screen.availHeight || 940) - 80))}`);
        } catch (e) {}
        if (!w) {
          errorMsg = 'Das Fenster wurde vom Browser blockiert – bitte Pop-ups für diese Seite erlauben.';
          render();
          return;
        }
        try {
          infoWinBuild(w);
        } catch (e) {
          try {
            w.close();
          } catch (x) {}
          infoWinReset();
          errorMsg = 'Das Fenster lässt sich nicht öffnen.';
          render();
        }
      }
      // Baut das Gerüst im neuen Fenster: Dokument mit Doctype (sonst Quirks-Modus), die Stile der Seite, der Inhalt kommt aus infoWinSync
      function infoWinBuild(w) {
        const d = w.document;
        d.open();
        d.write(`<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><base href="${location.origin}/"><title>Auftrag – Disposition</title></head><body class="giw"></body></html>`);
        d.close();
        for (const st of document.querySelectorAll('head style')) d.head.append(d.importNode(st, true));
        d.head.append(el('link', { rel: 'icon', href: '/icon-192.png' }));
        const main = el('main', { class: 'giw-main' });
        d.body.append(main);
        d.addEventListener('keydown', e => e.key === 'Escape' && closeInfoWin());
        gInfoUi = { doc: d, main, html: '' };
        gInfoWin = w;
        infoWinSync();
      }
      // Inhalt des Fensters zu einem Auftrag (nur rep/ent können hier vorkommen, sie haben keine Prüfobjekte)
      function infoWinContent(o) {
        const a = o.auftrag,
          kind = orderKind(o),
          sap = sapOf(o),
          slot = slotOf(o),
          sug = suggestSlot(o),
          clash = slot ? overlapsOf(slot, a) : [],
          edit = () => {
            if (dispoTab !== 'di') dispoTab = 'di';
            if (gSel !== a) selectOrder(a);
            else render();
            try {
              window.focus();
            } catch (e) {}
          },
          info = orderCard(o, true, false),
          dispo = el(
            'div',
            { class: 'card', 'data-k': 'gi-dis' },
            el('b', {}, 'Disposition'),
            slot
              ? el('p', {}, el('span', { class: 'tag st-ok' }, 'disponiert'), ` ${slot.team} · ${slotText(slot)} (${durationText(minutesBetween(slot.von, slot.bis))})`)
              : el('p', {}, el('span', { class: 'tag st-zf' }, 'noch offen'), ' Monteure sehen den Auftrag erst, wenn er disponiert ist.'),
            clash.length > 0 && el('p', { class: 'mu er' }, `⚠ Überschneidet sich bei ${slot.team} mit ${clash.map(orderLabel).join(', ')}`),
            el('p', { class: 'mu' }, `SAP: ${sap.team} · ${isoOfDate(sap.start) ? termText({ start: sap.start, ende: sap.ende, uhr: sap.uhr, uhr2: sap.uhr2 }) : 'kein Termin'}${o.arb ? ` · ${o.arb} Std geplant` : ''}`),
            !slot && sug && el('p', { class: 'mu' }, `Vorschlag aus SAP: ${sug.team}, ${slotText(sug)}`)
          );
        return el(
          'div',
          { class: 'giw-in' },
          el('div', { class: 'bar' }, el('h1', {}, `${kindInfo(kind).icon} ${kindInfo(kind).name} ${orderLabel(o)}`), el('button', { onclick: edit }, 'Im Diagramm bearbeiten')),
          info,
          dispo,
          timeCard(o, false),
          !!(meldungenOf(o).length || o.mel) && meldungCard(o)
        );
      }
      // Gleicht das Fenster mit dem Stand ab (am Ende von render()); ein unveränderter Inhalt wird nicht angefasst, sonst bleibt die Scroll-Stelle
      function infoWinSync() {
        if (!gInfoWin || !infoWinAlive()) return;
        if (session.role !== 'dispo' || !dispoUnlocked) return closeInfoWin();
        const ui = gInfoUi,
          d = ui.doc,
          root = document.documentElement,
          o = ordersMap.get(gInfoA),
          content = o
            ? infoWinContent(o)
            : el('div', { class: 'giw-in' }, el('div', { class: 'card' }, el('b', {}, 'Auftrag ' + gInfoA), el('p', { class: 'mu' }, 'Diesen Auftrag gibt es nicht (mehr).')));
        d.documentElement.className = root.className;
        if (root.dataset.theme) d.documentElement.dataset.theme = root.dataset.theme;
        else delete d.documentElement.dataset.theme;
        d.title = (o ? `${kindInfo(orderKind(o)).name} ${orderLabel(o)}` : 'Auftrag ' + gInfoA) + ' – Disposition';
        const html = content.outerHTML;
        if (html === ui.html) return;
        const w = gInfoWin,
          sy = w.scrollY;
        ui.html = html;
        ui.main.replaceChildren(content);
        w.scrollTo(0, ui.shown === gInfoA ? sy : 0); // (anderer Auftrag: wieder oben)
        ui.shown = gInfoA;
      }

      // ---- Karte aus dem Extra-Fenster in das Diagramm ziehen (HTML5-Ziehen, auch auf einen anderen Bildschirm) ----
      // Während des Ziehens ist gDrag = { a, native: true }: Live-Änderungen warten, das Extra-Fenster zeichnet nicht neu.
      function startNativeDrag(e, o) {
        gDrag = { a: o.auftrag, native: true };
        e.dataTransfer.setData('text/plain', o.auftrag);
        e.dataTransfer.effectAllowed = 'move';
      }
      function endNativeDrag() {
        if (!gDrag || !gDrag.native) return;
        gDrag = null;
        gDragEnd = performance.now();
        nativeDropClear();
        poolWinSync();
        if (liveDirty) renderLive();
      }
      // Zeitraum, den die gezogene Karte an dieser Stelle bekäme (Beginn = Stelle des Zeigers, Dauer aus SAP), samt Auftrag; sonst null
      function nativeSlot(team, clientX) {
        const o = gDrag && gDrag.native && ordersMap.get(gDrag.a);
        if (!o || o.dis || !gGeo) return null;
        const sug = suggestSlot(o),
          von = snapStart(gGeo, laneTime(clientX), sug ? sug.von.slice(11) : '07:00');
        return { o, slot: { team, von, bis: addMinutes(von, sug ? minutesBetween(sug.von, sug.bis) : G_DEFAULT_MIN) } };
      }
      function nativeDropClear() {
        document.querySelectorAll('.gt-row.tgt, .gt-name.tgt').forEach(n => n.classList.remove('tgt'));
        if (gTip) gTip.remove();
        gTip = null;
      }
      function nativeDragOver(e, team) {
        const hit = nativeSlot(team, e.clientX);
        if (!hit) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const i = gGeo.teams.indexOf(team);
        document.querySelectorAll('.gt-row.tgt, .gt-name.tgt').forEach(n => n.classList.remove('tgt'));
        const rows = app.querySelectorAll('.gt-row'),
          names = app.querySelectorAll('.gt-name');
        if (rows[i]) rows[i].classList.add('tgt');
        if (names[i]) names[i].classList.add('tgt');
        if (!gTip) {
          gTip = el('div', { class: 'gt-tip' });
          document.body.append(gTip);
        }
        gTip.textContent = `${hit.slot.team} · ${slotText(hit.slot)} (${durationText(minutesBetween(hit.slot.von, hit.slot.bis))})`;
        gTip.style.transform = `translate(${Math.min(e.clientX + 14, innerWidth - gTip.offsetWidth - 8)}px, ${Math.max(8, e.clientY - 38)}px)`;
        // am Rand scrollt die Zeitachse weiter (das Ereignis kommt etwa alle 50 ms, auch wenn die Maus stillsteht)
        const scroller = app.querySelector('.gt-scroll'),
          r = scroller.getBoundingClientRect();
        if (e.clientX < r.left + 40) scroller.scrollLeft -= 14;
        else if (e.clientX > r.right - 40) scroller.scrollLeft += 14;
      }
      function nativeDrop(e, team) {
        const hit = nativeSlot(team, e.clientX);
        nativeDropClear();
        if (!hit) return;
        e.preventDefault();
        if (gSel === hit.o.auftrag) {
          gSel = '';
          gDraft = null;
        }
        dispoSave([{ a: hit.o.auftrag, ...hit.slot }], `${hit.o.auftrag} → ${hit.slot.team}, ${slotText(hit.slot)}`);
        // (das Ende des Ziehens meldet die Karte selbst; fehlt es aus irgendeinem Grund, wird hier aufgeräumt)
        setTimeout(endNativeDrag, 800);
      }

      // Auswahl der Auftragsart (Alle / Reparaturen / Entstörungen) mit Zahlen – im Hauptfenster und im Extra-Fenster
      function dispatchKindChips() {
        const all = allOrders().filter(o => isDispatchKind(orderKind(o))),
          count = k => all.filter(o => orderKind(o) === k).length;
        return el(
          'div',
          { class: 'chips ksw' },
          [['', 'Alle', all.length], ...['rep', 'ent'].map(k => [k, `${kindInfo(k).icon} ${kindInfo(k).plural}`, count(k)])].map(([k, l, n]) =>
            el(
              'button',
              {
                class: 'chip' + (gKind === k ? ' on' : ''),
                onclick: () => {
                  gKind = k;
                  poolReset();
                  render();
                }
              },
              `${l} (${n})`
            )
          )
        );
      }
      // Suchfeld der Offen-Liste
      const poolSearch = () =>
        el('input', {
          type: 'search',
          'data-keep': 'gs',
          placeholder: 'Offene suchen (Auftrag, Kurztext, Straße …)',
          value: gSearch,
          oninput: e => {
            gSearch = e.target.value;
            poolReset();
            render();
          }
        });
      function drawDispoPlan() {
        if (!dataReady) {
          app.append(skeletonPage());
          return;
        }
        // Liste im Extra-Fenster? Dann nimmt das Diagramm die ganze Breite, und Suche und Knöpfe der Liste stehen im Extra-Fenster
        const solo = poolWinAlive();
        app.append(
          el(
            'div',
            { class: 'gtb', 'data-k': 'gtb' },
            dispatchKindChips(),
            // (die Zeile ist mit und ohne Extra-Fenster gleich hoch: nichts darunter springt)
            el(
              'div',
              { class: 'tools gtt' },
              solo
                ? [
                    el('span', { class: 'gtt-note mu' }, '⧉ Die Offen-Liste steht im Extra-Fenster'),
                    el('button', { onclick: focusPoolWin }, 'Nach vorn'),
                    el('button', { onclick: closePoolWin }, 'Liste wieder hier')
                  ]
                : [
                    poolSearch(),
                    poolWinSupported() &&
                      el('button', { class: 'gtt-pop', title: 'Die Liste der offenen Aufträge in einem eigenen Fenster öffnen – z. B. auf einem zweiten Bildschirm neben dem Diagramm', onclick: openPoolWin }, '⧉ Extra-Fenster')
                  ]
            )
          ),

            solo ? null : ganttPool(),

        const sheet = gtSheet();
        if (sheet) app.append(sheet);

          if (gFull) card.querySelector('.gt-wrap').scrollTop = gWrapY;

          lastTapCtl = !n && control && app.contains(control) ? controlKey(control) : null;

            lastTapKey = null;
            lastTapCtl = null;

      const controlText = c =>

          fixedPane = pane && getComputedStyle(pane).position === 'sticky' ? pane : null,
          // (ebenso alles im Chat: Teamliste und Verlauf rollen in sich, die Seite steht)

          control = tappedNode && still(tappedNode) ? null : tappedNode;

        viewKey = null,

        // Disponent: Übersicht/Auftrag. Wechselt der Disponent nur die Auftragsart oder den Tab, bleiben Kopfzeile, Tab-Leiste und
        // Umschalter stehen und nur der Inhalt blendet ein.
        const monteurKind = session.role === 'monteur' && !openOrder ? viewKind : '',
          shell = openOrder ? 'o' : [session.role, session.team, dispoUnlocked, monteurKind].join('|'),
          key =
            openOrder
              ? 'o'
              : shell +
                '|' +
                (session.role === 'dispo'
                  ? // (Disposition: steht die Offen-Liste im Extra-Fenster, hat das Diagramm eine andere Breite – das ist eine eigene Ansicht;

                    dispoTab + '|' + (dispoTab === 'ue' ? viewKind : '') + (dispoTab === 'di' && poolWinAlive() ? 'solo' : '') + (dispoTab === 'di' && gFull ? 'full' : '') +

      /**

            const z = valid && (result.nok || []).find(z => z && z.i === i);
            return (z && z.m) || '';
          };
          checklistCard.append(
            el(
              'p',
              { class: 'mu', 'data-k': 'ps' },
              `${okCount} OK · ${nokCount} Nicht OK · ${count - okCount - nokCount} offen`
            )
          );
          if (result && !valid)
            checklistCard.append(
              el(
                'p',
                { class: 'mu er' },
                'Die Prüfliste hat sich seit der letzten Bewertung geändert – bitte neu prüfen.'
              )
            );
          // „Alles OK“ setzt nur offene Prüfobjekte auf OK – Nicht OK (samt Text) bleibt erhalten
          const openCount = count - okCount - nokCount;
          // immer zweite Bestätigung; Klicks in den ersten 250 ms nach dem ersten zählen nicht (versehentlicher Doppel-Tipp)
          if (isMonteur && !locked && openCount > 0)
            checklistCard.append(
              !armAllOk
                ? el(
                    'button',
                    {
                      class: 'allok',
                      'data-k': 'aok',
                      onclick: () => {
                        armAllOk = Date.now();
                        editIndex = null;
                        render();
                      }
                    },
                    okCount + nokCount > 0 ? `✓ Alle offenen OK (${openCount})` : '✓ Alles OK'
                  )
                : el(
                    'div',
                    { class: 'cfm', 'data-k': 'aok' },
                    el(
                      'b',
                      {},
                      openCount === count
                        ? `Wirklich alle ${count} Prüfobjekte OK?`
                        : `Wirklich alle ${openCount} restlichen Prüfobjekte OK?`
                    ),
                    nokCount > 0 && el('div', { class: 'mu' }, `${nokCount}× Nicht OK bleibt erhalten.`),
                    el(
                      'div',
                      { class: 'ob' },
                      el(
                        'button',
                        {
                          class: 'yes',
                          onclick: () => {
                            if (Date.now() - armAllOk < 250) return;
                            armAllOk = false;
                            const c = currentChecklistState(order.auftrag, items);
                            saveChecklistState(order, items, c.s.replace(/-/g, 'o'), c.T);
                          }
                        },
                        'Ja, alle OK'
                      ),
                      el(
                        'button',
                        {
                          onclick: () => {
                            armAllOk = false;
                            render();
                          }
                        },
                        'Abbrechen'
                      )
                    )
                  )
            );
          items.forEach((t, i) => {
            const c = state[i],
              m = nokTextOf(i);
            const nokBox =
              c === 'x' ? el('div', { class: 'nokbox' }, el('b', {}, 'Nicht OK: '), m || '–') : null;
            if (!isMonteur) {
              checklistCard.append(
                el(
                  'div',
                  { class: 'li', 'data-k': 'i' + i },
                  el('span', { class: 'mk' }, c === 'o' ? '✓' : c === 'x' ? '✗' : '○'),
                  t,
                  nokBox
                )
              );
              return;
            }
            checklistCard.append(
              el(
                'div',
                { class: 'it', 'data-k': 'i' + i, 'data-op': c === '-' ? '1' : null },
                el(
                  'div',
                  { class: 't' },
                  humanizeChecklistText(t),
                  humanizeChecklistText(t) !== t && el('div', { class: 'orig' }, t)
                ),
                el(
                  'div',
                  { class: 'ob' },
                  el(
                    'button',
                    {
                      class: 'ok' + (c === 'o' ? ' on' : ''),
                      disabled: locked ? 'disabled' : null,
                      onclick: () => toggleOk(order, items, i)
                    },
                    'OK'
                  ),
                  el(
                    'button',
                    {
                      class: 'nk' + (c === 'x' ? ' on' : ''),
                      disabled: locked ? 'disabled' : null,
                      onclick: () => openNokEditor(i, m)
                    },
                    'Nicht OK'
                  )
                ),
                editIndex === i && !locked
                  ? el(
                      'div',
                      { class: 'ed' },
                      el('textarea', {
                        rows: '3',
                        maxlength: '300',
                        'data-keep': 'e',
                        placeholder: 'Was ist nicht OK? (Pflichtfeld)',
                        oninput: e => {
                          editText = e.target.value;
                        },
                        value: editText
                      }),
                      editTextMissing &&
                        el('p', { class: 'mu er' }, 'Bitte Text eingeben, was nicht OK ist.'),
                      el(
                        'div',
                        { class: 'ob' },
                        el(
                          'button',
                          { class: 'sv', onclick: () => saveNokText(order, items, i) },
                          'Speichern'
                        ),
                        el(
                          'button',
                          {
                            onclick: () => {
                              editIndex = null;
                              render();
                            }
                          },
                          'Abbrechen'
                        ),
                        c === 'x' &&
                          el(
                            'button',
                            { class: 'er', onclick: () => resetItem(order, items, i) },
                            'Zurücksetzen'
                          )
                      )
                    )
                  : nokBox
              )
            );
          });
        }
        detail.append(checklistCard);
      }

      // Startseite: „Ich bin Monteur“ / „Ich bin Disponent“
      function drawRoleChoice() {
        app.append(
          el('h1', {}, 'Heiz-Hawara'),
          el(
            'button',
            {
              class: 'big',
              onclick: () => {
                // angemeldet: gleich weiter (zuletzt gewähltes Team), sonst zur Anmeldung
                switchRole(
                  'monteur',
                  userToken && userInfo ? (userInfo.lock ? null : userInfo.last) || userInfo.team || undefined : undefined
                );
                const n = app.querySelector('[data-keep="lu"]');
                if (n) n.focus();
              }
            },
            '🔧 Ich bin Monteur'
          ),
          el(
            'button',
            {
              class: 'big',
              onclick: () => {
                switchRole('dispo');
                const n = app.querySelector('[data-keep="p"]');
                if (n) n.focus();
              }
            },
            '📋 Ich bin Disponent'
          ),
          ...(userToken && userInfo
            ? [
                el(
                  'p',
                  { class: 'mu' },
                  `👤 Angemeldet als ${userInfo.name} (${userInfo.sap}) · `,
                  el('button', { class: 'lk', onclick: userLogout }, 'Abmelden')
                )
              ]
            : [])
        );
      }

      // Browser-Autofill (Passwortmanager) füllt die Felder oft ohne input-Ereignis: loginUser/loginPass bleiben dann leer, und
      // jedes Neuzeichnen würde die ausgefüllten Felder wieder leeren. Darum die Werte direkt aus den Feldern übernehmen
      // (beim Absenden und in render() vor dem Neuzeichnen).
      function syncLoginFields() {
        const u = document.getElementById('lgu'),
          p = document.getElementById('lgp');
        if (u) loginUser = u.value;
        if (p) loginPass = p.value;
      }
      // Passwort leeren – auch im Feld, sonst holt syncLoginFields() es beim nächsten Neuzeichnen zurück
      function clearLoginPass() {
        loginPass = '';
        const p = document.getElementById('lgp');
        if (p) p.value = '';
      }

      // Anmeldung der Monteure: SAP-User + Passwort (POST /api/user/login). Danach wird das Team aus der Benutzerverwaltung gewählt.
      function drawMonteurLogin(back) {
        const submit = async () => {
          syncLoginFields();
          const user = loginUser.trim(),
            password = loginPass;
          if (loginBusy) return;
          if (!user || !password) {
            loginError = 'Bitte SAP-User und Passwort eingeben.';
            render();
            return;
          }
          loginBusy = true;
          loginError = '';
          render();
          try {
            const r = await api('POST', '/api/user/login', { user, password, did: deviceId });
            userToken = r.token;
            // erneute Anmeldung desselben Benutzers (abgelaufen): beim zuletzt gewählten Team bleiben, sonst Team laut Benutzerverwaltung
            const last = userInfo && userInfo.sap === r.user.sap ? userInfo.last : null;
            userInfo = { sap: r.user.sap, name: r.user.name, team: r.user.team, lock: !!r.user.lock, last };
            saveUser();
            clearLoginPass();
            loginBusy = false;
            authAt = Date.now();
            infoMsg = ''; // z. B. „Dieses Gerät wurde vom Disponenten abgemeldet.“ gilt nach der Anmeldung nicht mehr
            switchRole('monteur', (r.user.lock ? null : last) || r.user.team || undefined);
          } catch (e) {
            loginBusy = false;
            clearLoginPass();
            loginError = e.net ? 'Keine Verbindung zum Server' : e.message || 'Anmeldung fehlgeschlagen.';
            render();
            const n = app.querySelector('[data-keep="lp"]');
            if (n) n.focus();
          }
        };
        app.append(
          el('div', { class: 'bar' }, el('h1', {}, 'Anmelden'), back),
          el(
            'form',
            {
              class: 'card lgn',
              onsubmit: e => {
                e.preventDefault();
                submit();
              }
            },
            el('b', {}, 'Monteur-Anmeldung'),
            el('label', { for: 'lgu' }, 'SAP-User'),
            el('input', {
              id: 'lgu',
              type: 'text',
              name: 'username',
              autocomplete: 'username',
              autocapitalize: 'characters',
              autocorrect: 'off',
              spellcheck: 'false',
              maxlength: '20',
              'data-keep': 'lu',
              value: loginUser || (userInfo && userInfo.sap) || '',
              oninput: e => {
                loginUser = e.target.value;
              }
            }),
            el('label', { for: 'lgp' }, 'Passwort'),
            el('input', {
              id: 'lgp',
              type: 'password',
              name: 'password',
              autocomplete: 'current-password',
              maxlength: '100',
              'data-keep': 'lp',
              value: loginPass,
              oninput: e => {
                loginPass = e.target.value;
              }
            }),
            loginError && el('p', { class: 'mu er' }, loginError),
            el('button', { class: 'pri', type: 'submit', disabled: loginBusy ? 'disabled' : null }, loginBusy ? 'Anmelden …' : 'Anmelden')
          )
        );
      }
      // Monteur abmelden: Token weg, Gerät nicht mehr dem Benutzer zugeordnet, zurück zum Start
      function userLogout() {
        userToken = '';
        userInfo = null;
        saveUser();
        clearLoginPass();
        loginError = '';
        switchRole(null);
      }

      // PIN-Eingabe des Disponenten (POST /api/login, automatisch nach der 4. Ziffer)
      function drawDispoLogin(back) {
        const checkPin = async () => {
          const pin = pinInput;
          pinInput = '';
          try {
            dispoToken = (await api('POST', '/api/login', { pin: pin, did: deviceId })).token;
            authAt = Date.now();
            dispoUnlocked = true;
            pinError = false;
            pushSync(false);
            poll(); // der Gesamtstand ist erst nach der PIN-Eingabe abrufbar
          } catch (e) {
            pinError = e.net ? 'Keine Verbindung zum Server' : e.message || 'Falscher PIN';
          }
          render();
        };
        app.append(
          el('div', { class: 'bar' }, el('h1', {}, 'Disponent'), back),
          el(
            'div',
            { class: 'card' },
            el('b', {}, 'PIN eingeben'),
            el('input', {
              type: 'password',
              inputmode: 'numeric',
              autocomplete: 'off',
              maxlength: '4',
              'data-keep': 'p',
              placeholder: '••••',
              value: pinInput,
              oninput: e => {
                pinInput = e.target.value.replace(/\D/g, '');
                if (pinInput.length === 4) checkPin();
              }
            }),
            pinError &&
              el('p', { class: 'mu er' }, typeof pinError === 'string' ? pinError : 'Falscher PIN.'),
            el('button', { class: 'pri', onclick: checkPin }, 'Weiter')
          )
        );
      }

      // Monteur: Team auswählen
      function drawTeamPicker(back, missingTeam) {
        app.append(el('div', { class: 'bar' }, el('h1', {}, 'Dein Team'), back));
        if (missingTeam)
          app.append(
            el('p', { class: 'mu' }, `Für „${missingTeam}“ gibt es derzeit keine Aufträge. Bitte wähle ein Team.`)
          );
        const teamEntries = teamCounts();
        if (!dataReady) app.append(skeletonButtons(4));
        else if (!teamEntries.length)
          app.append(el('p', { class: 'mu' }, 'Noch keine Aufträge hochgeladen.'));
        if (teamEntries.length)
          app.append(
            el(
              'div',
              { class: 'tgrid' },
              teamEntries.map(([t, n]) =>
                el(
                  'button',
                  { class: 'big', onclick: () => switchRole('monteur', t) },
                  t,
                  el('span', { class: 'mu' }, `  · ${n} Aufträge`)
                )
              )
            )
          );
      }

      // Auftragsart öffnen / zurück zur Startseite (Monteur). Die Zurück-Taste des Geräts führt von der Liste zur Startseite.
      const openKind = k => {
        viewKind = k;
        monteurFilter = 'open';
        searchText = '';
        if (!(history.state && (history.state.k || history.state.a))) history.pushState({ k: 1 }, '');
        render();
        scrollTo(0, 0);
      };
      const closeKind = () => {
        viewKind = '';
        searchText = '';
        render();
        scrollTo(0, 0);
        if (history.state && history.state.k) history.back();
      };
      // offene / gesamte Aufträge je Auftragsart eines Teams (Meldungen: ohne Auftrag)
      const kindCounts = teamRows => {
        const out = {};
        for (const { k } of KINDS) {
          if (k === 'mel') {
            const n = freeMeldungen(session.team).length;
            out[k] = { n, open: n, today: 0 };
            continue;
          }
          const list = ordersOfKind(teamRows, k);
          // Wartungen zählen offene Aufträge; Reparatur und Entstörung zählen, was heute ansteht (nur Offenes: die Liste zeigt zuerst „Offen“)
          out[k] = {
            n: list.length,
            open: k === 'war' ? list.filter(r => !isFinished(r)).length : list.length,
            today: isTimedKind(k) ? list.filter(r => isoOfDate(r.start) === today() && !isFinished(r)).length : 0,
            late: isTimedKind(k) ? list.filter(lateInfo).length : 0
          };
        }
        return out;
      };
      // Startseite des Monteurs: eine große Fläche je Auftragsart mit der Zahl offener Aufträge (Reparatur/Entstörung: auch „heute“)
      function drawKindHome(counts) {
        app.append(
          el('p', { class: 'mu kh' }, 'Welche Aufträge möchtest du sehen?'),
          el(
            'div',
            { class: 'tgrid kinds' },
            KINDS.map(({ k, plural, icon, note }) => {
              const c = counts[k];
              return el(
                'button',
                { class: 'big kind', 'data-k': 'kd-' + k, onclick: () => openKind(k) },
                el('span', { class: 'ki' }, icon),
                el(
                  'span',
                  { class: 'kb' },
                  el('span', { class: 'kn' }, plural),
                  el(
                    'span',
                    { class: 'mu' },
                    k === 'mel'
                      ? c.n
                        ? `${c.n} ohne Auftrag`
                        : 'Keine offenen Meldungen'
                      : c.n
                        ? k === 'war'
                        ? `${c.open} offen · ${c.n} gesamt`
                        : c.n === 1
                          ? '1 Auftrag'
                          : `${c.n} Aufträge`
                        : 'Keine Aufträge'
                  ),
                  el('span', { class: 'mu sm' }, note)
                ),
                (c.today > 0 || c.late > 0) &&
                  el(
                    'span',
                    { class: 'ktags' },
                    c.late > 0 && el('span', { class: 'tag st-nok' }, `⏰ ${c.late} im Verzug`),
                    c.today > 0 && el('span', { class: 'tag st-zf' }, `📅 ${c.today} heute`)
                  )
              );
            }),
            chatTile()
          )
        );
      }
      // Meldungen ohne Auftrag (Schäden, noch nicht verknüpft): neueste zuerst. showTeam: Team auf der Karte (Disponent)
      function meldungList(items, showTeam) {
        const filtered = items
            .filter(matchesSearchMeldung)
            .sort((a, b) => (isoOfDate(b.dat) || '').localeCompare(isoOfDate(a.dat) || '') || naturalCompare(b.nr, a.nr)),
          shown = filtered.slice(0, LIST_MAX),
          container = el('div', {});
        container.append(
          el('p', { class: 'mu cnt' }, filtered.length === 1 ? '1 Meldung' : `${filtered.length} Meldungen`),
          el('div', { class: 'grid', 'data-list': '1' }, shown.map(m => meldungCardEl(m, showTeam)))
        );
        if (filtered.length > LIST_MAX)
          container.append(el('p', { class: 'mu' }, `Nur die ersten ${LIST_MAX} angezeigt – Suche nutzen.`));
        return container;
      }
      // Monteur: Liste „Meldungen“ (Schäden des Teams, die noch keinem Auftrag zugeordnet sind)
      function drawMeldungenView() {
        const items = freeMeldungen(session.team),
          container = el('div', {}),
          searchRow = searchBox(v => {
            searchText = v;
            swapList(container, meldungList(items, false));
          });
        searchRow.append(fontScaleButtons());
        app.append(
          el('p', { class: 'mu' }, 'Gemeldete Schäden, für die es noch keinen Auftrag gibt.'),
          el('div', { class: 'ctl' }, searchRow),
          container
        );
        container.append(meldungList(items, false));
        if (uploadMeta) app.append(el('p', { class: 'mu' }, 'Stand: ' + new Date(uploadMeta.at).toLocaleString('de-AT')));
      }

      // Monteur: Startseite mit der Auswahl der Auftragsart; danach Fortschritt, Filter (Standard „Offen“), Suche, Schriftgröße und die
      // Auftragsliste des Teams in dieser Auftragsart
      function drawMonteurList(back) {
        const teamRows = allOrders().filter(r => r.team === session.team),
          rows = ordersOfKind(teamRows, viewKind);
        app.append(
          el(
            'div',
            { class: 'bar' },
            el('h1', {}, session.team),
            el(
              'div',
              { class: 'row' },
              !(userInfo && userInfo.lock) && el('button', { onclick: () => switchRole('monteur') }, 'Team wechseln'),
              viewKind ? el('button', { onclick: closeKind }, viewKind === 'chat' ? '← Zurück' : '← Auftragsarten') : back
            )
          ),
          ...(userInfo
            ? [
                el(
                  'p',
                  { class: 'mu uline' + (pushStatusBanner() ? ' two' : '') },
                  `👤 ${userInfo.name} (${userInfo.sap})${userInfo.lock ? ' · 🔒 Team fest zugewiesen' : ''} · `,
                  el('button', { class: 'lk', onclick: userLogout }, 'Abmelden'),
                  ...(pushBell() ? [' · ', pushBell()] : [])
                )
              ]
            : [])
        );
        // Daten laden noch (erster Start ohne Zwischenspeicher): Platzhalter statt einer leeren Liste
        if (!dataReady) {
          app.append(skeletonPage());
          return;
        }
        const counts = kindCounts(teamRows);
        const banner = pushBanner();
        if (banner) app.append(banner);
        // Zeile steht immer da (auch ohne Bestätigung), damit die Liste nicht springt, wenn die Bestätigung eintrifft
        const gasAt = gasConfirmedAt(session.team);
        const gasLine = el(
          'p',
          { class: 'mu gasl' + (gasAt ? ' ok' : '') },
          gasAt
            ? `✓ Gaswarngerät heute um ${timeText(gasAt)} Uhr bestätigt`
            : 'Gaswarngerät heute noch nicht bestätigt'
        );
        if (!viewKind) {
          app.append(gasLine);
          drawKindHome(counts);
          if (uploadMeta)
            app.append(el('p', { class: 'mu' }, 'Stand: ' + new Date(uploadMeta.at).toLocaleString('de-AT')));
          return;
        }
        if (viewKind === 'chat') {
          drawChatView();
          return;
        }
        app.append(gasLine);
        if (viewKind === 'mel') {
          drawMeldungenView();
          return;
        }
        const withList = viewKind === 'war',
          // Filter Alle / Offen (Standard) / Erledigt gibt es bei Wartungen (zusätzlich „Nicht OK“) und bei Reparatur/Entstörung (erledigt =
          // endrückgemeldet; eine Teilrückmeldung ist noch offen); Fortschritt nur bei Wartungen, Daueraufträge zeigen immer alle
          withFilter = withList || isTimedKind(viewKind);
        const view = () =>
          withFilter
            ? rows.filter(
                r =>
                  !monteurFilter ||
                  (monteurFilter === 'open'
                    ? !isFinished(r)
                    : monteurFilter === 'done'
                      ? isFinished(r)
                      : orderStatus(r).nx > 0)
              )
            : rows;
        const doneCount = rows.filter(isFinished).length,
          nokCount = rows.filter(r => orderStatus(r).nx > 0).length;
        const container = el('div', {});
        const searchRow = searchBox(v => {
          searchText = v;
          swapList(container, orderList(view(), false));
        });
        searchRow.append(fontScaleButtons()); // Schriftgröße neben der Suche: Kopfzeile bleibt unverändert
        const controls = el(
          'div',
          { class: 'ctl' },
          withFilter &&
            filterChips(
              [
                ['', 'Alle', rows.length],
                ['open', 'Offen', rows.length - doneCount],
                ['done', 'Erledigt', doneCount],
                ...(withList ? [['nok', 'Nicht OK', nokCount]] : [])
              ],
              monteurFilter,
              k => {
                monteurFilter = k;
              }
            ),
          sortChips(),
          searchRow
        );
        // Fortschritt und Wochenpensum (Frist 31.12.) gibt es nur bei Wartungen
        app.append(
          rows.length && withList ? el('div', { class: 'mtop' }, progressCard(rows.length, doneCount), controls) : controls,
          container
        );
        container.append(orderList(view(), false));
        if (uploadMeta)
          app.append(el('p', { class: 'mu' }, 'Stand: ' + new Date(uploadMeta.at).toLocaleString('de-AT')));
        // Sortierung „Entfernung“ war schon gewählt (App neu gestartet): Standort einmal je Sitzung bestimmen
        if (sortMode() === 'nah' && !geoAsked) {
          geoAsked = true;
          setTimeout(() => locateMe(true), 0);
        }
      }

      // Dispo-Tab „Fortschritt“: Gesamt + je Team
      function drawDispoProgress() {
        const stats = teamStats();
        if (!stats.length) {
          app.append(
            dataReady
              ? el('p', { class: 'mu' }, 'Noch keine Aufträge – im Tab „Upload“ hochladen.')
              : skeletonGrid(2)
          );
          return;
        }
        const totals = stats.reduce(
          (a, t) => ({ n: a.n + t.n, done: a.done + t.done, teil: a.teil + t.teil, nok: a.nok + t.nok }),
          { n: 0, done: 0, teil: 0, nok: 0 }
        );
        const deadlineDate = deadline(),
          workingDays = workingDaysUntil(deadlineDate),
          deadlineText = deadlineDate.toLocaleDateString('de-AT', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          });
        app.append(
          el(
            'div',
            { class: 'gpage' },
            totalCard(totals, workingDays, deadlineText),
            teamProgressCard(stats, totals, workingDays)
          ),
          gasCard()
        );
        if (uploadMeta)
          app.append(
            el(
              'p',
              { class: 'mu' },
              'Fortschritt der Wartungen (Prüfobjekte, Frist 31.12.) · Stand: ' +
                new Date(uploadMeta.at).toLocaleString('de-AT') +
                ' · aktualisiert sich automatisch'
            )
          );
      }

      // Dispo-Tab „Upload“: erst den Upload-PIN abfragen (POST /api/login-upload)
      function drawUploadPinPrompt() {
        const checkUploadPin = async () => {
          const pin = uploadPinInput;
          uploadPinInput = '';
          try {
            uploadToken = (await api('POST', '/api/login-upload', { pin: pin, did: deviceId })).token;
            uploadPinError = false;
            errorMsg = '';
          } catch (e) {
            uploadPinError = e.net ? 'Keine Verbindung zum Server' : e.message || 'Falscher Upload-PIN.';
          }
          render();
        };
        app.append(
          el(
            'div',
            { class: 'card pinc' },
            el('b', {}, 'Upload-PIN eingeben'),
            el('p', { class: 'mu' }, 'Für Hochladen und Löschen ist ein eigener PIN nötig.'),
            el('input', {
              type: 'password',
              inputmode: 'numeric',
              autocomplete: 'off',
              maxlength: '4',
              'data-keep': 'u',
              placeholder: '••••',
              value: uploadPinInput,
              oninput: e => {
                uploadPinInput = e.target.value.replace(/\D/g, '');
                if (uploadPinInput.length === 4) checkUploadPin();
              }
            }),
            uploadPinError && el('p', { class: 'mu er' }, uploadPinError),
            el('button', { class: 'pri', onclick: checkUploadPin }, 'Weiter')
          )
        );
      }

      // Dispo-Tab „Upload“: Aufträge und Prüflose hochladen, alles löschen

              'Reparaturen (3NAR) zählen je Vorgang, Vorgänge von Teams mit „P“ (geplant) sind noch nicht zu sehen, FW-IHEXT sind externe Firmen.'
          ),
          el(

              columns: 'Auftrag, Verantw.ArbPl., Auftragsart, IH-Leistungsart, Kurztext, Postleitzahl, Straße, Techn. Platz, Term. Start, Meldung',

            }

          searchBox(v => {

            swapList(container, meldungList(items, true));

        );

      }
      function drawDispoOverview() {
        // Daten laden noch: Platzhalter statt leerer Filter und Liste
        if (!dataReady) {
          app.append(skeletonPage());
          return;
        }
        if (!viewKind) viewKind = 'war';
        if (dataReady && !ordersByTeam.size && !meldungen.size)
          app.append(el('p', { class: 'mu' }, 'Noch keine Aufträge – im Tab „Upload" hochladen.'));
        app.append(dispoKindBar());
        if (viewKind === 'mel') {
          drawDispoMeldungen();
          return;
        }
        const kindRows = ordersOfKind(allOrders(), viewKind),
          withList = viewKind === 'war',
          kindTeamCounts = new Map();
        for (const r of kindRows) kindTeamCounts.set(r.team, (kindTeamCounts.get(r.team) || 0) + 1);
        const teamEntries = [...kindTeamCounts].sort((a, b) => naturalCompare(a[0], b[0])),
          range = reportedRange();
        const matchesStatus = r =>
          !withList ||
          !statusFilter ||
          (statusFilter === 'nok' ? orderStatus(r).nx > 0 : orderStatus(r).st === statusFilter);
        const candidates = kindRows.filter(
          r => (!teamFilter || r.team === teamFilter) && (!range || inRange(r, range)) && matchesSearch(r)
        );
        const visibleBefore = candidates.filter(matchesStatus),
          markedCount = visibleBefore.filter(r => markState(r.auftrag) === 1).length,
          anyMarkedCount = visibleBefore.filter(r => markState(r.auftrag) > 0).length; // Abgehakte in der aktuellen Liste
        const base = candidates.filter(r =>
            markedFilter === 'hide'
              ? markState(r.auftrag) !== 1
              : markedFilter === 'only'
                ? markState(r.auftrag) > 0
                : true
          ),
          counts = { done: 0, teil: 0, offen: 0, nok: 0 };
        base.forEach(r => {
          const x = orderStatus(r);
          counts[x.st]++;
          if (x.nx > 0) counts.nok++;
        });
        const view = () => base.filter(matchesStatus);
        const nokByTeam = new Map();
        kindRows.forEach(r => {
          if (orderStatus(r).nx > 0) nokByTeam.set(r.team, (nokByTeam.get(r.team) || 0) + 1);
        });
        const teamSelect = el(
          'select',
          {
            onchange: e => {

              render();

          el('option', { value: '' }, 'Alle Teams'),
          teamEntries.map(([t, n]) =>
            el(
              'option',
              { value: t, ...(t === teamFilter ? { selected: 'selected' } : {}) },
              `${t} (${n})` + (nokByTeam.get(t) ? ` · ⚠ ${nokByTeam.get(t)} Nicht OK` : '')
            )
          )
        );
        const option = (v, l, c) =>
          el('option', { value: v, ...(v === c ? { selected: 'selected' } : {}) }, l);
        // Filter: am Handy hinter der Schaltfläche „Filter“ (aufklappbar), breit immer sichtbar. Oben bleiben Suche und eine Zeile mit
        // den aktiven Filtern (jeder lässt sich mit ✕ lösen).
        const panel = el('div', { class: 'fp' + (dispoFiltersOpen ? '' : ' closed') });
        panel.append(
          el(

            { class: 'flt', 'data-k': 'fl' },
            el('span', { class: 'mu' }, 'Team'),
            teamSelect,
            teamFilter &&
              el(
                'button',
                {

                    armMarkAll = false;
                    render();
                  }
                },
                '✕ Teamfilter aufheben'
              ),
            el('span', { class: 'mu' }, 'Rückgemeldet'),
            el(
              'select',
              {
                onchange: e => {
                  reportedFilter = e.target.value;
                  armMarkAll = false;
                  render();
                }
              },
              option('', 'Kein Filter', reportedFilter),
              option('h', 'Heute', reportedFilter),
              option('g', 'Gestern', reportedFilter),

              option('z', 'Zeitraum …', reportedFilter)
            ),

              el(
                'div',
                { class: 'rg' },
                el('input', {
                  class: 'dt',
                  type: 'date',
                  'data-nr': '1',
                  max: today(),
                  value: reportedFrom,
                  onchange: e => {
                    reportedFrom = e.target.value;
                    armMarkAll = false;
                    render();
                  }
                }),
                el('span', {}, '–'),
                el('input', {
                  class: 'dt',
                  type: 'date',
                  'data-nr': '1',
                  max: today(),
                  value: reportedTo,
                  onchange: e => {
                    reportedTo = e.target.value;
                    armMarkAll = false;
                    render();
                  }
                })
              ),
            reportedFilter &&
              el(
                'button',
                {
                  class: 'rs',
                  onclick: () => {
                    reportedFilter = '';
                    reportedFrom = '';
                    reportedTo = '';
                    armMarkAll = false;
                    render();
                  }
                },
                '✕ Zeitfilter aufheben'
              )
          )
        );
        if (reportedFilter === 'z' && reportedFrom && reportedTo && reportedFrom > reportedTo)
          panel.append(el('p', { class: 'mu er' }, '„Von“ liegt nach „Bis“ – es kann nichts gefunden werden.'));
        // Status (Nicht OK, Erledigt, In Arbeit, Offen) gibt es nur bei Wartungen
        if (withList)
          panel.append(
            filterChips(
              [
                ['', 'Alle', base.length],
                ['nok', 'Nicht OK', counts.nok],
                ['done', 'Erledigt', counts.done],
                ['teil', 'In Arbeit', counts.teil],
                ['offen', 'Offen', counts.offen]

                statusFilter = k;
              }
