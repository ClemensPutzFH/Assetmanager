<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aufträge nach Team</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#bb005d" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        var t = localStorage.getItem('thm');
        if (t == 'light' || t == 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* ===== Stile ====================================================================================
         Aufbau: Farben (Design-Tokens, hell/dunkel) → Grundelemente → Bausteine → Layout je Bildschirmgröße.
         Klassennamen sind bewusst kurz. Wichtigste Abkürzungen:
           .mu  = muted (gedämpfter Text)        .er  = error (Fehlerfarbe)       .tag = kleines Etikett
           .kt  = Kurztext (Titel einer Karte)   .cl  = clickable (Karte anklickbar)  .dn = done (erledigt, blasser)
           .it  = item (ein Prüfobjekt, Monteur) .li  = Listenzeile (ein Prüfobjekt, Dispo, nur Ansicht)
           .ob  = Button-Reihe (OK / Nicht OK)   .ed  = Editor für den Nicht-OK-Text   .cfm = Rückfrage „Alles OK“
           .zt  = Zeile der Zeitkarte            .qk  = Schnellwahl-Buttons            .flt = Filterleiste (Dispo)
           .mkr = Zeile „Abhaken“ (Dispo)        .g*  = Fortschrittsgrafik aller Teams (Dispo)
           .vg* = Vergleichsseite (Dispo)        .dlg = Dialog
         Farb-Variablen: --bg Hintergrund, --card Karte, --tx Text, --mu gedämpft, --ac/--act Akzent (Wiener-Netze-Magenta),
         --bd Rahmen, --er Fehler, --ok erledigt/OK, --nk Nicht OK, --g1/--g2/--gt Balken (in Arbeit/erledigt/offen).
         ================================================================================================= */
      /* ---- Farben: hell (Standard), dunkel per Systemeinstellung oder Schalter (data-theme am <html>) ---- */
      :root {
        --bg: #f5f5f6;
        --card: #fff;
        --tx: #1f1f23;
        --mu: #66656c;
        --ac: #bb005d;
        --act: #bb005d;
        --bd: #e4e3e7;
        --er: #c4320a;
        --ok: #067647;
        --nk: #c4320a;
        --g1: #5fb085;
        --g2: #067647;
        --gt: #e1e0e5;
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #141316;
          --card: #1e1c20;
          --tx: #ededf0;
          --mu: #a09fa6;
          --ac: #d1176f;
          --act: #f06baa;
          --bd: #2f2d33;
          --er: #f2704f;
          --ok: #15803d;
          --nk: #d0421a;
          --g1: #2e6e4c;
          --g2: #22a35a;
          --gt: #34323a;
        }
      }
      :root[data-theme='dark'] {
        --bg: #141316;
        --card: #1e1c20;
        --tx: #ededf0;
        --mu: #a09fa6;
        --ac: #d1176f;
        --act: #f06baa;
        --bd: #2f2d33;
        --er: #f2704f;
        --ok: #15803d;
        --nk: #d0421a;
        --g1: #2e6e4c;
        --g2: #22a35a;
        --gt: #34323a;
      }
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* ---- Grundlayout ---- */
      html {
        scroll-padding-top: calc(var(--toph, 52px) + 8px);
        overflow-anchor: none;
      }
      /* Schriftgröße ändern: die Seite wechselt sofort und blendet vom alten zum neuen Bild über (siehe changeFontScale).
         font-size selbst wird bewusst nicht animiert – bei jedem Zwischenschritt würden Texte neu umbrechen und die Seite springen. */
      ::view-transition-old(root),
      ::view-transition-new(root) {
        animation-duration: 0.22s;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          1rem/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 8px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
        /* Einblendungen schieben Karten seitlich herein: der Überstand darf die Seite nicht breiter machen (sonst lässt sie
           sich während der Animation seitlich verschieben und wackelt). clip statt hidden, damit „sticky“ weiter klappt. */
        overflow-x: clip;
      }
      body[data-w='n'] main {
        max-width: 560px;
      }
      h1 {
        font-size: 1.375rem;
        margin: 8px 0 16px;
      }
      .bar {
        display: flex;
        flex-wrap: wrap; /* bei großer Schrift auf schmalem Handy rutscht der Knopf unter die Überschrift, statt über den Rand zu ragen */
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .bar h1 {
        margin: 0;
      }
      .bar button {
        white-space: nowrap;
        flex: 0 0 auto;
      }
      /* ---- Bedienelemente ---- */
      button,
      select,
      input[type='search'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 14px;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
      }
      button.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      button.big {
        display: block;
        width: 100%;
        padding: 18px;
        font-size: 1.125rem;
        margin-bottom: 10px;
        text-align: left;
      }
      button.er {
        color: var(--er);
      }
      /* ---- Karten, Etiketten, Meldungen, Statusfarben ---- */
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        overflow-wrap: break-word;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tag {
        font-size: 0.75rem;
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 1px 8px;
        color: var(--mu);
      }
      .kt {
        font-size: 1.0625rem;
        font-weight: 600;
        margin: 6px 0 2px;
      }
      .mu {
        color: var(--mu);
        font-size: 0.875rem;
      }
      .msg {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        margin-bottom: 12px;
        background: var(--card);
      }
      .msg.er {
        color: var(--er);
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .tools input {
        flex: 1;
        min-width: 0;
      }
      label.ck {
        display: block;
        margin: 10px 0;
        font-size: 0.875rem;
        color: var(--mu);
      }
      .card.cl {
        cursor: pointer;
      }
      .chev {
        margin-left: auto;
        color: var(--mu);
        font-size: 0.875rem;
      }
      .li {
        padding: 8px 0;
        border-top: 1px solid var(--bd);
      }
      .card button.pri {
        margin-top: 10px;
      }
      .mu.er {
        color: var(--er);
      }
      .tag.st-ok {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .tag.st-nok {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      .tag.st-teil {
        border-color: var(--ac);
        color: var(--act);
      }
      .tag.st-zf {
        background: rgba(196, 50, 10, 0.14);
        border-color: var(--nk);
        color: var(--er);
        font-weight: 700;
      }
      .nokbox {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--nk);
        font-size: 0.875rem;
      }
      .nokbox b {
        color: var(--er);
      }
      /* ---- Filter-Chips ---- */
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .chip.nk.on {
        background: var(--nk);
        border-color: var(--nk);
      }
      .chips.ab {
        align-items: center;
      }
      /* ---- Prüfobjekte: Monteur (.it) mit OK / Nicht OK, Rückfrage „Alles OK“ (.cfm) ---- */
      .it {
        padding: 10px 0;
        border-top: 1px solid var(--bd);
      }
      .it .t {
        margin-bottom: 8px;
        word-break: break-word;
      }
      .it .t .orig {
        font-size: 0.75rem;
        color: var(--mu);
        opacity: 0.8;
        margin-top: 2px;
      }
      .ob {
        display: flex;
        gap: 8px;
      }
      .ob button {
        flex: 1;
        padding: 12px 8px;
      }
      .ob button.ok.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .ob button.nk.on {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      /* abgehakter Auftrag (Monteur): Prüfobjekte nur ansehen */
      .ob button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      .lockn {
        display: flex;
        flex-direction: column;
        gap: 4px;
        border-color: var(--ac);
      }
      button.allok {
        display: block;
        width: 100%;
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        padding: 14px;
        font-size: 1.0625rem;
        margin: 10px 0;
      }
      .cfm {
        margin: 10px 0;
        padding: 12px;
        border: 2px solid var(--ok);
        border-radius: 10px;
      }
      .cfm .ob {
        margin-top: 10px;
      }
      .cfm button {
        padding: 14px 8px;
        font-size: 1rem;
      }
      .cfm button.yes {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .mk {
        display: inline-block;
        width: 1.4em;
      }
      /* ---- Tabs der Disponentenansicht, Texteingaben ---- */
      /* Tabs: nebeneinander, am Handy seitlich wischbar (nichts wird abgeschnitten), der aktive Tab wird in die Mitte gerückt */
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
        overflow-x: auto;
        scrollbar-width: none;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
      }
      .tabs::-webkit-scrollbar {
        display: none;
      }
      .tabs button {
        flex: 1 0 auto;
        white-space: nowrap;
        padding: 10px 14px;
        font-size: 0.875rem;
      }
      .tabs button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .tools select {
        flex: 1;
        min-width: 0;
      }
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
      }
      .ed {
        margin-top: 8px;
      }
      .ob button.sv {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .nk1 {
        margin-top: 4px;
      }
      .tmr {
        margin-bottom: 12px;
      }
      /* überfälliger Auftrag: roter Balken links an der Karte */
      .card.due {
        border-left: 4px solid var(--er);
      }
      /* Dispo-Filter: breit immer sichtbar; am Handy zugeklappt hinter „Filter“, oben nur Suche und die aktiven Filter */
      .fbtn {
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .fbtn.on {
        border-color: var(--ac);
        color: var(--ac);
      }
      .fsum {
        margin: 0 0 10px;
      }
      @media (max-width: 699px) {
        .fp.closed {
          display: none;
        }
        .srow {
          display: flex;
          gap: 8px;
          align-items: flex-start;
        }
        .srow .tools {
          flex: 1 1 auto;
          min-width: 0;
        }
      }
      @media (min-width: 700px) {
        .fbtn,
        .fsum {
          display: none;
        }
      }
      /* Liste: Marke am Ende, bei deren Annäherung die Liste automatisch länger wird (ohne IntersectionObserver ein Button) */
      .more {
        min-height: 1px;
        text-align: center;
        margin: 6px 0 16px;
      }
      .more button {
        min-width: 16rem;
      }
      /* Benutzer: Link-Schaltfläche (.lk), Benutzerzeile (.uline) und Karten der Benutzerverwaltung (.ucard) */
      button.lk {
        border: none;
        background: none;
        color: var(--act);
        padding: 0;
        text-decoration: underline;
        font-size: inherit;
      }
      .uline {
        margin: -4px 0 10px;
      }
      /* Mit Benachrichtigungs-Hinweis/-Glocke kann die Zeile umbrechen: zwei Zeilen reservieren, damit die Seite nicht springt,
         wenn die Glocke erscheint oder verschwindet */
      @media (max-width: 600px) {
        .uline.two {
          min-height: 2.8em;
        }
      }
      .ulog {
        margin: 6px 0 0;
        padding-left: 0;
        list-style: none;
        max-height: 14rem;
        overflow: auto;
      }
      .ulog li {
        font-size: 0.8125rem;
        color: var(--mu);
        padding: 2px 0;
      }
      .ucard.off {
        opacity: 0.7;
      }
      .uq {
        margin-top: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .uq select {
        flex: 1 1 10rem;
        min-width: 0;
      }
      .uq button {
        flex: 0 0 auto;
      }
      .ufm label {
        display: block;
        font-size: 0.875rem;
        color: var(--mu);
        margin: 8px 0 2px;
      }
      .ufm input[type='text'],
      .lgn input {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 12px;
        width: 100%;
        box-sizing: border-box;
      }
      .lgn label {
        display: block;
        font-size: 0.875rem;
        color: var(--mu);
        margin: 10px 0 2px;
      }
      .lgn button {
        width: 100%;
        margin-top: 14px;
      }
      .tmr p {
        margin: 6px 0;
      }
      /* Zeitkarte: „Mit wem gearbeitet?“ – Auswahlfeld füllt die Kartenbreite */
      .wp select {
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0 12px;
      }
      .wp .chips {
        margin: 4px 0 0;
      }
      .it .nokbox {
        margin-top: 8px;
      }
      input[type='password'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 1.375rem;
        letter-spacing: 0.4em;
        width: 100%;
        box-sizing: border-box;
        margin: 10px 0;
      }
      button.dl {
        display: block;
        width: 100%;
        margin-bottom: 12px;
      }
      input.tm,
      select.tm {
        font: inherit;
        font-size: 1.25rem;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px;
        width: 72px;
        text-align: center;
        box-sizing: border-box;
      }
      select.tm {
        width: 84px;
        padding: 10px 6px;
      }
      /* ---- Zeitkarte (Datum, Beginn, Dauer) ---- */
      .zt {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .qk {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .qk button {
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      input.dt {
        font: inherit;
        font-size: 1.125rem;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 9px 10px;
        box-sizing: border-box;
        flex: 1;
        min-width: 9.375rem;
      }
      /* ---- Filterleiste der Dispo-Übersicht ---- */
      .flt {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 10px;
        align-items: center;
        margin-bottom: 12px;
      }
      .flt select {
        width: 100%;
        min-width: 0;
      }
      .flt .rg {
        grid-column: 1/-1;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .flt .rg .dt {
        min-width: 0;
        font-size: 1rem;
      }
      .flt .rs {
        grid-column: 1/-1;
        color: var(--er);
      }
      /* ---- Fortschrittskarte (Monteur-Teamansicht) ---- */
      .prg {
        display: flex;
        gap: 12px;
        align-items: stretch;
      }
      .prg .pb {
        flex: 1;
        min-width: 0;
      }
      .prg .pt {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 6px;
        white-space: nowrap;
      }
      .prg .pp {
        font-size: 1.625rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .pbar {
        height: 14px;
        border-radius: 7px;
        background: var(--bd);
        overflow: hidden;
        margin: 6px 0;
      }
      .pbar .pd {
        height: 100%;
        background: var(--ok);
        border-radius: 7px 0 0 7px;
      }
      .prg .ps {
        flex: 0 0 auto;
        width: 6rem;
        text-align: center;
        border-left: 1px solid var(--bd);
        padding-left: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .prg .pn {
        font-size: 1.625rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .prg .pn.ok {
        color: var(--ok);
      }
      .prg .ps.warn .pn {
        color: var(--er);
      }
      .prg .sm {
        font-size: 0.75rem;
        margin-top: 2px;
      }
      /* ---- „Abhaken“ durch den Disponenten ---- */
      .mkr {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .mkb {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      .mkb.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .mkb.ch {
        border-color: var(--nk);
        color: var(--er);
        font-weight: 600;
      }
      .card.dn {
        opacity: 0.6;
      }
      .msg button {
        margin-left: 8px;
        padding: 4px 10px;
        font-size: 0.875rem;
      }
      /* ---- Kopfzeile: Logo + Hell/Dunkel-Schalter ---- */
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg);
        transition: box-shadow 0.15s;
        padding: calc(12px + env(safe-area-inset-top, 0px))
          max(16px, env(safe-area-inset-right), calc((100% - 1440px) / 2 + 16px)) 8px
          max(16px, env(safe-area-inset-left), calc((100% - 1440px) / 2 + 16px));
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: border-box;
      }
      .logo {
        height: 28px;
        width: auto;
        display: block;
        flex: 0 1 auto;
        min-width: 0;
        object-fit: contain;
        object-position: left center;
      }
      .dk .logo {
        background: #fff;
        padding: 4px 8px;
        border-radius: 6px;
        /* Der weiße Hintergrund ragt über das Logo hinaus, ohne Platz zu brauchen: Kopfzeile und Seite bleiben beim
           Umschalten Hell/Dunkel gleich hoch und breit (sonst springt alles um 2 px und das Logo ruckt) */
        margin: -4px -8px;
      }
      .thm {
        margin-left: auto;
        flex: 0 0 auto;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-color: transparent;
        background: none;
        color: var(--mu);
        font-size: 0.875rem;
      }
      .thm .sw {
        flex: 0 0 auto;
        width: 34px;
        height: 20px;
        border-radius: 10px;
        background: var(--mu);
        position: relative;
        transition: background 0.15s;
      }
      .thm .sw::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s;
      }
      .thm[aria-checked='true'] .sw {
        background: var(--ac);
      }
      .thm[aria-checked='true'] .sw::after {
        transform: translateX(14px);
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      input[type='checkbox'] {
        accent-color: var(--ac);
      }
      /* ---- Schriftgröße A− / A+ (Monteur) ---- */

    <script>
      /* =================================================================================================
       * Aufträge nach Team – Oberfläche (eine Datei, ohne Framework und ohne Build-Schritt)
       *
       * ROLLEN
       *   Monteur   bestätigt täglich vor der Arbeit das Gaswarngerät (Fenster, siehe showGasCheck), wählt sein Team, sieht
       *             dessen Aufträge, bewertet die Prüfobjekte (OK / Nicht OK mit Text) und meldet die Zeit zurück. Ein Auftrag gilt als „erledigt“, wenn alle Prüfobjekte bewertet sind UND
       *             die Zeit vollständig ist (Datum + Beginn + Dauer).
       *   Disponent PIN-geschützt: Übersicht (Filter, Excel-Export, Abhaken), Fortschritt aller Teams (+ Nachricht ans
       *             Team), Upload (eigener PIN), Vergleich (Aufträge-Excel gegen Export) und Geräte (wer ist wo
       *             angemeldet, Spitznamen, Geräte ausloggen, Standort der Monteur-Geräte).
       *
       * DATENFLUSS
       *   Server (SQLite) <-> poll(): holt nur Änderungen seit der Änderungsnummer `syncSeq`; der Server meldet Änderungen
       *   live per Server-Sent Events (syncLive/onLive). Der Stand liegt zusätzlich in IndexedDB (loadCache/saveCache) ->
       *   die App startet sofort und funktioniert offline. Eingaben des Monteurs landen zuerst im `outbox`

      // ---- Upload (Disponent) ----
      /**
       * Auftrags-Excel(s) lesen (im Web Worker) und hochladen. keep = true: nur ergänzen/aktualisieren,

      /**

      async function uploadChecklists(files) {

      // Alle Prüfobjekte löschen (DELETE /api/pruef)
      async function wipeChecklists() {

      }
      // ---- Prüfobjekt-Texte lesbar machen (nur Monteur-Ansicht; Dispo und Export zeigen den Originaltext) ----
      // Beispiele aus den Prüflosen:
      //   „VL 1210 Am Spitz DN125 RL“           -> Verteilleitung 1210 Am Spitz DN125 – Rücklauf
      //   „AL UHM001 1210 Am Spitz 8 VL“        -> Abzweigleitung Schacht UHM001 1210 Am Spitz 8 – Vorlauf
      //   „KH RL AL 1210 Am Spitz 8 SHM911“     -> Kugelhahn am Rücklauf der Abzweigleitung 1210 Am Spitz 8 im Schacht SHM911
      // Kürzel: VL/AL = Verteil-/Abzweigleitung (am Anfang), VL/RL = Vor-/Rücklauf (hinten), KH = Kugelhahn,
      // Ü = Überlauf, E = Entleerung. Schachtbezeichnung = 3 Buchstaben + 3 Ziffern (z. B. SHM911).
      const LINE_NAMES = { VL: 'Verteilleitung', AL: 'Abzweigleitung' },
        FLOW_NAMES = { VL: 'Vorlauf', RL: 'Rücklauf' },
        PART_NAMES = { KH: 'Kugelhahn', E: 'Entleerung', Ü: 'Überlauf' },
        SHAFT_PATTERN = /^[A-Z]{3}\d{3}$/;
      /**
       * Wandelt den Kurztext eines Prüfobjekts in einen lesbaren Satz um. Erkennt zwei Muster:
       *   1) Leitung:  <VL|AL> <Ort/Schacht …> <VL|RL>
       *   2) Bauteil:  <KH|Ü|E> <VL|RL> <VL|AL> <Ort …> [Schacht]
       * Alles andere kommt unverändert zurück (der Monteur sieht dann den Originaltext).
       */
      function humanizeChecklistText(text) {
        const words = String(text).trim().split(/\s+/),
          shaftLabel = x => (SHAFT_PATTERN.test(x) ? 'Schacht ' + x : x);
        // „VL 1210 Am Spitz DN125 RL“ / „AL UHM001 1210 Am Spitz 8 VL“
        if (LINE_NAMES[words[0]] && FLOW_NAMES[words[words.length - 1]] && words.length > 2)
          return `${LINE_NAMES[words[0]]} ${words.slice(1, -1).map(shaftLabel).join(' ')} – ${FLOW_NAMES[words[words.length - 1]]}`;
        // „KH RL AL 1210 Am Spitz 8 SHM911“ (Bauteil, Vor-/Rücklauf, Leitungsart, Ort, Schacht)
        const part = PART_NAMES[words[0].toUpperCase()],
          flow = FLOW_NAMES[words[1]],
          lineType = LINE_NAMES[words[2]];
        if (part && flow && lineType && words.length > 3) {
          const shaft = SHAFT_PATTERN.test(words[words.length - 1]) ? words.pop() : '',
            place = words.slice(3).join(' ');
          return `${part} am ${flow} der ${lineType}${place ? ' ' + place : ''}${shaft ? ' im Schacht ' + shaft : ''}`;
        }
        return text;
      }
      // ---- Excel-Export ----
      // Anzeigetexte der Status-Werte (siehe orderStatus)
      const STATUS_LABELS = { done: 'Erledigt', teil: 'In Arbeit', offen: 'Offen' };
      /**
       * Excel-Export der übergebenen Aufträge (Disponent): holt die Prüfobjekt-Listen vom Server, baut zwei Tabellen
       * (Blatt „Aufträge“: eine Zeile je Auftrag; Blatt „Prüfobjekte“: eine Zeile je Prüfobjekt) und lässt die Datei im
       * Web Worker erzeugen. Die Spalte „Abgehakt am“ wird auch vom Vergleich (drawComparison) gelesen.
       * Veraltete Bewertungen (Prüfliste wurde nach der Bewertung geändert) werden als „veraltet“ gekennzeichnet.
       */
      async function exportXlsx(rows) {
        busy = true;
        errorMsg = '';
        infoMsg = 'Erstelle Excel …';
        render();
        try {
          const lists = new Map(
            Object.entries(
              (await api('POST', '/api/pruef/get', { ids: rows.map(order => order.auftrag) }, 120000)).map
            )
          );
          const orderRows = [
            [
              'Auftrag',
              'Team (Verantw. Arb. Pl.)',
              'Techn. Platz',
              'Auftragsart',
              'PLZ',
              'Straße',
              'Kurztext',
              'Eckstarttermin',
              'Eckendtermin',
              'Status',
              'Prüfergebnis',
              'Prüfobjekte gesamt',
              'OK',
              'Nicht OK',
              'Offen',
              'Durchgeführt am',
              'Beginn (Uhrzeit)',
              'Dauer (Min)',
              'Dauer (Std)',
              'Zeit zurückgemeldet am',
              'Zeit zurückgemeldet von',
              'Gearbeitet mit',
              'Nicht OK – Prüfobjekt → Text',
              'Hinweis',
              'Abgehakt am',
              'Zuletzt gespeichert von'
            ]
          ];
          const checklistRows = [
            [
              'Auftrag',
              'Team',
              'Auftrag Kurztext',
              'Pos.',
              'Prüfobjekt (Kurztext)',
              'Ergebnis',
              'Text bei Nicht OK'
            ]
          ];
          for (const order of rows) {
            const items = lists.get(order.auftrag) || [],
              status = orderStatus(order),
              count = items.length,
              valid = !!(status.s && count > 0 && status.n === count && status.s.length === count),
              stale = !!(status.s && count > 0 && !valid),
              total = count || status.n;
            orderRows.push([
              order.auftrag,
              order.team,
              order.tp,
              order.art,
              order.plz,
              order.str,
              order.kurz,
              order.start,
              order.ende,
              STATUS_LABELS[stale && status.st === 'done' ? 'teil' : status.st],
              status.nx > 0
                ? status.op > 0
                  ? 'Nicht OK (unvollständig)'
                  : 'Nicht OK'
                : status.n > 0 && !status.op
                  ? 'OK'
                  : status.ok > 0
                    ? 'unvollständig'
                    : '',
              total,
              status.ok,
              status.nx,
              Math.max(0, total - status.ok - status.nx),
              isoToExcelDate(performedDate(status)),
              timeToExcelFraction(status.von),
              status.min != null ? status.min : null,
              status.min != null ? Math.round((status.min / 60) * 100) / 100 : null,
              status.tat ? new Date(status.tat).toLocaleString('de-AT') : null,
              status.tu ? userLabel(status.tu) : null,
              status.mit && status.mit.length ? status.mit.map(userLabel).join(', ') : null,
              status.nok.map(z => (z.m ? `${z.t} → ${z.m}` : z.t)).join(' | '),
              stale ? 'Prüfliste seit der Bewertung geändert' : '',
              markState(order.auftrag)
                ? new Date(marks.get(order.auftrag).at).toLocaleString('de-AT') +
                  (markState(order.auftrag) === 2 ? ' (danach geändert)' : '')
                : null,
              status.u ? userLabel(status.u) : null
            ]);
            items.forEach((t, i) => {
              const itemMark = valid ? status.s[i] : '-',
                z = valid ? status.nok.find(z => z.i === i) : null;
              checklistRows.push([
                order.auftrag,
                order.team,
                order.kurz,
                i + 1,
                t,
                stale ? 'veraltet' : itemMark === 'o' ? 'OK' : itemMark === 'x' ? 'Nicht OK' : 'Offen',
                z ? z.m : ''
              ]);
            });
          }
          const out = await runExcelWorker({
            type: 'xlsx',
            A: orderRows,
            P: checklistRows,
            dc: orderRows[0].indexOf('Durchgeführt am'),
            tc: orderRows[0].indexOf('Beginn (Uhrzeit)')
          });
          const fileName =
            'Pruefergebnisse' +
            (teamFilter ? '_' + teamFilter.replace(/[^A-Za-z0-9_-]/g, '_') : '') +
            (statusFilter ? '_' + statusFilter : '') +
            (reportedRange()
              ? '_RM_' + (reportedRange()[0] || '') + '_bis_' + (reportedRange()[1] || '')
              : '') +
            '_' +
            new Date().toLocaleDateString('sv-SE') +
            '.xlsx';
          const url = URL.createObjectURL(
            new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
          );
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          infoMsg = `Export bereit: ${rows.length} Aufträge, ${checklistRows.length - 1} Prüfobjekte`;
        } catch (e) {
          infoMsg = '';
          if (e && e.code === 'declined') infoMsg = 'Download abgebrochen';
          else errorMsg = 'Export fehlgeschlagen: ' + (e.message || e);
        }
        busy = false;
        render();
      }
      // ---- Auftrag öffnen ----
      /** Öffnet die Detailansicht: Zeitfelder aus dem Ergebnis vorbelegen, Prüfobjekte aus dem Zwischenspeicher oder vom Server laden. */
      async function openOrderDetail(order) {
        openOrder = order;
        armAllOk = false;
        editIndex = null;
        checklist = { st: 'load' };
        const existingResult = resultOf(order.auftrag);
        // ältere, nicht auf Viertelstunden gerundete Zeiten werden im Formular auf die nächste Viertelstunde aufgerundet vorbelegt
        const shownMin = existingResult && existingResult.min != null ? roundUpQuarter(existingResult.min) : null;
        timeHours = shownMin != null ? String(Math.floor(shownMin / 60)) : '';
        timeMinutes = shownMin != null ? String(shownMin % 60) : '';
        timeError = '';
        timeDate =
          existingResult && existingResult.min != null ? performedDate(existingResult) || today() : today();
        timeStart =
          existingResult && existingResult.min != null && existingResult.von
            ? roundQuarterHHMM(existingResult.von)
            : '';
        timeWith = existingResult && existingResult.min != null && existingResult.mit ? [...existingResult.mit] : [];
        // neue Zeit: alle aus dem Team sind vorausgewählt (sobald die Kollegenliste da ist), solange der Monteur nichts ändert
        timeWithAuto = session.role === 'monteur' && !(existingResult && existingResult.min != null);
        timeFormOpen = false;
        applyDefaultWith(order);
        if (session.role === 'monteur') loadColleagues(order.team);
        timeFormAtOpen = timeFormSnapshot();
        render();
        try {
          let items = checklistsByOrder.get(order.auftrag);
          if (!items) {
            items = (await api('GET', '/api/pruef?a=' + encodeURIComponent(order.auftrag))).list;
            checklistsByOrder.set(order.auftrag, items);
          }
          if (!openOrder || openOrder.auftrag !== order.auftrag) return;
          checklist = { st: 'ok', list: items };
        } catch (e) {
          if (!openOrder || openOrder.auftrag !== order.auftrag) return;
          checklist = {
            st: 'err',
            m: e.net ? 'Keine Verbindung – Prüfobjekte noch nicht geladen' : errorMessageOf(e)
          };
        }
        render();
      }

      // ---- Ergebnisse und Status ----
      // Ergebnis-Dokument eines Auftrags (Format siehe Kopfkommentar): erst die noch nicht gesendete Eingabe (outbox), sonst der Stand vom Server
      const resultOf = orderNo => outbox.get(orderNo) || results.get(orderNo);
      /**
       * Status eines Auftrags, abgeleitet aus dem Ergebnis-Dokument:
       *   st = 'done'  erledigt: alle Prüfobjekte bewertet UND Zeitrückmeldung vollständig
       *        'teil'  begonnen (etwas bewertet oder Zeit erfasst)
       *        'offen' noch nichts erfasst
       *   op = Anzahl noch offener Prüfobjekte; nx > 0 (Nicht OK) gilt unabhängig davon – ein Auftrag kann
       *   „Nicht OK“ UND erledigt (oder in Arbeit) sein.
       */
      // Ergebnisse ändern sich nie „von innen“ (jede Änderung ist ein neues Objekt) -> der Status wird je Ergebnis nur einmal berechnet
      const statusCache = new WeakMap(),
        STATUS_NONE = { st: 'offen', ok: 0, n: 0, nx: 0, op: 0, nok: [] };
      const orderStatus = order => {
        const result = resultOf(order.auftrag);
        if (!result) return STATUS_NONE;
        let status = statusCache.get(result);
        if (!status) statusCache.set(result, (status = computeOrderStatus(result)));
        return status;
      };
      const computeOrderStatus = result => {
        const openCount = Math.max(0, (result.n | 0) - (result.ok | 0) - (result.nx | 0));
        return {
          ...result,
          op: openCount,
          nok: (result.nok || []).map(z => (typeof z === 'string' ? { t: z, m: '' } : z)),
          st:
            result.n > 0 && !openCount && timeComplete(result)
              ? 'done'
              : result.ok + result.nx > 0 || result.min != null
                ? 'teil'
                : 'offen'
        };
      };
      // Etiketten („Nicht OK“, „Erledigt“, „x von y offen“) für die Auftragskarte
      const statusTags = order => {
        const status = orderStatus(order);
        return [
          status.nx > 0 && el('span', { class: 'tag st-nok' }, `✗ Nicht OK (${status.nx})`),
          status.st === 'done'
            ? el('span', { class: 'tag st-ok' }, '✓ Erledigt')
            : status.st === 'teil' && status.op > 0
              ? el('span', { class: 'tag st-teil' }, `◐ ${status.op} von ${status.n} offen`)
              : status.st === 'teil' && status.n > 0
                ? el('span', { class: 'tag st-teil' }, 'Alle geprüft')
                : null
        ];
      };
      // Zeitrückmeldung vollständig = Datum + Beginn + Dauer
      const timeComplete = result =>
        !!(result && result.min >= 1 && performedDate(result) && /^\d{2}:\d{2}$/.test(result.von || ''));
      // true, wenn der Auftrag erledigt ist
      const isFinished = order => orderStatus(order).st === 'done';
      // Zeile mit Filter-Chips: items = [[Schlüssel, Beschriftung, Anzahl]]; current = aktiver Schlüssel; select setzt ihn
      const filterChips = (items, cur, set) =>
        el(
          'div',
          { class: 'chips', 'data-k': 'fc' },
          items.map(([k, l, n]) =>
            el(
              'button',
              {
                class: 'chip' + (k === 'nok' ? ' nk' : '') + (cur === k ? ' on' : ''),
                onclick: () => {
                  set(k);
                  render();
                }
              },
              `${l} (${n})`
            )
          )
        );
      // Änderungsnummer (Stand vom Server), auf der eine Eingabe beruht. Läuft bei schnellen Folgeeingaben mit
      // (siehe sendPending); der Server lehnt Eingaben ab, wenn inzwischen ein anderes Gerät gespeichert hat.
      const serverBaseOf = a => {
        const p = outbox.get(a);
        return p && p._b != null ? p._b : resultSeq.get(a) || 0;
      };
      // entfernt das interne Feld _b, bevor ein Ergebnis als „Stand vom Server“ gemerkt wird
      const withoutBase = d => {
        const { _b, ...o } = d;
        return o;
      };
      /**
       * Speichert die Bewertung eines Auftrags: baut das Ergebnis-Dokument aus state (Status-String, 'o'/'x'/'-' je
       * Prüfobjekt) und nokTexts (Text je Index), legt es in die Outbox und stößt das Senden an. Bereits erfasste
       * Zeitfelder bleiben erhalten.
       */
      // Die Zeit-Felder eines Ergebnisses (Dauer, Zeitpunkt, Datum, Beginn, Kollegen), die jedes neue Ergebnis mitnehmen muss –
      // sonst gingen sie beim Bewerten eines Prüfobjekts verloren. Ohne Zeit: nichts.
      const timeFieldsOf = result =>
        result && result.min != null
          ? {
              min: result.min,
              ...(result.tat ? { tat: result.tat } : {}),
              ...(result.dat ? { dat: result.dat } : {}),
              ...(result.von ? { von: result.von } : {}),
              ...(Array.isArray(result.mit) ? { mit: [...result.mit] } : {})
            }
          : {};
      function saveChecklistState(order, items, state, nokTexts = {}) {
        if (isLocked(order.auftrag)) return denyLocked();
        const nokItems = [...state].flatMap((c, k) =>
          c === 'x' ? [{ i: k, t: items[k], m: nokTexts[k] || '' }] : []
        );
        const result = resultOf(order.auftrag);
        outbox.set(order.auftrag, {
          _b: serverBaseOf(order.auftrag),
          a: order.auftrag,
          team: order.team,
          n: state.length,
          ok: [...state].filter(c => c === 'o').length,
          nx: nokItems.length,
          s: state,
          nok: nokItems,
          ...timeFieldsOf(result)
        });
        errorMsg = '';
        saveOutbox();
        render();
        sendPending(order.auftrag);
      }
      /**
       * Aktueller Bewertungsstand für die übergebene Prüfliste: { s: Status-String, T: Text je Index }.
       * Ein veraltetes Ergebnis (andere Listenlänge als die aktuelle Prüfliste) zählt als leer.
       */
      function currentChecklistState(orderNo, items) {
        const result = resultOf(orderNo),
          count = items.length;
        if (!(result && result.s && result.n === count && result.s.length === count))
          return { s: '-'.repeat(count), T: {} };
        const nokTexts = {};
        for (const z of result.nok || []) if (z && z.i != null) nokTexts[z.i] = z.m || '';
        return { s: result.s, T: nokTexts };
      }
      // ---- Zeitrückmeldung: Felder min (Minuten), tat (Zeitpunkt), dat (Datum), von (Beginn) im selben Ergebnis-Dokument ----
      // Die Dauer wird nur in Viertelstunden zurückgemeldet. roundUpQuarter: nächsthöherer Viertelstundenwert (mindestens 15)
      const roundUpQuarter = minutes => Math.max(15, Math.ceil(minutes / 15) * 15);
      // Beginn-Uhrzeit: auf die nächste Viertelstunde gerundet, und zwar auf- UND abgerundet (07:07 -> 07:00, 07:08 -> 07:15),
      // nie über Mitternacht hinaus (dann 23:45, damit das Datum stimmt). roundQuarterClock: Zeitpunkt (ms) -> { date, time }
      const clockText = t => String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0');
      const roundQuarterClock = ms => {
        const d = new Date(ms),
          t = d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
        return { date: d.toLocaleDateString('sv-SE'), time: clockText(Math.min(1425, Math.round(t / 15) * 15)) };
      };
      // „HH:MM“ -> auf die nächste Viertelstunde gerundet (ungültige Eingaben bleiben unverändert)
      const roundQuarterHHMM = v => {
        const m = /^(\d{2}):(\d{2})$/.exec(v || '');
        return m ? clockText(Math.min(1425, Math.round((+m[1] * 60 + +m[2]) / 15) * 15)) : v;
      };
      // Dauer als Text: 90 -> „1 Std 30 Min“
      const formatMinutes = m =>
        m >= 60 ? `${Math.floor(m / 60)} Std${m % 60 ? ' ' + (m % 60) + ' Min' : ''}` : `${m} Min`;
      // Zeit-Etikett: Dauer, oder Warnung, sobald am Auftrag gearbeitet wurde, die Zeitrückmeldung aber fehlt/unvollständig ist
      const timeTag = r => {
        const d = resultOf(r.auftrag);
        if (timeComplete(d)) return el('span', { class: 'tag' }, '⏱ ' + formatMinutes(d.min));
        if (d && d.min != null) return el('span', { class: 'tag st-zf' }, '⏱ Beginn fehlt');
        return d && d.ok + d.nx > 0 ? el('span', { class: 'tag st-zf' }, '⏱ Zeit fehlt') : null;
      };
      // Datums-/Zeit-Helfer. today() liefert JJJJ-MM-TT in Ortszeit (Locale „sv-SE“ liefert genau dieses Format)
      const today = () => new Date().toLocaleDateString('sv-SE');
      // JJJJ-MM-TT -> TT.MM.JJJJ
      const formatIsoDate = i => (i ? i.split('-').reverse().join('.') : '');
      // JJJJ-MM-TT -> Excel-Datumszahl (Tage seit 1900), für echte Datumszellen im Export
      const isoToExcelDate = v =>
        /^\d{4}-\d{2}-\d{2}$/.test(v || '')
          ? Math.round(Date.UTC(+v.slice(0, 4), +v.slice(5, 7) - 1, +v.slice(8, 10)) / 864e5) + 25569
          : null;
      // HH:MM -> Bruchteil eines Tages (Excel-Uhrzeit)
      const timeToExcelFraction = v =>
        /^\d{2}:\d{2}$/.test(v || '') ? (+v.slice(0, 2) * 60 + +v.slice(3, 5)) / 1440 : null;
      // „Durchgeführt am“: das gewählte Datum, sonst das Datum der Rückmeldung
      const performedDate = d => d.dat || (d.tat ? new Date(d.tat).toLocaleDateString('sv-SE') : '');
      // ---- Kollegen („mit wem gearbeitet“) ----
      // colleagueCache: Team -> [{ sap, name, team, here }] (alle aktiven Benutzer außer dem eigenen; here = zuletzt in diesem Team
      // unterwegs). Wird im Gerät gemerkt, damit die Auswahl auch ohne Netz da ist.
      const colleagueCache = new Map();
      try {
        for (const [team, list] of Object.entries(JSON.parse(localStorage.getItem('col') || '{}'))) {
          colleagueCache.set(team, list);
          for (const c of list) userNames.set(c.sap, c.name);
        }
      } catch (e) {}
      // Vorauswahl: alle Benutzer, deren Team dieses Team ist. Gilt nicht als Änderung (kein „nicht gespeichert“-Hinweis).
      function applyDefaultWith(order) {
        const list = colleagueCache.get(order.team);
        if (!timeWithAuto || !list || !openOrder || openOrder.auftrag !== order.auftrag) return;
        timeWithAuto = false;
        const clean = timeFormSnapshot() === timeFormAtOpen;
        timeWith = list.filter(c => c.team === order.team).map(c => c.sap);
        if (clean) timeFormAtOpen = timeFormSnapshot();
      }
      async function loadColleagues(team) {
        try {
          const list = (await api('GET', '/api/colleagues?team=' + encodeURIComponent(team))).list;
          colleagueCache.set(team, list);
          for (const c of list) userNames.set(c.sap, c.name);
          try {
            localStorage.setItem('col', JSON.stringify(Object.fromEntries(colleagueCache)));
          } catch (e) {}

          render();
        } catch (e) {}
      }
      /**
       * Speichert Zeitfelder im Ergebnis-Dokument (min > 0) bzw. löscht sie (min leer/0). Gibt es noch keine gültige
       * Bewertung, wird ein leeres Dokument angelegt – so kann die Zeit vor den Prüfobjekten erfasst werden.
       */
      function storeTime(order, items, minutes, date, start) {
        if (isLocked(order.auftrag)) return denyLocked();
        timeFormAtOpen = timeFormSnapshot();
        timeFormOpen = false;
        timeFlash = minutes > 0;
        // kurze Bestätigung (bei „Ende“ hat stopTimer schon eine eigene Meldung gesetzt)
        if (minutes > 0 && !infoMsg.startsWith('⏱')) infoMsg = '✓ Zeit gespeichert: ' + formatMinutes(minutes);
        else if (!(minutes > 0)) infoMsg = '🗑 Zeit gelöscht';
        const result = resultOf(order.auftrag),
          count = items.length,
          listValid = !!(result && result.s && result.n === count && result.s.length === count);
        const doc = {
          ...(listValid
            ? result
            : { a: order.auftrag, team: order.team, n: count, ok: 0, nx: 0, s: '-'.repeat(count), nok: [] })
        };
        delete doc.min;
        delete doc.tat;
        delete doc.dat;
        delete doc.von;
        delete doc.mit;
        if (minutes > 0) {
          delete runningTimers[order.auftrag]; // die Zeit ist jetzt gespeichert: ein laufender Timer ist erledigt
          saveTimers();
          doc.min = minutes;
          doc.tat = Date.now();
          if (date) doc.dat = date;
          if (start) doc.von = start;
          doc.mit = [...timeWith]; // immer als Liste (auch leer): so ist „alle abgewählt“ etwas anderes als „nicht angegeben“
        }
        doc._b = serverBaseOf(order.auftrag);
        outbox.set(order.auftrag, doc);
        errorMsg = '';
        saveOutbox();
        render();
        sendPending(order.auftrag);
      }
      // Prüft die Eingaben der Zeitkarte (Datum nicht leer/zukünftig, Beginn, Dauer 1 Min – 24 Std) und speichert sie
      function validateAndStoreTime(order, items) {
        const minutes = (parseInt(timeHours || '0', 10) || 0) * 60 + (parseInt(timeMinutes || '0', 10) || 0);
        const fail = message => {
          timeError = message;
          playErrorSound();
          render();
        };
        timeStart = roundQuarterHHMM(timeStart); // auch ein getippter Wert wird auf die Viertelstunde gerundet
        if (!/^\d{4}-\d{2}-\d{2}$/.test(timeDate)) return fail('Bitte ein Datum wählen.');
        if (timeDate > today()) return fail('Das Datum liegt in der Zukunft.');
        if (!/^\d{2}:\d{2}$/.test(timeStart || '')) return fail('Bitte die Beginn-Uhrzeit angeben.');
        if (minutes < 15 || minutes > 1440)
          return fail('Bitte eine Dauer zwischen 15 Minuten und 24 Stunden eingeben.');
        if (minutes % 15 !== 0) return fail('Die Dauer wird in Viertelstunden angegeben (15, 30, 45 Min …).');
        timeError = '';
        storeTime(order, items, minutes, timeDate, timeStart);
      }
      // ---- Start / Ende: der Monteur kann beim Arbeitsbeginn „Start“ und am Ende „Ende“ drücken ----
      // „Ende“ speichert Datum, Beginn und Dauer wie die Zeitkarte. Der Start wird je Gerät gemerkt (localStorage), auch wenn die
      // App dazwischen geschlossen wird. runningTimers: Auftrag -> Startzeitpunkt (ms)
      let runningTimers = {};
      try {
        runningTimers = JSON.parse(localStorage.getItem('tmr') || '{}') || {};
      } catch (e) {}
      const saveTimers = () => {
        try {
          localStorage.setItem('tmr', JSON.stringify(runningTimers));
        } catch (e) {}

      const timerStartOf = orderNo => +runningTimers[orderNo] || 0;
      // „seit 08:15 Uhr · 12 Min“ (die Minuten aktualisiert ein Intervall, siehe unten)
      const elapsedMinutes = start => Math.max(0, Math.floor((Date.now() - start) / 60000));
      const startTimer = order => {
        runningTimers[order.auftrag] = Date.now();
        saveTimers();
        timeError = '';
        render();
      };
      const cancelTimer = order => {
        delete runningTimers[order.auftrag];
        saveTimers();
        render();
      };
      function stopTimer(order, items) {
        const start = timerStartOf(order.auftrag);

        const minutes = Math.max(15, Math.ceil((Date.now() - start) / 900000) * 15);
        if (minutes > 1440) {
          timeError = 'Der Timer läuft schon länger als 24 Stunden – bitte „Verwerfen“ und die Zeit von Hand eintragen.';
          playErrorSound();
          render();
          return;
        }
        // Beginn auf die nächste Viertelstunde gerundet (auf- und abrunden), die Dauer wird aufgerundet
        const began = roundQuarterClock(start);
        timeDate = began.date;
        timeStart = began.time;
        timeHours = String(Math.floor(minutes / 60));
        timeMinutes = String(minutes % 60);
        timeError = '';
        infoMsg = `⏱ Zeit gespeichert: ab ${timeStart} Uhr, ${formatMinutes(minutes)} (Beginn auf die nächste, Dauer auf die nächsthöhere Viertelstunde gerundet)`;
        storeTime(order, items, minutes, timeDate, timeStart);

      setInterval(() => {

      }, 15000);
      // Löscht die erfasste Zeit (Felder leeren und Zeitangaben im Ergebnis entfernen)
      function deleteTime(order, items) {

        timeStart = '';
        timeWith = [];
        timeDate = today();
        storeTime(order, items, null);
      }
      /**

      function timeCard(order, isMonteur) {

        const timePanel = el(
          'div',
          { class: 'card', 'data-zeit': '1', 'data-k': 'zc' },

          el(
            'p',
            { class: 'mu' },

          hasTime && result.mit && el('p', { class: 'mu' }, '👥 Gearbeitet mit: ' + userNamesText(result.mit)),
          result &&

        );
        // abgehakt (Monteur): nur ansehen – keine Hinweise zum Ausfüllen, keine Eingabe von Zeit und Kollegen
        if (isMonteur && isLocked(order.auftrag)) return timePanel;
        if (hasTime && !timeComplete(result))
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },

        else if (!hasTime && result && result.n > 0 && result.ok + result.nx === result.n)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },

            )

        else if (hasTime && orderStatus(order).op > 0)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              `Zeit erfasst – für „Erledigt“ ${orderStatus(order).op === 1 ? 'fehlt noch 1 Prüfobjekt' : 'fehlen noch ' + orderStatus(order).op + ' Prüfobjekte'}.`

        if (!isMonteur) return timePanel;
        const numberInput = (k, v, set) =>
          el('input', {

            type: 'text',
            inputmode: 'numeric',
            maxlength: '2',

        // Auswahl der Kollegen: Teammitglieder (und wer zuletzt in diesem Team war) als Schalter, alle weiteren über das Auswahlfeld
        const withPicker = order => {
          const list = colleagueCache.get(order.team) || [],
            near = list.filter(c => c.team === order.team || c.here),

            others = list.filter(c => !nearSaps.has(c.sap) && !timeWith.includes(c.sap)),

          return el(
            'div',

              ? el(

                    el(
                      'button',

        const timerStart = timerStartOf(order.auftrag);
        if (timerStart || !hasTime)
          timePanel.append(
            el(
              'div',
              { class: 'tmr', 'data-k': 'zs' },
              timerStart
                ? [
                    el(
                      'p',
                      { class: 'mu' },
                      `⏱ Läuft seit ${new Date(timerStart).toTimeString().slice(0, 5)} Uhr · `,
                      el('b', { 'data-tmr': timerStart }, formatMinutes(elapsedMinutes(timerStart)))
                    ),
                    el(
                      'div',
                      { class: 'ob' },
                      el(
                        'button',
                        { class: 'sv', disabled: items ? null : 'disabled', onclick: () => stopTimer(order, items) },
                        '■ Ende'

                      el('button', { class: 'er', onclick: () => cancelTimer(order) }, 'Verwerfen')
                    )
                  ]
                : [
                    el(
                      'p',
                      { class: 'mu' },
                      'Optional: „Start“ drücken, wenn die Arbeit beginnt, und „Ende“, wenn sie fertig ist – die Zeit wird dann automatisch gespeichert.'
                    ),
                    el('div', { class: 'ob' }, el('button', { class: 'sv', onclick: () => startTimer(order) }, '▶ Start'))
                  ]

          );
        // Kompakt: Start/Ende und die Kollegen-Auswahl sind immer da (bei neuer Zeit), Datum/Beginn/Dauer erst nach „Zeit von Hand
        // eintragen“ bzw. „Zeit ändern“. Bei einem Fehler oder angefangener Eingabe bleibt das Formular offen.
        const formOpen = timeFormOpen || !!timeError;
        if (!hasTime)

        if (!formOpen) {

            el(
              'div',
              { class: 'ob', 'data-k': 'zo' },
              el(
                'button',

            )
          )

      }
      // ---- Prüfobjekte bewerten (Monteur) ----
      // ersetzt ein Zeichen des Status-Strings (Index i -> c)
      const replaceCharAt = (s, i, c) => s.slice(0, i) + c + s.slice(i + 1);
      // „OK“ eines Prüfobjekts umschalten (OK <-> offen); ein vorhandener Nicht-OK-Text geht dabei verloren
      function toggleOk(order, items, index) {
        armAllOk = false;
        editIndex = null;
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        saveChecklistState(
          order,
          items,

          nokTexts
        );
      }
      // Öffnet das Eingabefeld für den „Nicht OK“-Text des Prüfobjekts index (text = bisheriger Text)
      function openNokEditor(index, text) {

        editTextMissing = false;

        const field = app.querySelector('[data-keep="e"]');

      function saveNokText(order, items, index) {

        if (!text) {
          editTextMissing = true;
          playErrorSound();
          render();
          return;
        }
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        nokTexts[index] = text;
        editIndex = null;
        armAllOk = false;
        saveChecklistState(order, items, replaceCharAt(state, index, 'x'), nokTexts);
      }
      // Setzt ein Prüfobjekt zurück auf „offen“
      function resetItem(order, items, index) {
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        editIndex = null;
        saveChecklistState(order, items, replaceCharAt(state, index, '-'), nokTexts);
      }
      // ---- Outbox: ungesendete Ergebnisse ----
      // Ungesendete Ergebnisse liegen in `outbox` (und in localStorage) und werden automatisch erneut gesendet.
      // outboxOffline: es gab vorübergehende Sendefehler; retryTimer: nächster Versuch; prefetching: Vorab-Laden läuft
      let outboxOffline = false,
        retryTimer = null,
        prefetching = false;
      // Outbox im Gerät sichern (übersteht Neuladen und App-Neustart)
      const saveOutbox = () => {
        try {
          localStorage.setItem('outbox', JSON.stringify([...outbox]));
        } catch (e) {}
      };
      // Outbox beim Start aus dem Gerät laden
      const loadOutbox = () => {
        try {
          for (const [a, d] of JSON.parse(localStorage.getItem('outbox') || '[]')) outbox.set(a, d);
        } catch (e) {}
      };
      // nächster Sendeversuch in 15 Sekunden
      const scheduleRetry = () => {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(sendAllPending, 15000);
      };
      // alle noch ungesendeten Aufträge senden
      const sendAllPending = () => {
        for (const a of [...outbox.keys()]) sendPending(a);
      };
      /**
       * Sendet das Ergebnis eines Auftrags (PUT /api/ergebnis/<Auftrag>). Pro Auftrag läuft nur eine Sendung gleichzeitig;
       * kommt währenddessen eine neue Eingabe, wird sie danach nachgesendet (schnelle Folgeeingaben).
       * Fehlerbehandlung:
       *   409  inzwischen auf einem anderen Gerät geändert -> der Stand vom Server gilt, Hinweis per toast()
       *   4xx  dauerhafter Fehler -> Eingabe verwerfen, Fehler anzeigen
       *   sonst (kein Netz, Serverfehler) -> in der Outbox behalten und später erneut senden
       */
      async function sendPending(orderNo) {
        const state = sendState.get(orderNo) || sendState.set(orderNo, {}).get(orderNo);
        if (state.busy) {
          state.dirty = true;
          return;
        }
        state.busy = true;
        try {
          let lastDoc = null,
            seq = 0,
            doc = outbox.get(orderNo);
          while (doc) {
            // nur erneut senden, wenn wirklich eine neue Eingabe dazukam
            lastDoc = doc;
            state.dirty = false;
            seq = (await api('PUT', '/api/ergebnis/' + encodeURIComponent(orderNo), doc)).sq;
            const newer = outbox.get(orderNo);
            if (!newer || newer === doc) break;
            newer._b = seq;
            saveOutbox();
            doc = newer; // eigene Folgeeingabe beruht jetzt auf diesem Stand
          }
          if (lastDoc) {
            results.set(orderNo, withoutBase(lastDoc));
            resultSeq.set(orderNo, seq);
          }
          outbox.delete(orderNo);
          saveOutbox();
          serverReachable = true;
          if (outboxOffline && !outbox.size) {
            outboxOffline = false;

      // ---- Abhaken (Disponent) ----

       * Hakt Aufträge ab (checked = true) bzw. nimmt den Haken zurück (POST /api/mark). Merkt sich den vorherigen Zustand

      const deadline = () => new Date(new Date().getFullYear(), 11, 31); // Frist: 31.12. des laufenden Jahres
      // Ostersonntag nach der Gauß'schen Osterformel (y = Jahr)
