<script>

let since=0,sk='',teamList=[],ordersMap=new Map(),ersSq=new Map(),plC=null,again=false,tok='',net=true,polling=false,cacheT=null,chunks=new Map(),meta=null,ready=false,canWrite=true,err='',msg='',busy=false,arm=false,q='',ft='',openA=null,pl={},pmeta=null,pcache=new Map(),armP=false,sy=0,ers=new Map(),pend=new Map(),wq=new Map(),dtab='ue',fs='',armA=false,mf='',edi=null,edt='',edE=false,unlocked=false,pinv='',pinE=false,tH='',tM='',tE='',tD='',tV='';

try{ses=JSON.parse(localStorage.getItem('ses'))||ses}catch(e){}
const save=()=>{try{localStorage.setItem('ses',JSON.stringify(ses))}catch(e){}};
const cmp=(a,b)=>String(a).localeCompare(String(b),'de',{numeric:true});
const errTxt=e=>e&&e.message?e.message:String(e);

async function upload(files,keep){
  busy=true;err='';msg='Lese Datei …';render();
  try{
    const rows=new Map();let skip=0;
    for(const f of files){const buf=await f.arrayBuffer();const r=await work({type:'orders',buf},[buf]);skip+=r.skip;for(const o of r.rows)rows.set(o.auftrag,o)}
    if(!rows.size)throw new Error('Keine Aufträge mit Verantw. Arb. Pl. gefunden (Spalten Auftrag + Verantw.ArbPl. nötig)');
    msg='Speichere …';render();
    await api('POST','/api/orders',{rows:[...rows.values()],keep,files:files.map(f=>f.name).join(', ')},120000);
    await poll();
    msg=`${rows.size} Aufträge gespeichert`+(skip?` · ${skip} Zeilen ohne Team übersprungen`:'');
  }catch(e){msg='';err=errTxt(e)}
  busy=false;render();
}
async function wipe(){
  busy=true;arm=false;render();
  try{await api('DELETE','/api/orders');await poll();msg='Alle Aufträge gelöscht'}
  catch(e){err=errTxt(e)}
  busy=false;render();
}

// Prüflose: Kurztexte je Auftrag
async function uploadPl(files){
  busy=true;err='';msg='Lese Datei … (läuft im Hintergrund)';render();
  try{
    const by={};let n=0;
    for(const f of files){const buf=await f.arrayBuffer();const r=await work({type:'pruef',buf},[buf]);for(const [a,l] of Object.entries(r.by)){(by[a]=by[a]||[]).push(...l);n+=l.length}}
    const cnt=Object.keys(by).length;
    if(!cnt)throw new Error('Keine Prüfobjekte gefunden (Spalten „Auftrag" und „Kurztext des Prüfobjektes" nötig)');
    msg='Speichere …';render();
    await api('POST','/api/pruef',{by,files:files.map(f=>f.name).join(', '),count:n,orders:cnt},120000);
    pcache.clear();await poll();
    msg=`${n} Prüfobjekte zu ${cnt} Aufträgen gespeichert`;
  }catch(e){msg='';err=errTxt(e)}
  busy=false;render();
}
async function wipePl(){
  busy=true;armP=false;render();
  try{await api('DELETE','/api/pruef');pcache.clear();await poll();msg='Alle Prüfobjekte gelöscht'}
  catch(e){err=errTxt(e)}
  busy=false;render();
}
const STL={ok:'OK',nok:'Nicht OK',teil:'In Arbeit',offen:'Offen'};
async function exportXlsx(rows){
  busy=true;err='';msg='Erstelle Excel …';render();
  try{
    const lists=new Map(Object.entries((await api('POST','/api/pruef/get',{ids:rows.map(r=>r.auftrag)},120000)).map));
    const A=[['Auftrag','Team (Verantw. Arb. Pl.)','Techn. Platz','Auftragsart','PLZ','Straße','Kurztext','Eckstarttermin','Eckendtermin','Prüfstatus','Prüfobjekte gesamt','OK','Nicht OK','Offen','Durchgeführt am','Beginn (Uhrzeit)','Dauer (Min)','Dauer (Std)','Zeit zurückgemeldet am','Nicht OK – Prüfobjekt → Text','Hinweis']];
    const P=[['Auftrag','Team','Auftrag Kurztext','Pos.','Prüfobjekt (Kurztext)','Ergebnis','Text bei Nicht OK']];
    for(const r of rows){
      const L=lists.get(r.auftrag)||[],x=stat(r),n=L.length,valid=!!(x.s&&n>0&&x.n===n&&x.s.length===n),stale=!!(x.s&&n>0&&!valid),tot=n||x.n;
      A.push([r.auftrag,r.team,r.tp,r.art,r.plz,r.str,r.kurz,r.start,r.ende,STL[x.st],tot,x.ok,x.nx,Math.max(0,tot-x.ok-x.nx),di(dOf(x)),tf(x.von),x.min!=null?x.min:null,x.min!=null?Math.round(x.min/60*100)/100:null,x.tat?new Date(x.tat).toLocaleString('de-AT'):null,x.nok.map(z=>z.m?`${z.t} → ${z.m}`:z.t).join(' | '),stale?'Prüfliste seit der Bewertung geändert':'']);
      L.forEach((t,i)=>{
        const c=valid?x.s[i]:'-',z=valid?x.nok.find(z=>z.i===i):null;
        P.push([r.auftrag,r.team,r.kurz,i+1,t,stale?'veraltet':c==='o'?'OK':c==='x'?'Nicht OK':'Offen',z?z.m:'']);
      });
    }
    const out=await work({type:'xlsx',A,P,dc:A[0].indexOf('Durchgeführt am'),tc:A[0].indexOf('Beginn (Uhrzeit)')});
    const nm='Pruefergebnisse'+(ft?'_'+ft.replace(/[^A-Za-z0-9_-]/g,'_'):'')+(fs?'_'+fs:'')+'_'+new Date().toLocaleDateString('sv-SE')+'.xlsx';
    const u=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));const lk=document.createElement('a');lk.href=u;lk.download=nm;document.body.append(lk);lk.click();lk.remove();setTimeout(()=>URL.revokeObjectURL(u),10000);
    msg=`Export bereit: ${rows.length} Aufträge, ${P.length-1} Prüfobjekte`;
  }catch(e){msg='';if(e&&e.code==='declined')msg='Download abgebrochen';else err='Export fehlgeschlagen: '+(e.message||e)}
  busy=false;render();
}
async function showOrder(r){
  openA=r;armA=false;edi=null;pl={st:'load'};const d0=docOf(r.auftrag);tH=d0&&d0.min!=null?String(Math.floor(d0.min/60)):'';tM=d0&&d0.min!=null?String(d0.min%60):'';tE='';tD=d0&&d0.min!=null?(dOf(d0)||today()):today();tV=d0&&d0.min!=null&&d0.von?d0.von:'';render();
  try{
    let L=pcache.get(r.auftrag);
    if(!L){L=(await api('GET','/api/pruef?a='+encodeURIComponent(r.auftrag))).list;pcache.set(r.auftrag,L)}
    if(openA!==r)return;
    pl={st:'ok',list:L};
  }catch(e){if(openA!==r)return;pl={st:'err',m:e.net?'Keine Verbindung – Prüfobjekte noch nicht geladen':errTxt(e)}}
  render();
}

// Prüfergebnisse: ergebnis/<Auftrag> = {a,team,n,ok,nx,s:'o|x|-' je Prüfobjekt,nok:[Kurztexte]}
const docOf=a=>pend.get(a)||ers.get(a);
const stat=r=>{const d=docOf(r.auftrag);if(!d)return{st:'offen',ok:0,n:0,nx:0,nok:[]};return{...d,nok:(d.nok||[]).map(z=>typeof z==='string'?{t:z,m:''}:z),st:d.nx>0?'nok':d.n>0&&d.ok===d.n?'ok':d.ok>0?'teil':'offen'}};
const stTag=r=>{const x=stat(r);return x.st==='offen'?null:el('span',{class:'tag st-'+x.st},x.st==='ok'?'✓ OK':x.st==='nok'?`✗ Nicht OK (${x.nx})`:`${x.ok}/${x.n}`)};
const fin=r=>{const x=stat(r);return x.n>0&&x.ok+x.nx===x.n};
const chips=(items,cur,set)=>el('div',{class:'chips'},items.map(([k,l,n])=>el('button',{class:'chip'+(k==='nok'?' nk':'')+(cur===k?' on':''),onclick:()=>{set(k);render()}},`${l} (${n})`)));
function setS(r,L,s,T={}){
  const nok=[...s].flatMap((c,k)=>c==='x'?[{i:k,t:L[k],m:T[k]||''}]:[]);
  const d=docOf(r.auftrag);
  pend.set(r.auftrag,{a:r.auftrag,team:r.team,n:s.length,ok:[...s].filter(c=>c==='o').length,nx:nok.length,s,nok,...(d&&d.min!=null?{min:d.min,...(d.tat?{tat:d.tat}:{}),...(d.dat?{dat:d.dat}:{}),...(d.von?{von:d.von}:{})}:{})});
  err='';saveOb();render();flush(r.auftrag);
}
// aktueller Stand (Status-String + Texte je Index); veraltete Ergebnisse (andere Listenlänge) zählen als leer
function cur(a,L){
  const d=docOf(a),n=L.length;
  if(!(d&&d.s&&d.n===n&&d.s.length===n))return{s:'-'.repeat(n),T:{}};
  const T={};for(const z of d.nok||[])if(z&&z.i!=null)T[z.i]=z.m||'';
  return{s:d.s,T};
}
// Zeitrückmeldung: Felder min (Minuten) und tat (Zeitstempel) im selben Ergebnis-Dokument
const fmt=m=>m>=60?`${Math.floor(m/60)} Std${m%60?' '+m%60+' Min':''}`:`${m} Min`;
const zTag=r=>{const d=docOf(r.auftrag);return d&&d.min!=null?el('span',{class:'tag'},'⏱ '+fmt(d.min)):null};
const today=()=>new Date().toLocaleDateString('sv-SE');
const dfmt=i=>i?i.split('-').reverse().join('.'):'';
const di=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?Math.round(Date.UTC(+v.slice(0,4),+v.slice(5,7)-1,+v.slice(8,10))/864e5)+25569:null;
const tf=v=>/^\d{2}:\d{2}$/.test(v||'')?(+v.slice(0,2)*60+ +v.slice(3,5))/1440:null;
const dOf=d=>d.dat||(d.tat?new Date(d.tat).toLocaleDateString('sv-SE'):'');
function setTime(r,L,min,dat,von){
  const d=docOf(r.auftrag),n=L.length,ok=!!(d&&d.s&&d.n===n&&d.s.length===n);
  const o={...(ok?d:{a:r.auftrag,team:r.team,n,ok:0,nx:0,s:'-'.repeat(n),nok:[]})};
  delete o.min;delete o.tat;delete o.dat;delete o.von;
  if(min>0){o.min=min;o.tat=Date.now();if(dat)o.dat=dat;if(von)o.von=von}
  pend.set(r.auftrag,o);err='';saveOb();render();flush(r.auftrag);
}
function saveTime(r,L){
  const t=(parseInt(tH||'0',10)||0)*60+(parseInt(tM||'0',10)||0);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(tD)){tE='Bitte ein Datum wählen.';render();return}
  if(tD>today()){tE='Das Datum liegt in der Zukunft.';render();return}
  if(tV&&!/^\d{2}:\d{2}$/.test(tV)){tE='Bitte eine gültige Uhrzeit wählen.';render();return}
  if(t<1||t>1440){tE='Bitte eine Dauer zwischen 1 Minute und 24 Stunden eingeben.';render();return}
  tE='';setTime(r,L,t,tD,tV);
}
function delTime(r,L){tH='';tM='';tE='';tV='';tD=today();setTime(r,L,null)}
function timeCard(r,mon){
  const d=docOf(r.auftrag),L=pl.st==='ok'?pl.list:null,has=!!(d&&d.min!=null);
  const c=el('div',{class:'card'},el('b',{},'Zeit'),
    el('p',{class:'mu'},has?`Durchgeführt am ${dfmt(dOf(d))||'–'}${d.von?' · ab '+d.von+' Uhr':''} · Dauer ${fmt(d.min)}`:'Noch keine Zeit zurückgemeldet.'));
  if(!mon)return c;
  const inp=(k,v,set)=>el('input',{class:'tm',type:'text',inputmode:'numeric',maxlength:'2','data-keep':k,placeholder:'0',value:v,oninput:e=>{set(e.target.value=e.target.value.replace(/\D/g,''))}});
  const gestern=()=>{const g=new Date();g.setDate(g.getDate()-1);return g.toLocaleDateString('sv-SE')};
  c.append(el('div',{class:'mu'},'Durchgeführt am'),
    el('div',{class:'zt'},el('input',{class:'dt',type:'date',max:today(),'data-nr':'1',value:tD,oninput:e=>{tD=e.target.value},onchange:e=>{tD=e.target.value}}),
      el('button',{onclick:()=>{tD=today();tE='';render()}},'Heute'),el('button',{onclick:()=>{tD=gestern();tE='';render()}},'Gestern')),
    el('div',{class:'mu'},'Beginn (Uhrzeit, optional)'),
    el('div',{class:'zt'},el('input',{class:'dt',type:'time','data-nr':'1',value:tV,oninput:e=>{tV=e.target.value},onchange:e=>{tV=e.target.value}}),
      el('button',{onclick:()=>{tV=new Date().toTimeString().slice(0,5);tE='';render()}},'Jetzt'),tV&&el('button',{onclick:()=>{tV='';render()}},'✕')),
    el('div',{class:'mu'},'Dauer'),
    el('div',{class:'qk'},[15,30,60,90,120,180].map(m=>el('button',{onclick:()=>{tH=String(Math.floor(m/60));tM=String(m%60);tE='';render()}},fmt(m)))),
    el('div',{class:'zt'},inp('h',tH,v=>{tH=v}),el('span',{},'Std'),inp('m',tM,v=>{tM=v}),el('span',{},'Min')),
    tE&&el('p',{class:'mu er'},tE),
    el('div',{class:'ob'},el('button',{class:'sv',disabled:L?null:'disabled',onclick:()=>saveTime(r,L)},has?'Zeit ändern':'Zeit speichern'),has&&el('button',{class:'er',onclick:()=>delTime(r,L)},'Löschen')));
  return c;
}
const put=(s,i,c)=>s.slice(0,i)+c+s.slice(i+1);
function markOk(r,L,i){
  armA=false;edi=null;
  const{s,T}=cur(r.auftrag,L);
  setS(r,L,put(s,i,s[i]==='o'?'-':'o'),T);
}
function openEd(i,txt){edi=i;edt=txt||'';edE=false;render();const n=app.querySelector('[data-keep="e"]');if(n)n.focus()}
function saveEd(r,L,i){
  const m=edt.trim();
  if(!m){edE=true;render();return}
  const{s,T}=cur(r.auftrag,L);T[i]=m;edi=null;armA=false;
  setS(r,L,put(s,i,'x'),T);
}
function resetEd(r,L,i){const{s,T}=cur(r.auftrag,L);edi=null;setS(r,L,put(s,i,'-'),T)}
// Offline-Outbox: ungesendete Ergebnisse liegen in pend + localStorage und werden automatisch erneut gesendet
let off=false,retryT=null,pfBusy=false;
const saveOb=()=>{try{localStorage.setItem('outbox',JSON.stringify([...pend]))}catch(e){}};
const loadOb=()=>{try{for(const [a,d] of JSON.parse(localStorage.getItem('outbox')||'[]'))pend.set(a,d)}catch(e){}};
const schedule=()=>{clearTimeout(retryT);retryT=setTimeout(flushAll,15000)};
const flushAll=()=>{for(const a of [...pend.keys()])flush(a)};
async function flush(a){
  const w=wq.get(a)||wq.set(a,{}).get(a);
  if(w.busy){w.dirty=true;return}
  w.busy=true;
  try{
    let last=null,sq=0;
    do{
      w.dirty=false;
      const d=pend.get(a);if(!d)break;
      last=d;
      sq=(await api('PUT','/api/ergebnis/'+encodeURIComponent(a),d)).sq;
    }while(w.dirty);
    if(last){ers.set(a,last);ersSq.set(a,sq)}
    pend.delete(a);saveOb();net=true;
    if(off&&!pend.size){off=false;const m=msg='✓ Alle Eingaben wurden übertragen';setTimeout(()=>{if(msg===m){msg='';render()}},6000)}
  }catch(e){
    if(e&&e.status>=400&&e.status<500&&e.status!==408&&e.status!==429){pend.delete(a);saveOb();err=errTxt(e)}  // dauerhafter Fehler
    else{off=true;if(e&&e.net)net=false;schedule()}                                                              // vorübergehend: behalten, später erneut senden
  }
  w.busy=false;render();
}

// ---- Server-Zugriff ----
async function api(method,url,body,timeout=20000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);
  let r;
  try{
    r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{})},body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal});
  }catch(e){clearTimeout(t);const n=new Error('Keine Verbindung zum Server');n.net=true;throw n}
  clearTimeout(t);
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    const e=new Error(j.error||('Fehler '+r.status));e.status=r.status;
    if(r.status===401&&tok){tok='';unlocked=false;render()}
    throw e;
  }
  return j;
}
// Excel im Hintergrund lesen/schreiben (Web Worker)
const work=(msg,tr)=>new Promise((ok,no)=>{
  const w=new Worker('/worker.js');
  w.onmessage=e=>{w.terminate();e.data.error?no(new Error(e.data.error)):ok(e.data.res)};
  w.onerror=()=>{w.terminate();no(new Error('Excel konnte nicht verarbeitet werden'))};
  w.postMessage(msg,tr||[]);
});
// Zwischenspeicher im Gerät (IndexedDB, keine 5-MB-Grenze)
const idb={
  p:null,
  open(){return this.p||(this.p=new Promise((ok,no)=>{if(typeof indexedDB==='undefined')return no(new Error('kein IndexedDB'));const r=indexedDB.open('auftraege',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}))},
  async get(k){try{const d=await this.open();return await new Promise((ok,no)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})}catch(e){return undefined}},
  async set(k,v){const d=await this.open();return new Promise((ok,no)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=ok;t.onerror=()=>no(t.error)})}
};
const enc=encodeURIComponent;
const skey=()=>ses.role==='dispo'?'dispo':ses.role==='monteur'?'m:'+(ses.team||''):'';
function rebuildChunks(){chunks=new Map();for(const r of ordersMap.values()){let c=chunks.get(r.team);if(!c)chunks.set(r.team,c={team:r.team,rows:[]});c.rows.push(r)}}
async function loadCacheFor(key){
  ordersMap=new Map();ers=new Map();ersSq=new Map();since=0;teamList=[];meta=null;pmeta=null;rebuildChunks();
  const c=await idb.get('st:'+key);
  if(c){
    for(const r of c.orders||[])ordersMap.set(r.auftrag,r);
    for(const [a,x] of Object.entries(c.ergebnis||{})){ers.set(a,x.doc);ersSq.set(a,x.sq)}
    teamList=c.teams||[];meta=c.meta||null;pmeta=c.pmeta||null;since=c.since||0;rebuildChunks();ready=true;
  }
}
function saveCache(){
  if(!sk)return;
  idb.set('st:'+sk,{since,orders:[...ordersMap.values()],ergebnis:Object.fromEntries([...ers].map(([a,d])=>[a,{doc:d,sq:ersSq.get(a)||0}])),teams:teamList,meta,pmeta}).catch(()=>{});
}
// Abgleich: nur Änderungen seit der letzten Änderungsnummer holen (Monteur: nur das eigene Team)
async function poll(){
  if(polling){again=true;return}
  const key=skey();if(!key)return;
  polling=true;
  try{
    if(key!==sk){sk=key;await loadCacheFor(key);render()}
    const team=ses.role==='monteur'?(ses.team||'-'):'';
    const j=await api('GET',`/api/sync?since=${since}&team=${enc(team)}`,undefined,20000);
    net=true;
    if(!j.same){
      if(j.full){ordersMap=new Map();ers=new Map();ersSq=new Map()}
      for(const r of j.orders||[]){if(r.del)ordersMap.delete(r.auftrag);else ordersMap.set(r.auftrag,r)}
      for(const x of j.ergebnis||[])if(x.sq>(ersSq.get(x.a)||0)){ers.set(x.a,x.doc);ersSq.set(x.a,x.sq)}   // ältere Stände nie über neuere schreiben
      if(j.full||(j.orders&&j.orders.length))rebuildChunks();
      const oa=(pmeta&&pmeta.at)||0;
      teamList=j.teams;meta=j.meta.upload||null;pmeta=j.meta.pruef||null;since=j.seq;ready=true;
      clearTimeout(cacheT);cacheT=setTimeout(saveCache,1500);
      if(((pmeta&&pmeta.at)||0)!==oa){
        if(ses.role==='monteur')prefetch().then(()=>{if(openA)showOrder(openA)});
        else{pcache.clear();if(openA)showOrder(openA)}
      }
      const a=document.activeElement;
      if(edi===null&&!(a&&a.dataset&&a.dataset.nr))render();
    }
    if(off&&!pend.size)off=false;
    if(pend.size)flushAll();
  }catch(e){if(e.net)net=false;else if(!/^Nicht angemeldet/.test(e.message||''))err=errTxt(e)}
  polling=false;
  if(again){again=false;poll()}
}
// Prüfobjekt-Listen des eigenen Teams vorab laden (nur Änderungen), damit Aufträge auch ohne Netz geöffnet werden können
async function prefetch(){
  if(pfBusy||ses.role!=='monteur'||!ses.team)return;
  pfBusy=true;
  try{
    const team=ses.team;
    if(!plC||plC.team!==team){const c=(await idb.get('pl:'+team))||{};plC={team,seq:c.seq||0,map:c.map||{}};for(const [a,l] of Object.entries(plC.map))pcache.set(a,l)}
    const j=await api('GET',`/api/pruef?team=${enc(team)}&since=${plC.seq}`,undefined,60000);
    for(const [a,l] of Object.entries(j.map)){pcache.set(a,l);plC.map[a]=l}
    plC.seq=j.seq;
    idb.set('pl:'+team,{seq:plC.seq,map:plC.map}).catch(()=>{});
  }catch(e){}
  pfBusy=false;
}
