      /**
       * Karte eines Auftrags (Liste und Detailkopf). clickable = true: antippbar, öffnet den Auftrag (merkt die
       * Scroll-Position und legt einen History-Eintrag für die Zurück-Taste an). showTeam: Team-Etikett und – für den
       * Disponenten – die „Nicht OK“-Texte direkt auf der Karte.
       */
      const orderCard = (order, showTeam, clickable = true) => {
        const isDispo = session.role === 'dispo',
          result = resultOf(order.auftrag);
        return el(
          'div',
          {
            class:
              'card' +
              (clickable ? ' cl' : '') +
              (isDispo && clickable && markState(order.auftrag) === 1 ? ' dn' : ''),
            // Anker für render(): hält die Liste an derselben Stelle, wenn oben etwas dazukommt oder wegfällt (siehe viewportAnchors)
            'data-k': clickable ? 'o' + order.auftrag : null,
            onclick: clickable
              ? () => {
                  listScrollY = scrollY;
                  if (!(history.state && history.state.a)) history.pushState({ a: order.auftrag }, '');
                  openOrderDetail(order);
                  scrollTo(0, 0);
                }
              : null
          },
          el(
            'div',
            { class: 'row' },
            el('b', {}, order.auftrag),
            showTeam && el('span', { class: 'tag' }, order.team),
            order.art && el('span', { class: 'tag' }, order.art),
            statusTags(order),
            timeTag(order),
            clickable && el('span', { class: 'chev' }, 'Prüfobjekte ›')
          ),
          el('div', { class: 'kt' }, order.kurz || '–'),
          (order.str || order.plz) &&
            el('div', { class: 'mu' }, [order.plz, order.str].filter(Boolean).join(' ')),
          order.tp && el('div', { class: 'mu' }, 'Techn. Platz: ' + order.tp),
          (order.start || order.ende) &&
            el('div', { class: 'mu' }, 'Termin: ' + [order.start, order.ende].filter(Boolean).join(' – ')),
          isDispo &&
            result &&
            result.min != null &&
            result.tat &&
            el('div', { class: 'mu' }, 'Rückgemeldet: ' + formatDateTime(result.tat)),
          clickable &&
            showTeam &&
            orderStatus(order).nx > 0 &&
            el(
              'div',
              { class: 'nokbox' },
              el('b', {}, 'Nicht OK:'),
              ...orderStatus(order).nok.map(x =>
                el('div', { class: 'nk1' }, '• ' + x.t, x.m && el('div', { class: 'mu' }, '→ ' + x.m))
              )
            ),
          isDispo && markRow(order)
        );
      };

      // ---- Fortschritt + Wochenpensum bis Jahresende (Monteur-Teamansicht) ----
      // Arbeitstage = Mo–Fr ohne gesetzliche Feiertage in Österreich, ab heute (inkl.) bis zur Frist
      const deadline = () => new Date(new Date().getFullYear(), 11, 31); // Frist: 31.12. des laufenden Jahres
      // Ostersonntag nach der Gauß'schen Osterformel (y = Jahr)
      const easterSunday = year => {
        const a = year % 19,
          b = Math.floor(year / 100),
          c = year % 100,
          d = Math.floor(b / 4),
          e = b % 4,
          f = Math.floor((b + 8) / 25),
          g = Math.floor((b - f + 1) / 3),
          h = (19 * a + b - d - g + 15) % 30,
          i = Math.floor(c / 4),
          k = c % 4,
          l = (32 + 2 * e + 2 * i - h - k) % 7,
          m = Math.floor((a + 11 * h + 22 * l) / 451),
          n = h + l - 7 * m + 114;
        return new Date(year, Math.floor(n / 31) - 1, (n % 31) + 1);
      };
      // Menge der gesetzlichen Feiertage (JJJJ-MM-TT) in Österreich für das Jahr
      const holidays = year => {
        const easter = easterSunday(year),
          shift = t => {
            const x = new Date(easter);
            x.setDate(x.getDate() + t);
            return x.toLocaleDateString('sv-SE');
          };
        // feste Feiertage + Ostermontag (+1), Christi Himmelfahrt (+39), Pfingstmontag (+50), Fronleichnam (+60)
        return new Set(
          ['01-01', '01-06', '05-01', '08-15', '10-26', '11-01', '12-08', '12-25', '12-26']
            .map(x => year + '-' + x)
            .concat([shift(1), shift(39), shift(50), shift(60)])
        );
      };
      // Anzahl Arbeitstage (Mo–Fr ohne Feiertage) von heute bis einschließlich until
      function workingDaysUntil(until) {
        const now = new Date(),
          day = new Date(now.getFullYear(), now.getMonth(), now.getDate()),
          holidaySet = holidays(day.getFullYear());
        let count = 0;
        for (; day <= until; day.setDate(day.getDate() + 1)) {
          const weekday = day.getDay();
          if (weekday > 0 && weekday < 6 && !holidaySet.has(day.toLocaleDateString('sv-SE'))) count++;
        }
        return count;
      }
      /**
       * Karte „Fortschritt“ für die Monteur-Teamliste: Prozent erledigt, Balken und das nötige Wochenpensum
       * (offene Aufträge / Arbeitswochen bis zur Frist). 100 % erscheint nur, wenn wirklich alles erledigt ist.
       */
      function progressCard(total, done) {
        const openCount = total - done,
          percentDone = done === total ? 100 : Math.min(99, Math.round((done / total) * 100)),
          deadlineDate = deadline(),
          workingDays = workingDaysUntil(deadlineDate);
        const perWeek = openCount && workingDays ? Math.ceil(openCount / (workingDays / 5)) : 0; // mindestens so viele Aufträge pro Arbeitswoche (5 Arbeitstage)
        const deadlineText = deadlineDate.toLocaleDateString('de-AT', { day: '2-digit', month: '2-digit' });
        return el(
          'div',
          { class: 'card prg' },
          el(
            'div',
            { class: 'pb' },
            el(
              'div',
              { class: 'pt' },
              el('span', { class: 'pp' }, `${percentDone} %`),
              el('span', { class: 'mu' }, 'erledigt')
            ),
            el(
              'div',
              {
                class: 'pbar',
                role: 'progressbar',
                'aria-valuemin': '0',
                'aria-valuemax': '100',
                'aria-valuenow': String(percentDone)
              },
              el('div', { class: 'pd', style: `width:${(done / total) * 100}%` })
            ),
            el(
              'div',
              { class: 'mu' },
              openCount
                ? `${done} von ${total} · ${openCount} offen (${100 - percentDone} %)`
                : `Alle ${total} Aufträge erledigt`
            )
          ),
          el(
            'div',
            { class: 'ps' + (openCount && !workingDays ? ' warn' : '') },
            !openCount
              ? [el('div', { class: 'pn ok' }, '✓'), el('div', { class: 'mu' }, 'Ziel erreicht')]
              : !workingDays
                ? [
                    el('div', { class: 'pn' }, String(openCount)),
                    el('div', { class: 'mu' }, `offen – Frist ${deadlineText} vorbei`)
                  ]
                : [
                    el('div', { class: 'pn' }, '≥ ' + perWeek),
                    el('div', { class: 'mu' }, 'Prüfungen / Woche'),
                    el('div', { class: 'mu sm' }, `bis ${deadlineText} · ${workingDays} Arbeitstage`)
                  ]
          )
        );
      }
      // Liste der Aufträge als Kartenraster (gefiltert nach Suche, sortiert nach Auftragsnummer, höchstens 300 Karten)
      function orderList(rows, showTeam) {
        const filtered = rows.filter(matchesSearch).sort((a, b) => naturalCompare(a.auftrag, b.auftrag));
        const container = el('div', {});
        container.append(
          el('p', { class: 'mu' }, filtered.length === 1 ? '1 Auftrag' : `${filtered.length} Aufträge`),
          el(
            'div',
            { class: 'grid', 'data-list': '1' },
            filtered.slice(0, 300).map(r => orderCard(r, showTeam))
          )
        );
        if (filtered.length > 300)
          container.append(el('p', { class: 'mu' }, 'Nur die ersten 300 angezeigt – Suche nutzen.'));
        return container;
      }
      // ---- Vergleich (Disponent): Aufträge-Excel (Original) gegen den Export dieser App ----
      // Es gelten nur zwei Regeln. „Erledigt“ bedeutet hier: vom Disponenten abgehakt (Spalte „Abgehakt am“ im Export).
      //   · nicht abgehakt -> der Auftrag muss in der Aufträge-Excel stehen
      //   · abgehakt       -> der Auftrag darf dort nicht mehr stehen
      // Alles andere (Status, Prüfergebnis, Aufträge, die nur in der Excel stehen) wird ignoriert.
      // Die Dateien werden nur im Browser gelesen und nicht hochgeladen.
      // cmpOrderFiles / cmpExportFiles: gewählte Dateien · cmpResult: Ergebnis des Vergleichs · cmpFilter: gewählter Chip
      let cmpOrderFiles = [],
        cmpExportFiles = [],
        cmpResult = null,
        cmpFilter = '',
        cmpBusy = false;
      // Bewertungstexte: fehlt = nicht abgehakt, fehlt aber in der Excel · noch = abgehakt, steht noch in der Excel · ok = stimmt
      const CMP_LABELS = {
        fehlt: 'Nicht abgehakt – fehlt in der Excel',
        noch: 'Abgehakt – steht noch in der Excel',
        ok: 'Stimmt überein'
      };
      /**
       * Liest beide Dateien im Worker (type 'cmp') und vergleicht: Basis sind die Aufträge des Exports. Erkennt vertauschte
       * Dateien (die Aufträge-Excel hat keine Spalte „Abgehakt am“, der Export schon). Ergebnis in cmpResult.
       */
      async function runComparison() {
        cmpBusy = true;
        errorMsg = '';
        cmpResult = null;
        render();
        try {
          const read = async fl => {
            const m = new Map();
            let hk = false;
            for (const f of fl) {
              const buf = await f.arrayBuffer();
              const r = await runExcelWorker({ type: 'cmp', buf }, [buf]);
              hk = hk || r.hasStatus;
              for (const o of r.rows) m.set(o.auftrag, o);
            }
            return { m, hk };
          };
          const ordersExcel = await read(cmpOrderFiles),
            exportExcel = await read(cmpExportFiles);
          if (ordersExcel.hk)
            throw new Error(
              'Die Datei bei „Aufträge-Excel“ hat eine Spalte „Abgehakt am“ und sieht wie der Export aus – bitte die beiden Dateien tauschen.'
            );
          if (!exportExcel.hk)
            throw new Error(
              'Die Datei bei „Export“ hat keine Spalte „Abgehakt am“ – bitte den aktuellen Excel-Export aus der Übersicht verwenden.'
            );
          if (!ordersExcel.m.size)
            throw new Error('In der Aufträge-Excel wurden keine Aufträge gefunden (Spalte „Auftrag“ nötig).');
          if (!exportExcel.m.size) throw new Error('Im Export wurden keine Aufträge gefunden.');
          const rows = [];
          for (const o of exportExcel.m.values()) {
            const x = ordersExcel.m.get(o.auftrag),
              hak = !!o.hak;
            rows.push({
              k: !hak && !x ? 'fehlt' : hak && x ? 'noch' : 'ok',
              a: o.auftrag,
              team: o.team || (x && x.team) || '',
              kurz: o.kurz || (x && x.kurz) || '',
              hak: o.hak,
              ex: !!x
            });
          }
          rows.sort((p, q) => naturalCompare(p.a, q.a));
          const counts = { fehlt: 0, noch: 0, ok: 0 };
          rows.forEach(r => counts[r.k]++);
          cmpResult = {
            rows,
            cnt: counts,
            nA: ordersExcel.m.size,
            nB: exportExcel.m.size,
            nH: rows.filter(r => r.hak).length
          };
          cmpFilter = counts.fehlt + counts.noch ? '' : 'ok';
        } catch (e) {
          errorMsg = errorMessageOf(e);
        }
        cmpBusy = false;
        render();
      }
      // Seite „Vergleich“: Dateiauswahl, Ergebnis-Zusammenfassung, Filter-Chips und Tabelle (höchstens 500 Zeilen)
      function drawComparison() {
        const pick = (lbl, hint, get, set, multi) => {
          const inp = el('input', {
            type: 'file',
            accept: '.xlsx,.xls',
            multiple: multi ? 'multiple' : null,
            onchange: e => {
              set([...e.target.files]);
              cmpResult = null;
              errorMsg = '';
              render();
            }
          });
          const fl = get();
          return el(
            'div',
            { class: 'card' },
            el('b', {}, lbl),
            el('p', { class: 'mu' }, hint),
            el('label', { class: 'fpick' }, fl.length ? 'Andere Datei wählen' : 'Datei wählen', inp),
            fl.length > 0 && el('p', { class: 'mu fnm' }, '✓ ' + fl.map(f => f.name).join(', '))
          );
        };
        app.append(
          el(
            'div',
            { class: 'ugrid' },
            pick(
              '1. Aufträge-Excel',
              'Die Datei, die sonst als Aufträge hochgeladen wird (Spalte „Auftrag“).',
              () => cmpOrderFiles,
              v => {
                cmpOrderFiles = v;
              },
              true
            ),
            pick(
              '2. Export aus dieser App',
              'Der Excel-Export aus der Übersicht („⬇ Excel exportieren“) mit der Spalte „Abgehakt am“.',
              () => cmpExportFiles,
              v => {
                cmpExportFiles = v;
              }
            )
          )
        );
        app.append(
          el(
            'button',
            {
              class: 'pri vgbtn',
              disabled: cmpBusy || !cmpOrderFiles.length || !cmpExportFiles.length ? 'disabled' : null,
              onclick: runComparison
            },
            cmpBusy ? 'Vergleiche …' : 'Vergleichen'
          )
        );
        // Vergleich läuft: Platzhalter, bis das Ergebnis da ist
        if (cmpBusy) {
          app.append(skeletonTable());
          return;
        }
        if (!cmpResult) {
          app.append(
            el(
              'p',
              { class: 'mu' },
              'Geprüft wird nur: Nicht abgehakte Aufträge müssen in der Aufträge-Excel stehen, abgehakte Aufträge dürfen dort nicht mehr stehen. Alles andere (Status, Prüfergebnis, Aufträge nur in der Excel) wird ignoriert. Die Dateien werden nur hier im Browser gelesen und nicht hochgeladen.'
            )
          );
          return;
        }
        const result = cmpResult,
          counts = result.cnt,
          discrepancies = counts.fehlt + counts.noch;
        app.append(
          el(
            'div',
            { class: 'card vgsum ' + (discrepancies ? 'bad' : 'good') },
            el(
              'b',
              {},
              discrepancies
                ? `⚠ ${discrepancies} ${discrepancies === 1 ? 'Abweichung' : 'Abweichungen'} gefunden`
                : '✓ Keine Abweichungen'
            ),
            el(
              'p',
              { class: 'mu' },
              `Export: ${result.nB} Aufträge (${result.nH} abgehakt, ${result.nB - result.nH} nicht abgehakt) · Aufträge-Excel: ${result.nA} Aufträge`
            )
          )
        );
        app.append(
          filterChips(
            [
              ['', 'Abweichungen', discrepancies],
              ['fehlt', 'Nicht abgehakt, fehlt in Excel', counts.fehlt],
              ['noch', 'Abgehakt, noch in Excel', counts.noch],
              ['ok', 'Stimmt überein', counts.ok],
              ['all', 'Alle', result.rows.length]
            ],
            cmpFilter,
            k => {
              cmpFilter = k;
            }
          )
        );
        const filtered = result.rows.filter(
          r => cmpFilter === 'all' || (cmpFilter === '' ? r.k !== 'ok' : r.k === cmpFilter)
        );
        if (!filtered.length) {
          app.append(el('p', { class: 'mu' }, 'Keine Einträge.'));
          return;
        }
        const tbody = el(
          'tbody',
          {},
          filtered
            .slice(0, 500)
            .map(r =>
              el(
                'tr',
                { class: 'vg-' + r.k },
                el('td', {}, r.a),
                el('td', { class: 'vk' }, CMP_LABELS[r.k]),
                el('td', {}, r.team || '–'),
                el('td', { class: 'wr' }, r.kurz || '–'),
                el('td', {}, r.hak || 'nicht abgehakt'),
                el('td', {}, r.ex ? 'ja' : 'nein')
              )
            )
        );
        app.append(
          el('p', { class: 'mu' }, filtered.length === 1 ? '1 Eintrag' : `${filtered.length} Einträge`),
          el(
            'div',
            { class: 'gtw card' },
            el(
              'table',
              { class: 'gt vgt' },
              el(
                'thead',
                {},
                el(
                  'tr',
                  {},
                  ['Auftrag', 'Bewertung', 'Team', 'Kurztext', 'Abgehakt am', 'In Excel'].map(h =>
                    el('th', {}, h)
                  )
                )
              ),
              tbody
            )
          )
        );
        if (filtered.length > 500)
          app.append(el('p', { class: 'mu' }, 'Nur die ersten 500 angezeigt – Filter nutzen.'));
      }
      // ---- Fortschritt aller Teams (Disponent): Gesamt + je Team, live aus denselben Daten wie die Übersicht ----
      // teamSort: 'n' nach Name | 'p' nach Fortschritt (im Gerät gespeichert) · teamTableView: Tabelle statt Diagramm
      let teamSort = 'n',
        teamTableView = false;
      try {
        teamSort = localStorage.getItem('gsort') === 'p' ? 'p' : 'n';
      } catch (e) {}
      const percent = (a, n) => (!n ? 0 : a === n ? 100 : Math.min(99, Math.round((a / n) * 100))); // 100 % nur wenn wirklich alles erledigt
      const weeklyQuota = (rest, at) => (rest && at ? Math.ceil(rest / (at / 5)) : 0); // nötige Prüfungen pro Arbeitswoche bis zur Frist
      // Zahl mit deutscher Tausendertrennung
      const formatNumber = v => Number(v).toLocaleString('de-AT');
      // Kennzahlen je Team: { team, n (Aufträge), done, teil (in Arbeit), nok (mit Nicht OK) }
      function teamStats() {
        const byTeam = new Map();
        for (const r of allOrders()) {
          let stats = byTeam.get(r.team);
          if (!stats) byTeam.set(r.team, (stats = { team: r.team, n: 0, done: 0, teil: 0, nok: 0 }));
          const status = orderStatus(r);
          stats.n++;
          if (status.st === 'done') stats.done++;
          else if (status.st === 'teil') stats.teil++;
          if (status.nx > 0) stats.nok++;
        }
        return [...byTeam.values()];
      }
      // gestapelter Balken: erledigt | in Arbeit | offen (Breite proportional zur Anzahl)
      const stackedBar = (stats, cls) =>
        el(
          'div',
          { class: 'gbar' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
          [
            [stats.done, 'g2'],
            [stats.teil, 'g1'],
            [stats.n - stats.done - stats.teil, 'g0']
          ]
            .filter(([v]) => v > 0)
            .map(([v, c]) => el('span', { class: c, style: 'flex-grow:' + v }))
        );
      // Reihen der Grafik: CSS-Klasse -> Beschriftung
      const STATUS_SERIES = [
        ['g2', 'Erledigt'],
        ['g1', 'In Arbeit'],
        ['g0', 'Offen']
      ];
      // Kennzahl-Kachel (Beschriftung, Wert, Farbmuster, Warnfarbe)
      const kpiTile = (label, value, swatch, warn) =>
        el(
          'div',
          { class: 'kpi' },
          el('div', { class: 'mu' }, swatch && el('i', { class: 'sw ' + swatch }), label),
          el('div', { class: 'kv' + (warn ? ' er' : '') }, (warn ? '✗ ' : '') + formatNumber(value))
        );
      // Karte „Gesamt · alle Teams“: Prozent, Balken, Kennzahlen und nötiges Wochenpensum
      function totalCard(totals, workingDays, deadlineText) {
        const openCount = totals.n - totals.done - totals.teil,
          remaining = totals.n - totals.done,
          perWeek = weeklyQuota(remaining, workingDays);
        return el(
          'div',
          { class: 'card', 'data-k': 'tc' },
          el('b', {}, 'Gesamt · alle Teams'),
          el(
            'div',
            { class: 'ghero' },
            el('span', { class: 'gp' }, percent(totals.done, totals.n) + ' %'),
            el('span', { class: 'mu' }, 'erledigt')
          ),
          stackedBar(totals, 'big'),
          el(
            'div',
            { class: 'gkpi' },
            kpiTile('Aufträge', totals.n),
            kpiTile('Erledigt', totals.done, 'g2'),
            kpiTile('In Arbeit', totals.teil, 'g1'),
            kpiTile('Offen', openCount, 'g0'),
            kpiTile('Nicht OK', totals.nok, null, totals.nok > 0)
          ),
          el(
            'p',
            { class: 'mu' },
            !remaining
              ? '✓ Alle Aufträge erledigt'
              : workingDays
                ? `Bis ${deadlineText} sind noch mindestens ${formatNumber(perWeek)} Prüfungen pro Woche nötig (${workingDays} Arbeitstage).`
                : `Die Frist ${deadlineText} ist vorbei – ${formatNumber(remaining)} Aufträge sind noch nicht erledigt.`
          )
        );
      }
      // Klick auf ein Team -> Übersicht mit Teamfilter
      const openTeamOverview = t => {
        teamFilter = t;
        statusFilter = '';
        reportedFilter = '';
        reportedFrom = '';
        reportedTo = '';
        searchText = '';
        armMarkAll = false;
        dispoTab = 'ue';
        render();
        scrollTo(0, 0);
      };
      /**
       * Karte „Fortschritt je Team“ als Diagramm (ein Balken je Team, Klick öffnet die Aufträge) oder Tabelle
       * (mit Summenzeile). Je Team ein 📣-Knopf für Nachrichten (siehe openSendDialog).
       */
      function teamProgressCard(teamRows, totals, workingDays) {
        const sorted = [...teamRows].sort(
          teamSort === 'p'
            ? (a, b) => a.done / a.n - b.done / b.n || naturalCompare(a.team, b.team)
            : (a, b) => naturalCompare(a.team, b.team)
        );
        const panel = el(
          'div',
          { class: 'card', 'data-k': 'tp' },
          el(
            'div',
            { class: 'ghead' },
            el('b', {}, `Fortschritt je Team (${teamRows.length})`),
            el(
              'div',
              { class: 'chips' },
              [
                [false, 'Diagramm'],
                [true, 'Tabelle']
              ].map(([k, l]) =>
                el(
                  'button',
                  {
                    class: 'chip' + (teamTableView === k ? ' on' : ''),
                    onclick: () => {
                      teamTableView = k;
                      render();
                    }
                  },
                  l
                )
              )
            )
          ),
          el(
            'div',
            { class: 'gsub' },
            el(
              'div',
              { class: 'glg' },
              STATUS_SERIES.map(([k, l]) => el('span', {}, el('i', { class: 'sw ' + k }), l))
            ),
            el(
              'div',
              { class: 'chips' },
              el('span', { class: 'mu' }, 'Sortieren:'),
              [
                ['n', 'Name'],
                ['p', 'Fortschritt']
              ].map(([k, l]) =>
                el(
                  'button',
                  {
                    class: 'chip' + (teamSort === k ? ' on' : ''),
                    onclick: () => {
                      teamSort = k;
                      try {
                        localStorage.setItem('gsort', k);
                      } catch (e) {}
                      render();
                    }
                  },
                  l
                )
              )
            )
          )
        );
        if (teamTableView) {
          const tableRow = (t, name) => {
            const op = t.n - t.done - t.teil;
            return el(
              'tr',
              name ? {} : { onclick: () => openTeamOverview(t.team) },
              el('td', {}, name || t.team),
              ...[t.n, t.done, t.teil, op].map(v => el('td', { class: 'n' }, formatNumber(v))),
              el('td', { class: 'n' + (t.nok ? ' er' : '') }, t.nok ? '✗ ' + formatNumber(t.nok) : '0'),
              el('td', { class: 'n' }, percent(t.done, t.n) + ' %'),
              el(
                'td',
                { class: 'n' },
                t.n > t.done
                  ? workingDays

                    : 'Frist vorbei'
                  : '✓'
              ),
              el(
                'td',
                {},
                name
                  ? ''
                  : [
                      messageButton(t),
                      activeMessage(t.team) &&
                        el('span', { class: 'gms' }, messageStatus(activeMessage(t.team), t.team))
                    ]
              )
            );
          };
          panel.append(
            el(
              'div',
              { class: 'gtw' },
              el(
                'table',
                { class: 'gt' },
                el(
                  'thead',
                  {},
                  el(
                    'tr',
                    {},
                    [
                      'Team',
                      'Aufträge',
                      'Erledigt',
                      'In Arbeit',
                      'Offen',
                      'Nicht OK',
                      'Erledigt %',
                      'Pensum / Woche',
                      'Nachricht'
                    ].map((h, i) => el('th', { class: i && i < 8 ? 'n' : null }, h))
                  )
                ),
                el(
                  'tbody',
                  {},
                  sorted.map(t => tableRow(t))
                ),
                el('tfoot', {}, tableRow(totals, 'Gesamt'))
              )
            )
          );
        } else {
          panel.append(
            el(
              'div',
              { class: 'grows' },
              sorted.map(t => {
                const op = t.n - t.done - t.teil,
                  p = percent(t.done, t.n),
                  pens = t.n > t.done ? weeklyQuota(t.n - t.done, workingDays) : 0;
                const lab =
                  `${t.team}: ${p} % erledigt, ${t.done} von ${t.n}, ${t.teil} in Arbeit, ${op} offen` +
                  (t.nok ? `, ${t.nok} Nicht OK` : '') +
                  (pens ? `, mindestens ${pens} Prüfungen pro Woche nötig` : '') +
                  '. Öffnet die Aufträge des Teams.';
                const am = activeMessage(t.team);
                return el(
                  'div',
                  { class: 'grr' },
                  el(
                    'button',
                    {
                      class: 'grow',
                      'aria-label': lab,
                      onclick: () => openTeamOverview(t.team),
                      onpointermove: e => showTooltip(e, t, p, op, pens),
                      onpointerleave: hideTooltip
                    },
                    el('span', { class: 'gn' }, t.team),
                    stackedBar(t),
                    el(
                      'span',
                      { class: 'gv' },
                      el('b', {}, p + ' %'),
                      el('span', { class: 'mu' }, ` ${formatNumber(t.done)}/${formatNumber(t.n)}`),
                      t.nok > 0 && el('span', { class: 'gnk' }, `✗ ${formatNumber(t.nok)} Nicht OK`),
                      am && el('span', { class: 'gms' }, '📣 ' + messageStatus(am, t.team))
                    )
                  ),
                  messageButton(t)
                );
              })
            )
          );
        }
        panel.append(
          el(
            'p',
            { class: 'mu' },
            'Tippe auf ein Team, um seine Aufträge in der Übersicht zu sehen. Mit 📣 schickst du dem Team eine Nachricht aufs Handy.'
          )
        );
        return panel;
      }
      // ---- Update: neue Version automatisch laden, wenn gerade nichts Ungespeichertes offen ist ----
      /**
       * Vergleicht die Server-Version mit APPVER. Weicht sie ab, wird automatisch neu geladen – aber nur, wenn gerade nichts
       * Ungespeichertes offen ist (Auftrag, laufender Upload, Dialog, eingeloggter Disponent, Eingabefeld);
       * sonst erscheint ein Banner „Jetzt aktualisieren“. Pro Version wird nur einmal automatisch neu geladen.
       */
      function checkAppVersion(version) {
        if (APPVER.startsWith('__') || version === APPVER) return;
        const first = newVersion !== version;
        newVersion = version;
        let tried = '';
        try {
          tried = sessionStorage.getItem('rl') || '';
        } catch (e) {}
        const focused = document.activeElement,
          inUse =
            openOrder ||
            busy ||
            document.querySelector('dialog[open]') ||
            (session.role === 'dispo' && dispoUnlocked) ||
            (focused && /^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName));
        if (tried !== version && !inUse) {
          try {
            sessionStorage.setItem('rl', version);
          } catch (e) {}
          location.reload();
          return;
        }
        // sonst beim nächsten Abgleich erneut versuchen
        if (first) render();
      }
      // „Jetzt aktualisieren“
      const reloadApp = () => {
        try {
          sessionStorage.setItem('rl', newVersion);
        } catch (e) {}
        location.reload();
      };
      // ---- Nachrichten an Teams ----
      // Disponent: Nachrichten gehen aufs Handy der Monteure (Push) und erscheinen dort als Fenster, das nur mit „Bestätigen“
      // zugeht; der Server erinnert wiederholt, bis alle Geräte des Teams bestätigt haben.
      // aktuelle (nicht beendete, nicht abgelaufene) Nachricht eines Teams
      const activeMessage = team =>
        messages.find(m => m.team === team && !m.closed && Date.now() - m.at < pushConfig.hours * 3600e3);
      // „1 Gerät“ / „n Geräte“
      const deviceCount = n => (n === 1 ? '1 Gerät' : formatNumber(n) + ' Geräte');
      // Bestätigungsstand einer Nachricht für die Dispo-Anzeige („3 von 5 Geräten bestätigt“, „✓ alle bestätigt“)
      function messageStatus(message, team) {
        const counts = devices[team] || [0, 0],
          acked = Math.min(message.acks | 0, counts[0]);
        return !counts[0]
          ? 'gesendet ' + formatDateTime(message.at)
          : acked >= counts[0]
            ? '✓ alle bestätigt'
            : `${acked} von ${formatNumber(counts[0])} ${counts[0] === 1 ? 'Gerät' : 'Geräten'} bestätigt`;
      }
      // 📣-Knopf: öffnet den Dialog zum Senden einer Nachricht an ein Team
      const messageButton = stats => {
        const active = activeMessage(stats.team);
        return el(
          'button',
          {
            class: 'gmsg' + (active ? ' on' : ''),
            title: 'Nachricht an ' + stats.team,
            'aria-label':
              `Nachricht an Team ${stats.team} senden` + (active ? ' (offene Nachricht vorhanden)' : ''),
            onclick: e => {
              e.stopPropagation();
              openSendDialog(stats);
            }
          },
          '📣'
        );
      };
      // Dialog des Disponenten: Nachricht senden / Erinnerung beenden
      const sendDialog = el('dialog', { class: 'dlg' });
      document.body.append(sendDialog);
      /**
       * Dialog „Nachricht an <Team>“: zeigt angemeldete Geräte / solche mit Benachrichtigungen, die offene Nachricht
       * (mit Bestätigungsstand) und ein Textfeld mit Vorschlag. Senden: POST /api/msg; „Erinnerung beenden“: POST /api/msg/close.
       */
      function openSendDialog(stats) {
        hideTooltip();
        const counts = devices[stats.team] || [0, 0],
          active = activeMessage(stats.team),
          errorLine = el('p', { class: 'mu er' });
        const textarea = el('textarea', { rows: '4', maxlength: '300', 'aria-label': 'Nachricht' });
        textarea.value = `Bitte mit den Prüfberichten schneller weitermachen! Aktueller Stand: ${percent(stats.done, stats.n)} % erledigt (${formatNumber(stats.done)} von ${formatNumber(stats.n)}).`;
        const sendButton = el('button', { class: 'sv' }, active ? 'Neu senden' : 'Senden');
        sendButton.onclick = async () => {
          const text = textarea.value.trim();
          if (!text || sendButton.disabled) return;
          sendButton.disabled = true;
          sendButton.textContent = 'Sende …';
          errorLine.textContent = '';
          try {
            await api('POST', '/api/msg', { team: stats.team, text }, 30000);
            sendDialog.close();
            errorMsg = '';
            poll();
            render();
          } catch (e) {
            errorLine.textContent = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
            sendButton.disabled = false;
            sendButton.textContent = active ? 'Neu senden' : 'Senden';
          }
        };
        sendDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b' },
            el('div', { class: 'dlg-t' }, '📣 Nachricht an ' + stats.team),
            el(
              'p',
              { class: 'mu' },
              counts[0]
                ? `${deviceCount(counts[0])} angemeldet, davon ${formatNumber(counts[1])} mit Benachrichtigungen.`
                : 'Noch kein Gerät dieses Teams angemeldet.'
            ),
            counts[0] > counts[1] &&
              el(
                'p',
                { class: 'mu er' },
                counts[1]
                  ? `${deviceCount(counts[0] - counts[1])} ohne Benachrichtigungen – dort erscheint die Nachricht erst beim Öffnen der App.`
                  : 'Kein Gerät hat Benachrichtigungen aktiviert – die Nachricht erscheint erst beim Öffnen der App.'
              ),
            active &&
              el(
                'div',
                { class: 'amsg' },
                el('b', {}, 'Offene Nachricht von ' + formatDateTime(active.at)),
                el('div', {}, active.text),
                el('div', { class: 'mu' }, messageStatus(active, stats.team)),
                el(
                  'button',
                  {
                    class: 'er',
                    onclick: async () => {
                      try {
                        await api('POST', '/api/msg/close', { id: active.id });
                        sendDialog.close();
                        infoMsg = '';
                        poll();
                        render();
                      } catch (e) {
                        errorLine.textContent = errorMessageOf(e);
                      }
                    }
                  },
                  'Erinnerung beenden'
                )
              ),
            textarea,
            el(
              'p',
              { class: 'mu' },
              `Die Monteure bekommen eine Benachrichtigung, die ${pushConfig.nag === 1 ? 'jede Minute' : 'alle ' + pushConfig.nag + ' Minuten'} wiederkommt, bis sie auf „Bestätigen“ tippen (längstens ${pushConfig.hours} Stunden).` +
                (active ? ' Eine neue Nachricht ersetzt die offene.' : '')
            ),
            errorLine,
            el(
              'div',
              { class: 'ob' },
              sendButton,
              el('button', { onclick: () => sendDialog.close() }, 'Abbrechen')
            )
          )
        );
        sendDialog.showModal();
        textarea.focus();
      }
      // Monteur: offene Nachricht als Fenster, das nur mit „Bestätigen“ zugeht (Esc/Abbrechen sind gesperrt)
      const readDialog = el('dialog', { class: 'dlg mdlg' });
      document.body.append(readDialog);
      let shownMessage = null;
      readDialog.addEventListener('cancel', e => e.preventDefault());
      // schließt der Browser das Fenster trotzdem, wird es wieder geöffnet
      readDialog.addEventListener('close', () => {
        if (shownMessage) {
          shownMessage = null;
          setTimeout(showUnreadMessage, 400);
        }
      });
      // offene (nicht bestätigte, nicht beendete, nicht abgelaufene) Nachrichten für das Team des Monteurs
      const unreadMessages = () =>
        session.role === 'monteur' && session.team
          ? messages.filter(
              m =>
                m.team === session.team &&
                !m.ack &&
                !m.closed &&
                Date.now() - m.at < pushConfig.hours * 3600e3
            )
          : [];
      // schließt bereits angezeigte System-Benachrichtigungen (Push) dieser App
      const closeNotifications = () => {
        if ('serviceWorker' in navigator)
          navigator.serviceWorker
            .getRegistration()
            .then(r => (r && r.getNotifications ? r.getNotifications({ tag: 'nachricht' }) : []))
            .then(ns => ns.forEach(n => n.close()))
            .catch(() => {});
      };
      // Zeigt die erste offene Nachricht im Fenster (nach jedem Abgleich aufgerufen); ohne offene Nachricht Fenster schließen
      function showUnreadMessage() {
        if (gasDialog.open) return; // erst das Gaswarngerät bestätigen, danach kommen die Nachrichten
        const message = unreadMessages()[0];
        if (!message) {
          if (readDialog.open) {
            shownMessage = null;
            readDialog.close();
          }
          if (session.role === 'monteur') closeNotifications();
          return;
        }
        if (readDialog.open && shownMessage && shownMessage.id === message.id) return;
        shownMessage = message;
        readDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'mdt' },
            el('div', { class: 'dlg-t', id: 'mdt' }, '📣 Nachricht vom Disponenten'),
            el('p', { class: 'mtx' }, message.text),
            el(
              'p',
              { class: 'mu' },
              'Gesendet ' +
                formatDateTime(message.at) +
                '. Bitte bestätige, dass du die Nachricht gelesen hast.'
            ),
            el(
              'div',
              { class: 'ob' },
              el(
                'button',
                { class: 'sv', onclick: () => acknowledgeMessage(message) },
                '✓ Gelesen – bestätigen'
              )
            )
          )
        );
        if (!readDialog.open && typeof readDialog.showModal === 'function') {
          try {
            readDialog.showModal();
            readDialog.querySelector('.sv').focus();
          } catch (e) {}
        }
      }
      // „Gelesen – bestätigen“: merkt die Bestätigung, schließt das Fenster und meldet sie dem Server
      function acknowledgeMessage(message) {
        message.ack = true;
        if (!ackQueue.includes(message.id)) ackQueue.push(message.id);
        try {
          localStorage.setItem('ackq', JSON.stringify(ackQueue));
        } catch (e) {}
        shownMessage = null;
        readDialog.close();
        closeNotifications();
        sendAcks();
        showUnreadMessage();
      }
      async function sendAcks() {
        // Bestätigungen senden (ohne Netz gemerkt, später automatisch)
        for (const id of [...ackQueue]) {
          try {
            await api('POST', '/api/msg/ack', { id, did: deviceId });
          } catch (e) {
            if (e.net) break;
          }
          ackQueue = ackQueue.filter(x => x !== id);
          try {
            localStorage.setItem('ackq', JSON.stringify(ackQueue));
          } catch (e) {}
        }
      }
      // ---- Gaswarngerät: tägliche Bestätigung je Team ----
      /**
       * Bevor ein Team arbeitet, muss es jeden Tag bestätigen, dass das Gaswarngerät ordnungsgemäß funktioniert. Solange das
       * Team heute nicht bestätigt hat, liegt ein Fenster über der App (nur „Bestätigen“ schließt es). Der Server hält
       * Tag, Team, Uhrzeit und Gerät fest (Tabelle gas); je Tag und Team zählt die erste Bestätigung, die anderen Geräte
       * des Teams sehen sie beim Abgleich. Ohne Netz wird sofort bestätigt und später gesendet (gasQueue, mit der echten Uhrzeit).
       * Der Disponent sieht im Tab „Fortschritt“ je Team die Uhrzeit oder „nicht bestätigt“ und kann das Protokoll als CSV laden.
       */
      // heutiger Tag (JJJJ-MM-TT): laut Server, solange er erreichbar ist, sonst nach der Geräteuhr
      const gasToday = () => (serverReachable && gasDay) || today();
      // Bestätigung des Servers für Team und Tag (heute, wenn kein Tag angegeben) oder null
      const gasRecord = (team, day = gasToday()) => gasRows.get(day + '|' + team) || null;
      // Bestätigung vom Server übernehmen (ältere Stände nie über neuere schreiben)
      function mergeGas(g) {
        const key = g.d + '|' + g.t,
          old = gasRows.get(key);
        if (!old || g.sq >= old.sq) gasRows.set(key, g);
      }
      // Zeitpunkt der Bestätigung des Teams heute (Server oder noch ungesendet im Gerät) oder 0
      function gasConfirmedAt(team) {
        const record = gasRecord(team);
        if (record) return record.at;
        const queued = gasQueue.find(
          x => x.team === team && new Date(x.at).toLocaleDateString('sv-SE') === today()
        );
        return queued ? queued.at : 0;
      }
      const saveGasQueue = () => {
        try {
          localStorage.setItem('gasq', JSON.stringify(gasQueue));
        } catch (e) {}
      };
      const timeText = t => new Date(t).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
      // Muss dieses Gerät jetzt die Bestätigung abfragen? (Monteur mit Team, erster Abgleich durch, heute noch nicht bestätigt)
      const gasNeeded = () =>
        session.role === 'monteur' && !!session.team && gasReady && !gasConfirmedAt(session.team);
      const gasDialog = el('dialog', { class: 'dlg mdlg' });
      document.body.append(gasDialog);
      gasDialog.addEventListener('cancel', e => e.preventDefault());
      // schließt der Browser das Fenster trotzdem, wird es wieder geöffnet
      gasDialog.addEventListener('close', () => {
        if (gasNeeded()) setTimeout(showGasCheck, 400);
      });
      // Zeigt das Fenster, solange das Team heute nicht bestätigt hat (nach jedem Abgleich aufgerufen); sonst schließt es
      function showGasCheck() {
        if (!gasNeeded()) {
          if (gasDialog.open) gasDialog.close();
          return;
        }
        if (gasDialog.open) return;
        gasDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'gdt' },
            el('div', { class: 'dlg-t', id: 'gdt' }, '⚠ Gaswarngerät prüfen'),
            el('p', { class: 'mtx' }, 'Funktioniert das Gaswarngerät ordnungsgemäß?'),
            el(
              'p',
              { class: 'mu' },
              `Bitte vor Arbeitsbeginn prüfen und für das Team „${session.team}“ bestätigen. Die Bestätigung wird mit Datum und Uhrzeit festgehalten. Funktioniert das Gerät nicht: nicht arbeiten und den Disponenten informieren.`
            ),
            el(
              'div',
              { class: 'ob' },
              el('button', { class: 'sv', onclick: confirmGas }, '✓ Funktioniert ordnungsgemäß'),
              el(
                'button',
                {
                  onclick: () => {
                    gasDialog.close();
                    switchRole('monteur');
                  }
                },
                'Team wechseln'
              )
            )
          )
        );
        try {
          gasDialog.showModal();
          gasDialog.querySelector('.sv').focus();
        } catch (e) {}
      }
      // „Funktioniert ordnungsgemäß“: hält Team und Uhrzeit im Gerät fest (gilt sofort), meldet sie dem Server
      function confirmGas() {
        if (!session.team || gasConfirmedAt(session.team)) return;
        gasQueue.push({ team: session.team, at: Date.now() });
        saveGasQueue();
        gasDialog.close();
        sendGas();
        render();
        showUnreadMessage();
      }
      // Sendet gemerkte Bestätigungen (ohne Netz bleiben sie liegen und gehen später automatisch raus)
      async function sendGas() {
        if (gasSending) return;
        gasSending = true;
        try {
          for (const item of [...gasQueue]) {
            try {
              mergeGas((await api('POST', '/api/gas', { did: deviceId, team: item.team, at: item.at })).row);
            } catch (e) {
              if (e.status !== 400) break; // kein Netz oder Serverfehler: später erneut (400 = ungültig, verwerfen)
            }
            gasQueue = gasQueue.filter(x => x !== item);
            saveGasQueue();
          }
        } finally {
          gasSending = false;
        }
        clearTimeout(cacheSaveTimer);
        cacheSaveTimer = setTimeout(saveCache, 1500);
        render();
      }
      // Disponent: Karte „Gaswarngerät“ im Tab „Fortschritt“ – je Team die Uhrzeit der Bestätigung für den gewählten Tag
      function gasCard() {
        const todayDay = gasToday(),
          day = gasViewDay || todayDay,
          teams = new Set(teamCounts().map(([t]) => t));
        for (const g of gasRows.values()) if (g.d === day) teams.add(g.t); // auch Teams, die inzwischen keine Aufträge mehr haben
        const rows = [...teams]
            .map(t => [t, gasRecord(t, day)])
            .sort((a, b) => !b[1] - !a[1] || naturalCompare(a[0], b[0])),
          confirmed = rows.filter(r => r[1]).length;
        const shiftDay = n => {
          const d = new Date(day + 'T12:00:00');
          d.setDate(d.getDate() + n);
          gasViewDay = d.toLocaleDateString('sv-SE');
          if (gasViewDay >= todayDay) gasViewDay = '';
          render();
        };
        return el(
          'div',
          { class: 'card', 'data-k': 'gc' },
          el('b', {}, 'Gaswarngerät – Bestätigung je Team'),
          el(
            'div',
            { class: 'gasnav' },
            el('button', { 'aria-label': 'Vorheriger Tag', onclick: () => shiftDay(-1) }, '‹'),
            el('input', {
              type: 'date',
              value: day,
              max: todayDay,
              'aria-label': 'Tag',
              onchange: e => {
                gasViewDay = !e.target.value || e.target.value >= todayDay ? '' : e.target.value;
                render();
              }
            }),
            el(
              'button',
              {
                'aria-label': 'Nächster Tag',
                disabled: day >= todayDay ? 'disabled' : null,
                onclick: () => shiftDay(1)
              },
              '›'
            ),
            el('span', { class: 'mu' }, `${confirmed} von ${rows.length} Teams bestätigt`)
          ),
          rows.length
            ? el(
                'div',
                { class: 'gasg' },
                rows.map(([team, record]) =>
                  el(
                    'div',
                    { class: 'gast' + (record ? ' ok' : ' no') },
                    el('b', {}, team),
                    record
                      ? el(
                          'span',
                          {},
                          '✓ ' + timeText(record.at) + ' Uhr',
                          record.n && el('span', { class: 'mu' }, ' · ' + record.n)
                        )
                      : el('span', {}, '⚠ nicht bestätigt')
                  )
                )
              )
            : el('p', { class: 'mu' }, 'Noch keine Teams.'),
          el(
            'p',
            { class: 'mu' },
            'Jedes Team bestätigt vor der Arbeit einmal pro Tag, dass das Gaswarngerät ordnungsgemäß funktioniert. Angezeigt wird die erste Bestätigung des Tages.'
          ),
          el('button', { onclick: exportGasLog }, '⬇ Gesamtes Protokoll (CSV)')
        );
      }
      // Lädt das ganze Protokoll vom Server und speichert es als CSV (Semikolon, mit BOM: öffnet sich in Excel richtig)
      async function exportGasLog() {
        errorMsg = '';
        try {
          const rows = (await api('GET', '/api/gas')).rows;
          // Zellen, die mit = + - @ beginnen, würde Excel als Formel lesen
          const cell = v => '"' + String(v ?? '').replace(/^([=+\-@])/, "'$1").replace(/"/g, '""') + '"';
          const lines = [['Datum', 'Team', 'Bestätigt um', 'Gerät', 'Beim Server eingegangen um']].concat(
            rows.map(r => [
              r.day.split('-').reverse().join('.'),
              r.team,
              new Date(r.at).toLocaleTimeString('de-AT'),
              (r.name ? r.name + ' ' : '') + '(…' + (r.did || '') + ')',
              Math.abs(r.rec - r.at) > 120e3 ? new Date(r.rec).toLocaleString('de-AT') : ''
            ])
          );
          const url = URL.createObjectURL(
            new Blob(['﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n')], {
              type: 'text/csv;charset=utf-8'
            })
          );
          const link = document.createElement('a');
          link.href = url;
          link.download = 'Gaswarngeraet_Protokoll_' + today() + '.csv';
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          infoMsg = `Protokoll exportiert: ${rows.length} Bestätigungen`;
        } catch (e) {
          infoMsg = '';
          errorMsg = e.net ? 'Keine Verbindung – Protokoll konnte nicht geladen werden' : errorMessageOf(e);
        }
        render();
      }
      // ---- Push-Benachrichtigungen (Monteur) ----
      // Push-Abo: Gerät + Team beim Server melden; ask=true nur nach Tipp auf „Aktivieren“ (der Browser verlangt das)
      // Browser kann Push (Service Worker + Push + Notifications)?
      const pushSupported = () =>
        'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

      function pushStatusBanner() {

              'div',
              { class: 'msg' },

            );

              /Android/.test(userAgent)
                ? 'Handy ohne Google-Dienste (z. B. neuere Huawei)? Dann Firefox verwenden.'

            hints.map(x => el('div', { class: 'mu' }, '• ' + x)),

          'div',
          { class: 'msg pb' },

      function unsavedWarnings() {

      const switchRole = (role, team) => {

      // ---- Standort melden (Monteur-Gerät) ----

      let locating = false,

      function viewportAnchors() {

            (a, b) =>

      // filterKey: zuletzt gezeigte Filterwahl · viewFrom / viewStart / listStart: Startposition und Startzeit der Einblendungen
      const VIEW_MS = 260,
        VIEW_STAGGER_MS = 25,
        LIST_MS = 220,
        LIST_STAGGER_MS = 20;
      let viewAnim = null,
        listStable = false,
        viewKey = null,
        viewDepth = 0,
        filterKey = '',
        viewFrom = '',
        viewStart = 0,
        listStart = -1e9;
      // Wirkt eine Einblendung noch (Start + Dauer + Staffelung)? Dann bei jedem Neuzeichnen an der gleichen Stelle fortsetzen.
      function fadeIn(nodes, from, start, ms, stagger) {
        const elapsed = performance.now() - start;
        if (elapsed > ms + nodes.length * stagger) return [];
        return nodes.map((n, i) =>
          n.animate([{ opacity: 0, transform: from }, { opacity: 1, transform: 'none' }], {
            duration: ms,
            delay: i * stagger - elapsed,
            easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
            fill: 'backwards'
          })
        );
      }
      function animateView() {
        const key = openOrder
            ? 'o'
            : [session.role, session.team, dispoUnlocked, session.role === 'dispo' ? dispoTab : ''].join('|'),
          filters = [
            teamFilter,
            statusFilter,
            markedFilter,
            reportedFilter,
            reportedFrom,
            reportedTo,
            monteurFilter,
            deviceTeamFilter
          ].join('|'),
          depth = openOrder ? 1 : 0,
          changed = viewKey !== null && key !== viewKey;
        if (changed) {
          viewFrom =
            depth > viewDepth ? 'translateX(28px)' : depth < viewDepth ? 'translateX(-28px)' : 'translateY(10px)';
          viewStart = performance.now();
          listStart = -1e9;
        } else if (viewKey !== null && filters !== filterKey) listStart = performance.now();
        // für animateRemoved: nur Änderungen der Liste selbst (Daten, Suche) animieren, nicht Ansichts- oder Filterwechsel
        listStable = !changed && filters === filterKey;
        viewKey = key;
        viewDepth = depth;
        filterKey = filters;
        if (!app.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        viewAnim = [
          ...(viewFrom ? fadeIn([...app.children].slice(0, 10), viewFrom, viewStart, VIEW_MS, VIEW_STAGGER_MS) : []),
          ...fadeIn(
            [...app.querySelectorAll('[data-list] > *')].slice(0, 12),
            'translateY(8px)',
            listStart,
            LIST_MS,
            LIST_STAGGER_MS
          )
        ];
      }
      /**
       * Ändert sich die Liste selbst (Disponent hakt einen Auftrag ab und „Abgehakte ausblenden“ ist an, Daten vom Server,
       * Suche), blenden verschwindende Karten aus: eine Kopie der alten Karte schwebt an ihrer Stelle (fixed, ohne Einfluss
       * auf das Layout) und verschwindet; die übrigen Karten gleiten an ihren neuen Platz (FLIP), neue Karten blenden ein.
       * Je Änderung höchstens 12 Karten, der Rest wechselt ohne Animation.
       * snapshotList() merkt sich vor dem Neuzeichnen die sichtbaren Karten samt Position, animateRemoved() vergleicht danach.
       */
      function snapshotList() {
        const snap = new Map();
        for (const n of app.querySelectorAll('[data-list] > [data-k]')) {
          const r = n.getBoundingClientRect();
          if (r.bottom > 0 && r.top < innerHeight && snap.size < 40) snap.set(n.dataset.k, { node: n, rect: r });
        }
        return snap.size ? snap : null;
      }
      function animateRemoved(snap) {
        if (!snap || !listStable || !app.animate || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        const now = new Map();
        for (const n of app.querySelectorAll('[data-list] > [data-k]')) now.set(n.dataset.k, n);
        if (!now.size && !app.querySelector('[data-list]')) return;
        const gone = [...snap].filter(([k]) => !now.has(k)).slice(0, 12),
          fresh = [...now]
            .filter(([k, n]) => {
              const r = n.getBoundingClientRect();
              return !snap.has(k) && r.bottom > 0 && r.top < innerHeight;
            })
            .slice(0, 12);
        if (!gone.length && !fresh.length) return;
        const easing = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
        for (const [, { node, rect }] of gone) {
          Object.assign(node.style, {
            position: 'fixed',
            left: rect.left + 'px',
            top: rect.top + 'px',
            width: rect.width + 'px',
            height: rect.height + 'px',
            margin: '0',
            boxSizing: 'border-box',
            display: 'flex',
            flexDirection: 'column',
            pointerEvents: 'none',
            zIndex: '4'
          });
          node.setAttribute('aria-hidden', 'true');
          document.body.append(node);
          node
            .animate(
              [
                { opacity: 1, transform: 'none' },
                { opacity: 0, transform: 'translateX(-24px) scale(0.94)' }
              ],
              { duration: 240, easing, fill: 'forwards' }
            )
            .finished.then(() => node.remove(), () => node.remove());
        }
        const slides = [];
        for (const [k, n] of now) {
          const before = snap.get(k);
          if (!before) continue;
          const r = n.getBoundingClientRect(),
            dx = before.rect.left - r.left,
            dy = before.rect.top - r.top;
          if (Math.abs(dx) + Math.abs(dy) < 1) continue;
          slides.push(
            n.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 260, easing })
          );
        }
        const appear = fresh.map(([, n], i) =>
          n.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], {
            duration: 220,
            delay: i * 20,
            easing,
            fill: 'backwards'
          })
        );
        viewAnim = [...(viewAnim || []), ...slides, ...appear];
      }
      // ---- Ansichten: draw() wählt je Zustand genau eine aus ----

      // errorMsgSounded: Fehlermeldung, für die schon der Fehlerton gespielt wurde
      let errorMsgSounded = '';
      // Info-Meldungen (nicht Fehler) verschwinden nach INFO_MS von selbst; Fortschrittsmeldungen („Lese Datei …“)
      // bleiben, bis sie durch das Ergebnis ersetzt werden. infoShown/infoTimer: aktuell beobachtete Meldung samt Timer
      const INFO_MS = 8000;
      let infoShown = '',
        infoTimer = null;
      function scheduleInfoExpiry() {
        if (infoMsg === infoShown) return;
        infoShown = infoMsg;
        clearTimeout(infoTimer);
        if (!infoMsg || infoMsg.includes('…')) return;
        const m = infoMsg;
        infoTimer = setTimeout(() => {
          if (infoMsg === m) {
            infoMsg = '';
            render();
          }
        }, INFO_MS);
      }
      // Meldungen oben: Update-Hinweis, Fehler, Info, Rückgängig (Dispo), Offline-Hinweise

        }
        if (errorMsg) app.append(el('div', { class: 'msg er' }, errorMsg));
        if (infoMsg && !errorMsg) app.append(el('div', { class: 'msg' }, infoMsg));
        scheduleInfoExpiry();
        if (undoInfo && session.role === 'dispo')
          app.append(
            el('div', { class: 'msg' }, undoInfo.txt, el('button', { onclick: undoLastMarks }, 'Rückgängig'))

        if (!serverReachable && !outbox.size)

        if (outbox.size && (outboxOffline || !serverReachable || navigator.onLine === false))
          app.append(
            el(
              'div',
              { class: 'msg' },
              `📴 Keine Verbindung – ${outbox.size} ${outbox.size === 1 ? 'Auftrag ist' : 'Aufträge sind'} noch nicht übertragen. Die Eingaben sind gesichert und werden automatisch gesendet, sobald wieder Netz da ist.`
            )

      // Detailansicht eines Auftrags: Auftragskarte, Zeitkarte und die Prüfobjekte. Monteur: OK / Nicht OK je Prüfobjekt
      // und „Alles OK“ (mit Rückfrage, Klicks in den ersten 250 ms nach dem ersten zählen nicht – Schutz vor Doppel-Tipp);

        else {

          const state = valid ? result.s : '-'.repeat(count),

          const nokTextOf = i => {

          // „Alles OK“ setzt nur offene Prüfobjekte auf OK – Nicht OK (samt Text) bleibt erhalten
          const openCount = count - okCount - nokCount;
          // immer zweite Bestätigung; Klicks in den ersten 250 ms nach dem ersten zählen nicht (versehentlicher Doppel-Tipp)
          if (isMonteur && openCount > 0)
            checklistCard.append(

      // Dispo-Tab „Übersicht“: Filter (Team, Rückgemeldet, Status, Abgehakte), Excel-Export, „Alle abhaken“, Suche und Kartenliste

        const teamEntries = teamCounts(),

        );

        app.append(

            [

              ['done', 'Erledigt', counts.done],
              ['teil', 'In Arbeit', counts.teil],

            ],

        const filterActive = !!(

        app.append(actions);

                )
              : el(
                  'button',
                  {
                    class: 'dl',

        if (markedFilter === 'hide' && markedCount > 0)
          app.lastChild.before(
