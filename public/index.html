                      el(
                        'div',
                        { class: 'ob' },
                        el(
                          'button',
                          { class: 'sv', onclick: () => saveNokText(order, items, i) },
                          'Speichern'
                        ),
                        el(
                          'button',
                          {
                            onclick: () => {
                              editIndex = null;
                              render();
                            }
                          },
                          'Abbrechen'
                        ),
                        c === 'x' &&
                          el(
                            'button',
                            { class: 'er', onclick: () => resetItem(order, items, i) },
                            'Zurücksetzen'
                          )
                      )
                    )
                  : nokBox
              )
            );
          });
        }
        detail.append(checklistCard);
      }

      // Startseite: „Ich bin Monteur“ / „Ich bin Disponent“
      function drawRoleChoice() {
        app.append(
          el('h1', {}, 'Aufträge'),
          el(
            'button',
            {
              class: 'big',
              onclick: () => {
                // angemeldet: gleich weiter (zuletzt gewähltes Team), sonst zur Anmeldung
                switchRole(
                  'monteur',
                  userToken && userInfo ? (userInfo.lock ? null : userInfo.last) || userInfo.team || undefined : undefined
                );
                const n = app.querySelector('[data-keep="lu"]');
                if (n) n.focus();
              }
            },
            '🔧 Ich bin Monteur'
          ),
          el(
            'button',
            {
              class: 'big',
              onclick: () => {
                switchRole('dispo');
                const n = app.querySelector('[data-keep="p"]');
                if (n) n.focus();
              }
            },
            '📋 Ich bin Disponent'
          ),
          ...(userToken && userInfo
            ? [
                el(
                  'p',
                  { class: 'mu' },
                  `👤 Angemeldet als ${userInfo.name} (${userInfo.sap}) · `,
                  el('button', { class: 'lk', onclick: userLogout }, 'Abmelden')
                )
              ]
            : [])
        );
      }

      // Browser-Autofill (Passwortmanager) füllt die Felder oft ohne input-Ereignis: loginUser/loginPass bleiben dann leer, und
      // jedes Neuzeichnen würde die ausgefüllten Felder wieder leeren. Darum die Werte direkt aus den Feldern übernehmen
      // (beim Absenden und in render() vor dem Neuzeichnen).
      function syncLoginFields() {
        const u = document.getElementById('lgu'),
          p = document.getElementById('lgp');
        if (u) loginUser = u.value;
        if (p) loginPass = p.value;
      }
      // Passwort leeren – auch im Feld, sonst holt syncLoginFields() es beim nächsten Neuzeichnen zurück
      function clearLoginPass() {
        loginPass = '';
        const p = document.getElementById('lgp');
        if (p) p.value = '';
      }

      // Anmeldung der Monteure: SAP-User + Passwort (POST /api/user/login). Danach wird das Team aus der Benutzerverwaltung gewählt.
      function drawMonteurLogin(back) {
        const submit = async () => {
          syncLoginFields();
          const user = loginUser.trim(),
            password = loginPass;
          if (loginBusy) return;
          if (!user || !password) {
            loginError = 'Bitte SAP-User und Passwort eingeben.';
            render();
            return;
          }
          loginBusy = true;
          loginError = '';
          render();
          try {
            const r = await api('POST', '/api/user/login', { user, password, did: deviceId });
            userToken = r.token;
            // erneute Anmeldung desselben Benutzers (abgelaufen): beim zuletzt gewählten Team bleiben, sonst Team laut Benutzerverwaltung
            const last = userInfo && userInfo.sap === r.user.sap ? userInfo.last : null;
            userInfo = { sap: r.user.sap, name: r.user.name, team: r.user.team, lock: !!r.user.lock, last };
            saveUser();
            clearLoginPass();
            loginBusy = false;
            authAt = Date.now();
            infoMsg = ''; // z. B. „Dieses Gerät wurde vom Disponenten abgemeldet.“ gilt nach der Anmeldung nicht mehr
            switchRole('monteur', (r.user.lock ? null : last) || r.user.team || undefined);
          } catch (e) {
            loginBusy = false;
            clearLoginPass();
            loginError = e.net ? 'Keine Verbindung zum Server' : e.message || 'Anmeldung fehlgeschlagen.';
            render();
            const n = app.querySelector('[data-keep="lp"]');
            if (n) n.focus();
          }
        };
        app.append(
          el('div', { class: 'bar' }, el('h1', {}, 'Anmelden'), back),
          el(
            'form',
            {
              class: 'card lgn',
              onsubmit: e => {
                e.preventDefault();
                submit();
              }
            },
            el('b', {}, 'Monteur-Anmeldung'),
            el('label', { for: 'lgu' }, 'SAP-User'),
            el('input', {
              id: 'lgu',
              type: 'text',
              name: 'username',
              autocomplete: 'username',
              autocapitalize: 'characters',
              autocorrect: 'off',
              spellcheck: 'false',
              maxlength: '20',
              'data-keep': 'lu',
              value: loginUser || (userInfo && userInfo.sap) || '',
              oninput: e => {
                loginUser = e.target.value;
              }
            }),
            el('label', { for: 'lgp' }, 'Passwort'),
            el('input', {
              id: 'lgp',
              type: 'password',
              name: 'password',
              autocomplete: 'current-password',
              maxlength: '100',
              'data-keep': 'lp',
              value: loginPass,
              oninput: e => {
                loginPass = e.target.value;
              }
            }),
            loginError && el('p', { class: 'mu er' }, loginError),
            el('button', { class: 'pri', type: 'submit', disabled: loginBusy ? 'disabled' : null }, loginBusy ? 'Anmelden …' : 'Anmelden')
          )
        );
      }
      // Monteur abmelden: Token weg, Gerät nicht mehr dem Benutzer zugeordnet, zurück zum Start
      function userLogout() {
        userToken = '';
        userInfo = null;
        saveUser();
        clearLoginPass();
        loginError = '';
        switchRole(null);
      }

      // PIN-Eingabe des Disponenten (POST /api/login, automatisch nach der 4. Ziffer)
      function drawDispoLogin(back) {
        const checkPin = async () => {
          const pin = pinInput;
          pinInput = '';
          try {
            dispoToken = (await api('POST', '/api/login', { pin: pin, did: deviceId })).token;
            authAt = Date.now();
            dispoUnlocked = true;
            pinError = false;
            pushSync(false);
            poll(); // der Gesamtstand ist erst nach der PIN-Eingabe abrufbar
          } catch (e) {
            pinError = e.net ? 'Keine Verbindung zum Server' : e.message || 'Falscher PIN';
          }
          render();
        };
        app.append(
          el('div', { class: 'bar' }, el('h1', {}, 'Disponent'), back),
          el(
            'div',
            { class: 'card' },
            el('b', {}, 'PIN eingeben'),
            el('input', {
              type: 'password',
              inputmode: 'numeric',
              autocomplete: 'off',
              maxlength: '4',
              'data-keep': 'p',
              placeholder: '••••',
              value: pinInput,
              oninput: e => {
                pinInput = e.target.value.replace(/\D/g, '');
                if (pinInput.length === 4) checkPin();
              }
            }),
            pinError &&
              el('p', { class: 'mu er' }, typeof pinError === 'string' ? pinError : 'Falscher PIN.'),
            el('button', { class: 'pri', onclick: checkPin }, 'Weiter')
          )
        );
      }

      // Monteur: Team auswählen
      function drawTeamPicker(back, missingTeam) {
        app.append(el('div', { class: 'bar' }, el('h1', {}, 'Dein Team'), back));
        if (missingTeam)
          app.append(
            el('p', { class: 'mu' }, `Für „${missingTeam}“ gibt es derzeit keine Aufträge. Bitte wähle ein Team.`)
          );
        const teamEntries = teamCounts();
        if (!dataReady) app.append(skeletonButtons(4));
        else if (!teamEntries.length)
          app.append(el('p', { class: 'mu' }, 'Noch keine Aufträge hochgeladen.'));
        if (teamEntries.length)
          app.append(
            el(
              'div',
              { class: 'tgrid' },
              teamEntries.map(([t, n]) =>
                el(
                  'button',
                  { class: 'big', onclick: () => switchRole('monteur', t) },
                  t,
                  el('span', { class: 'mu' }, `  · ${n} Aufträge`)
                )
              )
            )
          );
      }

      // Auftragsart öffnen / zurück zur Startseite (Monteur). Die Zurück-Taste des Geräts führt von der Liste zur Startseite.
      const openKind = k => {
        viewKind = k;
        monteurFilter = 'open';
        searchText = '';
        if (!(history.state && (history.state.k || history.state.a))) history.pushState({ k: 1 }, '');
        render();
        scrollTo(0, 0);
      };
      const closeKind = () => {
        viewKind = '';
        searchText = '';
        render();
        scrollTo(0, 0);
        if (history.state && history.state.k) history.back();
      };
      // offene / gesamte Aufträge je Auftragsart eines Teams (Meldungen: ohne Auftrag)
      const kindCounts = teamRows => {
        const out = {};
        for (const { k } of KINDS) {
          if (k === 'mel') {
            const n = freeMeldungen(session.team).length;
            out[k] = { n, open: n, today: 0 };
            continue;
          }
          const list = ordersOfKind(teamRows, k);
          // offen/erledigt gibt es nur bei Wartungen; Reparatur und Entstörung zählen, was heute ansteht
          out[k] = {
            n: list.length,
            open: k === 'war' ? list.filter(r => !isFinished(r)).length : list.length,
            today: isTimedKind(k) ? list.filter(r => isoOfDate(r.start) === today()).length : 0,
            late: isTimedKind(k) ? list.filter(lateInfo).length : 0
          };
        }
        return out;
      };
      // Startseite des Monteurs: eine große Fläche je Auftragsart mit der Zahl offener Aufträge (Reparatur/Entstörung: auch „heute“)
      function drawKindHome(counts) {
        app.append(
          el('p', { class: 'mu kh' }, 'Welche Aufträge möchtest du sehen?'),
          el(
            'div',
            { class: 'tgrid kinds' },
            KINDS.map(({ k, plural, icon, note }) => {
              const c = counts[k];
              return el(
                'button',
                { class: 'big kind', 'data-k': 'kd-' + k, onclick: () => openKind(k) },
                el('span', { class: 'ki' }, icon),
                el(
                  'span',
                  { class: 'kb' },
                  el('span', { class: 'kn' }, plural),
                  el(
                    'span',
                    { class: 'mu' },
                    k === 'mel'
                      ? c.n
                        ? `${c.n} ohne Auftrag`
                        : 'Keine offenen Meldungen'
                      : c.n
                        ? k === 'war'
                        ? `${c.open} offen · ${c.n} gesamt`
                        : c.n === 1
                          ? '1 Auftrag'
                          : `${c.n} Aufträge`
                        : 'Keine Aufträge'
                  ),
                  el('span', { class: 'mu sm' }, note)
                ),
                (c.today > 0 || c.late > 0) &&
                  el(
                    'span',
                    { class: 'ktags' },
                    c.late > 0 && el('span', { class: 'tag st-nok' }, `⏰ ${c.late} im Verzug`),
                    c.today > 0 && el('span', { class: 'tag st-zf' }, `📅 ${c.today} heute`)
                  )
              );
            })
          )
        );
      }
      // Meldungen ohne Auftrag (Schäden, noch nicht verknüpft): neueste zuerst. showTeam: Team auf der Karte (Disponent)
      function meldungList(items, showTeam) {
        const filtered = items
            .filter(matchesSearchMeldung)
            .sort((a, b) => (isoOfDate(b.dat) || '').localeCompare(isoOfDate(a.dat) || '') || naturalCompare(b.nr, a.nr)),
          shown = filtered.slice(0, LIST_MAX),
          container = el('div', {});
        container.append(
          el('p', { class: 'mu cnt' }, filtered.length === 1 ? '1 Meldung' : `${filtered.length} Meldungen`),
          el('div', { class: 'grid', 'data-list': '1' }, shown.map(m => meldungCardEl(m, showTeam)))
        );
        if (filtered.length > LIST_MAX)
          container.append(el('p', { class: 'mu' }, `Nur die ersten ${LIST_MAX} angezeigt – Suche nutzen.`));
        return container;
      }
      // Monteur: Liste „Meldungen“ (Schäden des Teams, die noch keinem Auftrag zugeordnet sind)
      function drawMeldungenView() {
        const items = freeMeldungen(session.team),
          container = el('div', {}),
          searchRow = searchBox(v => {
            searchText = v;
            swapList(container, meldungList(items, false));
          });
        searchRow.append(fontScaleButtons());
        app.append(
          el('p', { class: 'mu' }, 'Gemeldete Schäden, für die es noch keinen Auftrag gibt.'),
          el('div', { class: 'ctl' }, searchRow),
          container
        );
        container.append(meldungList(items, false));
        if (uploadMeta) app.append(el('p', { class: 'mu' }, 'Stand: ' + new Date(uploadMeta.at).toLocaleString('de-AT')));
      }

      // Monteur: Startseite mit der Auswahl der Auftragsart; danach Fortschritt, Filter (Standard „Offen“), Suche, Schriftgröße und die
      // Auftragsliste des Teams in dieser Auftragsart
      function drawMonteurList(back) {
        const teamRows = allOrders().filter(r => r.team === session.team),
          rows = ordersOfKind(teamRows, viewKind);
        app.append(
          el(
            'div',
            { class: 'bar' },
            el('h1', {}, session.team),
            el(
              'div',
              { class: 'row' },
              !(userInfo && userInfo.lock) && el('button', { onclick: () => switchRole('monteur') }, 'Team wechseln'),
              viewKind ? el('button', { onclick: closeKind }, '← Auftragsarten') : back
            )
          ),
          ...(userInfo
            ? [
                el(
                  'p',
                  { class: 'mu uline' + (pushStatusBanner() ? ' two' : '') },
                  `👤 ${userInfo.name} (${userInfo.sap})${userInfo.lock ? ' · 🔒 Team fest zugewiesen' : ''} · `,
                  el('button', { class: 'lk', onclick: userLogout }, 'Abmelden'),
                  ...(pushBell() ? [' · ', pushBell()] : [])
                )
              ]
            : [])
        );
        // Daten laden noch (erster Start ohne Zwischenspeicher): Platzhalter statt einer leeren Liste
        if (!dataReady) {
          app.append(skeletonPage());
          return;
        }
        const counts = kindCounts(teamRows);
        const banner = pushBanner();
        if (banner) app.append(banner);
        // Zeile steht immer da (auch ohne Bestätigung), damit die Liste nicht springt, wenn die Bestätigung eintrifft
        const gasAt = gasConfirmedAt(session.team);
        const gasLine = el(
          'p',
          { class: 'mu gasl' + (gasAt ? ' ok' : '') },
          gasAt
            ? `✓ Gaswarngerät heute um ${timeText(gasAt)} Uhr bestätigt`
            : 'Gaswarngerät heute noch nicht bestätigt'
        );
        if (!viewKind) {
          app.append(gasLine);
          drawKindHome(counts);
          if (uploadMeta)
            app.append(el('p', { class: 'mu' }, 'Stand: ' + new Date(uploadMeta.at).toLocaleString('de-AT')));
          return;
        }
        app.append(gasLine);
        if (viewKind === 'mel') {
          drawMeldungenView();
          return;
        }
        const withList = viewKind === 'war';
        // Filter (Offen/Erledigt/Nicht OK) und Fortschritt gibt es nur bei Wartungen; die anderen Auftragsarten zeigen alle Aufträge
        const view = () =>
          withList
            ? rows.filter(
                r =>
                  !monteurFilter ||
                  (monteurFilter === 'open'
                    ? !isFinished(r)
                    : monteurFilter === 'done'
                      ? isFinished(r)
                      : orderStatus(r).nx > 0)
              )
            : rows;
        const doneCount = rows.filter(isFinished).length,
          nokCount = rows.filter(r => orderStatus(r).nx > 0).length;
        const container = el('div', {});
        const searchRow = searchBox(v => {
          searchText = v;
          swapList(container, orderList(view(), false));
        });
        searchRow.append(fontScaleButtons()); // Schriftgröße neben der Suche: Kopfzeile bleibt unverändert
        const controls = el(
          'div',
          { class: 'ctl' },
          withList &&
            filterChips(
              [
                ['', 'Alle', rows.length],
                ['open', 'Offen', rows.length - doneCount],
                ['done', 'Erledigt', doneCount],
                ['nok', 'Nicht OK', nokCount]
              ],
              monteurFilter,
              k => {
                monteurFilter = k;
              }
            ),
          sortChips(),
          searchRow
        );
        // Fortschritt und Wochenpensum (Frist 31.12.) gibt es nur bei Wartungen
        app.append(
          rows.length && withList ? el('div', { class: 'mtop' }, progressCard(rows.length, doneCount), controls) : controls,
          container
        );
        container.append(orderList(view(), false));
        if (uploadMeta)
          app.append(el('p', { class: 'mu' }, 'Stand: ' + new Date(uploadMeta.at).toLocaleString('de-AT')));
        // Sortierung „Entfernung“ war schon gewählt (App neu gestartet): Standort einmal je Sitzung bestimmen
        if (sortMode() === 'nah' && !geoAsked) {
          geoAsked = true;
          setTimeout(() => locateMe(true), 0);
        }
      }

      // Dispo-Tab „Fortschritt“: Gesamt + je Team
      function drawDispoProgress() {
        const stats = teamStats();
        if (!stats.length) {
          app.append(
            dataReady
              ? el('p', { class: 'mu' }, 'Noch keine Aufträge – im Tab „Upload“ hochladen.')
              : skeletonGrid(2)
          );
          return;
        }
        const totals = stats.reduce(
          (a, t) => ({ n: a.n + t.n, done: a.done + t.done, teil: a.teil + t.teil, nok: a.nok + t.nok }),
          { n: 0, done: 0, teil: 0, nok: 0 }
        );
        const deadlineDate = deadline(),
          workingDays = workingDaysUntil(deadlineDate),
          deadlineText = deadlineDate.toLocaleDateString('de-AT', {
            day: '2-digit',
            month: '2-digit',
            year: 'numeric'
          });
        app.append(
          el(
            'div',
            { class: 'gpage' },
            totalCard(totals, workingDays, deadlineText),
            teamProgressCard(stats, totals, workingDays)
          ),
          gasCard()
        );
        if (uploadMeta)
          app.append(
            el(
              'p',
              { class: 'mu' },
              'Fortschritt der Wartungen (Prüfobjekte, Frist 31.12.) · Stand: ' +
                new Date(uploadMeta.at).toLocaleString('de-AT') +
                ' · aktualisiert sich automatisch'
            )
          );
      }

      // Dispo-Tab „Upload“: erst den Upload-PIN abfragen (POST /api/login-upload)
      function drawUploadPinPrompt() {
        const checkUploadPin = async () => {
          const pin = uploadPinInput;
          uploadPinInput = '';

            uploadToken = (await api('POST', '/api/login-upload', { pin: pin, did: deviceId })).token;
            uploadPinError = false;
            errorMsg = '';

            el('input', {
              type: 'password',
              inputmode: 'numeric',
              autocomplete: 'off',
              maxlength: '4',
              'data-keep': 'u',
              placeholder: '••••',

                if (uploadPinInput.length === 4) checkUploadPin();

      // Dispo-Tab „Upload“: Aufträge und Prüflose hochladen, alles löschen

        const card = ({ title, text, columns, onUpload, keepOption, meta, metaText, wipe }) => {

            'div',
            { class: 'card', 'data-k': 'up-' + wipe },
            el('b', {}, title),
            el('p', { class: 'mu' }, text),
            el('p', { class: 'mu ucols' }, 'Spalten: ' + columns),
            canWrite
              ? el(
                  'div',
                  {},
                  input,
                  keep && el('label', { class: 'ck' }, keep, ' Nur ergänzen/aktualisieren (bestehende behalten)'),
                  el(
                    'button',
                    {

                    'button',
                    {
                      class: 'er',
                      onclick: () => {
                        armWipe = wipe;
                        render();
                      }
                    },
                    `Alle ${title} löschen`

        };
        app.append(
          el(
            'p',
            { class: 'mu' },
            'Vier Excel-Dateien aus SAP – jede im eigenen Feld, einzeln und in beliebiger Reihenfolge. Aufträge und Vorgänge werden dabei von der App zusammengesetzt: ' +
              'Reparaturen (3NAR) zählen je Vorgang, Vorgänge von Teams mit „P“ (geplant) sind noch nicht zu sehen, FW-IHEXT sind externe Firmen.'

          el(
            'div',
            { class: 'ugrid' },
            card({
              title: 'Aufträge',

              columns: 'Auftrag, Verantw.ArbPl., Auftragsart, IH-Leistungsart, Kurztext, Postleitzahl, Straße, Techn. Platz, Term. Start, Meldung',
              onUpload: (files, keep) => uploadSource('auftraege', files, keep),
              keepOption: true,
              meta: uploadMeta,
              metaText: m =>
                `${m.count} Aufträge` +
                (m.kinds ? ' (' + KINDS.filter(x => m.kinds[x.k]).map(x => kindCount(x.k, m.kinds[x.k])).join(', ') + ')' : ''),
              wipe: 'orders'
            }),
            card({
              title: 'Vorgänge',
              text: 'Je Vorgang eine Zeile (Reparatur, Entstörung): Team, Termin und Uhrzeit, externe Firmen. Ersetzt die Vorgänge der enthaltenen Aufträge.',
              columns: 'Auftrag, Vorgang, Kurztext Vrg., VrgArbeitsplatz, Eckstarttermin, Eckendtermin, Iststart Uzt, Istende Uzt, Arbeit',
              onUpload: (files, keep) => uploadSource('vorgaenge', files, keep),

      // Dispo-Tab „Übersicht“, Auftragsart „Meldungen“: Schäden ohne Auftrag (oder mit), je Team filterbar
      function drawDispoMeldungen() {

            [

            ],

          searchBox(v => {

          container
        );

      }
      function drawDispoOverview() {
        // Daten laden noch: Platzhalter statt leerer Filter und Liste
        if (!dataReady) {
          app.append(skeletonPage());
          return;
        }
        if (!viewKind) viewKind = 'war';
        if (dataReady && !ordersByTeam.size && !meldungen.size)
          app.append(el('p', { class: 'mu' }, 'Noch keine Aufträge – im Tab „Upload" hochladen.'));
        app.append(dispoKindBar());
        if (viewKind === 'mel') {
          drawDispoMeldungen();
          return;
        }
        const kindRows = ordersOfKind(allOrders(), viewKind),
          withList = viewKind === 'war',
          kindTeamCounts = new Map();
        for (const r of kindRows) kindTeamCounts.set(r.team, (kindTeamCounts.get(r.team) || 0) + 1);
        const teamEntries = [...kindTeamCounts].sort((a, b) => naturalCompare(a[0], b[0])),
          range = reportedRange();
        const matchesStatus = r =>
          !withList ||
          !statusFilter ||
          (statusFilter === 'nok' ? orderStatus(r).nx > 0 : orderStatus(r).st === statusFilter);
        const candidates = kindRows.filter(
          r => (!teamFilter || r.team === teamFilter) && (!range || inRange(r, range)) && matchesSearch(r)
        );
        const visibleBefore = candidates.filter(matchesStatus),
          markedCount = visibleBefore.filter(r => markState(r.auftrag) === 1).length,
          anyMarkedCount = visibleBefore.filter(r => markState(r.auftrag) > 0).length; // Abgehakte in der aktuellen Liste
        const base = candidates.filter(r =>
            markedFilter === 'hide'
              ? markState(r.auftrag) !== 1
              : markedFilter === 'only'
                ? markState(r.auftrag) > 0
                : true
          ),
          counts = { done: 0, teil: 0, offen: 0, nok: 0 };
        base.forEach(r => {
          const x = orderStatus(r);
          counts[x.st]++;
          if (x.nx > 0) counts.nok++;
        });
        const view = () => base.filter(matchesStatus);
        const nokByTeam = new Map();
        kindRows.forEach(r => {
          if (orderStatus(r).nx > 0) nokByTeam.set(r.team, (nokByTeam.get(r.team) || 0) + 1);
        });
        const teamSelect = el(
          'select',
          {
            onchange: e => {

          el('option', { value: '' }, 'Alle Teams'),
          teamEntries.map(([t, n]) =>

        // Filter: am Handy hinter der Schaltfläche „Filter“ (aufklappbar), breit immer sichtbar. Oben bleiben Suche und eine Zeile mit
        // den aktiven Filtern (jeder lässt sich mit ✕ lösen).
        const panel = el('div', { class: 'fp' + (dispoFiltersOpen ? '' : ' closed') });
        panel.append(

            teamFilter &&

                  onclick: () => {

                  onchange: e => {

                    armMarkAll = false;
                    render();

                el('input', {
                  class: 'dt',

                    render();
                  }

              )

        );
        if (reportedFilter === 'z' && reportedFrom && reportedTo && reportedFrom > reportedTo)
          panel.append(el('p', { class: 'mu er' }, '„Von“ liegt nach „Bis“ – es kann nichts gefunden werden.'));
        // Status (Nicht OK, Erledigt, In Arbeit, Offen) gibt es nur bei Wartungen
        if (withList)
          panel.append(
            filterChips(
              [
                ['', 'Alle', base.length],
                ['nok', 'Nicht OK', counts.nok],
                ['done', 'Erledigt', counts.done],
                ['teil', 'In Arbeit', counts.teil],
                ['offen', 'Offen', counts.offen]
              ],
              statusFilter,
              k => {
                statusFilter = k;
              }
            )
          );
        const filterActive = !!(
          teamFilter ||
          statusFilter ||
          markedFilter ||
          reportedFilter ||
          searchText.trim()
        );
        const actions = el('div', { class: 'acts' });
        actions.append(
          el(
            'button',
            {
              class: 'dl',
              disabled: busy || !view().length ? 'disabled' : null,
              onclick: () => exportXlsx(view())
            },
            `⬇ Excel exportieren (${view().length} Aufträge${filterActive ? ', gefiltert' : ''})`
          )
        );
        const toMark = view()
          .filter(r => markState(r.auftrag) !== 1)
          .map(r => r.auftrag);
        if (toMark.length)
          actions.append(
            armMarkAll
              ? el(
                  'button',
                  {
                    class: 'dl',
                    onclick: () => {
                      armMarkAll = false;
                      setMarks(toMark, true);
                    }
                  },
                  `Wirklich ${toMark.length} Aufträge abhaken?`
                )
              : el(
                  'button',
                  {
                    class: 'dl',
                    onclick: () => {
                      armMarkAll = true;
                      render();
                    }
                  },
                  `☑ Alle angezeigten abhaken (${toMark.length})`
                )
          );
        // Abgehakte ein-/ausblenden (Wahl bleibt im Gerät gespeichert)
        const setMarkedFilter = k => {
          markedFilter = k;
          armMarkAll = false;
          try {
            localStorage.setItem('dha', markedFilter);
          } catch (x) {}
          render();
        };
        const setMarkedFilterQuiet = k => {
          markedFilter = k;
          try {
            localStorage.setItem('dha', markedFilter);
          } catch (x) {}
        };
        panel.append(
          el(
            'div',
            { class: 'chips ab' },
            el('span', { class: 'mu' }, 'Abgehakte:'),
            [
              ['', 'Anzeigen'],
              ['hide', `Ausblenden (${markedCount})`],
              ['only', `Nur abgehakte (${anyMarkedCount})`]
            ].map(([k, l]) =>
              el(
                'button',
                { class: 'chip' + (markedFilter === k ? ' on' : ''), onclick: () => setMarkedFilter(k) },
                l
              )
            )
          ),
          sortChips(),
          actions
        );
        // aktive Filter als Kurzzeile (nur am Handy sichtbar, wenn die Filter zugeklappt sind)
        const reportedNames = { h: 'Heute', g: 'Gestern', 7: 'Letzte 7 Tage', m: 'Dieser Monat', z: 'Zeitraum' },
          statusNames = { nok: 'Nicht OK', done: 'Erledigt', teil: 'In Arbeit', offen: 'Offen' },
          active = [
            teamFilter && [`Team ${teamFilter}`, () => (teamFilter = '')],
            statusFilter && [`Status ${statusNames[statusFilter]}`, () => (statusFilter = '')],
            reportedFilter && [
              `Rückgemeldet ${reportedNames[reportedFilter]}`,
              () => {
                reportedFilter = '';
                reportedFrom = '';
                reportedTo = '';
              }
            ],
            markedFilter && [
              markedFilter === 'hide' ? 'Abgehakte ausgeblendet' : 'Nur abgehakte',
              () => setMarkedFilterQuiet('')
            ]
          ].filter(Boolean);
        app.append(
          el(
            'div',
            { class: 'srow', 'data-k': 'sr' },
            searchBox(v => {
              searchText = v;
              armMarkAll = false;
              render();
            }),
            el(
              'button',
              {
                class: 'fbtn' + (active.length ? ' on' : ''),
                'aria-expanded': dispoFiltersOpen ? 'true' : 'false',
                onclick: () => {
                  dispoFiltersOpen = !dispoFiltersOpen;
                  render();
                }
              },
              `⚙ Filter${active.length ? ' (' + active.length + ')' : ''} ${dispoFiltersOpen ? '▴' : '▾'}`
            )
          ),
          ...(active.length
            ? [
                el(
                  'div',
                  { class: 'fsum chips' },
                  active.map(([label, reset]) =>
                    el(
                      'button',
                      {
                        class: 'chip on',
                        title: 'Filter lösen',
                        onclick: () => {
                          reset();
                          armMarkAll = false;
                          render();
                        }
                      },
                      label + ' ✕'
                    )
                  )
                )
              ]
            : []),
          panel,
          orderList(view(), true)
        );
        // Hinweis nur wenn zutreffend – app.append() würde false/null sonst als Text anzeigen
        if (markedFilter === 'hide' && markedCount > 0)
          app.lastChild.before(
            el(
              'p',
              { class: 'mu' },
              markedCount === 1
                ? '1 abgehakter Auftrag ist ausgeblendet.'
                : `${markedCount} abgehakte Aufträge sind ausgeblendet.`
            )
          );
      }

      // ---- Geräteübersicht (Disponent) ----
      // Kurzbeschreibung des Geräts aus dem User-Agent des Browsers: „Android · Chrome“
      function deviceKind(ua) {
        const text = String(ua || ''),
          system = /iPhone|iPad|iPod/.test(text)
            ? 'iPhone/iPad'
            : /Android/.test(text)
              ? 'Android'
              : /Windows/.test(text)
                ? 'Windows'
                : /Mac OS X/.test(text)
                  ? 'Mac'
                  : /Linux/.test(text)
                    ? 'Linux'
                    : 'Gerät',
          browser = /Edg\//.test(text)
            ? 'Edge'
            : /OPR\/|Opera/.test(text)
              ? 'Opera'
              : /Firefox|FxiOS/.test(text)
                ? 'Firefox'
                : /SamsungBrowser/.test(text)
                  ? 'Samsung Internet'
                  : /Chrome|CriOS/.test(text)
                    ? 'Chrome'
                    : /Safari/.test(text)
                      ? 'Safari'
                      : '';
        return browser ? system + ' · ' + browser : system;
      }
      // „gerade eben“, „vor 5 Min“, „vor 3 Std“, sonst Datum und Uhrzeit (seen = Zeitpunkt, now = Serverzeit)
      function agoText(seen, now) {
        const minutes = Math.floor((now - seen) / 60000);
        if (minutes < 1) return 'gerade eben';
        if (minutes < 60) return `vor ${minutes} Min`;
        if (minutes < 1440) return `vor ${Math.floor(minutes / 60)} Std`;
        return formatDateTime(seen);
      }
      // Lädt die Geräteliste vom Server (GET /api/devices) und zeichnet neu. Das hält auch die Standortabfrage am Leben
      // (?locate=1, 90 Sekunden) – nur diese Seite fragt Standorte ab. refresh = true: sofort neue Abfragerunde.
      async function loadDevices(refresh = false) {
        try {
          const response = await api('GET', '/api/devices?locate=1' + (refresh ? '&refresh=1' : ''));
          deviceList = response.devices;
          deviceListOffset = response.now - Date.now();
          deviceListError = '';
        } catch (e) {
          deviceListError = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        render();
      }
      // Spitzname speichern (leer = entfernen)
      async function renameDevice(did, name) {
        try {
          await api('POST', '/api/devices/name', { did, name });
          deviceRenameId = null;
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadDevices();
      }
      // Gerät ausloggen: der Server meldet es sofort ab (Rolle/Team weg, Tokens ungültig); das Gerät selbst kehrt zum Startbildschirm
      // zurück, sobald es sich beim Server meldet (bei offener App sofort)
      async function logoutDevice(did) {
        deviceLogoutArmed = null;
        try {
          await api('POST', '/api/devices/logout', { did });
          infoMsg =
            'Gerät ausgeloggt – es kehrt zum Startbildschirm zurück, sobald es sich beim Server meldet.';
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
        }
        await loadDevices();
      }
      // ein Gerät gilt als online, wenn es sich in den letzten 2 Minuten beim Server gemeldet hat
      const DEVICE_ONLINE_MS = 2 * 60e3;
      // Die Monteur-Geräte antworten auf die Standortabfrage innerhalb weniger Sekunden: Liste nach 3, 8 und 15 Sekunden nachladen
      function reloadDevicesSoon() {
        for (const ms of [3000, 8000, 15000])
          setTimeout(() => {
            if (dispoTab === 'dv' && deviceRenameId === null && !document.hidden) loadDevices();
          }, ms);
      }
      // Standortzeile einer Gerätekarte: Karten-Link mit Genauigkeit und Alter, oder der Grund, warum es keinen gibt
      function locationLine(device, now) {
        if (device.locError)
          return el(
            'div',
            { class: 'mu' },
            '📍 ' +
              (device.locError === 'denied'
                ? 'Standort nicht freigegeben'
                : device.locError === 'unavailable'
                  ? 'Standort nicht verfügbar'
                  : 'Standort: keine Antwort (Zeitüberschreitung)') +
              ' · ' +
              agoText(device.locAt, now)
          );
        if (device.lat == null)
          return el(
            'div',
            { class: 'mu' },
            now - device.seen < DEVICE_ONLINE_MS
              ? '📍 Standort: noch keine Antwort'
              : '📍 Gerät ist offline – Standort unbekannt (nur geöffnete Geräte antworten)'
          );
        const url = `https://www.openstreetmap.org/?mlat=${device.lat}&mlon=${device.lon}#map=17/${device.lat}/${device.lon}`;
        return el(
          'div',
          { class: 'mu' },
          '📍 ',
          el('a', { href: url, target: '_blank', rel: 'noopener' }, 'Auf Karte öffnen'),
          ` · ±${device.acc} m · ${agoText(device.locAt, now)}`
        );
      }
      /**
       * Dispo-Tab „Geräte“: alle Geräte der letzten 30 Tage mit Rolle/Team (wo angemeldet), Spitzname, zuletzt aktiv und
       * Push-Status. Je Gerät: Spitzname vergeben und „Ausloggen“ (mit Rückfrage). Die Liste lädt beim Öffnen des Tabs und
       * erneuert sich alle 20 Sekunden.
       */
      function drawDevices() {
        if (deviceList === null) {
          app.append(deviceListError ? el('p', { class: 'mu er' }, deviceListError) : skeletonGrid(4));
          return;
        }
        const now = Date.now() + deviceListOffset,
          isOnline = device => now - device.seen < DEVICE_ONLINE_MS,
          loggedIn = deviceList.filter(device => device.role).length,
          online = deviceList.filter(isOnline).length;
        app.append(
          el(
            'div',
            { class: 'card' },
            el('b', {}, 'Geräte'),
            el(
              'p',
              { class: 'mu' },
              `${deviceList.length} ${deviceList.length === 1 ? 'Gerät' : 'Geräte'} in den letzten 30 Tagen · ${loggedIn} angemeldet · ${online} online`
            ),
            el(
              'p',
              { class: 'mu' },
              'Hier siehst du, welches Gerät wo angemeldet ist, und kannst Geräten einen Spitznamen geben. „Ausloggen“ meldet ein Gerät sofort ab: Es kehrt zum Startbildschirm zurück (bei geöffneter App gleich, sonst beim nächsten Öffnen), bei Disponenten wird die Anmeldung sofort ungültig. Monteure können sich danach wieder anmelden.'
            ),
            el(
              'p',
              { class: 'mu' },
              'Standorte werden nur abgefragt, solange diese Seite offen ist – und nur von Monteur-Geräten, die gerade geöffnet sind und den Standort freigeben.'
            ),
            el(
              'button',
              {
                class: 'pri',
                onclick: () => {
                  loadDevices(true);
                  reloadDevicesSoon();
                }
              },
              '📍 Standorte jetzt aktualisieren'
            ),
            deviceListError && el('p', { class: 'mu er' }, deviceListError)
          )
        );
        // Team-Filter: alle Teams der Monteur-Geräte (mit Anzahl Geräte und davon online), dazu Disponenten und „ohne Team“
        const DEV_DISPO = '\u0000d',
          DEV_NOTEAM = '\u0000n',
          matchesDeviceTeam = device =>
            !deviceTeamFilter ||
            (deviceTeamFilter === DEV_DISPO
              ? device.role === 'dispo'
              : deviceTeamFilter === DEV_NOTEAM
                ? device.role === 'monteur' && !device.team
                : device.role === 'monteur' && device.team === deviceTeamFilter),
          deviceTeams = new Map();
        let dispoDevices = 0,
          noTeamDevices = 0;
        for (const device of deviceList) {
          if (device.role === 'dispo') dispoDevices++;
          else if (device.role === 'monteur' && !device.team) noTeamDevices++;
          else if (device.role === 'monteur') {
            const c = deviceTeams.get(device.team) || [0, 0];
            c[0]++;
            if (isOnline(device)) c[1]++;
            deviceTeams.set(device.team, c);
          }
        }
        // gewähltes Team gibt es nicht mehr (z. B. Gerät hat gewechselt): Filter aufheben
        if (
          deviceTeamFilter &&
          deviceTeamFilter !== DEV_DISPO &&
          deviceTeamFilter !== DEV_NOTEAM &&
          !deviceTeams.has(deviceTeamFilter)
        )
          deviceTeamFilter = '';
        const deviceOpt = (value, label) =>
          el('option', { value, ...(value === deviceTeamFilter ? { selected: 'selected' } : {}) }, label);
        app.append(
          el(
            'div',
            { class: 'flt', 'data-k': 'fl' },
            el('span', { class: 'mu' }, 'Team'),
            el(
              'select',
              {
                onchange: e => {
                  deviceTeamFilter = e.target.value;
                  deviceLogoutArmed = null;
                  render();
                }
              },
              deviceOpt('', `Alle Geräte (${deviceList.length})`),
              [...deviceTeams]
                .sort((a, b) => naturalCompare(a[0], b[0]))
                .map(([t, c]) => deviceOpt(t, `${t} (${c[0]} · ${c[1]} online)`)),
              noTeamDevices > 0 && deviceOpt(DEV_NOTEAM, `Monteur ohne Team (${noTeamDevices})`),
              dispoDevices > 0 && deviceOpt(DEV_DISPO, `Disponenten (${dispoDevices})`)
            ),
            deviceTeamFilter &&
              el(
                'button',
                {
                  class: 'rs',
                  onclick: () => {
                    deviceTeamFilter = '';
                    deviceLogoutArmed = null;
                    render();
                  }
                },
                '✕ Teamfilter aufheben'
              )
          )
        );
        // angemeldete Geräte zuerst, innerhalb davon online vor offline und das zuletzt aktive
        const sorted = deviceList
          .filter(matchesDeviceTeam)
          .sort(
            (a, b) =>
              (b.role ? 1 : 0) - (a.role ? 1 : 0) || isOnline(b) - isOnline(a) || b.seen - a.seen
          );

          return render();

            if (tabsShown !== dispoTab || performance.now() - tabsSince < 500)
              tabBar.scrollTo({
                left: target,
                behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'
              });
          }
          if (tabsShown !== dispoTab) tabsSince = performance.now();
          tabsShown = dispoTab;
        }
        if (dispoTab === 'us') {
          drawUsers();
          return;
        }
        if (dispoTab === 'di') {
          drawDispoPlan();
          return;
        }
        if (dispoTab === 'dv') {
          drawDevices();
          return;
        }
        if (dispoTab === 'vg') {
          drawComparison();
          return;
        }
        if (dispoTab === 'st') {
          drawDispoProgress();
          return;
        }
        if (dispoTab === 'up' && !uploadToken) {
          drawUploadPinPrompt();
          return;
        }
        if (dispoTab === 'up') {
          drawUploadTab();
          return;
        }
        drawDispoOverview();
      }

      /** Baut die komplette Seite aus dem Zustand: Meldungen, dann je nach Zustand Detail, Start, PIN, Team, Monteur- oder Dispo-Ansicht. */
      function draw() {
        applyFontScale();
        hideTooltip();
        document.body.dataset.w =
          !openOrder && (!session.role || (session.role === 'dispo' && !dispoUnlocked)) ? 'n' : '';
        app.replaceChildren();
        drawStatusBanners();
        if (openOrder) {
          drawOrderDetail();
          return;
        }
        if (!session.role) {
          drawRoleChoice();
          return;
        }
        const back = el('button', { onclick: () => switchRole(null) }, '← Start');
        if (session.role === 'dispo' && !dispoUnlocked) {
          drawDispoLogin(back);
          return;
        }
        // Monteure müssen sich anmelden (SAP-User + Passwort); danach gilt das Team aus der Benutzerverwaltung
        if (session.role === 'monteur' && !userToken) {
          drawMonteurLogin(back);
          return;
        }
        if (session.role === 'monteur' && !session.team) {
          drawTeamPicker(back);
          return;
        }
        // Team gibt es (noch) nicht bei den Aufträgen (z. B. „Springer“): Team wählen lassen
        if (
          session.role === 'monteur' &&
          !(userInfo && userInfo.lock) &&
          dataReady &&
          teamList.length &&
          !teamList.some(([t]) => t === session.team)
        ) {
          drawTeamPicker(back, session.team);
          return;
        }
        if (session.role === 'monteur') {
          drawMonteurList(back);
          return;
        }
        drawDispo(back);
      }

      // ---- Start ----
      // Ungesendete Eingaben aus dem Gerät laden, auf Netz-/Sichtbarkeitswechsel reagieren, erstmals zeichnen und abgleichen
      loadOutbox();
      addEventListener('online', () => {
        serverReachable = true;
        if (outbox.size) sendAllPending();
        poll();
      });
      addEventListener('offline', () => {
        serverReachable = false;
        render();
      });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
          if (outbox.size) sendAllPending();
          // nach dem Hintergrund ist die Verbindung oft stumm tot: neu aufbauen, wenn lange nichts kam
          if (live.ctrl && Date.now() - live.last > 45000) live.ctrl.abort();
          syncLive();
          if (liveDirty) renderLive();
          poll();
        }
      });
      // Sicherheitsnetz: steht die Live-Verbindung, reicht ein Abgleich alle 90 Sekunden, sonst alle 30
      setInterval(() => {
        if (!document.hidden && Date.now() - lastPollAt > (live.ok ? 90000 : 30000) - 2000) poll();
      }, 15000);
      // Geräteübersicht offen: alle 20 Sekunden neu laden (nicht während ein Spitzname getippt wird)
      setInterval(() => {
        if (
          dispoTab === 'dv' &&
          dispoUnlocked &&
          session.role === 'dispo' &&
          !document.hidden &&
          deviceRenameId === null
        )
          loadDevices();
      }, 20000);
      // Erst zeichnen, wenn die Schrift (Inter, vier Schnitte à ~24 KB) geladen ist: sonst springt der Text beim Nachladen um
      // (andere Zeichenbreiten -> neue Umbrüche). Höchstens 700 ms warten (dann gilt vorübergehend die Systemschrift, font-display: swap).
      const fontsLoaded =
        document.fonts && document.fonts.load
          ? Promise.race([
              Promise.all(['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 1rem Inter`))).catch(() => {}),
              new Promise(resolve => setTimeout(resolve, 700))
            ])
          : Promise.resolve();
      fontsLoaded.then(() => {
        render();
        poll().then(() => {
          sendAllPending();
          prefetchChecklists();
          pushSync(false);
        });
        syncLive();
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
        // Push angekommen / bestätigt -> sofort abgleichen
        navigator.serviceWorker.addEventListener('message', e => {
          if (e.data && e.data.t === 'msg') poll();
        });
      }
    </script>
  </body>
</html>
