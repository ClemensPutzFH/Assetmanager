      // als Hinweis (infoMsg, verschwindet nach INFO_MS von selbst). Nichts wird gesperrt. Das „…“ ersetzt: ein Hinweis mit „…“ gilt als
      // Fortschrittsmeldung und bliebe stehen.
      // Push zählt nur, wenn auch der Server das Gerät samt Abo kennt (serverDevState 2; null = noch unbekannt): erlaubte Benachrichtigungen allein
      // helfen nicht, wenn das Abo dort fehlt (andere Datenbank, abgelaufen) – dann käme weder Push noch dieser Hinweis, und es sähe aus, als ginge es nicht.
      const pushWorks = () =>
        pushSupported() && Notification.permission === 'granted' && !pushError && (serverDevState === null || serverDevState === 2);
      function onDispoNote(n) {
        if (session.role !== 'monteur' || pushWorks()) return;
        infoMsg = ('🔔 ' + n.title + ' – ' + n.brief).replace(/…/g, '...');
        liveDirty = true;
        if (!liveRenderTimer) liveRenderTimer = setTimeout(renderLive, liveRenderDelay);
      }
      // Ankündigung vom Server (siehe announce() in server.js): { s: Nummer, d?: Daten, n?: 1 = bitte abgleichen }
      function onLive(m) {
        if (m.dn) return onDispoNote(m.dn);
        if (!(m.s > syncSeq)) return; // schon bekannt (z. B. durch einen Abgleich)
        if (m.s !== syncSeq + 1 || m.n || isPolling) return poll(); // Lücke, größere Änderung oder Abgleich läuft: normal abgleichen
        syncSeq = m.s;
        const d = m.d;
        if (!d) return; // betrifft dieses Gerät nicht
        if (d.k === 'e') {
          if (m.s > (resultSeq.get(d.a) || 0)) {
            results.set(d.a, d.doc);
            resultSeq.set(d.a, m.s);
          }
        } else if (d.k === 'm') {
          for (const a of d.ids) marks.set(a, { v: d.v, at: d.at, sq: m.s });
          dropEditsOfLockedOrder(); // der offene Auftrag wurde abgehakt: Eingaben schließen
        } else if (d.k === 'c') {
          // Chat-Nachricht: an den Verlauf anhängen, die Seite wird nicht neu gezeichnet (Eingabefeld, Tastatur und Scroll-Stelle bleiben)
          chatApply([d.row], { notify: true });
          chatPatchAll();
          if (!liveSaveTimer)
            liveSaveTimer = setTimeout(() => {
              liveSaveTimer = null;
              saveCache();
            }, 3000);
          return;
        } else if (d.k === 'o') {
          // Disposition geändert (Disponent): die geänderten Aufträge und die neue Teamliste. Stimmen sie mit dem überein, was das Gerät
          // schon zeigt (eigenes Speichern, siehe dispoSave), muss nichts neu gezeichnet werden
          const same = d.rows.every(r => {
            const o = ordersMap.get(r.auftrag);
            return !!o && ['team', 'start', 'ende', 'uhr', 'uhr2', 'dis'].every(k => (o[k] || '') === (r[k] || ''));
          });
          for (const r of d.rows) ordersMap.set(r.auftrag, r);
          if (d.teams) teamList = d.teams;
          rebuildOrdersByTeam();
          if (same) return;
        }
        // höchstens alle 80 ms neu zeichnen (mehrere Änderungen auf einmal -> ein Zeichnen), Cache höchstens alle 3 s schreiben
        liveDirty = true;
        if (!liveRenderTimer) liveRenderTimer = setTimeout(renderLive, liveRenderDelay);
        if (!liveSaveTimer)
          liveSaveTimer = setTimeout(() => {
            liveSaveTimer = null;
            saveCache();
          }, 3000);
      }
      function renderLive() {
        liveRenderTimer = null;
        const a = document.activeElement;
        // nicht mitten in einer Eingabe und nicht im Hintergrund (dann beim Zurückkehren, siehe visibilitychange)
        if (document.hidden || editIndex !== null || gDrag || (a && a.dataset && a.dataset.nr)) return;
        liveDirty = false;
        const t0 = performance.now();
        render();
        liveRenderDelay = Math.min(1000, Math.max(80, Math.round((performance.now() - t0) * 4)));
      }

      // ---- Auftragslisten ----
      // alle Aufträge (mit Team) als flache Liste
      // (die Liste wird nur neu gebaut, wenn sich ordersByTeam geändert hat; sie darf nicht verändert werden)
      let allOrdersCache = { src: null, list: [] };
      const allOrders = () => {
        if (allOrdersCache.src !== ordersByTeam)
          allOrdersCache = {
            src: ordersByTeam,
            list: [...ordersByTeam.values()].flatMap(c => c.rows.map(r => ({ ...r, team: c.team })))
          };
        return allOrdersCache.list;
      };
      // [[Team, Anzahl]] sortiert
      const teamCounts = () => teamList.map(([t, n]) => [t, n]).sort((a, b) => naturalCompare(a[0], b[0]));
      // ---- Auftragsarten ----
      // Jeder Auftrag hat eine Auftragsart der App (kind): war Wartung (3NAW, Leistungsart FWS), rep Reparatur (3NAR – jeder Vorgang ist ein
      // eigener Auftrag), ent Entstörung (3NAE), dau Dauerauftrag (3NAW, Leistungsart FWD). Dazu gibt es „mel“: Meldungen (Schäden), die noch
      // keinem Auftrag zugeordnet sind – das sind keine Aufträge, sondern nur eine Liste. Ältere Aufträge ohne kind sind Wartungen.
      // timed: Termin und Uhrzeit sind wichtig (Anzeige, Sortierung, Vorbelegung der Zeit)
      const KINDS = [
        { k: 'war', name: 'Wartung', plural: 'Wartungen', icon: '🔧', note: 'Prüfobjekte bewerten, Zeit melden' },
        { k: 'rep', name: 'Reparatur', plural: 'Reparaturen', icon: '🛠️', note: 'Vorgänge mit Termin und Uhrzeit', timed: true },
        { k: 'ent', name: 'Entstörung', plural: 'Entstörungen', icon: '🚨', note: 'mit Termin und Uhrzeit', timed: true },
        { k: 'dau', name: 'Dauerauftrag', plural: 'Daueraufträge', icon: '♻️', note: 'laufende Arbeiten' },
        { k: 'mel', name: 'Meldung', plural: 'Meldungen', icon: '📋', note: 'gemeldete Schäden ohne Auftrag' }
      ];
      const kindInfo = k => KINDS.find(x => x.k === k) || KINDS[0];
      // „1 Reparatur“ / „4 Reparaturen“
      const kindCount = (k, n) => `${n} ${n === 1 ? kindInfo(k).name : kindInfo(k).plural}`;
      const orderKind = order => order.kind || 'war';
      const isTimedKind = k => !!kindInfo(k).timed;
      // echte Auftragsnummer (bei Reparaturen ist `auftrag` „Nummer-Vorgang“)
      const orderNr = order => order.nr || order.auftrag;
      // so steht ein Auftrag auf Karte und Kopfzeile: bei Reparaturen mit dem Vorgang nach einem Bindestrich („65900001-0010“)
      const orderLabel = order => orderNr(order) + (order.vg ? '-' + order.vg : '');
      // Aufträge einer Auftragsart (Meldungen sind keine Aufträge)
      const ordersOfKind = (rows, k) => rows.filter(r => orderKind(r) === k);
      // ---- Meldungen (Schäden) ----
      function rebuildMeldungen() {
        meldungenByOrder = new Map();
        for (const m of meldungen.values())
          if (m.auftrag) (meldungenByOrder.get(m.auftrag) || meldungenByOrder.set(m.auftrag, []).get(m.auftrag)).push(m);
      }
      /**
       * Gebrechen: Meldungen mit der Codierung „Gebrechen leicht/mittel/stark“ sind dringender als ein Schaden und werden hervorgehoben
       * (Etikett mit Schwere, farbige Kante an Karte und Meldung). gebrechenOf liefert { lvl: 1 leicht | 2 mittel | 3 stark, word } oder
       * null (Schaden und alles andere). Bei mehreren Meldungen zählt die schwerste (worstGebrechen).
       */
      const GEBRECHEN_LEVELS = { leicht: 1, mittel: 2, stark: 3 };
      const gebrechenOf = m => {
        const x = /^Gebrechen(?:\s+(leicht|mittel|stark))?\b/i.exec(String((m && m.code) || '').trim());
        return x ? { lvl: GEBRECHEN_LEVELS[(x[1] || 'leicht').toLowerCase()], word: (x[1] || '').toLowerCase() } : null;
      };
      const worstGebrechen = melds => melds.map(gebrechenOf).filter(Boolean).sort((a, b) => b.lvl - a.lvl)[0] || null;
      const gebrechenTag = g => el('span', { class: 'tag gb gb-' + g.lvl, title: 'Gebrechen' + (g.word ? ', ' + g.word : '') }, '⚠ Gebrechen' + (g.word ? ' · ' + g.word : ''));
      // Meldungen, schwerstes Gebrechen zuerst (sonst in der Reihenfolge der Datei)
      const bySeverity = melds => [...melds].sort((a, b) => ((gebrechenOf(b) || {}).lvl || 0) - ((gebrechenOf(a) || {}).lvl || 0));
      // Meldungen zu einem Auftrag (nach Nummer)
      const meldungenOf = order => meldungenByOrder.get(orderNr(order)) || [];
      // Meldungen ohne Auftrag (team = nur die dieses Teams)
      const freeMeldungen = team => [...meldungen.values()].filter(m => !m.auftrag && (!team || m.team === team));
      // ---- Abhaken (Disponent) ----
      // 0 = nicht abgehakt, 1 = abgehakt, 2 = abgehakt, aber das Ergebnis wurde danach noch geändert
      const markState = orderNo => {
        const mark = marks.get(orderNo);
        return !mark || !mark.v ? 0 : (resultSeq.get(orderNo) || 0) > mark.sq ? 2 : 1;
      };
      /**
       * Monteur: Vom Disponenten abgehakte Aufträge sind gesperrt – man kann sie ansehen, aber nichts mehr ändern (Prüfobjekte,
       * Zeit, Kollegen). Auch der Server lehnt Änderungen dann ab (423). Nimmt der Disponent den Haken zurück, geht es wieder.
       */
      function isLocked(orderNo) {
        return session.role === 'monteur' && !!(marks.get(orderNo) || {}).v;
      }
      const LOCKED_TEXT = 'Dieser Auftrag wurde vom Disponenten abgehakt und kann nicht mehr bearbeitet werden.';
      // Änderung an einem gesperrten Auftrag (z. B. kurz nach dem Abhaken getippt): nicht speichern, Hinweis zeigen
      function denyLocked() {
        dropEditsOfLockedOrder();
        toast('🔒 ' + LOCKED_TEXT);
        playErrorSound();
        render();
      }
      // Wird der offene Auftrag gesperrt, während der Monteur gerade etwas eingibt, schließen sich die Eingaben (Nicht-OK-Text,
      // Rückfrage „Alles OK“, Zeitformular)
      function dropEditsOfLockedOrder() {
        if (!openOrder || !isLocked(openOrder.auftrag)) return;
        editIndex = null;
        armAllOk = false;
        timeFormOpen = false;
        timeError = '';
        entryKey = '';
      }
      // Zeitpunkt (ms) als „TT.MM.JJ, HH:MM“
      const formatDateTime = t =>
        new Date(t).toLocaleString('de-AT', { dateStyle: 'short', timeStyle: 'short' });
      /**
       * Hakt Aufträge ab (checked = true) bzw. nimmt den Haken zurück (POST /api/mark). Merkt sich den vorherigen Zustand
       * für „Rückgängig“ (10 Sekunden), wenn undo gesetzt ist.
       */
      async function setMarks(ids, checked, undo = true) {
        if (!ids.length) return;
        const prev = ids.map(a => [a, markState(a)]);
        errorMsg = '';
        try {
          const response = await api('POST', '/api/mark', { ids, v: checked }, 60000);
          for (const a of ids) marks.set(a, { v: checked ? 1 : 0, at: response.at, sq: response.sq });
          clearTimeout(cacheSaveTimer);
          cacheSaveTimer = setTimeout(saveCache, 1500);
          clearTimeout(undoTimer);
          undoInfo = null;
          if (undo) {
            undoInfo = {
              prev,
              v: checked,
              txt:
                (ids.length === 1 ? 'Auftrag ' + ids[0] : ids.length + ' Aufträge') +
                (checked ? ' abgehakt' : ' nicht mehr abgehakt') +
                (checked && markedFilter === 'hide' ? ' und ausgeblendet' : '')
            };
            undoTimer = setTimeout(() => {
              undoInfo = null;
              render();
            }, 10000);
          }
        } catch (e) {
          errorMsg = e.net ? 'Keine Verbindung – Abhaken wurde nicht gespeichert' : errorMessageOf(e);
        }
        render();
      }
      // „Rückgängig“: stellt den Zustand vor der letzten Abhak-Aktion wieder her
      function undoLastMarks() {
        const u = undoInfo;
        undoInfo = null;
        clearTimeout(undoTimer);
        if (u)
          setMarks(
            u.prev.filter(([, x]) => !!x !== !!u.v).map(([a]) => a),
            !u.v,
            false
          );
      }
      // Zeile mit Abhak-Schaltfläche und Zeitpunkt unter einer Auftragskarte (Dispo)
      const markRow = order => {
        const state = markState(order.auftrag),
          mark = marks.get(order.auftrag);
        return el(
          'div',
          { class: 'mkr' },
          el(
            'button',
            {
              class: 'mkb' + (state === 1 ? ' on' : state === 2 ? ' ch' : ''),
              onclick: e => {
                e.stopPropagation();
                setMarks([order.auftrag], state !== 1);
              }
            },
            state === 1 ? '☑ Abgehakt' : state === 2 ? '⚠ Danach geändert – neu abhaken' : '☐ Abhaken'
          ),
          state > 0 &&
            el('span', { class: 'mu' }, (state === 2 ? 'abgehakt am ' : 'am ') + formatDateTime(mark.at))
        );
      };
      // ---- Filter und Auftragskarte ----
      // Rückmeldezeitpunkt = wann die Zeit zurückgemeldet wurde (tat); Filterzeitraum als [von, bis] (JJJJ-MM-TT, leer = offen)
      // Datum von heute + n Tagen
      const dateOffset = n => {
        const g = new Date();
        g.setDate(g.getDate() + n);
        return g.toLocaleDateString('sv-SE');
      };
      // Zeitraum des Filters „Rückgemeldet“ als [von, bis] oder null (kein Filter)
      const reportedRange = () =>
        reportedFilter === 'h'
          ? [today(), today()]
          : reportedFilter === 'g'
            ? [dateOffset(-1), dateOffset(-1)]
            : reportedFilter === '7'
              ? [dateOffset(-6), today()]
              : reportedFilter === 'm'
                ? [today().slice(0, 8) + '01', today()]
                : reportedFilter === 'z'
                  ? [reportedFrom, reportedTo]
                  : null;
      // Tag, an dem die Zeit zurückgemeldet wurde (JJJJ-MM-TT) oder ''
      const reportedDate = r => {
        const d = resultOf(r.auftrag);
        return d && d.min != null && d.tat ? new Date(d.tat).toLocaleDateString('sv-SE') : '';
      };
      // true, wenn der Auftrag in den Zeitraum R fällt
      const inRange = (r, R) => {
        const x = reportedDate(r);
        return !!x && (!R[0] || x >= R[0]) && (!R[1] || x <= R[1]);
      };
      // ---- Termine: Anzeige als TT.MM.JJJJ, Fälligkeit und Sortierung ----
      // Termin-Text („1.10.2026“ oder „2026-10-01“) -> JJJJ-MM-TT, sonst ''
      const isoOfDate = t => {
        const x = String(t || '').trim();
        let m = /^(\d{4})-(\d{2})-(\d{2})/.exec(x);
        if (m) return `${m[1]}-${m[2]}-${m[3]}`;
        m = /^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})$/.exec(x);
        return m ? `${m[3].length === 2 ? '20' + m[3] : m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}` : '';
      };
      const dateDe = t => (isoOfDate(t) ? formatIsoDate(isoOfDate(t)) : String(t || ''));
      // Wochentag („Mi“) zu einem Datum JJJJ-MM-TT
      const weekdayShort = iso => new Date(iso + 'T12:00:00').toLocaleDateString('de-AT', { weekday: 'short' }).replace('.', '');
      /**
       * Termin einer Reparatur/Entstörung mit Uhrzeit: „Mi 07.01.2026 · 04:00–06:30 Uhr“ (über Mitternacht: „… 13:00 Uhr bis 08.01.2026,
       * 05:55 Uhr“). Fehlt die Uhrzeit, steht nur das Datum; fehlt das Datum, ein leerer Text.
       */
      // short: ohne das laufende Jahr („Mo 05.10.“ statt „Mo 05.10.2026“) – für enge Stellen wie die Karten der Offen-Liste
      const termText = (order, short = false) => {
        const from = isoOfDate(order.start),
          to = isoOfDate(order.ende),
          date = t => {
            const d = dateDe(t);
            return short && d.endsWith('.' + new Date().getFullYear()) ? d.slice(0, -4) : d;
          };
        if (!from) return '';
        const day = weekdayShort(from) + ' ' + date(order.start);
        if (to && to !== from)
          return `${day}${order.uhr ? ' · ' + order.uhr + ' Uhr' : ''} bis ${weekdayShort(to)} ${date(order.ende)}${order.uhr2 ? ', ' + order.uhr2 + ' Uhr' : ''}`;
        return day + (order.uhr ? ' · ' + order.uhr + (order.uhr2 && order.uhr2 > order.uhr ? '–' + order.uhr2 : '') + ' Uhr' : '');
      };
      // Etikett „Heute“ / „Morgen“ für noch nicht erledigte Reparaturen und Entstörungen (Termin = Beginndatum)
      const termTag = order => {
        if (!isTimedKind(orderKind(order))) return null;
        const from = isoOfDate(order.start);
        if (!from) return null;
        const days = Math.round((new Date(from + 'T12:00:00') - new Date(today() + 'T12:00:00')) / 864e5);
        return days === 0
          ? el('span', { class: 'tag st-zf' }, '📅 Heute')
          : days === 1
            ? el('span', { class: 'tag st-zf' }, '📅 Morgen')
            : null;
      };
      // Fälligkeit nach dem Endtermin (nur für nicht erledigte Aufträge): überfällig | heute | in höchstens 3 Tagen, sonst null.
      // Die Aufträge gelten für das ganze Jahr: „überfällig“ gibt es deshalb nur, wenn der Endtermin im Vorjahr (oder früher) liegt.
      const dueInfo = order => {
        const end = isoOfDate(order.ende);
        if (!end || orderKind(order) !== 'war' || isFinished(order)) return null;
        const now = today(),
          days = Math.round((new Date(end + 'T12:00:00') - new Date(now + 'T12:00:00')) / 864e5);
        if (days < 0) return end.slice(0, 4) < now.slice(0, 4) ? { kind: 'over', days: -days } : null;
        return days <= 3 ? { kind: days ? 'soon' : 'today', days } : null;
      };
      const dueTag = order => {
        const d = dueInfo(order);
        if (!d) return null;
        const plural = n => (n === 1 ? '1 Tag' : n + ' Tagen');
        return d.kind === 'over'
          ? el('span', { class: 'tag st-nok' }, `⏰ überfällig seit ${plural(d.days)}`)
          : el('span', { class: 'tag st-zf' }, d.kind === 'today' ? '⏰ heute fällig' : `⏰ fällig in ${plural(d.days)}`);
      };
      /**
       * Reparaturen und Entstörungen im Verzug: Der Termin sollte schon gewesen sein – sein Ende (Enddatum, sonst das Datum) liegt vor
       * heute – und der Auftrag ist noch nicht endrückgemeldet (Teilzeiten genügen nicht). Wer pünktlich arbeitet, hat in der Liste nur Aufträge von heute an. Alles Ältere
       * ist hervorgehoben (rotes Etikett mit den Tagen, rote Kante) und steht in der Liste ganz oben. Ergebnis { days } oder null.
       */
      const dueDateOf = order => isoOfDate(order.ende) || isoOfDate(order.start);
      const lateInfo = order => {
        const due = isTimedKind(orderKind(order)) ? dueDateOf(order) : '';
        if (!due || isFinished(order)) return null;
        const days = Math.round((new Date(today() + 'T12:00:00') - new Date(due + 'T12:00:00')) / 864e5);
        return days > 0 ? { days } : null;
      };
      const lateTag = order => {
        const l = lateInfo(order);
        return l && el('span', { class: 'tag st-nok' }, `⏰ im Verzug · ${l.days === 1 ? '1 Tag' : l.days + ' Tage'}`);
      };
      // Sortierung der Listen: Auftragsnummer (alle), Entfernung (Monteur: nächste zuerst, ohne Adresse zuletzt) oder Rückmeldung
      // (Disponent: zuletzt zurückgemeldete zuerst, ohne Rückmeldung zuletzt). Gespeichert ist die letzte Wahl; gilt sie in der
      // aktuellen Rolle nicht, wird nach Nummer sortiert (sortMode).
      // Reparaturen und Entstörungen sind zeitlich wichtig: Standard ist hier „zeit“ – das Älteste zuerst, die neueren darunter (wer im
      // Verzug ist, sieht das oben, sonst stehen nur Aufträge von heute an in der Liste); wer „Auftragsnummer“ antippt, bekommt die Nummer.
      // Die gespeicherte Wahl (Entfernung, Rückmeldung …) gilt nur für Wartungen, Daueraufträge und Meldungen: sonst überstimmte ein einmal
      // gewähltes „Entfernung“ aus der Wartungsliste für immer den Termin der Reparaturen. Reparaturen/Entstörungen merken sich eine
      // andere Wahl nur bis zum Neuladen (timedSort).
      const sortChoice = () => (isTimedKind(viewKind) ? timedSort : listSort);
      const sortMode = () => {
        const choice = sortChoice();
        return session.role === 'dispo'
          ? choice === 'rueck'
            ? 'rueck'
            : isTimedKind(viewKind) && choice !== 'nr'
              ? 'zeit'
              : 'nr'
          : choice === 'nah'
            ? 'nah'
            : isTimedKind(viewKind) && choice !== 'nr'
              ? 'zeit'
              : 'nr';
      };
      // Sortierschlüssel nach Termin: Datum + Uhrzeit (ohne Uhrzeit vor der ersten Uhrzeit des Tages)
      const termKey = r => (isoOfDate(r.start) || '') + ' ' + (r.uhr || '00:00');
      const sortRows = rows => {
        const byNr = (a, b) => naturalCompare(a.auftrag, b.auftrag),
          mode = sortMode(),
          reported = r => {
            const d = resultOf(r.auftrag);
            return d && d.min != null && d.tat ? d.tat : 0;
          };
        // Entfernung: ohne Standort (noch nicht ermittelt oder nicht erlaubt) bleibt es bei der Nummer; ohne Adresse ganz ans Ende
        if (mode === 'nah' && geoPos) {
          const far = new Map(rows.map(r => [r.auftrag, distanceKm(r) ?? Infinity]));
          return rows.sort((a, b) => far.get(a.auftrag) - far.get(b.auftrag) || byNr(a, b)); // Infinity − Infinity = NaN -> Nummer
        }
        if (mode === 'zeit')
          // nach Fälligkeit (Enddatum, sonst Datum), dann nach Beginn und Uhrzeit: das Älteste zuerst; ohne Datum ans Ende
          return rows.sort((a, b) => {
            const da = dueDateOf(a),
              db = dueDateOf(b);
            if (!da || !db) return !da - !db || byNr(a, b);
            return da.localeCompare(db) || termKey(a).localeCompare(termKey(b)) || byNr(a, b);
          });
        return rows.sort(mode === 'rueck' ? (a, b) => reported(b) - reported(a) || byNr(a, b) : byNr);
      };
      // ---- Entfernung: Koordinaten der Adressen (vom Server) + Standort des Geräts ----
      // geoMap: "PLZ|Straße" -> [Breite, Länge, 'h' Hausnummer gefunden | 's' nur die Straße] · geoSince: Stand beim Server (?since=) ·
      // geoPending: so viele Adressen hat der Server noch nicht aufgelöst (dafür gilt vorerst die Bezirksmitte) · geoErr: letzter Fehler
      // des Geocoders am Server · geoOff: Server fragt keinen Geocoder ab · geoFailed: der Abruf der Koordinaten ist gescheitert ·
      // geoPos: letzter Standort { lat, lon, at, acc (Genauigkeit in m) } oder null (bleibt nur im Gerät, wird nie an den Server gesendet) ·
      // geoStatus: '' | 'wait' (Abfrage läuft) | 'denied' (nicht erlaubt) | 'unavailable' (nicht möglich) · geoAsked: in dieser

      // Liste der Aufträge als Kartenraster (gefiltert nach Suche, sortiert nach Auftragsnummer, höchstens 300 Karten)

        const sig = [viewKind, teamFilter, statusFilter, markedFilter, reportedFilter, reportedFrom, reportedTo, monteurFilter, searchText, session.role, session.team, dispoTab, sortMode(), sortMode() === 'nah' ? geoVer : ''].join('|');
        if (sig !== listSig) {
          listSig = sig;
          listLimit = LIST_CHUNK;
        }
        const shown = Math.min(total, listLimit);
        if (moreObserver) moreObserver.disconnect();
        moreObserver = null;
        const container = el('div', {});
        container.append(
          el('p', { class: 'mu cnt' }, (filtered.length === 1 ? '1 Auftrag' : `${filtered.length} Aufträge`) + geoLine(filtered)),
          el(
            'div',
            { class: 'grid', 'data-list': '1' },
            filtered.slice(0, shown).map(r => orderCard(r, showTeam))
          )
        );
        if (shown < total) {
          const loadMore = () => {
            if (listLimit >= total) return;
            listLimit += LIST_CHUNK;
            render();
          };
          // Unsichtbare Marke am Ende der Liste: kommt der Nutzer in ihre Nähe (1200 px davor), wird die Liste automatisch länger.
          // Nur ohne IntersectionObserver (sehr alter Browser) gibt es stattdessen einen Button.
          const more = el(
            'div',
            { class: 'more', 'aria-hidden': 'true' },
            typeof IntersectionObserver === 'undefined' &&
              el('button', { onclick: loadMore }, `Weitere Aufträge anzeigen (${shown} von ${total})`)
          );
          container.append(more);
          if (typeof IntersectionObserver !== 'undefined') {
            moreObserver = new IntersectionObserver(
              entries => {
                if (entries.some(e => e.isIntersecting)) loadMore();
              },
              { rootMargin: '1200px 0px' }
            );
            moreObserver.observe(more);
          }
        }
        if (filtered.length > LIST_MAX)
          container.append(el('p', { class: 'mu' }, `Nur die ersten ${LIST_MAX} angezeigt – Suche nutzen.`));
        return container;
      }
      // Karten je Portion / höchstens je Liste; listLimit = aktuell gezeichnete Anzahl, listSig = Kennung von Filter/Suche/Ansicht
      const LIST_CHUNK = 60,
        LIST_MAX = 300;
      let listLimit = LIST_CHUNK,
        listSig = '',
        moreObserver = null;
      // ---- Vergleich (Disponent): Aufträge-Excel (Original) gegen den Export dieser App ----
      // Es gelten nur zwei Regeln. „Erledigt“ bedeutet hier: vom Disponenten abgehakt (Spalte „Abgehakt am“ im Export).
      //   · nicht abgehakt -> der Auftrag muss in der Aufträge-Excel stehen
      //   · abgehakt       -> der Auftrag darf dort nicht mehr stehen
      // Alles andere (Status, Prüfergebnis, Aufträge, die nur in der Excel stehen) wird ignoriert.
      // Die Dateien werden nur im Browser gelesen und nicht hochgeladen.
      // cmpOrderFiles / cmpExportFiles: gewählte Dateien · cmpResult: Ergebnis des Vergleichs · cmpFilter: gewählter Chip
      let cmpOrderFiles = [],
        cmpExportFiles = [],
        cmpResult = null,
        cmpFilter = '',
        cmpBusy = false;
      // Bewertungstexte: fehlt = nicht abgehakt, fehlt aber in der Excel · noch = abgehakt, steht noch in der Excel · ok = stimmt
      const CMP_LABELS = {
        fehlt: 'Nicht abgehakt – fehlt in der Excel',
        noch: 'Abgehakt – steht noch in der Excel',
        ok: 'Stimmt überein'
      };
      /**
       * Liest beide Dateien im Worker (type 'cmp') und vergleicht: Basis sind die Aufträge des Exports. Erkennt vertauschte
       * Dateien (die Aufträge-Excel hat keine Spalte „Abgehakt am“, der Export schon). Ergebnis in cmpResult.
       */
      async function runComparison() {
        cmpBusy = true;
        errorMsg = '';
        cmpResult = null;
        render();
        try {
          const read = async fl => {
            const m = new Map();
            let hk = false;
            for (const f of fl) {
              const buf = await f.arrayBuffer();
              const r = await runExcelWorker({ type: 'cmp', buf }, [buf]);
              hk = hk || r.hasStatus;
              for (const o of r.rows) m.set(o.auftrag, o);
            }
            return { m, hk };
          };
          const ordersExcel = await read(cmpOrderFiles),
            exportExcel = await read(cmpExportFiles);
          if (ordersExcel.hk)
            throw new Error(
              'Die Datei bei „Aufträge-Excel“ hat eine Spalte „Abgehakt am“ und sieht wie der Export aus – bitte die beiden Dateien tauschen.'
            );
          if (!exportExcel.hk)
            throw new Error(
              'Die Datei bei „Export“ hat keine Spalte „Abgehakt am“ – bitte den aktuellen Excel-Export aus der Übersicht verwenden.'
            );
          if (!ordersExcel.m.size)
            throw new Error('In der Aufträge-Excel wurden keine Aufträge gefunden (Spalte „Auftrag“ nötig).');
          if (!exportExcel.m.size) throw new Error('Im Export wurden keine Aufträge gefunden.');
          const rows = [];
          for (const o of exportExcel.m.values()) {
            const x = ordersExcel.m.get(o.auftrag),
              hak = !!o.hak;
            rows.push({
              k: !hak && !x ? 'fehlt' : hak && x ? 'noch' : 'ok',
              a: o.auftrag,
              team: o.team || (x && x.team) || '',
              kurz: o.kurz || (x && x.kurz) || '',
              hak: o.hak,
              ex: !!x
            });
          }
          rows.sort((p, q) => naturalCompare(p.a, q.a));
          const counts = { fehlt: 0, noch: 0, ok: 0 };
          rows.forEach(r => counts[r.k]++);
          cmpResult = {
            rows,
            cnt: counts,
            nA: ordersExcel.m.size,
            nB: exportExcel.m.size,
            nH: rows.filter(r => r.hak).length
          };
          cmpFilter = counts.fehlt + counts.noch ? '' : 'ok';
        } catch (e) {
          errorMsg = errorMessageOf(e);
        }
        cmpBusy = false;
        render();
      }
      // Seite „Vergleich“: Dateiauswahl, Ergebnis-Zusammenfassung, Filter-Chips und Tabelle (höchstens 500 Zeilen)
      function drawComparison() {
        const pick = (lbl, hint, get, set, multi) => {
          const inp = el('input', {
            type: 'file',
            accept: '.xlsx,.xls',
            multiple: multi ? 'multiple' : null,
            onchange: e => {
              set([...e.target.files]);
              cmpResult = null;
              errorMsg = '';
              render();
            }
          });
          const fl = get();
          return el(
            'div',
            { class: 'card' },
            el('b', {}, lbl),
            el('p', { class: 'mu' }, hint),
            el('label', { class: 'fpick' }, fl.length ? 'Andere Datei wählen' : 'Datei wählen', inp),
            fl.length > 0 && el('p', { class: 'mu fnm' }, '✓ ' + fl.map(f => f.name).join(', '))
          );
        };
        app.append(
          el(
            'div',
            { class: 'ugrid' },
            pick(
              '1. Aufträge-Excel',
              'Die Datei, die sonst als Aufträge hochgeladen wird (Spalte „Auftrag“).',
              () => cmpOrderFiles,
              v => {
                cmpOrderFiles = v;
              },
              true
            ),
            pick(
              '2. Export aus dieser App',
              'Der Excel-Export aus der Übersicht („⬇ Excel exportieren“) mit der Spalte „Abgehakt am“.',
              () => cmpExportFiles,
              v => {
                cmpExportFiles = v;
              }
            )
          )
        );
        app.append(
          el(
            'button',
            {
              class: 'pri vgbtn',
              disabled: cmpBusy || !cmpOrderFiles.length || !cmpExportFiles.length ? 'disabled' : null,
              onclick: runComparison

            cmpBusy ? 'Vergleiche …' : 'Vergleichen'
          )
        );
        // Vergleich läuft: Platzhalter, bis das Ergebnis da ist
        if (cmpBusy) {
          app.append(skeletonTable());
          return;
        }
        if (!cmpResult) {
          app.append(
            el(
              'p',
              { class: 'mu' },
              'Geprüft wird nur: Nicht abgehakte Aufträge müssen in der Aufträge-Excel stehen, abgehakte Aufträge dürfen dort nicht mehr stehen. Alles andere (Status, Prüfergebnis, Aufträge nur in der Excel) wird ignoriert. Die Dateien werden nur hier im Browser gelesen und nicht hochgeladen.'
            )
          );
          return;
        }
        const result = cmpResult,
          counts = result.cnt,
          discrepancies = counts.fehlt + counts.noch;
        app.append(
          el(
            'div',
            { class: 'card vgsum ' + (discrepancies ? 'bad' : 'good') },
            el(
              'b',
              {},
              discrepancies

                : '✓ Keine Abweichungen'
            ),
            el(
              'p',
              { class: 'mu' },
              `Export: ${result.nB} Aufträge (${result.nH} abgehakt, ${result.nB - result.nH} nicht abgehakt) · Aufträge-Excel: ${result.nA} Aufträge`
            )
          )
        );
        app.append(
          filterChips(
            [
              ['', 'Abweichungen', discrepancies],
              ['fehlt', 'Nicht abgehakt, fehlt in Excel', counts.fehlt],
              ['noch', 'Abgehakt, noch in Excel', counts.noch],
              ['ok', 'Stimmt überein', counts.ok],
              ['all', 'Alle', result.rows.length]
            ],
            cmpFilter,
            k => {
              cmpFilter = k;
            }
          )
        );
        const filtered = result.rows.filter(
          r => cmpFilter === 'all' || (cmpFilter === '' ? r.k !== 'ok' : r.k === cmpFilter)
        );
        if (!filtered.length) {
          app.append(el('p', { class: 'mu' }, 'Keine Einträge.'));
          return;
        }
        const tbody = el(
          'tbody',
          {},
          filtered
            .slice(0, 500)
            .map(r =>
              el(
                'tr',
                { class: 'vg-' + r.k },
                el('td', {}, r.a),
                el('td', { class: 'vk' }, CMP_LABELS[r.k]),
                el('td', {}, r.team || '–'),
                el('td', { class: 'wr' }, r.kurz || '–'),
                el('td', {}, r.hak || 'nicht abgehakt'),
                el('td', {}, r.ex ? 'ja' : 'nein')
              )
            )
        );
        app.append(
          el('p', { class: 'mu' }, filtered.length === 1 ? '1 Eintrag' : `${filtered.length} Einträge`),
          el(
            'div',
            { class: 'gtw card' },
            el(
              'table',
              { class: 'gt vgt' },
              el(
                'thead',
                {},
                el(
                  'tr',
                  {},
                  ['Auftrag', 'Bewertung', 'Team', 'Kurztext', 'Abgehakt am', 'In Excel'].map(h =>
                    el('th', {}, h)
                  )
                )
              ),
              tbody
            )
          )
        );
        if (filtered.length > 500)
          app.append(el('p', { class: 'mu' }, 'Nur die ersten 500 angezeigt – Filter nutzen.'));
      }
      // ---- Fortschritt aller Teams (Disponent): Gesamt + je Team, live aus denselben Daten wie die Übersicht ----
      // teamSort: 'n' nach Name | 'p' nach Fortschritt (im Gerät gespeichert) · teamTableView: Tabelle statt Diagramm
      let teamSort = 'n',
        teamTableView = false;
      try {
        teamSort = localStorage.getItem('gsort') === 'p' ? 'p' : 'n';
      } catch (e) {}
      const percent = (a, n) => (!n ? 0 : a === n ? 100 : Math.min(99, Math.round((a / n) * 100))); // 100 % nur wenn wirklich alles erledigt
      const weeklyQuota = (rest, at) => (rest && at ? Math.ceil(rest / (at / 5)) : 0); // nötige Prüfungen pro Arbeitswoche bis zur Frist
      // Zahl mit deutscher Tausendertrennung
      const formatNumber = v => Number(v).toLocaleString('de-AT');
      // Kennzahlen je Team: { team, n (Aufträge), done, teil (in Arbeit), nok (mit Nicht OK) }
      function teamStats() {
        const byTeam = new Map();
        // Fortschritt und Wochenpensum (Frist 31.12.) gelten für die Wartungen
        for (const r of ordersOfKind(allOrders(), 'war')) {
          let stats = byTeam.get(r.team);
          if (!stats) byTeam.set(r.team, (stats = { team: r.team, n: 0, done: 0, teil: 0, nok: 0 }));
          const status = orderStatus(r);
          stats.n++;
          if (status.st === 'done') stats.done++;
          else if (status.st === 'teil') stats.teil++;
          if (status.nx > 0) stats.nok++;
        }
        return [...byTeam.values()];
      }
      // gestapelter Balken: erledigt | in Arbeit | offen (Breite proportional zur Anzahl)
      const stackedBar = (stats, cls) =>
        el(
          'div',
          { class: 'gbar' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
          [
            [stats.done, 'g2'],
            [stats.teil, 'g1'],
            [stats.n - stats.done - stats.teil, 'g0']
          ]
            .filter(([v]) => v > 0)
            .map(([v, c]) => el('span', { class: c, style: 'flex-grow:' + v }))
        );
      // Reihen der Grafik: CSS-Klasse -> Beschriftung
      const STATUS_SERIES = [
        ['g2', 'Erledigt'],
        ['g1', 'In Arbeit'],
        ['g0', 'Offen']
      ];
      // Kennzahl-Kachel (Beschriftung, Wert, Farbmuster, Warnfarbe)
      const kpiTile = (label, value, swatch, warn) =>
        el(
          'div',
          { class: 'kpi' },
          el('div', { class: 'mu' }, swatch && el('i', { class: 'sw ' + swatch }), label),
          el('div', { class: 'kv' + (warn ? ' er' : '') }, (warn ? '✗ ' : '') + formatNumber(value))
        );
      // Karte „Gesamt · alle Teams“: Prozent, Balken, Kennzahlen und nötiges Wochenpensum
      function totalCard(totals, workingDays, deadlineText) {
        const openCount = totals.n - totals.done - totals.teil,
          remaining = totals.n - totals.done,
          perWeek = weeklyQuota(remaining, workingDays);
        return el(
          'div',
          { class: 'card', 'data-k': 'tc' },
          el('b', {}, 'Gesamt · alle Teams'),
          el(
            'div',
            { class: 'ghero' },
            el('span', { class: 'gp' }, percent(totals.done, totals.n) + ' %'),
            el('span', { class: 'mu' }, 'erledigt')
          ),
          stackedBar(totals, 'big'),
          el(
            'div',
            { class: 'gkpi' },
            kpiTile('Aufträge', totals.n),
            kpiTile('Erledigt', totals.done, 'g2'),
            kpiTile('In Arbeit', totals.teil, 'g1'),
            kpiTile('Offen', openCount, 'g0'),
            kpiTile('Nicht OK', totals.nok, null, totals.nok > 0)
          ),
          el(
            'p',
            { class: 'mu' },
            !remaining
              ? '✓ Alle Aufträge erledigt'
              : workingDays
                ? `Bis ${deadlineText} sind noch mindestens ${formatNumber(perWeek)} Prüfungen pro Woche nötig (${workingDays} Arbeitstage).`
                : `Die Frist ${deadlineText} ist vorbei – ${formatNumber(remaining)} Aufträge sind noch nicht erledigt.`
          )
        );
      }
      // Klick auf ein Team -> Übersicht mit Teamfilter
      const openTeamOverview = t => {
        teamFilter = t;
        statusFilter = '';
        reportedFilter = '';
        reportedFrom = '';
        reportedTo = '';
        searchText = '';
        armMarkAll = false;
        dispoTab = 'ue';
        render();
        scrollTo(0, 0);
      };
      /**
       * Karte „Fortschritt je Team“ als Diagramm (ein Balken je Team, Klick öffnet die Aufträge) oder Tabelle
       * (mit Summenzeile). Je Team ein 📣-Knopf für Nachrichten (siehe openSendDialog).
       */
      function teamProgressCard(teamRows, totals, workingDays) {
        const sorted = [...teamRows].sort(
          teamSort === 'p'
            ? (a, b) => a.done / a.n - b.done / b.n || naturalCompare(a.team, b.team)
            : (a, b) => naturalCompare(a.team, b.team)
        );
        const panel = el(
          'div',
          { class: 'card', 'data-k': 'tp' },
          el(
            'div',
            { class: 'ghead' },
            el('b', {}, `Fortschritt je Team (${teamRows.length})`),
            el(
              'div',
              { class: 'chips' },
              [
                [false, 'Diagramm'],
                [true, 'Tabelle']
              ].map(([k, l]) =>
                el(
                  'button',
                  {
                    class: 'chip' + (teamTableView === k ? ' on' : ''),
                    onclick: () => {
                      teamTableView = k;
                      render();
                    }
                  },
                  l
                )
              )
            )
          ),
          el(
            'div',
            { class: 'gsub' },
            el(
              'div',
              { class: 'glg' },
              STATUS_SERIES.map(([k, l]) => el('span', {}, el('i', { class: 'sw ' + k }), l))
            ),
            el(
              'div',
              { class: 'chips' },
              el('span', { class: 'mu' }, 'Sortieren:'),
              [
                ['n', 'Name'],
                ['p', 'Fortschritt']
              ].map(([k, l]) =>
                el(
                  'button',
                  {
                    class: 'chip' + (teamSort === k ? ' on' : ''),
                    onclick: () => {
                      teamSort = k;
                      try {
                        localStorage.setItem('gsort', k);
                      } catch (e) {}
                      render();
                    }
                  },
                  l
                )
              )
            )
          )
        );
        if (teamTableView) {
          const tableRow = (t, name) => {

            return el(
              'tr',
              name ? {} : { onclick: () => openTeamOverview(t.team) },
              el('td', {}, name || t.team),
              ...[t.n, t.done, t.teil, op].map(v => el('td', { class: 'n' }, formatNumber(v))),
              el('td', { class: 'n' + (t.nok ? ' er' : '') }, t.nok ? '✗ ' + formatNumber(t.nok) : '0'),
              el('td', { class: 'n' }, percent(t.done, t.n) + ' %'),
              el(
                'td',
                { class: 'n' },
                t.n > t.done
                  ? workingDays
                    ? '≥ ' + formatNumber(weeklyQuota(t.n - t.done, workingDays))
                    : 'Frist vorbei'
                  : '✓'
              ),
              el(
                'td',
                {},
                name
                  ? ''
                  : [
                      messageButton(t),
                      activeMessage(t.team) &&
                        el('span', { class: 'gms' }, messageStatus(activeMessage(t.team), t.team))
                    ]
              )
            );
          };
          panel.append(
            el(
              'div',
              { class: 'gtw' },
              el(
                'table',
                { class: 'gt' },
                el(
                  'thead',
                  {},
                  el(
                    'tr',
                    {},
                    [
                      'Team',
                      'Aufträge',
                      'Erledigt',
                      'In Arbeit',
                      'Offen',
                      'Nicht OK',
                      'Erledigt %',
                      'Pensum / Woche',
                      'Nachricht'
                    ].map((h, i) => el('th', { class: i && i < 8 ? 'n' : null }, h))
                  )
                ),
                el(
                  'tbody',
                  {},
                  sorted.map(t => tableRow(t))
                ),
                el('tfoot', {}, tableRow(totals, 'Gesamt'))
              )
            )
          );
        } else {
          panel.append(
            el(
              'div',
              { class: 'grows' },
              sorted.map(t => {
                const op = t.n - t.done - t.teil,
                  p = percent(t.done, t.n),
                  pens = t.n > t.done ? weeklyQuota(t.n - t.done, workingDays) : 0;
                const lab =
                  `${t.team}: ${p} % erledigt, ${t.done} von ${t.n}, ${t.teil} in Arbeit, ${op} offen` +
                  (t.nok ? `, ${t.nok} Nicht OK` : '') +
                  (pens ? `, mindestens ${pens} Prüfungen pro Woche nötig` : '') +
                  '. Öffnet die Aufträge des Teams.';
                const am = activeMessage(t.team);
                return el(
                  'div',
                  { class: 'grr' },
                  el(
                    'button',
                    {
                      class: 'grow',
                      'aria-label': lab,
                      onclick: () => openTeamOverview(t.team),
                      onpointermove: e => showTooltip(e, t, p, op, pens),
                      onpointerleave: hideTooltip
                    },
                    el('span', { class: 'gn' }, t.team),
                    stackedBar(t),
                    el(
                      'span',
                      { class: 'gv' },
                      el('b', {}, p + ' %'),
                      el('span', { class: 'mu' }, ` ${formatNumber(t.done)}/${formatNumber(t.n)}`),
                      t.nok > 0 && el('span', { class: 'gnk' }, `✗ ${formatNumber(t.nok)} Nicht OK`),
                      am && el('span', { class: 'gms' }, '📣 ' + messageStatus(am, t.team))
                    )
                  ),
                  messageButton(t)
                );
              })
            )
          );
        }
        panel.append(
          el(
            'p',
            { class: 'mu' },
            'Tippe auf ein Team, um seine Aufträge in der Übersicht zu sehen. Mit 📣 schickst du dem Team eine Nachricht aufs Handy.'
          )
        );
        return panel;
      }
      // ---- Update: neue Version automatisch laden, wenn gerade nichts Ungespeichertes offen ist ----
      /**
       * Vergleicht die Server-Version mit APPVER. Weicht sie ab, wird automatisch neu geladen – aber nur, wenn gerade nichts
       * Ungespeichertes offen ist (Auftrag, laufender Upload, Dialog, eingeloggter Disponent, Eingabefeld);
       * sonst erscheint ein Banner „Jetzt aktualisieren“. Pro Version wird nur einmal automatisch neu geladen.
       */
      function checkAppVersion(version) {
        if (APPVER.startsWith('__') || version === APPVER) return;
        const first = newVersion !== version;
        newVersion = version;
        let tried = '';
        try {
          tried = sessionStorage.getItem('rl') || '';
        } catch (e) {}
        const focused = document.activeElement,
          inUse =
            openOrder ||
            busy ||
            document.querySelector('dialog[open]') ||
            (session.role === 'dispo' && dispoUnlocked) ||
            (focused && /^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName));
        if (tried !== version && !inUse) {
          try {
            sessionStorage.setItem('rl', version);
          } catch (e) {}
          location.reload();
          return;
        }
        // sonst beim nächsten Abgleich erneut versuchen
        if (first) render();
      }
      // „Jetzt aktualisieren“
      const reloadApp = () => {
        try {
          sessionStorage.setItem('rl', newVersion);
        } catch (e) {}
        location.reload();
      };
      // ---- Nachrichten an Teams ----
      // Disponent: Nachrichten gehen aufs Handy der Monteure (Push) und erscheinen dort als Fenster, das nur mit „Bestätigen“
      // zugeht; der Server erinnert wiederholt, bis alle Geräte des Teams bestätigt haben.
      // aktuelle (nicht beendete, nicht abgelaufene) Nachricht eines Teams
      const activeMessage = team =>
        messages.find(m => m.team === team && !m.closed && Date.now() - m.at < pushConfig.hours * 3600e3);
      // „1 Gerät“ / „n Geräte“
      const deviceCount = n => (n === 1 ? '1 Gerät' : formatNumber(n) + ' Geräte');
      // Bestätigungsstand einer Nachricht für die Dispo-Anzeige („3 von 5 Geräten bestätigt“, „✓ alle bestätigt“)
      function messageStatus(message, team) {
        const counts = devices[team] || [0, 0],
          acked = Math.min(message.acks | 0, counts[0]);
        return !counts[0]
          ? 'gesendet ' + formatDateTime(message.at)
          : acked >= counts[0]
            ? '✓ alle bestätigt'
            : `${acked} von ${formatNumber(counts[0])} ${counts[0] === 1 ? 'Gerät' : 'Geräten'} bestätigt`;
      }
      // 📣-Knopf: öffnet den Dialog zum Senden einer Nachricht an ein Team
      const messageButton = stats => {
        const active = activeMessage(stats.team);
        return el(
          'button',
          {
            class: 'gmsg' + (active ? ' on' : ''),
            title: 'Nachricht an ' + stats.team,
            'aria-label':
              `Nachricht an Team ${stats.team} senden` + (active ? ' (offene Nachricht vorhanden)' : ''),
            onclick: e => {
              e.stopPropagation();
              openSendDialog(stats);
            }
          },
          '📣'
        );
      };
      /**
       * Rückmeldung nach dem Senden (Antwort von POST /api/msg: pushed = Geräte, bei denen der Push-Dienst die Nachricht angenommen hat, of = Geräte des
       * Teams mit Push-Abo, known = alle Geräte des Teams): der Disponent sieht sofort, ob und bei wie vielen Monteuren sie als Benachrichtigung ankommt.
       * Ohne „…“: ein Hinweis mit „…“ gilt als Fortschrittsmeldung und bliebe stehen.
       */
      function messageFeedback(sent) {
        if (!sent || typeof sent.pushed !== 'number') return '';
        const devices = n => `${n} ${n === 1 ? 'Gerät' : 'Geräten'}`;
        if (!sent.known) return 'Nachricht gesendet – im Team ist noch kein Gerät angemeldet.';
        if (!sent.of)
          return 'Nachricht gesendet – kein Gerät dieses Teams hat Benachrichtigungen aktiviert, sie erscheint erst beim Öffnen der App.';
        const without = sent.known - sent.of;
        return (
          `Nachricht gesendet – per Push angenommen bei ${sent.pushed} von ${devices(sent.of)}` +
          (sent.pushed < sent.of ? ' (der Grund steht im Protokoll des Servers)' : '') +
          (without > 0 ? `; ${without === 1 ? '1 weiteres Gerät hat' : without + ' weitere Geräte haben'} keine Benachrichtigungen` : '') +
          '.'
        );
      }
      // Dialog des Disponenten: Nachricht senden / Erinnerung beenden
      const sendDialog = el('dialog', { class: 'dlg' });
      document.body.append(sendDialog);
      /**
       * Dialog „Nachricht an <Team>“: zeigt angemeldete Geräte / solche mit Benachrichtigungen, die offene Nachricht
       * (mit Bestätigungsstand) und ein Textfeld mit Vorschlag. Senden: POST /api/msg; „Erinnerung beenden“: POST /api/msg/close.
       */
      function openSendDialog(stats) {
        hideTooltip();
        const counts = devices[stats.team] || [0, 0],
          active = activeMessage(stats.team),
          errorLine = el('p', { class: 'mu er' });
        const textarea = el('textarea', { rows: '4', maxlength: '300', 'aria-label': 'Nachricht' });
        textarea.value = `Bitte mit den Prüfberichten schneller weitermachen! Aktueller Stand: ${percent(stats.done, stats.n)} % erledigt (${formatNumber(stats.done)} von ${formatNumber(stats.n)}).`;
        const sendButton = el('button', { class: 'sv' }, active ? 'Neu senden' : 'Senden');
        sendButton.onclick = async () => {
          const text = textarea.value.trim();
          if (!text || sendButton.disabled) return;
          sendButton.disabled = true;
          sendButton.textContent = 'Sende …';
          errorLine.textContent = '';
          try {
            const sent = await api('POST', '/api/msg', { team: stats.team, text }, 30000);
            sendDialog.close();
            errorMsg = '';
            infoMsg = messageFeedback(sent);
            poll();
            render();
          } catch (e) {
            errorLine.textContent = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
            sendButton.disabled = false;
            sendButton.textContent = active ? 'Neu senden' : 'Senden';
          }
        };
        sendDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b' },
            el('div', { class: 'dlg-t' }, '📣 Nachricht an ' + stats.team),
            el(
              'p',
              { class: 'mu' },
              counts[0]
                ? `${deviceCount(counts[0])} angemeldet, davon ${formatNumber(counts[1])} mit Benachrichtigungen.`
                : 'Noch kein Gerät dieses Teams angemeldet.'
            ),
            counts[0] > counts[1] &&
              el(
                'p',
                { class: 'mu er' },
                counts[1]
                  ? `${deviceCount(counts[0] - counts[1])} ohne Benachrichtigungen – dort erscheint die Nachricht erst beim Öffnen der App.`
                  : 'Kein Gerät hat Benachrichtigungen aktiviert – die Nachricht erscheint erst beim Öffnen der App.'
              ),
            active &&
              el(
                'div',
                { class: 'amsg' },
                el('b', {}, 'Offene Nachricht von ' + formatDateTime(active.at)),
                el('div', {}, active.text),
                el('div', { class: 'mu' }, messageStatus(active, stats.team)),
                el(
                  'button',
                  {
                    class: 'er',
                    onclick: async () => {
                      try {
                        await api('POST', '/api/msg/close', { id: active.id });
                        sendDialog.close();
                        infoMsg = '';
                        poll();
                        render();
                      } catch (e) {
                        errorLine.textContent = errorMessageOf(e);
                      }
                    }
                  },
                  'Erinnerung beenden'
                )
              ),
            textarea,
            el(
              'p',
              { class: 'mu' },
              `Die Monteure bekommen eine Benachrichtigung, die ${pushConfig.nag === 1 ? 'jede Minute' : 'alle ' + pushConfig.nag + ' Minuten'} wiederkommt, bis sie auf „Bestätigen“ tippen (längstens ${pushConfig.hours} Stunden).` +
                (active ? ' Eine neue Nachricht ersetzt die offene.' : '')
            ),
            errorLine,
            el(
              'div',
              { class: 'ob' },
              sendButton,
              el('button', { onclick: () => sendDialog.close() }, 'Abbrechen')
            )
          )
        );
        sendDialog.showModal();
        textarea.focus();
      }
      // Monteur: offene Nachricht als Fenster, das nur mit „Bestätigen“ zugeht (Esc/Abbrechen sind gesperrt)
      const readDialog = el('dialog', { class: 'dlg mdlg' });
      document.body.append(readDialog);
      let shownMessage = null;
      readDialog.addEventListener('cancel', e => e.preventDefault());
      // schließt der Browser das Fenster trotzdem, wird es wieder geöffnet
      readDialog.addEventListener('close', () => {
        if (shownMessage) {
          shownMessage = null;
          setTimeout(showUnreadMessage, 400);
        }
      });
      // offene (nicht bestätigte, nicht beendete, nicht abgelaufene) Nachrichten für das Team des Monteurs
      const unreadMessages = () =>
        session.role === 'monteur' && session.team
          ? messages.filter(
              m =>
                m.team === session.team &&
                !m.ack &&
                !m.closed &&
                Date.now() - m.at < pushConfig.hours * 3600e3
            )
          : [];
      // schließt bereits angezeigte System-Benachrichtigungen (Push) dieser App
      const closeNotifications = () => {
        if ('serviceWorker' in navigator)
          navigator.serviceWorker
            .getRegistration()
            .then(r => (r && r.getNotifications ? r.getNotifications({ tag: 'nachricht' }) : []))
            .then(ns => ns.forEach(n => n.close()))
            .catch(() => {});
      };
      // Zeigt die erste offene Nachricht im Fenster (nach jedem Abgleich aufgerufen); ohne offene Nachricht Fenster schließen
      function showUnreadMessage() {
        if (gasDialog.open) return; // erst das Gaswarngerät bestätigen, danach kommen die Nachrichten
        const message = unreadMessages()[0];
        if (!message) {
          if (readDialog.open) {
            shownMessage = null;
            readDialog.close();
          }
          if (session.role === 'monteur') closeNotifications();
          return;
        }
        if (readDialog.open && shownMessage && shownMessage.id === message.id) return;
        shownMessage = message;
        readDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'mdt' },
            el('div', { class: 'dlg-t', id: 'mdt' }, '📣 Nachricht vom Disponenten'),
            el('p', { class: 'mtx' }, message.text),
            el(
              'p',
              { class: 'mu' },
              'Gesendet ' +
                formatDateTime(message.at) +
                '. Bitte bestätige, dass du die Nachricht gelesen hast.'
            ),
            el(
              'div',
              { class: 'ob' },
              el(
                'button',
                { class: 'sv', onclick: () => acknowledgeMessage(message) },
                '✓ Gelesen – bestätigen'
              )
            )
          )
        );
        if (!readDialog.open && typeof readDialog.showModal === 'function') {
          try {
            readDialog.showModal();
            readDialog.querySelector('.sv').focus();
          } catch (e) {}
        }
      }
      // „Gelesen – bestätigen“: merkt die Bestätigung, schließt das Fenster und meldet sie dem Server
      function acknowledgeMessage(message) {
        message.ack = true;
        if (!ackQueue.includes(message.id)) ackQueue.push(message.id);
        try {
          localStorage.setItem('ackq', JSON.stringify(ackQueue));
        } catch (e) {}
        shownMessage = null;
        readDialog.close();
        closeNotifications();
        sendAcks();
        showUnreadMessage();
      }
      async function sendAcks() {
        // Bestätigungen senden (ohne Netz gemerkt, später automatisch)
        for (const id of [...ackQueue]) {
          try {
            await api('POST', '/api/msg/ack', { id, did: deviceId });
          } catch (e) {
            if (e.net) break;
          }
          ackQueue = ackQueue.filter(x => x !== id);
          try {
            localStorage.setItem('ackq', JSON.stringify(ackQueue));
          } catch (e) {}
        }
      }
      // ---- Gaswarngerät: tägliche Bestätigung je Team ----
      /**
       * Bevor ein Team arbeitet, muss es jeden Tag bestätigen, dass das Gaswarngerät ordnungsgemäß funktioniert. Solange das
       * Team heute nicht bestätigt hat, liegt ein Fenster über der App (nur „Bestätigen“ schließt es). Der Server hält
       * Tag, Team, Uhrzeit und Gerät fest (Tabelle gas); je Tag und Team zählt die erste Bestätigung, die anderen Geräte
       * des Teams sehen sie beim Abgleich. Ohne Netz wird sofort bestätigt und später gesendet (gasQueue, mit der echten Uhrzeit).
       * Der Disponent sieht im Tab „Fortschritt“ je Team die Uhrzeit oder „nicht bestätigt“ und kann das Protokoll als CSV laden.
       */
      // heutiger Tag (JJJJ-MM-TT): laut Server, solange er erreichbar ist, sonst nach der Geräteuhr
      const gasToday = () => (serverReachable && gasDay) || today();
      // Bestätigung des Servers für Team und Tag (heute, wenn kein Tag angegeben) oder null
      const gasRecord = (team, day = gasToday()) => gasRows.get(day + '|' + team) || null;
      // Bestätigung vom Server übernehmen (ältere Stände nie über neuere schreiben)
      function mergeGas(g) {
        const key = g.d + '|' + g.t,
          old = gasRows.get(key);
        if (!old || g.sq >= old.sq) gasRows.set(key, g);
      }
      // Zeitpunkt der Bestätigung des Teams heute (Server oder noch ungesendet im Gerät) oder 0
      function gasConfirmedAt(team) {
        const record = gasRecord(team);
        if (record) return record.at;
        const queued = gasQueue.find(
          x => x.team === team && new Date(x.at).toLocaleDateString('sv-SE') === today()
        );
        return queued ? queued.at : 0;
      }
      const saveGasQueue = () => {
        try {
          localStorage.setItem('gasq', JSON.stringify(gasQueue));
        } catch (e) {}
      };
      const timeText = t => new Date(t).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
      // Muss dieses Gerät jetzt die Bestätigung abfragen? (Monteur mit Team, erster Abgleich durch, heute noch nicht bestätigt)
      const gasNeeded = () =>
        session.role === 'monteur' && !!session.team && gasReady && !gasConfirmedAt(session.team);
      const gasDialog = el('dialog', { class: 'dlg mdlg' });
      document.body.append(gasDialog);
      gasDialog.addEventListener('cancel', e => e.preventDefault());
      // schließt der Browser das Fenster trotzdem, wird es wieder geöffnet
      gasDialog.addEventListener('close', () => {
        if (gasNeeded()) setTimeout(showGasCheck, 400);
      });
      // Zeigt das Fenster, solange das Team heute nicht bestätigt hat (nach jedem Abgleich aufgerufen); sonst schließt es
      function showGasCheck() {
        if (!gasNeeded()) {
          if (gasDialog.open) gasDialog.close();
          return;
        }
        if (gasDialog.open) return;
        gasDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'gdt' },
            el('div', { class: 'dlg-t', id: 'gdt' }, '⚠ Gaswarngerät prüfen'),
            el('p', { class: 'mtx' }, 'Funktioniert das Gaswarngerät ordnungsgemäß?'),
            el(
              'p',
              { class: 'mu' },
              `Bitte vor Arbeitsbeginn prüfen und für das Team „${session.team}“ bestätigen. Die Bestätigung wird mit Datum und Uhrzeit festgehalten. Funktioniert das Gerät nicht: nicht arbeiten und den Disponenten informieren.`
            ),
            el(
              'div',
              { class: 'ob' },
              el('button', { class: 'sv', onclick: confirmGas }, '✓ Funktioniert ordnungsgemäß'),
              !(userInfo && userInfo.lock) &&
                el(
                  'button',
                  {
                    onclick: () => {
                      gasDialog.close();
                      switchRole('monteur');
                    }
                  },
                  'Team wechseln'
                )
            )
          )
        );
        try {
          gasDialog.showModal();
          gasDialog.querySelector('.sv').focus();
        } catch (e) {}
      }
      // „Funktioniert ordnungsgemäß“: hält Team und Uhrzeit im Gerät fest (gilt sofort), meldet sie dem Server
      function confirmGas() {
        if (!session.team || gasConfirmedAt(session.team)) return;
        gasQueue.push({ team: session.team, at: Date.now() });
        saveGasQueue();
        gasDialog.close();
        sendGas();
        render();
        showUnreadMessage();
      }
      // Sendet gemerkte Bestätigungen (ohne Netz bleiben sie liegen und gehen später automatisch raus)
      async function sendGas() {
        if (gasSending) return;
        gasSending = true;
        try {
          for (const item of [...gasQueue]) {
            try {
              mergeGas((await api('POST', '/api/gas', { did: deviceId, team: item.team, at: item.at })).row);
            } catch (e) {
              if (e.status !== 400) break; // kein Netz oder Serverfehler: später erneut (400 = ungültig, verwerfen)
            }
            gasQueue = gasQueue.filter(x => x !== item);
            saveGasQueue();
          }
        } finally {
          gasSending = false;
        }
        clearTimeout(cacheSaveTimer);
        cacheSaveTimer = setTimeout(saveCache, 1500);
        render();
      }
      // Disponent: Karte „Gaswarngerät“ im Tab „Fortschritt“ – je Team die Uhrzeit der Bestätigung für den gewählten Tag
      function gasCard() {
        const todayDay = gasToday(),
          day = gasViewDay || todayDay,
          teams = new Set(teamCounts().map(([t]) => t));
        for (const g of gasRows.values()) if (g.d === day) teams.add(g.t); // auch Teams, die inzwischen keine Aufträge mehr haben
        const rows = [...teams]
            .map(t => [t, gasRecord(t, day)])
            .sort((a, b) => !b[1] - !a[1] || naturalCompare(a[0], b[0])),
          confirmed = rows.filter(r => r[1]).length;
        const shiftDay = n => {
          const d = new Date(day + 'T12:00:00');
          d.setDate(d.getDate() + n);
          gasViewDay = d.toLocaleDateString('sv-SE');
          if (gasViewDay >= todayDay) gasViewDay = '';
          render();
        };
        return el(
          'div',
          { class: 'card', 'data-k': 'gc' },
          el('b', {}, 'Gaswarngerät – Bestätigung je Team'),
          el(
            'div',
            { class: 'gasnav' },
            el('button', { 'aria-label': 'Vorheriger Tag', onclick: () => shiftDay(-1) }, '‹'),
            el('input', {
              type: 'date',
              value: day,
              max: todayDay,
              'aria-label': 'Tag',
              onchange: e => {
                gasViewDay = !e.target.value || e.target.value >= todayDay ? '' : e.target.value;
                render();
              }
            }),
            el(
              'button',
              {
                'aria-label': 'Nächster Tag',
                disabled: day >= todayDay ? 'disabled' : null,
                onclick: () => shiftDay(1)
              },
              '›'
            ),
            el('span', { class: 'mu' }, `${confirmed} von ${rows.length} Teams bestätigt`)
          ),
          rows.length
            ? el(
                'div',
                { class: 'gasg' },
                rows.map(([team, record]) =>
                  el(
                    'div',
                    { class: 'gast' + (record ? ' ok' : ' no') },
                    el('b', {}, team),
                    record
                      ? el(
                          'span',
                          {},
                          '✓ ' + timeText(record.at) + ' Uhr',
                          (record.un || record.u || record.n) &&
                            el('span', { class: 'mu' }, ' · ' + (record.un ? `${record.un} (${record.u})` : record.u || record.n))
                        )
                      : el('span', {}, '⚠ nicht bestätigt')
                  )
                )
              )
            : el('p', { class: 'mu' }, 'Noch keine Teams.'),
          el(
            'p',
            { class: 'mu' },
            'Jedes Team bestätigt vor der Arbeit einmal pro Tag, dass das Gaswarngerät ordnungsgemäß funktioniert. Angezeigt wird die erste Bestätigung des Tages.'
          ),
          el('button', { onclick: exportGasLog }, '⬇ Gesamtes Protokoll (CSV)')
        );
      }
      // Lädt das ganze Protokoll vom Server und speichert es als CSV (Semikolon, mit BOM: öffnet sich in Excel richtig)
      async function exportGasLog() {
        errorMsg = '';
        try {
          const rows = (await api('GET', '/api/gas')).rows;
          // Zellen, die mit = + - @ beginnen, würde Excel als Formel lesen
          const cell = v => '"' + String(v ?? '').replace(/^([=+\-@])/, "'$1").replace(/"/g, '""') + '"';
          const lines = [['Datum', 'Team', 'Bestätigt um', 'Benutzer', 'SAP-User', 'Gerät', 'Beim Server eingegangen um']].concat(
            rows.map(r => [
              r.day.split('-').reverse().join('.'),
              r.team,
              new Date(r.at).toLocaleTimeString('de-AT'),
              r.uname || '',
              r.usr || '',
              (r.name ? r.name + ' ' : '') + '(…' + (r.did || '') + ')',
              Math.abs(r.rec - r.at) > 120e3 ? new Date(r.rec).toLocaleString('de-AT') : ''
            ])
          );
          const url = URL.createObjectURL(
            new Blob(['﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n')], {
              type: 'text/csv;charset=utf-8'
            })
          );
          const link = document.createElement('a');
          link.href = url;
          link.download = 'Gaswarngeraet_Protokoll_' + today() + '.csv';
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          infoMsg = `Protokoll exportiert: ${rows.length} Bestätigungen`;
        } catch (e) {
          infoMsg = '';
          errorMsg = e.net ? 'Keine Verbindung – Protokoll konnte nicht geladen werden' : errorMessageOf(e);
        }
        render();
      }
      // ---- Push-Benachrichtigungen (Monteur) ----
      // Push-Abo: Gerät + Team beim Server melden; ask=true nur nach Tipp auf „Aktivieren“ (der Browser verlangt das)
      // Browser kann Push (Service Worker + Push + Notifications)?
      const pushSupported = () =>
        'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      // Base64URL-Schlüssel des Servers -> Bytes (für pushManager.subscribe)
      const base64UrlToBytes = s => {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        return Uint8Array.from(atob(s + '='.repeat((4 - (s.length % 4)) % 4)), c => c.charCodeAt(0));
      };
      // wartet höchstens ms auf ein Versprechen, danach Fehler mit dieser Meldung (das Versprechen läuft im Browser weiter)
      const withTimeout = (promise, ms, message) =>
        Promise.race([promise, new Promise((_, no) => setTimeout(() => no(new Error(message)), ms))]);
      /**
       * Meldet Gerät, Rolle (Monteur/Disponent/abgemeldet), Team und (wenn erlaubt) das Push-Abo beim Server
       * (POST /api/push/sub) – so merkt sich der Server, welches Gerät wo angemeldet ist (Geräteübersicht). Mit
       * ask = true wird die Berechtigung abgefragt. Gibt es neue Server-Schlüssel, wird neu abonniert. Fehler landen in pushError (Banner).
       * Es läuft immer nur EINE Anmeldung zugleich (das erste Abonnieren dauert bis zu einer halben Minute; zwei gleichzeitige würden einander
       * die Antwort „kein Abo“ unterschieben): kommt währenddessen ein weiterer Aufruf, wird danach genau eine weitere Runde nachgeholt.
       * Außerdem ruft die App sie von selbst auf, wenn der Server das Gerät oder sein Abo nicht (mehr) kennt (onDeviceState).
       */
      async function pushSync(ask) {
        // Die Berechtigung wird als Allererstes abgefragt, solange der Tipp noch gilt (der Browser verlangt das) – und vor der Sperre unten,
        // denn die Antwort des Nutzers kann dauern und soll die übrigen Anmeldungen nicht aufhalten
        if (ask && pushSupported()) {
          pushError = '';
          try {
            if (Notification.permission === 'default') await Notification.requestPermission();
          } catch (e) {
            pushError = errorMessageOf(e) || 'unbekannter Fehler';
          }
        }
        if (pushRunning) {
          pushAgain = true;
          return;
        }
        pushRunning = true;
        try {
          do {
            pushAgain = false;
            await pushSyncOnce();
          } while (pushAgain);
        } finally {
          pushRunning = false;
        }
      }
      async function pushSyncOnce() {
        const team = session.role === 'monteur' && session.team ? session.team : null,
          // Der Disponent zählt erst als angemeldet, wenn die PIN eingegeben wurde (nach dem Neuladen also wieder abgemeldet)
          role =
            session.role === 'monteur'
              ? 'monteur'
              : session.role === 'dispo' && dispoUnlocked
                ? 'dispo'
                : null;
        if (!team && !role && !registeredTeam && !registeredRole) return;
        let sub = null,
          // Das Abo ließ sich gerade nicht prüfen (Fehler, Netz weg, Server startet neu): dem Server NICHT „kein Abo“ melden – er würde ein
          // funktionierendes Abo löschen, und das Gerät bekäme bis zum nächsten erfolgreichen Start keine Benachrichtigung mehr
          keepSub = false,
          // das alte Abo ist ungültig (neue Server-Schlüssel) und wurde bereits abgemeldet
          oldDropped = false,
          // Fehler dieser Runde; ersetzt erst am Ende pushError (ein Hinweis, der schon steht, verschwindet nicht für die Dauer des nächsten Versuchs)
          error = '';
        if (team && pushSupported()) {
          try {
            if (Notification.permission === 'granted') {
              const reg = await withTimeout(navigator.serviceWorker.ready, 10000, 'Service Worker nicht bereit');
              const key = (await api('GET', '/api/push/key')).key;
              let pk = '';
              try {
                pk = localStorage.getItem('pk') || '';
              } catch (e) {}
              sub = await reg.pushManager.getSubscription();
              // Server hat neue Schlüssel -> neu abonnieren
              if (sub && pk !== key) {
                await sub.unsubscribe();
                sub = null;
                oldDropped = true;
              }
              if (!sub)
                sub = await withTimeout(
                  reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: base64UrlToBytes(key) }),
                  60000,
                  'Zeitüberschreitung: Der Push-Dienst des Browsers hat nicht geantwortet'
                );
              try {
                localStorage.setItem('pk', key);
              } catch (e) {}
            }
          } catch (e) {
            if (!e.net) error = errorMessageOf(e) || 'unbekannter Fehler';
            keepSub = !oldDropped;
          }
        }
        // Push-Status für den Disponenten (Geräteübersicht): „Berechtigung|Detail“ – Detail = Fehlertext bzw. warum der Browser keinen Push kann
        const supported = pushSupported(),
          detail = supported
            ? error
            : window.isSecureContext === false
              ? 'insecure'
              : /iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone
                ? 'ios-home'
                : '';
        try {
          await api('POST', '/api/push/sub', {
            did: deviceId,
            role,
            team,
            sub: sub ? sub.toJSON() : null,
            keep: keepSub && !sub,
            ...(team ? { pstat: (supported ? Notification.permission : 'unsupported') + (detail ? '|' + detail : '') } : {})
          });

          registeredRole = role;
          // jetzt weiß das Gerät selbst, wie der Server es kennt (die nächste Abgleich-Antwort bestätigt es)
          serverDevState = role === 'monteur' && team ? (sub ? 2 : 1) : null;
          pushRegAt = Date.now();
          try {
            team ? localStorage.setItem('regteam', team) : localStorage.removeItem('regteam');
            role ? localStorage.setItem('regrole', role) : localStorage.removeItem('regrole');
          } catch (e) {}
        } catch (e) {
          // das Abo selbst wurde abgelehnt (z. B. Push-Dienst nicht erlaubt): das gehört in den Hinweis, sonst bliebe es für immer unsichtbar
          if (!e.net && sub && e.status !== 401) error = errorMessageOf(e) || 'unbekannter Fehler';
        }
        pushError = error;
        render();
      }
      /**
       * Der Server sagt bei jedem Abgleich, wie er dieses Gerät kennt (Antwort `dev`, siehe deviceState in server.js): 0 gar nicht (oder mit anderem
       * Team), 1 ohne Push-Abo, 2 mit Push-Abo. Fehlt ihm das Gerät – oder bei erlaubten Benachrichtigungen das Abo (andere Datenbank, Abo abgelaufen
       * und gelöscht, zwischendurch abgemeldet) –, meldet sich das Gerät von selbst neu an: der erste Versuch gleich, weitere höchstens alle 2 Minuten.
       * Ohne das bliebe ein solches Gerät bis zum nächsten App-Start stumm, und die App hielte sich dabei auch noch für „erreichbar“ (pushWorks).
       */
      function onDeviceState(state) {

        if (state === 2 || session.role !== 'monteur' || !session.team || pushRunning) return;

      let bannerHiddenUpTo = -1;

      const latestTeamMessageId = () =>
        messages.reduce((a, m) => (m.team === session.team ? Math.max(a, m.id | 0) : a), 0);
      // Banner zu Benachrichtigungen (mit „✕“ zum Ausblenden) oder null. Einmal weggeklickt, bleibt er weg: dann gibt es nur die kleine

      function pushBanner() {

      // kleine Schaltfläche statt des weggeklickten Banners (⚠ bei einem Problem, sonst 🔔), null wenn es nichts zu melden gibt
      function pushBell() {

          'button',
          {
            class: 'lk',

      // Einrichtung fehlgeschlagen (mit Tipps je Browser) oder noch nicht aktiviert („Aktivieren“)
      function pushStatusBanner() {
        if (!pushSupported()) {
          if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone)
            return el(
              'div',
              { class: 'msg' },
              '🔔 Damit dich Nachrichten vom Disponenten erreichen: App über „Teilen → Zum Home-Bildschirm“ hinzufügen, von dort öffnen und Benachrichtigungen aktivieren.'

        }

          if (!pushError) return null;

            userAgent = navigator.userAgent;

            hints.push(
              'Brave: Einstellungen → Datenschutz und Sicherheit → „Google-Dienste für Push-Messaging verwenden“ einschalten und Brave neu starten.'
            );
