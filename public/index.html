      // sieht sie kein Monteur. Zustand des Gantt-Diagramms (Beschreibung: Abschnitt „Disposition“ weiter unten)
      // gPxh: Zoom des Diagramms stufenlos in Pixel je Stunde (Zoom-Balken über dem Diagramm; die Knöpfe Tag/Woche/Monat setzen 48 / 14 / 1,5) ·
      // gZoom: daraus abgeleitet die Ansicht – 'tag' (3 Tage, Stunden) | 'woche' (7 Tage) | 'monat' (ein Kalendermonat; Standard: ein Tag = 36 px) –
      // sie bestimmt Zeitachse, Kopfzeile und Raster beim Ziehen (zoomMode) · gFrom: erster angezeigter Tag
      // (JJJJ-MM-TT, '' = heute; bei 'monat' zählt der Monat dieses Tages) · gKind: '' beide | 'rep' | 'ent' ·
      // gSearch: Suche in der Offen-Liste · gPoolMax: so viele Karten zeigt die Offen-Liste (wächst beim Scrollen von selbst, siehe
      // poolLoadMore) · gTeam: Team-Filter der Offen-Liste ('' = alle, Team laut SAP) · gSort: 'auf' älteste Termine zuerst | 'ab' neueste
      // zuerst · gPoolFrom / gPoolTo: Zeitraum der Offen-Liste (JJJJ-MM-TT, '' = offen; es zählt der SAP-Beginn) · gPoolTop: die Liste
      // beginnt nach dem nächsten Neuzeichnen wieder oben (Filter oder Sortierung wurden geändert) ·
      // gSel / gDraft: gewählter Auftrag und sein Entwurf { a, team, von, bis } im Bearbeiten-Fenster · gArmAll: „Alle Vorschläge übernehmen“
      // wurde einmal angetippt · gScrollX: Wisch-Stand der Zeitachse · gDrag: laufendes Ziehen · gDragEnd: Zeitpunkt des letzten Ziehens (das
      // folgende click-Ereignis zählt nicht) · gUndo: letzte Disposition für „Rückgängig“ · gSheetStart: Start der Einblendung des
      // Bearbeiten-Fensters · gFresh: Auftrag -> Startzeit, wenn sein Balken neu ist oder verschoben wurde · gGeo: Maße des gezeichneten
      // Diagramms (für das Ziehen) · dispoTeamNames: Teams, auf die disponiert werden kann (vom Server)
      // gFull: das Diagramm ist am Fenster fixiert (Vollbild, siehe gtFull) · gFullH: Höhe des Rasters davor (die Seite dahinter behält sie,
      // sonst verlöre sie ihre Scroll-Stelle) · gWrapY: senkrechter Wisch-Stand der Teamzeilen im Vollbild · gZoomRaf / gZoomPending: ein
      // Zoom wartet auf das nächste Neuzeichnen (mehrere Schritte in einem Bild werden zu einem)
      let gZoom = 'tag',
        gPxh = 48,
        gFull = false,
        gFullH = 0,
        gWrapY = 0,
        gZoomRaf = 0,
        gZoomPending = false,
        gNoAnchor = false,
        gFrom = '',
        gKind = '',
        gSearch = '',
        gPoolMax = 30,
        gTeam = '',
        gSort = 'auf',
        gPoolFrom = '',
        gPoolTo = '',
        gPoolTop = false,
        gSel = '',
        gDraft = null,
        gArmAll = false,
        gScrollX = null,
        gDrag = null,
        gDragEnd = 0,
        gUndo = null,
        gUndoTimer = null,
        gSheetStart = 0,
        gFresh = new Map(),
        gGeo = null,
        // gPoolWin: Extra-Fenster mit der Offen-Liste (siehe openPoolWin), null = Liste steht in der Seite · gPoolUi: dessen Bausteine ·
        // gPoolTimer: prüft, ob das Fenster noch offen ist · gPoolDirty: das Fenster wartet auf ein Neuzeichnen (während es einen Auftrag
        // zieht, bleibt seine Liste stehen)
        gPoolWin = null,
        gPoolUi = null,
        gPoolTimer = 0,
        gPoolDirty = false,
        // gInfoWin: Details-Fenster zu einem Auftrag (Doppelklick, siehe openInfoWin) · gInfoUi: dessen Bausteine · gInfoA: dessen Auftrag
        gInfoWin = null,
        gInfoUi = null,
        gInfoA = '',
        dispoTeamNames = [];
      try {
        // gz: zuletzt gewählte Ansicht (Knöpfe Tag/Woche/Monat) · gzp: Zoom in Pixel je Stunde (Zoom-Balken)
        const saved = localStorage.getItem('gz'),
          px = parseFloat(localStorage.getItem('gzp'));
        if (px >= 1 && px <= 150) gPxh = px;
        else if (saved === 'woche') gPxh = 14;
        else if (saved === 'monat') gPxh = 1.5;
        gZoom = gPxh >= 16 ? 'tag' : gPxh >= 4 ? 'woche' : 'monat'; // (wie zoomMode, das weiter unten steht)
      } catch (e) {}
      // ---- Geräteübersicht (Disponent) ----
      // deviceList: Geräte vom Server (null = noch nicht geladen) · deviceListOffset: Serveruhr minus Geräteuhr (für „vor … Min“) ·
      // deviceListError: Ladefehler · deviceRenameId / deviceRenameText: Gerät, dessen Spitzname gerade bearbeitet wird ·
      // deviceLogoutArmed: Gerät, bei dem „Ausloggen“ einmal angetippt wurde (zweiter Tipp bestätigt) ·
      // deviceTeamFilter: Team-Filter der Geräteliste ('' = alle | '\u0000d' = Disponenten | '\u0000n' = ohne Team) ·
      // deviceTestBusy: Gerät, an das gerade eine Test-Benachrichtigung geht (Knopf gesperrt, Größe bleibt)
      let deviceTestBusy = null,
        deviceTeamFilter = '',
        deviceList = null,
        deviceListOffset = 0,
        deviceListError = '',
        deviceRenameId = null,
        deviceRenameText = '',
        deviceLogoutArmed = null;
      // Nachrichten/Push – messages: Monteur: offene Nachrichten seines Teams; Disponent: die der letzten 24 h; devices: Team -> [Geräte gesamt, davon mit Push]
      let messages = [],
        devices = {},
        // pushConfig: { nag, hours } vom Server (Erinnerungsabstand in Minuten, Gültigkeit in Stunden)
        pushConfig = { nag: 5, hours: 12 },
        pushError = '',
        // Push-Anmeldung dieses Geräts (siehe pushSync): serverDevState = wie der Server das Gerät kennt (Antwort des Abgleichs, `dev`): 0 gar nicht bzw. mit
        // anderem Team, 1 ohne Push-Abo, 2 mit Push-Abo, null = noch nicht bekannt · pushRunning / pushAgain = eine Anmeldung läuft (das erste Abonnieren
        // dauert bis zu einer halben Minute), danach genau eine weitere · pushRepairAt = letzter Versuch, ein fehlendes Abo auf Wunsch des Servers nachzuholen
        serverDevState = null,
        pushRunning = false,
        pushAgain = false,
        pushRepairAt = 0,
        // Zeitpunkt der letzten erfolgreichen Anmeldung beim Server: eine Abgleich-Antwort, die VOR ihr abgeschickt wurde, kennt das Gerät noch nicht und sagt nichts
        pushRegAt = 0,
        // deviceId: zufällige Geräte-ID (im Gerät gespeichert; der Server kennt das Gerät darüber), ackQueue: noch nicht gemeldete Bestätigungen
        deviceId = '',
        ackQueue = [],
        // registeredTeam / registeredRole: Team und Rolle ('monteur' | 'dispo'), die der Server von diesem Gerät kennt
        registeredTeam = null,
        registeredRole = null;
      try {
        deviceId = localStorage.getItem('did') || '';
        ackQueue = JSON.parse(localStorage.getItem('ackq') || '[]');
        registeredTeam = localStorage.getItem('regteam');
        registeredRole = localStorage.getItem('regrole');
      } catch (e) {}
      // ---- Gaswarngerät (tägliche Bestätigung je Team) ----
      // gasRows: „Tag|Team“ -> { d, t, at, rec, n, sq } (Bestätigungen vom Server, Monteur: nur eigenes Team) ·
      // gasDay: heutiger Tag laut Server · gasReady: der erste Abgleich ist durch (vorher kein Dialog, sonst blitzt er kurz auf) ·
      // gasQueue: [{ team, at }] Bestätigungen, die noch nicht beim Server sind (ohne Netz bestätigt, im Gerät gesichert)
      let gasRows = new Map(),
        gasDay = '',
        gasReady = false,
        gasSending = false,
        gasQueue = [],
        // gasViewDay: Tag, den der Disponent im Protokoll ansieht ('' = heute)
        gasViewDay = '';
      try {
        gasQueue = JSON.parse(localStorage.getItem('gasq') || '[]');
      } catch (e) {}
      if (!/^[a-f0-9]{32}$/.test(deviceId)) {
        deviceId = [...crypto.getRandomValues(new Uint8Array(16))]
          .map(b => b.toString(16).padStart(2, '0'))
          .join('');
        try {
          localStorage.setItem('did', deviceId);
        } catch (e) {}
      }
      try {
        markedFilter = localStorage.getItem('dha') || '';
      } catch (e) {}
      // ---- Benutzer (Monteur-Anmeldung mit SAP-User + Passwort) ----
      // userToken: Anmelde-Token des Servers (Header X-User-Token) · userInfo: { sap, name, team (Team laut Benutzerverwaltung),
      // lock (Team fest zugewiesen: kein Teamwechsel), last (zuletzt gewähltes Team) } · userNames: SAP-User -> Name (Disponent, für „bewertet von“) ·
      // loginUser / loginPass / loginError / loginBusy: Eingaben und Zustand der Anmeldeseite
      let userToken = '',
        userInfo = null,
        userNames = new Map(),
        loginUser = '',
        loginPass = '',
        loginError = '',
        loginBusy = false;
      try {
        userToken = localStorage.getItem('utk') || '';
        userInfo = JSON.parse(localStorage.getItem('usr') || 'null');
      } catch (e) {}
      if (!userInfo || !userInfo.sap) {
        userToken = '';
        userInfo = null;
      }
      const saveUser = () => {
        try {
          userToken ? localStorage.setItem('utk', userToken) : localStorage.removeItem('utk');
          userInfo ? localStorage.setItem('usr', JSON.stringify(userInfo)) : localStorage.removeItem('usr');
        } catch (e) {}
      };
      // Name zu einem SAP-User (Disponent kennt alle Namen, sonst nur der SAP-User selbst)
      const userLabel = sap =>
        !sap ? '' : userNames.get(sap) ? `${userNames.get(sap)} (${sap})` : userInfo && userInfo.sap === sap ? `${userInfo.name} (${sap})` : sap;
      // nur der Name (ohne SAP-User); ohne bekannten Namen der SAP-User
      const userShort = sap => userNames.get(sap) || (userInfo && userInfo.sap === sap ? userInfo.name : sap);
      // „Anna Muster, Max Beispiel“ für eine Liste von SAP-Usern
      const userNamesText = saps => (saps || []).map(userShort).join(', ');
      // session: { role: 'monteur' | 'dispo' | null, team } – wird im Gerät gespeichert
      let session = { role: null, team: null };
      try {
        session = JSON.parse(localStorage.getItem('ses')) || session;
      } catch (e) {}
      // speichert die Rolle/das Team im Gerät (localStorage)
      const saveSession = () => {
        try {
          localStorage.setItem('ses', JSON.stringify(session));
        } catch (e) {}
      };
      // ---- Schriftgröße (nur Monteur) ----
      // Schriftgröße (nur Monteur-Ansicht, je Gerät gespeichert): skaliert alle rem-Schriftgrößen, Abstände bleiben gleich
      const FONT_SCALES = [1, 1.15, 1.3, 1.5];
      let fontScale = 1;
      try {
        fontScale = +localStorage.getItem('fz') || 1;
      } catch (e) {}
      if (!FONT_SCALES.includes(fontScale)) fontScale = 1;
      // setzt die Basisschriftgröße der Seite (16 px × Faktor) – nur in der Monteur-Ansicht
      const applyFontScale = () => {
        document.documentElement.style.fontSize =
          session.role === 'monteur' && fontScale !== 1 ? 16 * fontScale + 'px' : '';
      };
      // eine Stufe größer (+1) oder kleiner (-1), im Gerät gespeichert. Die Seite wird in einem Schritt neu gezeichnet; die
      // Schaltflächen „A−“/„A+“ (data-k="fz") bleiben dabei an derselben Bildschirmstelle – auch ganz oben auf der Seite –,
      // damit man gleich nochmal tippen kann und nichts wegspringt. Wo der Browser es kann (View Transitions), blendet das
      // alte Bild zum neuen über; sonst (und bei „weniger Bewegung“) wechselt die Seite ohne Übergang.
      // (font-size per CSS zu animieren, lässt Texte in jedem Zwischenschritt neu umbrechen: die Seite ruckelt und springt.)
      const changeFontScale = direction => {
        const index = FONT_SCALES.indexOf(fontScale) + direction;
        if (index < 0 || index >= FONT_SCALES.length) return;
        fontScale = FONT_SCALES[index];
        try {
          localStorage.setItem('fz', fontScale);
        } catch (e) {}
        const redraw = () => {
          lastTapKey = 'fz'; // der Tipp liegt beim Überblenden schon zurück (siehe click-Listener) – Anker selbst setzen
          holdAtTop = true;
          quietRender = true;
          try {
            render();
          } finally {
            lastTapKey = null;
            holdAtTop = false;
            quietRender = false;
          }
        };
        if (document.startViewTransition && !matchMedia('(prefers-reduced-motion: reduce)').matches)
          document.startViewTransition(redraw);
        else redraw();
      };
      // Schaltflächen „A−“ / „A+“; sperren an den Enden der Skala
      const fontScaleButtons = () => {
        const i = FONT_SCALES.indexOf(fontScale),
          p = ` (aktuell ${Math.round(fontScale * 100)} %)`;
        return el(
          'div',
          { class: 'fzg' + (fontScale !== 1 ? ' on' : ''), role: 'group', 'aria-label': 'Schriftgröße', 'data-k': 'fz' },
          el(
            'button',
            {
              title: 'Schrift kleiner' + p,
              'aria-label': 'Schrift kleiner' + p,
              disabled: i <= 0 ? 'disabled' : null,
              onclick: () => changeFontScale(-1)
            },
            'A−'
          ),
          el(
            'button',
            {
              title: 'Schrift größer' + p,
              'aria-label': 'Schrift größer' + p,
              disabled: i >= FONT_SCALES.length - 1 ? 'disabled' : null,
              onclick: () => changeFontScale(1)
            },
            'A+'
          )
        );
      };
      // ---- Hell/Dunkel ----
      // Hell/Dunkel: ohne eigene Wahl folgt die App der Einstellung des Handys; Wahl wird je Gerät gespeichert
      const darkMediaQuery = matchMedia('(prefers-color-scheme: dark)');
      let themeChoice = '';
      try {
        themeChoice = localStorage.getItem('thm') || '';
      } catch (e) {}
      if (themeChoice !== 'light' && themeChoice !== 'dark') themeChoice = '';
      // true, wenn gerade dunkel dargestellt wird (eigene Wahl, sonst Systemeinstellung)
      const isDark = () => (themeChoice ? themeChoice === 'dark' : darkMediaQuery.matches);
      // Schalter „Dunkel“ in der Kopfzeile
      const themeSwitch = el(
        'button',
        {
          class: 'thm',
          role: 'switch',
          'aria-label': 'Dunkelmodus',
          onclick: () => {
            themeChoice = isDark() ? 'light' : 'dark';
            try {
              localStorage.setItem('thm', themeChoice);
            } catch (e) {}
            applyTheme();
          }
        },
        el('span', {}, '☾ Dunkel'),
        el('span', { class: 'sw' })
      );
      // wendet die Wahl an: data-theme am <html>, Klasse .dk (für Logo/Hover), Statusleistenfarbe des Browsers
      function applyTheme() {
        const root = document.documentElement,
          dark = isDark();
        if (themeChoice) root.dataset.theme = themeChoice;
        else delete root.dataset.theme;
        root.classList.toggle('dk', dark);
        themeSwitch.setAttribute('aria-checked', String(dark));
        const metaTag = document.querySelector('meta[name="theme-color"]');
        if (metaTag) metaTag.content = dark ? '#111115' : '#bb005d';
      }
      // Logo: public/logo.png (sonst logo.svg); fehlt die Datei, bleibt nur der Schalter
      const logo = el('img', {
        class: 'logo',
        src: '/logo.png',
        alt: 'Wiener Netze',
        onerror: () => {
          if (!logo.dataset.f) {
            logo.dataset.f = '1';
            logo.src = '/logo.svg';
          } else logo.remove();
        }
      });
      // Kopfzeile (Logo + Schalter); ihre Höhe wird für die klebende Auftragszeile in --toph gehalten
      const topBar = document.getElementById('top');
      topBar.append(logo, themeSwitch);
      // Höhe der Kopfzeile merken (für die darunter klebende Auftragszeile); beim Scrollen dezente Trennlinie
      const updateTopBarHeight = () =>
        document.documentElement.style.setProperty('--toph', topBar.offsetHeight + 'px');
      if (window.ResizeObserver) new ResizeObserver(updateTopBarHeight).observe(topBar);
      updateTopBarHeight();
      addEventListener('scroll', () => topBar.classList.toggle('sc', scrollY > 2), { passive: true });
      applyTheme();
      darkMediaQuery.addEventListener
        ? darkMediaQuery.addEventListener('change', applyTheme)
        : darkMediaQuery.addListener(applyTheme);
      // ---- Hilfsfunktionen ----
      // Deutsche, "natürliche" Sortierung (Zahlen als Zahlen: 2 < 10)
      const naturalCompare = (a, b) => String(a).localeCompare(String(b), 'de', { numeric: true });
      // Text aus einer Exception (oder beliebigem Wert)
      const errorMessageOf = e => (e && e.message ? e.message : String(e));

      // ---- Skeleton-Platzhalter (während etwas lädt) ----
      // Graue, sanft pulsierende Platzhalter in der Form des späteren Inhalts – statt „Lade …“ oder einer leeren Seite.
      // Der äußere Container meldet sich Screenreadern als „Lade …“ (role=status), die einzelnen Teile sind dekorativ
      // (aria-hidden). Stellt das System „weniger Bewegung“ ein, steht die Animation still (siehe CSS .sk).
      const skeletonBar = (width = '100%', height = '1em') =>
        el('div', { class: 'sk', 'aria-hidden': 'true', style: `width:${width};height:${height}` });
      // Platzhalter für Container: Screenreader hören „Lade …“
      const skeletonBox = (cls, ...children) =>
        el('div', { class: cls, role: 'status', 'aria-busy': 'true', 'aria-label': 'Lade …' }, ...children);
      // Platzhalter einer Auftrags-/Gerätekarte: Etiketten, Titel, zwei Textzeilen
      const skeletonCard = () =>
        el(
          'div',
          { class: 'card', 'aria-hidden': 'true' },
          el('div', { class: 'row' }, skeletonBar('5.5rem', '1.5rem'), skeletonBar('4rem', '1.5rem')),
          skeletonBar('70%', '1.2em'),
          skeletonBar('50%'),
          skeletonBar('35%')
        );
      // Raster aus count Platzhalter-Karten (gleiches Raster wie die echte Liste)
      const skeletonGrid = (count = 6) =>
        skeletonBox('grid', ...Array.from({ length: count }, () => skeletonCard()));
      // Platzhalter einer Seite mit Fortschrittskarte, Filter-Chips und Kartenliste (Monteur-Liste, Dispo-Übersicht)
      const skeletonPage = () =>
        skeletonBox(
          '',
          el(
            'div',
            { class: 'card', 'aria-hidden': 'true' },
            skeletonBar('30%', '1.8rem'),
            skeletonBar('100%', '14px'),
            skeletonBar('55%')
          ),
          el(
            'div',
            { class: 'chips', 'aria-hidden': 'true' },
            ...[0, 1, 2, 3].map(() => skeletonBar('5rem', '2rem'))
          ),
          el(
            'div',
            { class: 'grid', 'aria-hidden': 'true' },
            ...Array.from({ length: 6 }, () => skeletonCard())
          )
        );
      // Platzhalter der Teamauswahl: count große Schaltflächen
      const skeletonButtons = (count = 4) =>
        skeletonBox(
          'tgrid',
          ...Array.from({ length: count }, () => el('div', { class: 'sk sk-btn', 'aria-hidden': 'true' }))
        );
      // Platzhalter der Prüfobjekte: je Eintrag eine Textzeile und zwei Schaltflächen
      const skeletonChecklist = () =>
        skeletonBox(
          '',
          ...Array.from({ length: 4 }, () =>
            el(
              'div',
              { class: 'it', 'aria-hidden': 'true' },
              skeletonBar('85%', '1.1em'),
              el('div', { class: 'ob' }, skeletonBar('100%', '2.8rem'), skeletonBar('100%', '2.8rem'))
            )
          )
        );
      // Platzhalter einer Ergebnistabelle (Vergleich)
      const skeletonTable = () =>
        skeletonBox(
          'card',
          ...[0, 1, 2, 3, 4, 5].map(i => skeletonBar(i === 0 ? '100%' : i % 2 ? '90%' : '75%', '1.2em'))
        );

      // ---- Upload (Disponent) ----
      // Vier SAP-Dateien, jede im eigenen Feld und in beliebiger Reihenfolge: Aufträge, Vorgänge, Meldungen, Prüflose. Der Server setzt
      // die Aufträge aus Aufträgen + Vorgängen zusammen (Reparatur: jeder Vorgang ein Auftrag), Meldungen und Prüflose hängen daran.
      // part: Feld im Tab „Upload“ (UPLOAD_PARTS)
      const UPLOAD_PARTS = {
        auftraege: { name: 'Aufträge', url: '/api/orders', meta: () => uploadMeta, wipe: 'orders', wiped: 'Alle Aufträge gelöscht' },
        vorgaenge: { name: 'Vorgänge', url: '/api/vorgaenge', meta: () => vorgMeta, wipe: 'vorg', wiped: 'Alle Vorgänge gelöscht' },
        meldungen: { name: 'Meldungen', url: '/api/meldungen', meta: () => melMeta, wipe: 'mel', wiped: 'Alle Meldungen gelöscht' }
      };
      /**
       * Eine Excel-Datei (bzw. mehrere derselben Art) lesen (im Web Worker) und hochladen. keep = true: nur ergänzen/aktualisieren,
       * sonst ersetzt die Datei die Einträge der enthaltenen Teams (Aufträge, Meldungen) bzw. Aufträge (Vorgänge) – siehe server.js.
       */
      async function uploadSource(part, files, keep) {
        const { url, wipe } = UPLOAD_PARTS[part];
        busy = true;
        errorMsg = '';
        infoMsg = 'Lese Datei …';
        render();
        try {
          const bufs = [];
          for (const f of files) bufs.push(await f.arrayBuffer());
          const r = await runExcelWorker({ type: 'orders', wanted: part, bufs }, bufs);
          infoMsg = 'Speichere …';
          render();
          const answer = await api('POST', url, { rows: r.rows, keep, hasLart: r.hasLart, files: files.map(f => f.name).join(', ') }, 120000);
          delete uploadPick[wipe]; // gespeichert: die Karte zeigt wieder „Keine Datei gewählt“ (bei einem Fehler bleibt die Auswahl für einen neuen Versuch)
          delete uploadKeep[wipe];
          await poll();
          const total = o => Object.values(o || {}).reduce((a, n) => a + n, 0),
            kinds = KINDS.filter(x => answer.counts && answer.counts[x.k]).map(x => kindCount(x.k, answer.counts[x.k]));
          if (part === 'auftraege')
            infoMsg =
              `Aufträge gespeichert: ${kinds.join(' · ') || 'keine'}` +
              (answer.planned ? ` · ${answer.planned} geplante Vorgänge/Aufträge (Team mit „P“) noch nicht angezeigt` : '') +
              (r.skip ? ` · ${r.skip} Zeilen ohne Team übersprungen` : '') +
              (total(answer.ignored)
                ? ` · ${total(answer.ignored) === 1 ? '1 Auftrag' : total(answer.ignored) + ' Aufträge'} anderer Auftragsarten übergangen (${Object.entries(answer.ignored)
                    .map(([art, n]) => `${n}× ${art}`)
                    .join(', ')})`
                : '') +
              (answer.counts && answer.counts.rep + answer.counts.ent > 0 && !answer.steps
                ? ' · Für Reparaturen fehlt noch die Vorgänge-Excel'
                : '');
          else if (part === 'vorgaenge')
            infoMsg =
              `${answer.count} Vorgänge zu ${answer.orders} Aufträgen gespeichert` +
              (kinds.length ? ` · jetzt: ${kinds.join(' · ')}` : '') +
              (answer.planned ? ` · ${answer.planned} geplante Vorgänge (Team mit „P“) noch nicht angezeigt` : '');
          else infoMsg = `${kindCount('mel', answer.count)} gespeichert`;
        } catch (e) {
          infoMsg = '';
          errorMsg = errorMessageOf(e);
        }
        busy = false;
        render();
      }
      // Eine Dateiart löschen (braucht den Upload-PIN): part = 'orders' | 'vorg' | 'mel' | 'pruef'
      async function wipePart(part) {
        const spec = part === 'pruef' ? { url: '/api/pruef', wiped: 'Alle Prüfobjekte gelöscht' } : Object.values(UPLOAD_PARTS).find(x => x.wipe === part);
        busy = true;
        armWipe = '';
        render();
        try {
          await api('DELETE', spec.url);
          if (part === 'pruef') checklistsByOrder.clear();
          await poll();
          infoMsg = spec.wiped;
        } catch (e) {
          errorMsg = errorMessageOf(e);
        }
        busy = false;
        render();
      }

      /**
       * Prüflos-Excel(s) lesen und hochladen: Spalten „Auftrag“ + „Kurztext des Prüfobjektes“.
       * Aufträge, die in der Datei vorkommen, bekommen ihre Prüfobjekt-Liste ersetzt (POST /api/pruef).
       */
      async function uploadChecklists(files) {
        busy = true;
        errorMsg = '';
        infoMsg = 'Lese Datei … (läuft im Hintergrund)';
        render();
        try {
          const by = {};
          let n = 0;
          for (const f of files) {
            const buf = await f.arrayBuffer();
            const r = await runExcelWorker({ type: 'pruef', buf }, [buf]);
            for (const [a, l] of Object.entries(r.by)) {
              (by[a] = by[a] || []).push(...l);
              n += l.length;
            }
          }
          const cnt = Object.keys(by).length;
          if (!cnt)
            throw new Error(
              'Keine Prüfobjekte gefunden (Spalten „Auftrag" und „Kurztext des Prüfobjektes" nötig)'
            );
          infoMsg = 'Speichere …';
          render();
          await api(
            'POST',
            '/api/pruef',
            { by, files: files.map(f => f.name).join(', '), count: n, orders: cnt },
            120000
          );
          delete uploadPick.pruef;
          checklistsByOrder.clear();
          await poll();
          infoMsg = `${n} Prüfobjekte zu ${cnt} Aufträgen gespeichert`;
        } catch (e) {
          infoMsg = '';
          errorMsg = errorMessageOf(e);
        }
        busy = false;
        render();
      }
      // ---- Prüfobjekt-Texte lesbar machen (nur Monteur-Ansicht; Dispo und Export zeigen den Originaltext) ----
      // Beispiele aus den Prüflosen:
      //   „VL 1210 Am Spitz DN125 RL“           -> Verteilleitung 1210 Am Spitz DN125 – Rücklauf
      //   „AL UHM001 1210 Am Spitz 8 VL“        -> Abzweigleitung Schacht UHM001 1210 Am Spitz 8 – Vorlauf
      //   „KH RL AL 1210 Am Spitz 8 SHM911“     -> Kugelhahn am Rücklauf der Abzweigleitung 1210 Am Spitz 8 im Schacht SHM911
      // Kürzel: VL/AL = Verteil-/Abzweigleitung (am Anfang), VL/RL = Vor-/Rücklauf (hinten), KH = Kugelhahn,
      // Ü = Überlauf, E = Entleerung. Schachtbezeichnung = 3 Buchstaben + 3 Ziffern (z. B. SHM911).
      const LINE_NAMES = { VL: 'Verteilleitung', AL: 'Abzweigleitung' },
        FLOW_NAMES = { VL: 'Vorlauf', RL: 'Rücklauf' },
        PART_NAMES = { KH: 'Kugelhahn', E: 'Entleerung', Ü: 'Überlauf' },
        SHAFT_PATTERN = /^[A-Z]{3}\d{3}$/;
      /**
       * Wandelt den Kurztext eines Prüfobjekts in einen lesbaren Satz um. Erkennt zwei Muster:
       *   1) Leitung:  <VL|AL> <Ort/Schacht …> <VL|RL>
       *   2) Bauteil:  <KH|Ü|E> <VL|RL> <VL|AL> <Ort …> [Schacht]
       * Alles andere kommt unverändert zurück (der Monteur sieht dann den Originaltext).
       */
      function humanizeChecklistText(text) {
        const words = String(text).trim().split(/\s+/),
          shaftLabel = x => (SHAFT_PATTERN.test(x) ? 'Schacht ' + x : x);
        // „VL 1210 Am Spitz DN125 RL“ / „AL UHM001 1210 Am Spitz 8 VL“
        if (LINE_NAMES[words[0]] && FLOW_NAMES[words[words.length - 1]] && words.length > 2)
          return `${LINE_NAMES[words[0]]} ${words.slice(1, -1).map(shaftLabel).join(' ')} – ${FLOW_NAMES[words[words.length - 1]]}`;
        // „KH RL AL 1210 Am Spitz 8 SHM911“ (Bauteil, Vor-/Rücklauf, Leitungsart, Ort, Schacht)
        const part = PART_NAMES[words[0].toUpperCase()],
          flow = FLOW_NAMES[words[1]],
          lineType = LINE_NAMES[words[2]];
        if (part && flow && lineType && words.length > 3) {
          const shaft = SHAFT_PATTERN.test(words[words.length - 1]) ? words.pop() : '',
            place = words.slice(3).join(' ');
          return `${part} am ${flow} der ${lineType}${place ? ' ' + place : ''}${shaft ? ' im Schacht ' + shaft : ''}`;
        }
        return text;
      }
      // ---- Excel-Export ----
      // Anzeigetexte der Status-Werte (siehe orderStatus)
      const STATUS_LABELS = { done: 'Erledigt', teil: 'In Arbeit', offen: 'Offen' };
      /**
       * Excel-Export der übergebenen Aufträge (Disponent): holt die Prüfobjekt-Listen vom Server, baut zwei Tabellen
       * (Blatt „Aufträge“: eine Zeile je Auftrag; Blatt „Prüfobjekte“: eine Zeile je Prüfobjekt) und lässt die Datei im
       * Web Worker erzeugen. Die Spalte „Abgehakt am“ wird auch vom Vergleich (drawComparison) gelesen.
       * Veraltete Bewertungen (Prüfliste wurde nach der Bewertung geändert) werden als „veraltet“ gekennzeichnet.
       */
      async function exportXlsx(rows) {
        busy = true;
        errorMsg = '';
        infoMsg = 'Erstelle Excel …';
        render();
        try {
          const lists = new Map(
            Object.entries(
              (await api('POST', '/api/pruef/get', { ids: rows.map(order => order.auftrag) }, 120000)).map
            )
          );
          const orderRows = [
            [
              'Auftrag',
              'Team (Verantw. Arb. Pl.)',
              'Techn. Platz',
              'Auftragsart',
              'PLZ',
              'Straße',
              'Kurztext',
              'Eckstarttermin',
              'Eckendtermin',
              'Status',
              'Prüfergebnis',
              'Prüfobjekte gesamt',
              'OK',
              'Nicht OK',
              'Offen',
              'Durchgeführt am',
              'Beginn (Uhrzeit)',
              'Dauer (Min)',
              'Dauer (Std)',
              'Zeit zurückgemeldet am',
              'Zeit zurückgemeldet von',
              'Gearbeitet mit',
              'Nicht OK – Prüfobjekt → Text',
              'Hinweis',
              'Abgehakt am',
              'Zuletzt gespeichert von',
              'Auftragsart (App)',
              'Vorgang',
              'Vorgang Kurztext',
              'Uhrzeit von',
              'Uhrzeit bis',
              'Meldung(en)',
              'Endrückmeldung'
            ]
          ];
          // Daueraufträge, Reparaturen, Entstörungen: jeder Eintrag eine Zeile (Blatt „Zeiteinträge“); beim Auftrag stehen die Summen
          const entryRows = [
            ['Auftrag', 'Team', 'Kurztext', 'Durchgeführt am', 'Beginn (Uhrzeit)', 'Dauer (Min)', 'Dauer (Std)', 'Gearbeitet mit', 'Eingetragen von', 'Eingetragen am', 'Endrückmeldung']
          ];
          const checklistRows = [
            [
              'Auftrag',
              'Team',
              'Auftrag Kurztext',
              'Pos.',
              'Prüfobjekt (Kurztext)',
              'Ergebnis',
              'Text bei Nicht OK'
            ]
          ];
          for (const order of rows) {
            const items = lists.get(order.auftrag) || [],
              status = orderStatus(order),
              count = items.length,
              valid = !!(status.s && count > 0 && status.n === count && status.s.length === count),
              stale = !!(status.s && count > 0 && !valid),
              total = count || status.n;
            orderRows.push([
              orderNr(order),
              order.team,
              order.tp,
              order.art,
              order.plz,
              order.str,
              order.kurz,
              order.start,
              order.ende,
              // Status und Prüfergebnis gibt es nur bei Wartungen
              orderKind(order) !== 'war' ? '' : STATUS_LABELS[stale && status.st === 'done' ? 'teil' : status.st],
              orderKind(order) !== 'war'
                ? ''
                : status.nx > 0
                  ? status.op > 0
                    ? 'Nicht OK (unvollständig)'
                    : 'Nicht OK'
                  : status.n > 0 && !status.op
                    ? 'OK'
                    : status.ok > 0
                      ? 'unvollständig'
                      : '',
              total,
              status.ok,
              status.nx,
              Math.max(0, total - status.ok - status.nx),
              isoToExcelDate(performedDate(status)),
              timeToExcelFraction(status.von),
              status.min != null ? status.min : null,
              status.min != null ? Math.round((status.min / 60) * 100) / 100 : null,
              status.tat ? new Date(status.tat).toLocaleString('de-AT') : null,
              status.tu ? userLabel(status.tu) : null,
              status.mit && status.mit.length ? status.mit.map(userLabel).join(', ') : null,
              status.nok.map(z => (z.m ? `${z.t} → ${z.m}` : z.t)).join(' | '),
              stale
                ? 'Prüfliste seit der Bewertung geändert'
                : status.cnt
                  ? `${status.cnt} ${orderKind(order) === 'dau' ? 'Tageseinträge' : 'Zeiteinträge'} – siehe Blatt „Zeiteinträge“`
                  : '',
              markState(order.auftrag)
                ? new Date(marks.get(order.auftrag).at).toLocaleString('de-AT') +
                  (markState(order.auftrag) === 2 ? ' (danach geändert)' : '')
                : null,
              status.u ? userLabel(status.u) : null,
              kindInfo(orderKind(order)).name,
              order.vg || '',
              order.vtxt || '',
              order.uhr || '',
              order.uhr2 || '',
              meldungenOf(order).map(m => `${m.nr}: ${m.txt}`).join(' | ') || order.mel || '',
              isTimedKind(orderKind(order)) && status.cnt ? (status.fin ? 'ja' : 'nein (Teilrückmeldung)') : ''
            ]);
            for (const e of status.ein || [])
              entryRows.push([
                orderNr(order),
                order.team,
                order.kurz,
                isoToExcelDate(performedDate(e)),
                timeToExcelFraction(e.von),
                e.min,
                Math.round((e.min / 60) * 100) / 100,
                e.mit && e.mit.length ? e.mit.map(userLabel).join(', ') : null,
                e.tu ? userLabel(e.tu) : null,
                e.tat ? new Date(e.tat).toLocaleString('de-AT') : null,
                isTimedKind(orderKind(order)) ? (e.fin ? 'ja' : 'nein') : ''
              ]);
            items.forEach((t, i) => {
              const itemMark = valid ? status.s[i] : '-',
                z = valid ? status.nok.find(z => z.i === i) : null;
              checklistRows.push([
                orderNr(order),
                order.team,
                order.kurz,
                i + 1,
                t,
                stale ? 'veraltet' : itemMark === 'o' ? 'OK' : itemMark === 'x' ? 'Nicht OK' : 'Offen',
                z ? z.m : ''
              ]);
            });
          }
          const out = await runExcelWorker({
            type: 'xlsx',
            A: orderRows,
            P: checklistRows,
            E: entryRows.length > 1 ? entryRows : null,
            dc: orderRows[0].indexOf('Durchgeführt am'),
            tc: orderRows[0].indexOf('Beginn (Uhrzeit)')
          });
          const fileName =
            (viewKind === 'war' || !viewKind ? 'Pruefergebnisse' : 'Auftraege_' + kindInfo(viewKind).plural) +
            (teamFilter ? '_' + teamFilter.replace(/[^A-Za-z0-9_-]/g, '_') : '') +
            (statusFilter ? '_' + statusFilter : '') +
            (reportedRange()
              ? '_RM_' + (reportedRange()[0] || '') + '_bis_' + (reportedRange()[1] || '')
              : '') +
            '_' +
            new Date().toLocaleDateString('sv-SE') +
            '.xlsx';
          const url = URL.createObjectURL(
            new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
          );
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          infoMsg = `Export bereit: ${rows.length} Aufträge, ${checklistRows.length - 1} Prüfobjekte`;
        } catch (e) {
          infoMsg = '';
          if (e && e.code === 'declined') infoMsg = 'Download abgebrochen';
          else errorMsg = 'Export fehlgeschlagen: ' + (e.message || e);
        }
        busy = false;
        render();
      }
      // ---- Auftrag öffnen ----
      /** Öffnet die Detailansicht: Zeitfelder aus dem Ergebnis vorbelegen, Prüfobjekte aus dem Zwischenspeicher oder vom Server laden. */
      async function openOrderDetail(order) {
        openOrder = order;
        armAllOk = false;
        editIndex = null;
        checklist = { st: 'load' };
        entryKey = '';
        entriesAll = false;
        // Auftrag mit Zeiteinträgen (Dauerauftrag, Reparatur, Entstörung): das Formular ist ein neuer Eintrag (die Einträge stehen darüber)
        const existingResult = hasEntries(orderKind(order)) ? null : resultOf(order.auftrag);
        timeFinal = !endReported(order);
        stopAsk = null;
        // ältere, nicht auf Viertelstunden gerundete Zeiten werden im Formular auf die nächste Viertelstunde aufgerundet vorbelegt
        const shownMin = existingResult && existingResult.min != null ? roundUpQuarter(existingResult.min) : null;
        timeHours = shownMin != null ? String(Math.floor(shownMin / 60)) : '';
        timeMinutes = shownMin != null ? String(shownMin % 60) : '';
        timeError = '';
        timeDate =
          existingResult && existingResult.min != null ? performedDate(existingResult) || today() : today();
        timeStart =
          existingResult && existingResult.min != null && existingResult.von
            ? roundQuarterHHMM(existingResult.von)
            : '';
        // Reparatur/Entstörung ohne Zeit: Datum und Beginn des Termins vorbelegen (nicht in der Zukunft)
        if (isTimedKind(orderKind(order)) && !(resultOf(order.auftrag) || {}).cnt) {
          const planned = isoOfDate(order.start);
          if (planned && planned <= today()) timeDate = planned;
          if (order.uhr && /^\d{2}:\d{2}$/.test(order.uhr)) timeStart = roundQuarterHHMM(order.uhr);
        }
        timeWith = existingResult && existingResult.min != null && existingResult.mit ? [...existingResult.mit] : [];
        // neue Zeit: alle aus dem Team sind vorausgewählt (sobald die Kollegenliste da ist), solange der Monteur nichts ändert
        timeWithAuto = session.role === 'monteur' && !(existingResult && existingResult.min != null);
        timeFormOpen = false;
        applyDefaultWith(order);
        if (session.role === 'monteur') loadColleagues(order.team);
        timeFormAtOpen = timeFormSnapshot();
        render();
        // nur Wartungen haben Prüfobjekte
        if (orderKind(order) !== 'war') {
          checklist = { st: 'ok', list: [] };
          render();
          return;
        }
        try {
          let items = checklistsByOrder.get(order.auftrag);
          if (!items) {
            items = (await api('GET', '/api/pruef?a=' + encodeURIComponent(order.auftrag))).list;
            checklistsByOrder.set(order.auftrag, items);
          }
          if (!openOrder || openOrder.auftrag !== order.auftrag) return;
          checklist = { st: 'ok', list: items };
        } catch (e) {
          if (!openOrder || openOrder.auftrag !== order.auftrag) return;
          checklist = {
            st: 'err',
            m: e.net ? 'Keine Verbindung – Prüfobjekte noch nicht geladen' : errorMessageOf(e)
          };
        }
        render();
      }

      // ---- Ergebnisse und Status ----
      // Ergebnis-Dokument eines Auftrags (Format siehe Kopfkommentar): erst die noch nicht gesendete Eingabe (outbox), sonst der Stand vom Server
      const rawResult = key => outbox.get(key) || results.get(key);
      // Aufträge mit mehreren Zeiteinträgen: Daueraufträge (ein Eintrag je Tag) sowie Reparaturen und Entstörungen (mehrere Zeiten, wenn die
      // Arbeit nicht in einem Zug fertig wird; der Eintrag mit `fin` ist die Endrückmeldung). Wartungen haben genau eine Zeit im Ergebnis.
      const hasEntries = k => k === 'dau' || k === 'rep' || k === 'ent';
      // Reparatur/Entstörung: eine früher (vor den Zeiteinträgen) im Ergebnis des Auftrags selbst gespeicherte Zeit zählt als Eintrag – und als
      // Endrückmeldung, denn mit ihr war der Auftrag bisher erledigt
      const legacyEntry = orderNo => {
        const o = ordersMap.get(orderNo);
        return !!o && (o.kind === 'rep' || o.kind === 'ent');
      };
      // Zeiteinträge eines Auftrags (nur gültige, mit Zeit), älteste zuerst; jeder mit seinem Schlüssel `k`
      function entriesOf(orderNo) {
        const list = [...(entryKeys.get(orderNo) || [])]
            .map(k => {
              const d = rawResult(k);
              return d && d.min != null ? { ...d, k } : null;
            })
            .filter(Boolean),
          own = rawResult(orderNo);
        if (own && own.min != null && legacyEntry(orderNo)) list.push({ ...own, k: orderNo, fin: own.fin ?? 1 });
        return list.sort((a, b) => (performedDate(a) + ' ' + (a.von || '')).localeCompare(performedDate(b) + ' ' + (b.von || '')) || a.k.localeCompare(b.k));
      }
      // Ein Auftrag mit Zeiteinträgen hat als „Ergebnis“ die Summe: min = Gesamtdauer, dat/von = letzter Eintrag, tat/tu = zuletzt
      // eingetragen, cnt = Anzahl, ein = die Einträge, fin = ein Eintrag ist die Endrückmeldung (Reparatur/Entstörung), mit = alle, mit denen
      // gearbeitet wurde (Reparatur/Entstörung). Alle anderen Aufträge: ihr gespeichertes Ergebnis.
      const resultOf = orderNo => {
        const own = rawResult(orderNo);
        if (entryKeys.has(orderNo) || (own && own.min != null && legacyEntry(orderNo))) {
          const list = entriesOf(orderNo);
          if (list.length) {
            const last = list[list.length - 1],
              mit = [...new Set(list.flatMap(e => e.mit || []))],
              timed = !!(ordersMap.get(orderNo) && isTimedKind(ordersMap.get(orderNo).kind));
            return {
              a: orderNo,
              team: last.team,
              n: 0,
              ok: 0,
              nx: 0,
              s: '',
              nok: [],
              min: list.reduce((sum, e) => sum + e.min, 0),
              dat: performedDate(last),
              von: last.von,
              tat: Math.max(...list.map(e => e.tat || 0)),
              tu: last.tu,
              cnt: list.length,
              ein: list,
              ...(timed ? { fin: list.some(e => e.fin) ? 1 : 0, ...(mit.length ? { mit } : {}) } : {})
            };
          }
        }
        return own;
      };
      // Hat der Monteur den Auftrag endrückgemeldet (Reparatur/Entstörung: ein Eintrag hat den Haken „Endrückmeldung“)?
      const endReported = order => !!(resultOf(order.auftrag) || {}).fin;
      /**
       * Status eines Auftrags, abgeleitet aus dem Ergebnis-Dokument:
       *   st = 'done'  erledigt: alle Prüfobjekte bewertet UND Zeitrückmeldung vollständig
       *        'teil'  begonnen (etwas bewertet oder Zeit erfasst)
       *        'offen' noch nichts erfasst
       *   op = Anzahl noch offener Prüfobjekte; nx > 0 (Nicht OK) gilt unabhängig davon – ein Auftrag kann
       *   „Nicht OK“ UND erledigt (oder in Arbeit) sein.
       */
      // Ergebnisse ändern sich nie „von innen“ (jede Änderung ist ein neues Objekt) -> der Status wird je Ergebnis nur einmal berechnet
      const statusCache = new WeakMap(),
        STATUS_NONE = { st: 'offen', ok: 0, n: 0, nx: 0, op: 0, nok: [] };
      const orderStatus = order => {
        const result = resultOf(order.auftrag);
        if (!result) return STATUS_NONE;
        let status = statusCache.get(result);
        if (!status) statusCache.set(result, (status = computeOrderStatus(result, orderKind(order))));
        return status;
      };
      // Auftragsart ohne Prüfobjekte (Reparatur, Entstörung): erledigt ist sie mit der Endrückmeldung (vollständige Zeit, Haken „Endrückmeldung“ –
      // Teilzeiten allein genügen nicht). Ein Dauerauftrag ist nie „erledigt“ (er läuft weiter): mit Tageseinträgen ist er „in Arbeit“.
      const computeOrderStatus = (result, kind) => {
        const openCount = Math.max(0, (result.n | 0) - (result.ok | 0) - (result.nx | 0));
        return {
          ...result,
          op: openCount,
          nok: (result.nok || []).map(z => (typeof z === 'string' ? { t: z, m: '' } : z)),
          st:
            kind !== 'dau' && (result.n > 0 || kind !== 'war') && !openCount && timeComplete(result) && (kind === 'war' || !!result.fin)
              ? 'done'
              : result.ok + result.nx > 0 || result.min != null
                ? 'teil'
                : 'offen'
        };
      };
      // Etiketten („Nicht OK“, „Erledigt“, „x von y offen“) für die Auftragskarte
      const statusTags = order => {
        // Status (erledigt, Prüfobjekte offen, Nicht OK) gibt es nur bei Wartungen
        if (orderKind(order) !== 'war') return [];
        const status = orderStatus(order);
        return [
          status.nx > 0 && el('span', { class: 'tag st-nok' }, `✗ Nicht OK (${status.nx})`),
          status.st === 'done'
            ? el('span', { class: 'tag st-ok' }, '✓ Erledigt')
            : status.st === 'teil' && status.op > 0
              ? el('span', { class: 'tag st-teil' }, `◐ ${status.op} von ${status.n} offen`)
              : status.st === 'teil' && status.n > 0
                ? el('span', { class: 'tag st-teil' }, 'Alle geprüft')
                : null
        ];
      };
      // Zeitrückmeldung vollständig = Datum + Beginn + Dauer
      const timeComplete = result =>
        !!(result && result.min >= 1 && performedDate(result) && /^\d{2}:\d{2}$/.test(result.von || ''));
      // true, wenn der Auftrag erledigt ist
      const isFinished = order => orderStatus(order).st === 'done';
      // Farbe in Liste und Diagramm: 'run' = Start gedrückt, noch keine Zeit gespeichert · 'fin' = erledigt (Wartung: Prüfobjekte bewertet und Zeit
      // eingetragen, sonst: Zeit eingetragen) · '' = sonst. Daueraufträge laufen weiter und bekommen keine Farbe. Der Disponent sieht nur den Start
      // laut Ergebnis (go); ein Monteur auch den Timer seines Geräts, der noch nicht gesendet ist.
      const startOf = order => (session.role === 'dispo' ? goOf(order.auftrag) : timerStartOf(order.auftrag));
      // Reparatur/Entstörung: auch mit Teilrückmeldung (Zeit eingetragen, aber noch keine Endrückmeldung) ist der Auftrag „in Arbeit“ (blau)
      const workState = order =>
        orderKind(order) === 'dau' ? '' : isFinished(order) ? 'fin' : startOf(order) || (isTimedKind(orderKind(order)) && (resultOf(order.auftrag) || {}).cnt) ? 'run' : '';
      // „08:15“, an einem anderen Tag „07.10. 08:15“
      const startText = ms => {
        const d = new Date(ms),
          day = d.toLocaleDateString('sv-SE');
        return (day === today() ? '' : formatIsoDate(day).slice(0, 6) + ' ') + d.toTimeString().slice(0, 5);
      };
      // Etikett „▶ gestartet 08:15“ (blau). „Erledigt“ bekommt nur die Farbe (grüne Kante): bei Wartungen steht das Etikett schon in statusTags,
      // die übrigen Auftragsarten zeigen bewusst keinen Status – dort steht die Zeit („⏱ 1 Std“) auf der Karte.
      const workTags = order => (workState(order) === 'run' && startOf(order) ? el('span', { class: 'tag st-run' }, '▶ gestartet ' + startText(startOf(order))) : null);
      // Etikett für Reparatur/Entstörung mit Zeit: „✓ Endrückmeldung“ (fertig) oder „◐ Teilrückmeldung“ (die Arbeit geht weiter)
      const endTag = order => {
        const d = isTimedKind(orderKind(order)) && resultOf(order.auftrag);

                  render();
                }
              },
              `Alle ${list.length} Einträge anzeigen`
            )
        ];
      }
      /**
       * Karte „Zeit“: zeigt die erfasste Zeit mit Hinweisen, warum der Auftrag noch nicht „erledigt“ ist.
       * Für den Monteur (isMonteur) zusätzlich Eingabefelder: Datum (Heute/Gestern), Beginn (Jetzt), Dauer
       * (Schnellwahl + Stunden/Minuten) und Speichern/Löschen.
       */
      function timeCard(order, isMonteur) {
        // Dauerauftrag, Reparatur, Entstörung: mehrere Einträge. Das Formular unten gilt dann für einen neuen Eintrag oder den gerade bearbeiteten
        // (entryKey). Reparatur/Entstörung: jede Zeit ist eine Teilrückmeldung, außer der Monteur wählt „Endrückmeldung“ (der Auftrag ist fertig).
        const dau = orderKind(order) === 'dau',
          entries = hasEntries(orderKind(order)),
          timed = isTimedKind(orderKind(order)),
          entry = entries && entryKey ? rawResult(entryKey) : null,
          result = entries ? entry : resultOf(order.auftrag),
          key = entries ? entryKey : order.auftrag,
          items = checklist.st === 'ok' ? checklist.list : null,
          hasTime = !!(result && result.min != null);
        const timePanel = el(

          { class: 'card', 'data-zeit': '1', 'data-k': 'zc' },
          ...(entries

                el(
                  'p',
                  { class: 'mu' },
                  hasTime
                    ? `Durchgeführt am ${formatIsoDate(performedDate(result)) || '–'}${result.von ? ' · ab ' + result.von + ' Uhr' : ''} · Dauer ${formatMinutes(result.min)}`
                    : 'Noch keine Zeit zurückgemeldet.'
                ),
                hasTime && result.tu && el('p', { class: 'mu' }, '👤 Zeit zurückgemeldet von ' + userLabel(result.tu)),
                hasTime && result.mit && el('p', { class: 'mu' }, '👥 Gearbeitet mit: ' + userNamesText(result.mit)),
                result &&
                  result.u &&
                  result.u !== result.tu &&
                  el('p', { class: 'mu' }, '👤 Zuletzt gespeichert von ' + userLabel(result.u))
              ])
        );
        // abgehakt (Monteur): nur ansehen – keine Hinweise zum Ausfüllen, keine Eingabe von Zeit und Kollegen
        if (isMonteur && isLocked(order.auftrag)) return timePanel;
        if (entries) {
          // keine Hinweise zu „erledigt“: ein Dauerauftrag läuft weiter, bei Reparatur/Entstörung sagt es die Zeile „Gesamt … Endrückmeldung“
        } else if (hasTime && !timeComplete(result))
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              'Zeitrückmeldung unvollständig (Beginn fehlt) – Auftrag zählt noch nicht als erledigt.'
            )
          );
        else if (!hasTime && result && result.n > 0 && result.ok + result.nx === result.n)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              'Alle Prüfobjekte bewertet – für „Erledigt“ fehlt noch die Zeitrückmeldung.'
            )
          );
        else if (hasTime && orderStatus(order).op > 0)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              `Zeit erfasst – für „Erledigt“ ${orderStatus(order).op === 1 ? 'fehlt noch 1 Prüfobjekt' : 'fehlen noch ' + orderStatus(order).op + ' Prüfobjekte'}.`
            )
          );
        if (!isMonteur) return timePanel;
        const numberInput = (k, v, set) =>
          el('input', {
            class: 'tm',
            type: 'text',
            inputmode: 'numeric',
            maxlength: '2',
            'data-keep': k,
            placeholder: '0',
            value: v,
            oninput: e => {
              set((e.target.value = e.target.value.replace(/\D/g, '')));
            }
          });
        // Auswahl der Kollegen: Teammitglieder (und wer zuletzt in diesem Team war) als Schalter, alle weiteren über das Auswahlfeld
        const withPicker = order => {
          const list = colleagueCache.get(order.team) || [],
            near = list.filter(c => c.team === order.team || c.here),
            nearSaps = new Set(near.map(c => c.sap)),
            others = list.filter(c => !nearSaps.has(c.sap) && !timeWith.includes(c.sap)),
            shown = [...near.map(c => c.sap), ...timeWith.filter(x => !nearSaps.has(x))],
            toggle = sap => {
              timeWithAuto = false;
              timeWith = timeWith.includes(sap) ? timeWith.filter(x => x !== sap) : [...timeWith, sap];
              render();
            };
          return el(
            'div',
            { class: 'wp', 'data-k': 'zw' },
            shown.length
              ? el(
                  'div',
                  { class: 'chips' },
                  shown.map(sap =>
                    el(
                      'button',
                      {
                        class: 'chip' + (timeWith.includes(sap) ? ' on' : ''),
                        'aria-pressed': timeWith.includes(sap) ? 'true' : 'false',
                        onclick: () => toggle(sap)
                      },
                      (timeWith.includes(sap) ? '✓ ' : '') + userShort(sap)
                    )
                  )
                )
              : el('p', { class: 'mu' }, list.length ? 'Keine weiteren Personen im Team.' : 'Kollegen werden geladen …'),
            others.length > 0 &&
              el(
                'select',
                {
                  'aria-label': 'Weitere Person hinzufügen',
                  onchange: e => {
                    if (!e.target.value) return;
                    timeWithAuto = false;
                    timeWith = [...timeWith, e.target.value];
                    render();
                  }
                },
                el('option', { value: '' }, '＋ Weitere Person …'),
                others.map(c => el('option', { value: c.sap }, c.name + (c.team ? ` (${c.team})` : '')))
              )
          );
        };
        const yesterday = () => {
          const g = new Date();
          g.setDate(g.getDate() - 1);
          return g.toLocaleDateString('sv-SE');
        };
        const timerStart = timerStartOf(order.auftrag);
        if (dau)
          timePanel.append(
            el('b', { class: 'zne', 'data-k': 'zn' }, entry ? `Eintrag bearbeiten (${formatIsoDate(performedDate(entry))})` : 'Neuer Eintrag')
          );
        else if (timed && (entry || (resultOf(order.auftrag) || {}).cnt))
          timePanel.append(
            el('b', { class: 'zne', 'data-k': 'zn' }, entry ? `Zeit bearbeiten (${formatIsoDate(performedDate(entry))})` : 'Weitere Zeit eintragen')
          );
        // Reparatur/Entstörung: Endrückmeldung (der Auftrag ist fertig) oder Teilrückmeldung (die Arbeit geht weiter). Bei Start/Ende fragt die Karte
        // nach dem Stoppen (stopAsk); der Schalter gehört nur zur Zeit von Hand (vorbelegt, solange der Auftrag nicht endrückgemeldet ist).
        // Der Hinweis ändert sich nicht mit der Wahl (eine Zeile mit anderem Umbruch ließe die Karte springen), nur der Haken am Schalter.
        const finRow = () =>
          el(
            'div',
            { class: 'frow', 'data-k': 'zf' },
            el(
              'button',
              {
                class: 'chip' + (timeFinal ? ' on' : ''),
                'aria-pressed': timeFinal ? 'true' : 'false',
                onclick: () => {
                  timeFinal = !timeFinal;
                  render();
                }
              },
              (timeFinal ? '✓ ' : '') + 'Endrückmeldung (Auftrag ist fertig)'
            ),
            el('p', { class: 'mu' }, 'Ohne Haken ist es eine Teilrückmeldung: Die Arbeit geht weiter, der Auftrag bleibt in Arbeit.')
          );
        // „■ Ende“ ist gedrückt (Reparatur/Entstörung): die Zeit steht fest, gefragt wird nach der Endrückmeldung. Läuft der Timer nicht mehr
        // (anderswo verworfen), gilt die Frage nicht mehr. Die Frage ersetzt Start/Ende im selben Bereich (`zs`): der angetippte Bereich bleibt stehen.
        const ask = timerStart && stopAsk && stopAsk.a === order.auftrag ? stopAsk : null;
        if (ask)
          timePanel.append(
            el(
              'div',
              { class: 'tmr', 'data-k': 'zs' },
              el('p', { class: 'mu' }, `■ Gestoppt: ab ${ask.time} Uhr · `, el('b', {}, formatMinutes(ask.minutes))),
              el('p', {}, el('b', {}, 'Endrückmeldung geben?')),
              el(
                'div',
                { class: 'ob ask' },
                el(
                  'button',
                  { class: 'sv', disabled: items ? null : 'disabled', onclick: () => answerStop(order, items, true) },
                  '✓ Ja – Endrückmeldung (Auftrag ist fertig)'
                ),
                el(
                  'button',
                  { disabled: items ? null : 'disabled', onclick: () => answerStop(order, items, false) },
                  '◐ Nein – Teilrückmeldung (Arbeit geht weiter)'
                ),
                el('button', { class: 'er', onclick: () => answerStop(order, items, null) }, 'Zurück – die Zeit läuft weiter')
              )
            )
          );
        else if (timerStart || !hasTime)
          timePanel.append(
            el(
              'div',
              { class: 'tmr', 'data-k': 'zs' },
              timerStart
                ? [
                    el(
                      'p',
                      { class: 'mu' },
                      `⏱ Läuft seit ${new Date(timerStart).toTimeString().slice(0, 5)} Uhr · `,
                      el('b', { 'data-tmr': timerStart }, formatMinutes(elapsedMinutes(timerStart)))
                    ),
                    el(
                      'div',
                      { class: 'ob' },
                      el(
                        'button',
                        { class: 'sv', disabled: items ? null : 'disabled', onclick: () => stopTimer(order, items) },
                        '■ Ende'
                      ),
                      el('button', { class: 'er', onclick: () => cancelTimer(order, items) }, 'Verwerfen')
                    )
                  ]
                : [
                    el(
                      'p',
                      { class: 'mu' },
                      timed
                        ? 'Optional: „Start“ drücken, wenn die Arbeit beginnt, und „Ende“, wenn sie aufhört – danach wird gefragt, ob es die Endrückmeldung ist.'
                        : 'Optional: „Start“ drücken, wenn die Arbeit beginnt, und „Ende“, wenn sie fertig ist – die Zeit wird dann automatisch gespeichert.'
                    ),
                    el('div', { class: 'ob' }, el('button', { class: 'sv', onclick: () => startTimer(order, items) }, '▶ Start'))
                  ]
            )
          );
        // Kompakt: Start/Ende und die Kollegen-Auswahl sind immer da (bei neuer Zeit), Datum/Beginn/Dauer erst nach „Zeit von Hand
        // eintragen“ bzw. „Zeit ändern“. Bei einem Fehler oder angefangener Eingabe bleibt das Formular offen.
        const formOpen = timeFormOpen || !!timeError;
        if (!hasTime) timePanel.append(el('div', { class: 'mu' }, 'Mit wem gearbeitet? (optional)'), withPicker(order));
        if (!formOpen) {
          timePanel.append(
            el(
              'div',
              { class: 'ob', 'data-k': 'zo' },
              el(
                'button',
                {
                  onclick: () => {
                    timeFormOpen = true;
                    render();
                  }
                },
                dau
                  ? hasTime
                    ? '✎ Eintrag ändern'
                    : '✎ Eintrag von Hand eintragen'
                  : hasTime
                    ? '✎ Zeit ändern'
                    : timed && (resultOf(order.auftrag) || {}).cnt
                      ? '✎ Weitere Zeit von Hand eintragen'
                      : '✎ Zeit von Hand eintragen'
              )
            )
          );
          return timePanel;
        }
        timePanel.append(
          el('div', { class: 'mu' }, 'Durchgeführt am'),
          el(
            'div',
            { class: 'zt', 'data-k': 'zd' },
            el('input', {
              class: 'dt',
              type: 'date',
              max: today(),
              'data-nr': '1',
              value: timeDate,
              oninput: e => {
                timeDate = e.target.value;
              },
              onchange: e => {
                timeDate = e.target.value;
              }
            }),
            el(
              'button',
              {
                onclick: () => {
                  timeDate = today();
                  timeError = '';
                  render();
                }
              },
              'Heute'
            ),
            el(
              'button',
              {
                onclick: () => {
                  timeDate = yesterday();
                  timeError = '';
                  render();
                }
              },
              'Gestern'
            )
          ),
          el('div', { class: 'mu' }, 'Beginn (Uhrzeit, auf Viertelstunden gerundet)'),
          el(
            'div',
            { class: 'zt', 'data-k': 'zv' },
            el('input', {
              class: 'dt',
              type: 'time',
              step: '900',
              'data-nr': '1',
              value: timeStart,
              oninput: e => {
                timeStart = e.target.value;
              },
              // beim Verlassen des Feldes auf die nächste Viertelstunde runden (auf oder ab)
              onchange: e => {
                timeStart = roundQuarterHHMM(e.target.value);
                e.target.value = timeStart;
              }
            }),
            el(
              'button',
              {
                onclick: () => {
                  timeStart = roundQuarterClock(Date.now()).time;
                  timeError = '';
                  render();
                }
              },
              'Jetzt'
            ),
            timeStart &&
              el(
                'button',
                {
                  onclick: () => {
                    timeStart = '';
                    render();
                  }
                },
                '✕'
              )
          ),
          el('div', { class: 'mu' }, 'Dauer (in Viertelstunden)'),
          el(
            'div',
            { class: 'qk', 'data-k': 'zq' },
            [15, 30, 60, 90, 120, 180].map(m =>
              el(
                'button',
                {
                  onclick: () => {
                    timeHours = String(Math.floor(m / 60));
                    timeMinutes = String(m % 60);
                    timeError = '';
                    render();
                  }
                },
                formatMinutes(m)
              )
            )
          ),
          el(
            'div',
            { class: 'zt', 'data-k': 'zh' },
            numberInput('h', timeHours, v => {
              timeHours = v;
            }),
            el('span', {}, 'Std'),
            el(
              'select',
              {
                class: 'tm',
                'aria-label': 'Minuten (Viertelstunden)',
                onchange: e => {
                  timeMinutes = e.target.value;
                }
              },
              ['0', '15', '30', '45'].map(v =>
                el(
                  'option',
                  { value: v, ...((timeMinutes || '0') === v ? { selected: 'selected' } : {}) },
                  v.padStart(2, '0')
                )
              )
            ),
            el('span', {}, 'Min')
          ),
          ...(timed ? [finRow()] : []),
          ...(hasTime ? [el('div', { class: 'mu' }, 'Mit wem gearbeitet? (optional)'), withPicker(order)] : []),
          timeError && el('p', { class: 'mu er' }, timeError),
          el(
            'div',
            { class: 'ob', 'data-k': 'zb' },
            el(
              'button',
              {
                class: 'sv',
                disabled: items ? null : 'disabled',
                onclick: () => validateAndStoreTime(order, items, key)
              },
              dau ? (hasTime ? 'Eintrag ändern' : 'Eintrag speichern') : hasTime ? 'Zeit ändern' : 'Zeit speichern'
            ),
            hasTime && el('button', { class: 'er', onclick: () => deleteTime(order, items, key) }, dau ? 'Eintrag löschen' : 'Löschen'),
            el(
              'button',
              {
                onclick: () => {
                  if (entries && entryKey) return editEntry(order, ''); // Bearbeiten abbrechen: zurück zu einem neuen Eintrag
                  timeFormOpen = false;
                  timeError = '';
                  render();
                }
              },
              entries && entryKey ? 'Abbrechen' : 'Zuklappen'
            )
          )
        );
        return timePanel;
      }
      // ---- Prüfobjekte bewerten (Monteur) ----
      // ersetzt ein Zeichen des Status-Strings (Index i -> c)
      const replaceCharAt = (s, i, c) => s.slice(0, i) + c + s.slice(i + 1);
      // „OK“ eines Prüfobjekts umschalten (OK <-> offen); ein vorhandener Nicht-OK-Text geht dabei verloren
      function toggleOk(order, items, index) {
        armAllOk = false;
        editIndex = null;
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        saveChecklistState(
          order,
          items,
          replaceCharAt(state, index, state[index] === 'o' ? '-' : 'o'),
          nokTexts
        );
      }
      // Öffnet das Eingabefeld für den „Nicht OK“-Text des Prüfobjekts index (text = bisheriger Text)
      function openNokEditor(index, text) {
        editIndex = index;
        editText = text || '';
        editTextMissing = false;
        render();
        const field = app.querySelector('[data-keep="e"]');
        if (field) field.focus();
      }
      // „Nicht OK“ speichern – der Text ist Pflicht
      function saveNokText(order, items, index) {
        const text = editText.trim();
        if (!text) {
          editTextMissing = true;
          playErrorSound();
          render();
          return;
        }
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        nokTexts[index] = text;
        editIndex = null;
        armAllOk = false;
        saveChecklistState(order, items, replaceCharAt(state, index, 'x'), nokTexts);
      }
      // Setzt ein Prüfobjekt zurück auf „offen“
      function resetItem(order, items, index) {
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        editIndex = null;
        saveChecklistState(order, items, replaceCharAt(state, index, '-'), nokTexts);
      }
      // ---- Outbox: ungesendete Ergebnisse ----
      // Ungesendete Ergebnisse liegen in `outbox` (und in localStorage) und werden automatisch erneut gesendet.
      // outboxOffline: es gab vorübergehende Sendefehler; retryTimer: nächster Versuch; prefetching: Vorab-Laden läuft
      let outboxOffline = false,
        retryTimer = null,
        prefetching = false;
      // Outbox im Gerät sichern (übersteht Neuladen und App-Neustart)
      const saveOutbox = () => {
        try {
          localStorage.setItem('outbox', JSON.stringify([...outbox]));
        } catch (e) {}
      };
      // Outbox beim Start aus dem Gerät laden
      const loadOutbox = () => {
        try {
          for (const [a, d] of JSON.parse(localStorage.getItem('outbox') || '[]')) outbox.set(a, d);
        } catch (e) {}
      };
      // nächster Sendeversuch in 15 Sekunden
      const scheduleRetry = () => {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(sendAllPending, 15000);
      };
      // alle noch ungesendeten Aufträge senden
      const sendAllPending = () => {
        for (const a of [...outbox.keys()]) sendPending(a);
      };
      /**
       * Sendet das Ergebnis eines Auftrags (PUT /api/ergebnis/<Auftrag>). Pro Auftrag läuft nur eine Sendung gleichzeitig;
       * kommt währenddessen eine neue Eingabe, wird sie danach nachgesendet (schnelle Folgeeingaben).
       * Fehlerbehandlung:
       *   409  inzwischen auf einem anderen Gerät geändert -> der Stand vom Server gilt, Hinweis per toast()
       *   4xx  dauerhafter Fehler -> Eingabe verwerfen, Fehler anzeigen
       *   sonst (kein Netz, Serverfehler) -> in der Outbox behalten und später erneut senden
       */
      async function sendPending(orderNo) {
        const state = sendState.get(orderNo) || sendState.set(orderNo, {}).get(orderNo);
        if (state.busy) {
          state.dirty = true;
          return;
        }
        state.busy = true;
        try {
          let lastDoc = null,
            seq = 0,
            doc = outbox.get(orderNo);
          while (doc) {
            // nur erneut senden, wenn wirklich eine neue Eingabe dazukam
            lastDoc = doc;
            state.dirty = false;
            seq = (await api('PUT', '/api/ergebnis/' + encodeURIComponent(orderNo), doc)).sq;
            const newer = outbox.get(orderNo);
            if (!newer || newer === doc) break;
            newer._b = seq;
            saveOutbox();
            doc = newer; // eigene Folgeeingabe beruht jetzt auf diesem Stand
          }
          if (lastDoc) {
            results.set(orderNo, withoutBase(lastDoc));
            resultSeq.set(orderNo, seq);
          }
          outbox.delete(orderNo);
          saveOutbox();
          serverReachable = true;
          if (outboxOffline && !outbox.size) {
            outboxOffline = false;
            const m = (infoMsg = '✓ Alle Eingaben wurden übertragen');
            setTimeout(() => {
              if (infoMsg === m) {
                infoMsg = '';
                render();
              }
            }, 6000);
          }
        } catch (e) {
          if (e && e.status === 409) {
            // gleichzeitig woanders geändert -> Server gewinnt
            const conflict = e.data || {};
            outbox.delete(orderNo);
            saveOutbox();
            if (conflict.doc) {
              results.set(orderNo, conflict.doc);
              resultSeq.set(orderNo, conflict.sq | 0);
            } else {
              results.delete(orderNo);
              resultSeq.delete(orderNo);
            }
            toast(
              `⚠ Auftrag ${orderNo} wurde gleichzeitig auf einem anderen Gerät geändert. Es gilt der Stand vom Server – deine letzte Eingabe wurde nicht übernommen.`
            );
          } else if (e && e.status === 423) {
            // inzwischen vom Disponenten abgehakt -> die Eingabe wird nicht übernommen, der Server-Stand und der Haken gelten
            const locked = e.data || {};
            outbox.delete(orderNo);
            saveOutbox();
            if (locked.mark) marks.set(orderNo, locked.mark);
            if (locked.doc) {
              results.set(orderNo, locked.doc);
              resultSeq.set(orderNo, locked.sq | 0);
            } else {
              results.delete(orderNo);
              resultSeq.delete(orderNo);
            }
            dropEditsOfLockedOrder();
            clearTimeout(cacheSaveTimer);
            cacheSaveTimer = setTimeout(saveCache, 1500);
            toast(`🔒 Auftrag ${orderNo}: ${LOCKED_TEXT} Deine letzte Eingabe wurde nicht übernommen.`);
            playErrorSound();
          } else if (e && e.status === 401 && e.data && e.data.login) {
            // Anmeldung abgelaufen: die Eingabe bleibt gesichert und geht nach der erneuten Anmeldung hinaus
          } else if (e && e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429) {
            // dauerhafter Fehler: Eingabe verwerfen und Fehler anzeigen
            outbox.delete(orderNo);
            saveOutbox();
            errorMsg = errorMessageOf(e);
          } else {
            // vorübergehend (kein Netz, Serverfehler): behalten, später erneut senden
            outboxOffline = true;
            if (e && e.net) serverReachable = false;
            scheduleRetry();
          }
        }
        state.busy = false;
        render();
      }

      // Kurzmeldung unten am Bildschirm – sichtbar egal wie weit gescrollt ist; geht nach einigen Sekunden oder per Tipp weg
      const toastEl = el('div', { class: 'toast', role: 'status', 'aria-live': 'polite' });
      document.body.append(toastEl);
      let toastTimer = null,
        toastTap = null; // Aktion beim Antippen (z. B. zum Chat wechseln), sonst schließt der Tipp nur die Meldung
      toastEl.addEventListener('click', () => {
        toastEl.classList.remove('on');
        const tap = toastTap;
        toastTap = null;
        if (tap) tap();
      });
      // zeigt text 10 Sekunden lang als Kurzmeldung; onTap (optional) läuft, wenn man sie antippt
      function toast(text, onTap) {
        toastTap = onTap || null;
        toastEl.textContent = text;
        toastEl.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('on'), 10000);
      }
      // ---- Fehlerton (nur Monteur) ----
      // Ein kurzer, tiefer Doppelton, wenn etwas fehlt oder schiefgeht (fehlende Zeitangabe, leerer Nicht-OK-Text, Auftrag
      // nicht vollständig ausgefüllt, Fehlermeldung oben). Der Klang wird im Browser erzeugt (Web Audio, keine Datei, geht auch
