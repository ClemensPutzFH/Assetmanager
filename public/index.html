  w.busy=true;

    let last=null,sq=0;

async function api(method,url,body,timeout=20000){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),timeout);
  let r;
  try{
    r=await fetch(url,{method,headers:{'Content-Type':'application/json',...(tok?{Authorization:'Bearer '+tok}:{}),...(upTok?{'X-Upload-Token':upTok}:{})},body:body===undefined?undefined:JSON.stringify(body),signal:ctl.signal});
  }catch(e){clearTimeout(t);const n=new Error('Keine Verbindung zum Server');n.net=true;throw n}
  clearTimeout(t);
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok){
    const e=new Error(j.error||('Fehler '+r.status));e.status=r.status;
    if(r.status===401&&j.up){upTok='';render()}                 // Upload-PIN fehlt/abgelaufen -> nur Upload-PIN neu abfragen
    else if(r.status===401&&tok){tok='';unlocked=false;render()}
    throw e;
  }
  return j;
}

      el('button',{class:'pri',disabled:busy?'disabled':null,onclick:()=>{if(fp.files.length)uploadPl([...fp.files]);else{err='Bitte erst eine Datei wählen.';render()}}},busy?'Speichere …':'Hochladen & speichern'))
      :el('p',{class:'mu'},'Kein Schreibzugriff.'),
    pmeta&&el('p',{class:'mu'},`Letzter Upload: ${new Date(pmeta.at).toLocaleString('de-AT')} · ${pmeta.files} · ${pmeta.count} Prüfobjekte (${pmeta.orders} Aufträge)`),
    pmeta&&canWrite&&!busy&&(armP?el('button',{class:'er',onclick:wipePl},'Wirklich ALLE Prüfobjekte löschen?'):el('button',{class:'er',onclick:()=>{armP=true;render()}},'Alle Prüfobjekte löschen'))));
    if(chunks.size&&canWrite)app.append(arm?el('button',{class:'er',onclick:wipe},'Wirklich ALLE Aufträge löschen?'):el('button',{class:'er',onclick:()=>{arm=true;render()}},'Alle Aufträge löschen'));
    return;
  }
  // Übersicht: Status je Auftrag, Filter
  if(ready&&!chunks.size)app.append(el('p',{class:'mu'},'Noch keine Aufträge – im Tab „Upload" hochladen.'));
  const ts=teams(),R=rRange();
  const fsOk=r=>!fs||(fs==='nok'?stat(r).nx>0:stat(r).st===fs);
  const pre=rowsAll().filter(r=>(!ft||r.team===ft)&&(!R||inR(r,R))&&matchQ(r));
  const pv=pre.filter(fsOk),nOn=pv.filter(r=>mk(r.auftrag)===1).length,nAny=pv.filter(r=>mk(r.auftrag)>0).length;   // Abgehakte in der aktuellen Liste
  const base=pre.filter(r=>dha==='hide'?mk(r.auftrag)!==1:dha==='only'?mk(r.auftrag)>0:true),cnt={done:0,teil:0,offen:0,nok:0};
  base.forEach(r=>{const x=stat(r);cnt[x.st]++;if(x.nx>0)cnt.nok++});
  const view=()=>base.filter(fsOk);
  const tn=new Map();rowsAll().forEach(r=>{if(stat(r).nx>0)tn.set(r.team,(tn.get(r.team)||0)+1)});
  const sel=el('select',{onchange:e=>{ft=e.target.value;armM=false;render()}},el('option',{value:''},'Alle Teams'),ts.map(([t,n])=>el('option',{value:t,...(t===ft?{selected:'selected'}:{})},`${t} (${n})`+(tn.get(t)?` · ⚠ ${tn.get(t)} Nicht OK`:''))));
  const opt=(v,l,c)=>el('option',{value:v,...(v===c?{selected:'selected'}:{})},l);
  app.append(el('div',{class:'flt'},
    el('span',{class:'mu'},'Team'),sel,
    ft&&el('button',{class:'rs',onclick:()=>{ft='';armM=false;render()}},'✕ Teamfilter aufheben'),
    el('span',{class:'mu'},'Rückgemeldet'),el('select',{onchange:e=>{rf=e.target.value;armM=false;render()}},opt('','Kein Filter',rf),opt('h','Heute',rf),opt('g','Gestern',rf),opt('7','Letzte 7 Tage',rf),opt('m','Dieser Monat',rf),opt('z','Zeitraum …',rf)),
    rf==='z'&&el('div',{class:'rg'},
      el('input',{class:'dt',type:'date','data-nr':'1',max:today(),value:rv,onchange:e=>{rv=e.target.value;armM=false;render()}}),el('span',{},'–'),
      el('input',{class:'dt',type:'date','data-nr':'1',max:today(),value:rb,onchange:e=>{rb=e.target.value;armM=false;render()}})),
    rf&&el('button',{class:'rs',onclick:()=>{rf='';rv='';rb='';armM=false;render()}},'✕ Zeitfilter aufheben')));
  if(rf==='z'&&rv&&rb&&rv>rb)app.append(el('p',{class:'mu er'},'„Von“ liegt nach „Bis“ – es kann nichts gefunden werden.'));
  app.append(chips([['','Alle',base.length],['nok','Nicht OK',cnt.nok],['done','Erledigt',cnt.done],['teil','In Arbeit',cnt.teil],['offen','Offen',cnt.offen]],fs,k=>{fs=k}));
  const flt=!!(ft||fs||dha||rf||q.trim());
  const acts=el('div',{class:'acts'});app.append(acts);
  acts.append(el('button',{class:'dl',disabled:busy||!view().length?'disabled':null,onclick:()=>exportXlsx(view())},`⬇ Excel exportieren (${view().length} Aufträge${flt?', gefiltert':''})`));
  const toM=view().filter(r=>mk(r.auftrag)!==1).map(r=>r.auftrag);
  if(toM.length)acts.append(armM?el('button',{class:'dl',onclick:()=>{armM=false;setMark(toM,true)}},`Wirklich ${toM.length} Aufträge abhaken?`):el('button',{class:'dl',onclick:()=>{armM=true;render()}},`☑ Alle angezeigten abhaken (${toM.length})`));
  // Abgehakte direkt bei der Liste ein-/ausblenden (Wahl bleibt im Gerät gespeichert)
  const setDha=k=>{dha=k;armM=false;try{localStorage.setItem('dha',dha)}catch(x){}render()};
  app.append(el('div',{class:'srow'},search(v=>{q=v;armM=false;render()}),
    el('div',{class:'chips ab'},el('span',{class:'mu'},'Abgehakte:'),
      [['','Anzeigen'],['hide',`Ausblenden (${nOn})`],['only',`Nur abgehakte (${nAny})`]].map(([k,l])=>el('button',{class:'chip'+(dha===k?' on':''),onclick:()=>setDha(k)},l)))),
    list(view(),true));
  // Hinweis nur wenn zutreffend – app.append() würde false/null sonst als Text anzeigen
  if(dha==='hide'&&nOn>0)app.lastChild.before(el('p',{class:'mu'},nOn===1?'1 abgehakter Auftrag ist ausgeblendet.':`${nOn} abgehakte Aufträge sind ausgeblendet.`));
}

loadOb();
addEventListener('online',()=>{net=true;if(pend.size)flushAll();poll()});
addEventListener('offline',()=>{net=false;render()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(pend.size)flushAll();poll()}});
setInterval(()=>{if(!document.hidden)poll()},30000);   // Sicherheitsnetz; normalerweise kommt der Hinweis live vom Server
render();
poll().then(()=>{flushAll();prefetch();pushSync(false)});
events();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
  navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.t==='msg')poll()});   // Push angekommen / bestätigt -> sofort abgleichen
}
</script></body></html>
