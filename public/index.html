        };
        const yesterday = () => {
          const g = new Date();
          g.setDate(g.getDate() - 1);
          return g.toLocaleDateString('sv-SE');
        };
        const timerStart = timerStartOf(order.auftrag);
        if (dau)
          timePanel.append(
            el('b', { class: 'zne', 'data-k': 'zn' }, entry ? `Eintrag bearbeiten (${formatIsoDate(performedDate(entry))})` : 'Neuer Eintrag')
          );
        if (timerStart || !hasTime)
          timePanel.append(
            el(
              'div',
              { class: 'tmr', 'data-k': 'zs' },
              timerStart
                ? [
                    el(
                      'p',
                      { class: 'mu' },
                      `⏱ Läuft seit ${new Date(timerStart).toTimeString().slice(0, 5)} Uhr · `,
                      el('b', { 'data-tmr': timerStart }, formatMinutes(elapsedMinutes(timerStart)))
                    ),
                    el(
                      'div',
                      { class: 'ob' },
                      el(
                        'button',
                        { class: 'sv', disabled: items ? null : 'disabled', onclick: () => stopTimer(order, items) },
                        '■ Ende'
                      ),
                      el('button', { class: 'er', onclick: () => cancelTimer(order) }, 'Verwerfen')
                    )
                  ]
                : [
                    el(
                      'p',
                      { class: 'mu' },
                      'Optional: „Start“ drücken, wenn die Arbeit beginnt, und „Ende“, wenn sie fertig ist – die Zeit wird dann automatisch gespeichert.'
                    ),
                    el('div', { class: 'ob' }, el('button', { class: 'sv', onclick: () => startTimer(order) }, '▶ Start'))
                  ]
            )
          );
        // Kompakt: Start/Ende und die Kollegen-Auswahl sind immer da (bei neuer Zeit), Datum/Beginn/Dauer erst nach „Zeit von Hand
        // eintragen“ bzw. „Zeit ändern“. Bei einem Fehler oder angefangener Eingabe bleibt das Formular offen.
        const formOpen = timeFormOpen || !!timeError;
        if (!hasTime)
          timePanel.append(el('div', { class: 'mu' }, 'Mit wem gearbeitet? (optional)'), withPicker(order));
        if (!formOpen) {
          timePanel.append(
            el(
              'div',
              { class: 'ob', 'data-k': 'zo' },
              el(
                'button',
                {
                  onclick: () => {
                    timeFormOpen = true;
                    render();
                  }
                },
                dau
                  ? hasTime
                    ? '✎ Eintrag ändern'
                    : '✎ Eintrag von Hand eintragen'
                  : hasTime
                    ? '✎ Zeit ändern'
                    : '✎ Zeit von Hand eintragen'
              )
            )
          );
          return timePanel;
        }
        timePanel.append(
          el('div', { class: 'mu' }, 'Durchgeführt am'),
          el(
            'div',
            { class: 'zt', 'data-k': 'zd' },
            el('input', {
              class: 'dt',
              type: 'date',
              max: today(),
              'data-nr': '1',
              value: timeDate,
              oninput: e => {
                timeDate = e.target.value;
              },
              onchange: e => {
                timeDate = e.target.value;
              }
            }),
            el(
              'button',
              {
                onclick: () => {
                  timeDate = today();
                  timeError = '';
                  render();
                }
              },
              'Heute'
            ),
            el(
              'button',
              {
                onclick: () => {
                  timeDate = yesterday();
                  timeError = '';
                  render();
                }
              },
              'Gestern'
            )
          ),
          el('div', { class: 'mu' }, 'Beginn (Uhrzeit, auf Viertelstunden gerundet)'),
          el(
            'div',
            { class: 'zt', 'data-k': 'zv' },
            el('input', {
              class: 'dt',
              type: 'time',
              step: '900',
              'data-nr': '1',
              value: timeStart,
              oninput: e => {
                timeStart = e.target.value;
              },
              // beim Verlassen des Feldes auf die nächste Viertelstunde runden (auf oder ab)
              onchange: e => {
                timeStart = roundQuarterHHMM(e.target.value);
                e.target.value = timeStart;
              }
            }),
            el(
              'button',
              {
                onclick: () => {
                  timeStart = roundQuarterClock(Date.now()).time;
                  timeError = '';
                  render();

              'Jetzt'
            ),
            timeStart &&
              el(
                'button',
                {
                  onclick: () => {
                    timeStart = '';
                    render();
                  }
                },
                '✕'
              )
          ),
          el('div', { class: 'mu' }, 'Dauer (in Viertelstunden)'),
          el(
            'div',
            { class: 'qk', 'data-k': 'zq' },
            [15, 30, 60, 90, 120, 180].map(m =>
              el(
                'button',
                {
                  onclick: () => {
                    timeHours = String(Math.floor(m / 60));
                    timeMinutes = String(m % 60);
                    timeError = '';
                    render();
                  }
                },
                formatMinutes(m)
              )
            )
          ),
          el(
            'div',
            { class: 'zt', 'data-k': 'zh' },
            numberInput('h', timeHours, v => {
              timeHours = v;
            }),
            el('span', {}, 'Std'),
            el(
              'select',
              {
                class: 'tm',
                'aria-label': 'Minuten (Viertelstunden)',
                onchange: e => {
                  timeMinutes = e.target.value;
                }
              },
              ['0', '15', '30', '45'].map(v =>
                el(
                  'option',
                  { value: v, ...((timeMinutes || '0') === v ? { selected: 'selected' } : {}) },
                  v.padStart(2, '0')
                )
              )
            ),
            el('span', {}, 'Min')
          ),
          ...(hasTime ? [el('div', { class: 'mu' }, 'Mit wem gearbeitet? (optional)'), withPicker(order)] : []),
          timeError && el('p', { class: 'mu er' }, timeError),
          el(
            'div',
            { class: 'ob', 'data-k': 'zb' },
            el(
              'button',
              {
                class: 'sv',
                disabled: items ? null : 'disabled',
                onclick: () => validateAndStoreTime(order, items, key)
              },
              dau ? (hasTime ? 'Eintrag ändern' : 'Eintrag speichern') : hasTime ? 'Zeit ändern' : 'Zeit speichern'
            ),
            hasTime && el('button', { class: 'er', onclick: () => deleteTime(order, items, key) }, dau ? 'Eintrag löschen' : 'Löschen'),
            el(
              'button',
              {
                onclick: () => {
                  if (dau && entryKey) return editEntry(order, ''); // Bearbeiten abbrechen: zurück zu einem neuen Eintrag
                  timeFormOpen = false;
                  timeError = '';
                  render();
                }
              },
              dau && entryKey ? 'Abbrechen' : 'Zuklappen'
            )
          )
        );
        return timePanel;
      }
      // ---- Prüfobjekte bewerten (Monteur) ----
      // ersetzt ein Zeichen des Status-Strings (Index i -> c)
      const replaceCharAt = (s, i, c) => s.slice(0, i) + c + s.slice(i + 1);
      // „OK“ eines Prüfobjekts umschalten (OK <-> offen); ein vorhandener Nicht-OK-Text geht dabei verloren
      function toggleOk(order, items, index) {
        armAllOk = false;
        editIndex = null;
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        saveChecklistState(
          order,
          items,
          replaceCharAt(state, index, state[index] === 'o' ? '-' : 'o'),
          nokTexts
        );
      }
      // Öffnet das Eingabefeld für den „Nicht OK“-Text des Prüfobjekts index (text = bisheriger Text)
      function openNokEditor(index, text) {
        editIndex = index;
        editText = text || '';
        editTextMissing = false;
        render();
        const field = app.querySelector('[data-keep="e"]');
        if (field) field.focus();
      }
      // „Nicht OK“ speichern – der Text ist Pflicht
      function saveNokText(order, items, index) {
        const text = editText.trim();
        if (!text) {
          editTextMissing = true;
          playErrorSound();
          render();
          return;
        }
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        nokTexts[index] = text;
        editIndex = null;
        armAllOk = false;
        saveChecklistState(order, items, replaceCharAt(state, index, 'x'), nokTexts);
      }
      // Setzt ein Prüfobjekt zurück auf „offen“
      function resetItem(order, items, index) {
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        editIndex = null;
        saveChecklistState(order, items, replaceCharAt(state, index, '-'), nokTexts);
      }
      // ---- Outbox: ungesendete Ergebnisse ----
      // Ungesendete Ergebnisse liegen in `outbox` (und in localStorage) und werden automatisch erneut gesendet.
      // outboxOffline: es gab vorübergehende Sendefehler; retryTimer: nächster Versuch; prefetching: Vorab-Laden läuft
      let outboxOffline = false,
        retryTimer = null,
        prefetching = false;
      // Outbox im Gerät sichern (übersteht Neuladen und App-Neustart)
      const saveOutbox = () => {
        try {
          localStorage.setItem('outbox', JSON.stringify([...outbox]));
        } catch (e) {}
      };
      // Outbox beim Start aus dem Gerät laden
      const loadOutbox = () => {
        try {
          for (const [a, d] of JSON.parse(localStorage.getItem('outbox') || '[]')) outbox.set(a, d);
        } catch (e) {}
      };
      // nächster Sendeversuch in 15 Sekunden
      const scheduleRetry = () => {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(sendAllPending, 15000);
      };
      // alle noch ungesendeten Aufträge senden
      const sendAllPending = () => {
        for (const a of [...outbox.keys()]) sendPending(a);
      };
      /**
       * Sendet das Ergebnis eines Auftrags (PUT /api/ergebnis/<Auftrag>). Pro Auftrag läuft nur eine Sendung gleichzeitig;
       * kommt währenddessen eine neue Eingabe, wird sie danach nachgesendet (schnelle Folgeeingaben).
       * Fehlerbehandlung:
       *   409  inzwischen auf einem anderen Gerät geändert -> der Stand vom Server gilt, Hinweis per toast()
       *   4xx  dauerhafter Fehler -> Eingabe verwerfen, Fehler anzeigen
       *   sonst (kein Netz, Serverfehler) -> in der Outbox behalten und später erneut senden
       */
      async function sendPending(orderNo) {
        const state = sendState.get(orderNo) || sendState.set(orderNo, {}).get(orderNo);
        if (state.busy) {
          state.dirty = true;
          return;
        }
        state.busy = true;
        try {
          let lastDoc = null,
            seq = 0,
            doc = outbox.get(orderNo);
          while (doc) {
            // nur erneut senden, wenn wirklich eine neue Eingabe dazukam
            lastDoc = doc;
            state.dirty = false;
            seq = (await api('PUT', '/api/ergebnis/' + encodeURIComponent(orderNo), doc)).sq;
            const newer = outbox.get(orderNo);
            if (!newer || newer === doc) break;
            newer._b = seq;
            saveOutbox();
            doc = newer; // eigene Folgeeingabe beruht jetzt auf diesem Stand
          }
          if (lastDoc) {
            results.set(orderNo, withoutBase(lastDoc));
            resultSeq.set(orderNo, seq);
          }
          outbox.delete(orderNo);
          saveOutbox();
          serverReachable = true;
          if (outboxOffline && !outbox.size) {
            outboxOffline = false;
            const m = (infoMsg = '✓ Alle Eingaben wurden übertragen');
            setTimeout(() => {
              if (infoMsg === m) {
                infoMsg = '';
                render();
              }
            }, 6000);
          }
        } catch (e) {
          if (e && e.status === 409) {
            // gleichzeitig woanders geändert -> Server gewinnt
            const conflict = e.data || {};
            outbox.delete(orderNo);
            saveOutbox();
            if (conflict.doc) {
              results.set(orderNo, conflict.doc);
              resultSeq.set(orderNo, conflict.sq | 0);
            } else {
              results.delete(orderNo);
              resultSeq.delete(orderNo);
            }
            toast(
              `⚠ Auftrag ${orderNo} wurde gleichzeitig auf einem anderen Gerät geändert. Es gilt der Stand vom Server – deine letzte Eingabe wurde nicht übernommen.`
            );
          } else if (e && e.status === 423) {
            // inzwischen vom Disponenten abgehakt -> die Eingabe wird nicht übernommen, der Server-Stand und der Haken gelten
            const locked = e.data || {};
            outbox.delete(orderNo);
            saveOutbox();
            if (locked.mark) marks.set(orderNo, locked.mark);
            if (locked.doc) {
              results.set(orderNo, locked.doc);
              resultSeq.set(orderNo, locked.sq | 0);
            } else {
              results.delete(orderNo);
              resultSeq.delete(orderNo);
            }
            dropEditsOfLockedOrder();
            clearTimeout(cacheSaveTimer);
            cacheSaveTimer = setTimeout(saveCache, 1500);
            toast(`🔒 Auftrag ${orderNo}: ${LOCKED_TEXT} Deine letzte Eingabe wurde nicht übernommen.`);
            playErrorSound();
          } else if (e && e.status === 401 && e.data && e.data.login) {
            // Anmeldung abgelaufen: die Eingabe bleibt gesichert und geht nach der erneuten Anmeldung hinaus
          } else if (e && e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429) {
            // dauerhafter Fehler: Eingabe verwerfen und Fehler anzeigen
            outbox.delete(orderNo);
            saveOutbox();
            errorMsg = errorMessageOf(e);
          } else {
            // vorübergehend (kein Netz, Serverfehler): behalten, später erneut senden
            outboxOffline = true;
            if (e && e.net) serverReachable = false;
            scheduleRetry();
          }
        }
        state.busy = false;
        render();
      }

      // Kurzmeldung unten am Bildschirm – sichtbar egal wie weit gescrollt ist; geht nach einigen Sekunden oder per Tipp weg
      const toastEl = el('div', { class: 'toast', role: 'status', 'aria-live': 'polite' });
      document.body.append(toastEl);
      let toastTimer = null;
      toastEl.addEventListener('click', () => toastEl.classList.remove('on'));
      // zeigt text 10 Sekunden lang als Kurzmeldung
      function toast(text) {
        toastEl.textContent = text;
        toastEl.classList.add('on');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove('on'), 10000);
      }
      // ---- Fehlerton (nur Monteur) ----

              hk = hk || r.hasStatus;
              for (const o of r.rows) m.set(o.auftrag, o);
            }
            return { m, hk };
          };
          const ordersExcel = await read(cmpOrderFiles),
            exportExcel = await read(cmpExportFiles);
          if (ordersExcel.hk)
            throw new Error(
              'Die Datei bei „Aufträge-Excel“ hat eine Spalte „Abgehakt am“ und sieht wie der Export aus – bitte die beiden Dateien tauschen.'
            );
          if (!exportExcel.hk)
            throw new Error(
              'Die Datei bei „Export“ hat keine Spalte „Abgehakt am“ – bitte den aktuellen Excel-Export aus der Übersicht verwenden.'
            );
          if (!ordersExcel.m.size)
            throw new Error('In der Aufträge-Excel wurden keine Aufträge gefunden (Spalte „Auftrag“ nötig).');
          if (!exportExcel.m.size) throw new Error('Im Export wurden keine Aufträge gefunden.');
          const rows = [];
          for (const o of exportExcel.m.values()) {
            const x = ordersExcel.m.get(o.auftrag),
              hak = !!o.hak;
            rows.push({
              k: !hak && !x ? 'fehlt' : hak && x ? 'noch' : 'ok',
              a: o.auftrag,
              team: o.team || (x && x.team) || '',
              kurz: o.kurz || (x && x.kurz) || '',
              hak: o.hak,
              ex: !!x
            });
          }
          rows.sort((p, q) => naturalCompare(p.a, q.a));
          const counts = { fehlt: 0, noch: 0, ok: 0 };
          rows.forEach(r => counts[r.k]++);
          cmpResult = {
            rows,
            cnt: counts,
            nA: ordersExcel.m.size,
            nB: exportExcel.m.size,
            nH: rows.filter(r => r.hak).length
          };
          cmpFilter = counts.fehlt + counts.noch ? '' : 'ok';
        } catch (e) {
          errorMsg = errorMessageOf(e);
        }
        cmpBusy = false;
        render();
      }
      // Seite „Vergleich“: Dateiauswahl, Ergebnis-Zusammenfassung, Filter-Chips und Tabelle (höchstens 500 Zeilen)
      function drawComparison() {
        const pick = (lbl, hint, get, set, multi) => {
          const inp = el('input', {
            type: 'file',
            accept: '.xlsx,.xls',
            multiple: multi ? 'multiple' : null,
            onchange: e => {
              set([...e.target.files]);
              cmpResult = null;
              errorMsg = '';
              render();
            }
          });
          const fl = get();
          return el(
            'div',
            { class: 'card' },
            el('b', {}, lbl),
            el('p', { class: 'mu' }, hint),
            el('label', { class: 'fpick' }, fl.length ? 'Andere Datei wählen' : 'Datei wählen', inp),
            fl.length > 0 && el('p', { class: 'mu fnm' }, '✓ ' + fl.map(f => f.name).join(', '))
          );
        };
        app.append(
          el(
            'div',
            { class: 'ugrid' },
            pick(
              '1. Aufträge-Excel',
              'Die Datei, die sonst als Aufträge hochgeladen wird (Spalte „Auftrag“).',
              () => cmpOrderFiles,
              v => {
                cmpOrderFiles = v;
              },
              true
            ),
            pick(
              '2. Export aus dieser App',
              'Der Excel-Export aus der Übersicht („⬇ Excel exportieren“) mit der Spalte „Abgehakt am“.',
              () => cmpExportFiles,
              v => {
                cmpExportFiles = v;
              }
            )
          )
        );
        app.append(
          el(
            'button',
            {
              class: 'pri vgbtn',
              disabled: cmpBusy || !cmpOrderFiles.length || !cmpExportFiles.length ? 'disabled' : null,
              onclick: runComparison
            },
            cmpBusy ? 'Vergleiche …' : 'Vergleichen'
          )
        );
        // Vergleich läuft: Platzhalter, bis das Ergebnis da ist
        if (cmpBusy) {
          app.append(skeletonTable());
          return;
        }
        if (!cmpResult) {
          app.append(
            el(
              'p',
              { class: 'mu' },
              'Geprüft wird nur: Nicht abgehakte Aufträge müssen in der Aufträge-Excel stehen, abgehakte Aufträge dürfen dort nicht mehr stehen. Alles andere (Status, Prüfergebnis, Aufträge nur in der Excel) wird ignoriert. Die Dateien werden nur hier im Browser gelesen und nicht hochgeladen.'
            )
          );
          return;
        }
        const result = cmpResult,
          counts = result.cnt,
          discrepancies = counts.fehlt + counts.noch;
        app.append(
          el(
            'div',
            { class: 'card vgsum ' + (discrepancies ? 'bad' : 'good') },
            el(
              'b',
              {},
              discrepancies
                ? `⚠ ${discrepancies} ${discrepancies === 1 ? 'Abweichung' : 'Abweichungen'} gefunden`
                : '✓ Keine Abweichungen'
            ),
            el(
              'p',
              { class: 'mu' },
              `Export: ${result.nB} Aufträge (${result.nH} abgehakt, ${result.nB - result.nH} nicht abgehakt) · Aufträge-Excel: ${result.nA} Aufträge`
            )
          )
        );
        app.append(
          filterChips(
            [
              ['', 'Abweichungen', discrepancies],
              ['fehlt', 'Nicht abgehakt, fehlt in Excel', counts.fehlt],
              ['noch', 'Abgehakt, noch in Excel', counts.noch],
              ['ok', 'Stimmt überein', counts.ok],
              ['all', 'Alle', result.rows.length]
            ],
            cmpFilter,
            k => {
              cmpFilter = k;
            }
          )
        );
        const filtered = result.rows.filter(
          r => cmpFilter === 'all' || (cmpFilter === '' ? r.k !== 'ok' : r.k === cmpFilter)
        );
        if (!filtered.length) {
          app.append(el('p', { class: 'mu' }, 'Keine Einträge.'));
          return;
        }
        const tbody = el(
          'tbody',
          {},
          filtered
            .slice(0, 500)
            .map(r =>
              el(
                'tr',
                { class: 'vg-' + r.k },
                el('td', {}, r.a),
                el('td', { class: 'vk' }, CMP_LABELS[r.k]),
                el('td', {}, r.team || '–'),
                el('td', { class: 'wr' }, r.kurz || '–'),
                el('td', {}, r.hak || 'nicht abgehakt'),
                el('td', {}, r.ex ? 'ja' : 'nein')
              )
            )
        );
        app.append(
          el('p', { class: 'mu' }, filtered.length === 1 ? '1 Eintrag' : `${filtered.length} Einträge`),
          el(
            'div',
            { class: 'gtw card' },
            el(
              'table',
              { class: 'gt vgt' },
              el(
                'thead',
                {},
                el(
                  'tr',
                  {},
                  ['Auftrag', 'Bewertung', 'Team', 'Kurztext', 'Abgehakt am', 'In Excel'].map(h =>
                    el('th', {}, h)
                  )
                )
              ),
              tbody
            )
          )
        );
        if (filtered.length > 500)
          app.append(el('p', { class: 'mu' }, 'Nur die ersten 500 angezeigt – Filter nutzen.'));
      }
      // ---- Fortschritt aller Teams (Disponent): Gesamt + je Team, live aus denselben Daten wie die Übersicht ----
      // teamSort: 'n' nach Name | 'p' nach Fortschritt (im Gerät gespeichert) · teamTableView: Tabelle statt Diagramm
      let teamSort = 'n',
        teamTableView = false;
      try {
        teamSort = localStorage.getItem('gsort') === 'p' ? 'p' : 'n';
      } catch (e) {}
      const percent = (a, n) => (!n ? 0 : a === n ? 100 : Math.min(99, Math.round((a / n) * 100))); // 100 % nur wenn wirklich alles erledigt
      const weeklyQuota = (rest, at) => (rest && at ? Math.ceil(rest / (at / 5)) : 0); // nötige Prüfungen pro Arbeitswoche bis zur Frist
      // Zahl mit deutscher Tausendertrennung
      const formatNumber = v => Number(v).toLocaleString('de-AT');
      // Kennzahlen je Team: { team, n (Aufträge), done, teil (in Arbeit), nok (mit Nicht OK) }
      function teamStats() {
        const byTeam = new Map();
        // Fortschritt und Wochenpensum (Frist 31.12.) gelten für die Wartungen
        for (const r of ordersOfKind(allOrders(), 'war')) {
          let stats = byTeam.get(r.team);
          if (!stats) byTeam.set(r.team, (stats = { team: r.team, n: 0, done: 0, teil: 0, nok: 0 }));
          const status = orderStatus(r);
          stats.n++;
          if (status.st === 'done') stats.done++;
          else if (status.st === 'teil') stats.teil++;
          if (status.nx > 0) stats.nok++;
        }
        return [...byTeam.values()];
      }
      // gestapelter Balken: erledigt | in Arbeit | offen (Breite proportional zur Anzahl)
      const stackedBar = (stats, cls) =>
        el(
          'div',
          { class: 'gbar' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true' },
          [
            [stats.done, 'g2'],
            [stats.teil, 'g1'],
            [stats.n - stats.done - stats.teil, 'g0']
          ]
            .filter(([v]) => v > 0)
            .map(([v, c]) => el('span', { class: c, style: 'flex-grow:' + v }))
        );
      // Reihen der Grafik: CSS-Klasse -> Beschriftung
      const STATUS_SERIES = [
        ['g2', 'Erledigt'],
        ['g1', 'In Arbeit'],
        ['g0', 'Offen']
      ];
      // Kennzahl-Kachel (Beschriftung, Wert, Farbmuster, Warnfarbe)
      const kpiTile = (label, value, swatch, warn) =>
        el(
          'div',
          { class: 'kpi' },
          el('div', { class: 'mu' }, swatch && el('i', { class: 'sw ' + swatch }), label),
          el('div', { class: 'kv' + (warn ? ' er' : '') }, (warn ? '✗ ' : '') + formatNumber(value))
        );
      // Karte „Gesamt · alle Teams“: Prozent, Balken, Kennzahlen und nötiges Wochenpensum
      function totalCard(totals, workingDays, deadlineText) {
        const openCount = totals.n - totals.done - totals.teil,
          remaining = totals.n - totals.done,
          perWeek = weeklyQuota(remaining, workingDays);
        return el(
          'div',
          { class: 'card', 'data-k': 'tc' },
          el('b', {}, 'Gesamt · alle Teams'),
          el(
            'div',
            { class: 'ghero' },
            el('span', { class: 'gp' }, percent(totals.done, totals.n) + ' %'),
            el('span', { class: 'mu' }, 'erledigt')
          ),
          stackedBar(totals, 'big'),
          el(
            'div',
            { class: 'gkpi' },
            kpiTile('Aufträge', totals.n),
            kpiTile('Erledigt', totals.done, 'g2'),
            kpiTile('In Arbeit', totals.teil, 'g1'),
            kpiTile('Offen', openCount, 'g0'),
            kpiTile('Nicht OK', totals.nok, null, totals.nok > 0)
          ),
          el(
            'p',
            { class: 'mu' },
            !remaining
              ? '✓ Alle Aufträge erledigt'
              : workingDays
                ? `Bis ${deadlineText} sind noch mindestens ${formatNumber(perWeek)} Prüfungen pro Woche nötig (${workingDays} Arbeitstage).`
                : `Die Frist ${deadlineText} ist vorbei – ${formatNumber(remaining)} Aufträge sind noch nicht erledigt.`
          )
        );
      }
      // Klick auf ein Team -> Übersicht mit Teamfilter
      const openTeamOverview = t => {
        teamFilter = t;
        statusFilter = '';
        reportedFilter = '';
        reportedFrom = '';
        reportedTo = '';
        searchText = '';
        armMarkAll = false;
        dispoTab = 'ue';
        render();
        scrollTo(0, 0);
      };
      /**
       * Karte „Fortschritt je Team“ als Diagramm (ein Balken je Team, Klick öffnet die Aufträge) oder Tabelle
       * (mit Summenzeile). Je Team ein 📣-Knopf für Nachrichten (siehe openSendDialog).
       */
      function teamProgressCard(teamRows, totals, workingDays) {
        const sorted = [...teamRows].sort(
          teamSort === 'p'
            ? (a, b) => a.done / a.n - b.done / b.n || naturalCompare(a.team, b.team)
            : (a, b) => naturalCompare(a.team, b.team)
        );
        const panel = el(
          'div',
          { class: 'card', 'data-k': 'tp' },
          el(
            'div',
            { class: 'ghead' },
            el('b', {}, `Fortschritt je Team (${teamRows.length})`),
            el(
              'div',
              { class: 'chips' },
              [
                [false, 'Diagramm'],
                [true, 'Tabelle']
              ].map(([k, l]) =>
                el(
                  'button',
                  {
                    class: 'chip' + (teamTableView === k ? ' on' : ''),
                    onclick: () => {
                      teamTableView = k;
                      render();
                    }
                  },
                  l
                )
              )
            )
          ),
          el(
            'div',
            { class: 'gsub' },
            el(
              'div',
              { class: 'glg' },
              STATUS_SERIES.map(([k, l]) => el('span', {}, el('i', { class: 'sw ' + k }), l))
            ),
            el(
              'div',
              { class: 'chips' },
              el('span', { class: 'mu' }, 'Sortieren:'),
              [
                ['n', 'Name'],
                ['p', 'Fortschritt']
              ].map(([k, l]) =>
                el(
                  'button',
                  {
                    class: 'chip' + (teamSort === k ? ' on' : ''),
                    onclick: () => {
                      teamSort = k;
                      try {
                        localStorage.setItem('gsort', k);
                      } catch (e) {}
                      render();
                    }
                  },
                  l
                )
              )
            )
          )
        );
        if (teamTableView) {
          const tableRow = (t, name) => {
            const op = t.n - t.done - t.teil;
            return el(
              'tr',
              name ? {} : { onclick: () => openTeamOverview(t.team) },
              el('td', {}, name || t.team),
              ...[t.n, t.done, t.teil, op].map(v => el('td', { class: 'n' }, formatNumber(v))),
              el('td', { class: 'n' + (t.nok ? ' er' : '') }, t.nok ? '✗ ' + formatNumber(t.nok) : '0'),
              el('td', { class: 'n' }, percent(t.done, t.n) + ' %'),
              el(
                'td',
                { class: 'n' },
                t.n > t.done
                  ? workingDays
                    ? '≥ ' + formatNumber(weeklyQuota(t.n - t.done, workingDays))
                    : 'Frist vorbei'
                  : '✓'
              ),
              el(
                'td',
                {},
                name
                  ? ''
                  : [
                      messageButton(t),
                      activeMessage(t.team) &&
                        el('span', { class: 'gms' }, messageStatus(activeMessage(t.team), t.team))
                    ]
              )
            );
          };
          panel.append(
            el(
              'div',
              { class: 'gtw' },
              el(
                'table',
                { class: 'gt' },
                el(
                  'thead',
                  {},
                  el(
                    'tr',
                    {},
                    [
                      'Team',
                      'Aufträge',
                      'Erledigt',
                      'In Arbeit',
                      'Offen',
                      'Nicht OK',
                      'Erledigt %',
                      'Pensum / Woche',
                      'Nachricht'
                    ].map((h, i) => el('th', { class: i && i < 8 ? 'n' : null }, h))
                  )
                ),
                el(
                  'tbody',
                  {},
                  sorted.map(t => tableRow(t))
                ),
                el('tfoot', {}, tableRow(totals, 'Gesamt'))
              )
            )
          );
        } else {
          panel.append(
            el(
              'div',
              { class: 'grows' },
              sorted.map(t => {
                const op = t.n - t.done - t.teil,
                  p = percent(t.done, t.n),
                  pens = t.n > t.done ? weeklyQuota(t.n - t.done, workingDays) : 0;
                const lab =
                  `${t.team}: ${p} % erledigt, ${t.done} von ${t.n}, ${t.teil} in Arbeit, ${op} offen` +
                  (t.nok ? `, ${t.nok} Nicht OK` : '') +
                  (pens ? `, mindestens ${pens} Prüfungen pro Woche nötig` : '') +
                  '. Öffnet die Aufträge des Teams.';
                const am = activeMessage(t.team);
                return el(
                  'div',
                  { class: 'grr' },
                  el(
                    'button',
                    {
                      class: 'grow',
                      'aria-label': lab,
                      onclick: () => openTeamOverview(t.team),
                      onpointermove: e => showTooltip(e, t, p, op, pens),
                      onpointerleave: hideTooltip
                    },
                    el('span', { class: 'gn' }, t.team),
                    stackedBar(t),
                    el(
                      'span',
                      { class: 'gv' },
                      el('b', {}, p + ' %'),
                      el('span', { class: 'mu' }, ` ${formatNumber(t.done)}/${formatNumber(t.n)}`),
                      t.nok > 0 && el('span', { class: 'gnk' }, `✗ ${formatNumber(t.nok)} Nicht OK`),
                      am && el('span', { class: 'gms' }, '📣 ' + messageStatus(am, t.team))
                    )
                  ),
                  messageButton(t)
                );
              })
            )
          );
        }
        panel.append(
          el(
            'p',
            { class: 'mu' },
            'Tippe auf ein Team, um seine Aufträge in der Übersicht zu sehen. Mit 📣 schickst du dem Team eine Nachricht aufs Handy.'
          )
        );
        return panel;
      }
      // ---- Update: neue Version automatisch laden, wenn gerade nichts Ungespeichertes offen ist ----
      /**
       * Vergleicht die Server-Version mit APPVER. Weicht sie ab, wird automatisch neu geladen – aber nur, wenn gerade nichts
       * Ungespeichertes offen ist (Auftrag, laufender Upload, Dialog, eingeloggter Disponent, Eingabefeld);
       * sonst erscheint ein Banner „Jetzt aktualisieren“. Pro Version wird nur einmal automatisch neu geladen.
       */
      function checkAppVersion(version) {
        if (APPVER.startsWith('__') || version === APPVER) return;
        const first = newVersion !== version;
        newVersion = version;
        let tried = '';
        try {
          tried = sessionStorage.getItem('rl') || '';
        } catch (e) {}
        const focused = document.activeElement,
          inUse =
            openOrder ||
            busy ||
            document.querySelector('dialog[open]') ||
            (session.role === 'dispo' && dispoUnlocked) ||
            (focused && /^(INPUT|TEXTAREA|SELECT)$/.test(focused.tagName));
        if (tried !== version && !inUse) {
          try {
            sessionStorage.setItem('rl', version);
          } catch (e) {}
          location.reload();
          return;
        }
        // sonst beim nächsten Abgleich erneut versuchen
        if (first) render();
      }
      // „Jetzt aktualisieren“
      const reloadApp = () => {
        try {
          sessionStorage.setItem('rl', newVersion);
        } catch (e) {}
        location.reload();
      };
      // ---- Nachrichten an Teams ----
      // Disponent: Nachrichten gehen aufs Handy der Monteure (Push) und erscheinen dort als Fenster, das nur mit „Bestätigen“
      // zugeht; der Server erinnert wiederholt, bis alle Geräte des Teams bestätigt haben.
      // aktuelle (nicht beendete, nicht abgelaufene) Nachricht eines Teams
      const activeMessage = team =>
        messages.find(m => m.team === team && !m.closed && Date.now() - m.at < pushConfig.hours * 3600e3);
      // „1 Gerät“ / „n Geräte“
      const deviceCount = n => (n === 1 ? '1 Gerät' : formatNumber(n) + ' Geräte');
      // Bestätigungsstand einer Nachricht für die Dispo-Anzeige („3 von 5 Geräten bestätigt“, „✓ alle bestätigt“)
      function messageStatus(message, team) {
        const counts = devices[team] || [0, 0],
          acked = Math.min(message.acks | 0, counts[0]);
        return !counts[0]
          ? 'gesendet ' + formatDateTime(message.at)
          : acked >= counts[0]
            ? '✓ alle bestätigt'
            : `${acked} von ${formatNumber(counts[0])} ${counts[0] === 1 ? 'Gerät' : 'Geräten'} bestätigt`;
      }
      // 📣-Knopf: öffnet den Dialog zum Senden einer Nachricht an ein Team
      const messageButton = stats => {
        const active = activeMessage(stats.team);
        return el(
          'button',
          {
            class: 'gmsg' + (active ? ' on' : ''),
            title: 'Nachricht an ' + stats.team,
            'aria-label':
              `Nachricht an Team ${stats.team} senden` + (active ? ' (offene Nachricht vorhanden)' : ''),
            onclick: e => {
              e.stopPropagation();
              openSendDialog(stats);
            }
          },
          '📣'
        );
      };
      // Dialog des Disponenten: Nachricht senden / Erinnerung beenden
      const sendDialog = el('dialog', { class: 'dlg' });
      document.body.append(sendDialog);
      /**
       * Dialog „Nachricht an <Team>“: zeigt angemeldete Geräte / solche mit Benachrichtigungen, die offene Nachricht
       * (mit Bestätigungsstand) und ein Textfeld mit Vorschlag. Senden: POST /api/msg; „Erinnerung beenden“: POST /api/msg/close.
       */
      function openSendDialog(stats) {
        hideTooltip();
        const counts = devices[stats.team] || [0, 0],
          active = activeMessage(stats.team),
          errorLine = el('p', { class: 'mu er' });
        const textarea = el('textarea', { rows: '4', maxlength: '300', 'aria-label': 'Nachricht' });
        textarea.value = `Bitte mit den Prüfberichten schneller weitermachen! Aktueller Stand: ${percent(stats.done, stats.n)} % erledigt (${formatNumber(stats.done)} von ${formatNumber(stats.n)}).`;
        const sendButton = el('button', { class: 'sv' }, active ? 'Neu senden' : 'Senden');
        sendButton.onclick = async () => {
          const text = textarea.value.trim();
          if (!text || sendButton.disabled) return;
          sendButton.disabled = true;
          sendButton.textContent = 'Sende …';
          errorLine.textContent = '';
          try {
            await api('POST', '/api/msg', { team: stats.team, text }, 30000);
            sendDialog.close();
            errorMsg = '';
            poll();
            render();
          } catch (e) {
            errorLine.textContent = e.net ? 'Keine Verbindung zum Server' : errorMessageOf(e);
            sendButton.disabled = false;
            sendButton.textContent = active ? 'Neu senden' : 'Senden';
          }
        };
        sendDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b' },
            el('div', { class: 'dlg-t' }, '📣 Nachricht an ' + stats.team),
            el(
              'p',
              { class: 'mu' },
              counts[0]
                ? `${deviceCount(counts[0])} angemeldet, davon ${formatNumber(counts[1])} mit Benachrichtigungen.`
                : 'Noch kein Gerät dieses Teams angemeldet.'
            ),
            counts[0] > counts[1] &&
              el(
                'p',
                { class: 'mu er' },
                counts[1]
                  ? `${deviceCount(counts[0] - counts[1])} ohne Benachrichtigungen – dort erscheint die Nachricht erst beim Öffnen der App.`
                  : 'Kein Gerät hat Benachrichtigungen aktiviert – die Nachricht erscheint erst beim Öffnen der App.'
              ),
            active &&
              el(
                'div',
                { class: 'amsg' },
                el('b', {}, 'Offene Nachricht von ' + formatDateTime(active.at)),
                el('div', {}, active.text),
                el('div', { class: 'mu' }, messageStatus(active, stats.team)),
                el(
                  'button',
                  {
                    class: 'er',
                    onclick: async () => {
                      try {
                        await api('POST', '/api/msg/close', { id: active.id });
                        sendDialog.close();
                        infoMsg = '';
                        poll();
                        render();
                      } catch (e) {
                        errorLine.textContent = errorMessageOf(e);
                      }
                    }
                  },
                  'Erinnerung beenden'
                )
              ),
            textarea,
            el(
              'p',
              { class: 'mu' },
              `Die Monteure bekommen eine Benachrichtigung, die ${pushConfig.nag === 1 ? 'jede Minute' : 'alle ' + pushConfig.nag + ' Minuten'} wiederkommt, bis sie auf „Bestätigen“ tippen (längstens ${pushConfig.hours} Stunden).` +
                (active ? ' Eine neue Nachricht ersetzt die offene.' : '')
            ),
            errorLine,
            el(
              'div',
              { class: 'ob' },
              sendButton,
              el('button', { onclick: () => sendDialog.close() }, 'Abbrechen')
            )
          )
        );
        sendDialog.showModal();
        textarea.focus();
      }
      // Monteur: offene Nachricht als Fenster, das nur mit „Bestätigen“ zugeht (Esc/Abbrechen sind gesperrt)
      const readDialog = el('dialog', { class: 'dlg mdlg' });
      document.body.append(readDialog);
      let shownMessage = null;
      readDialog.addEventListener('cancel', e => e.preventDefault());
      // schließt der Browser das Fenster trotzdem, wird es wieder geöffnet
      readDialog.addEventListener('close', () => {
        if (shownMessage) {
          shownMessage = null;
          setTimeout(showUnreadMessage, 400);
        }
      });
      // offene (nicht bestätigte, nicht beendete, nicht abgelaufene) Nachrichten für das Team des Monteurs
      const unreadMessages = () =>
        session.role === 'monteur' && session.team
          ? messages.filter(
              m =>
                m.team === session.team &&
                !m.ack &&
                !m.closed &&
                Date.now() - m.at < pushConfig.hours * 3600e3
            )
          : [];
      // schließt bereits angezeigte System-Benachrichtigungen (Push) dieser App
      const closeNotifications = () => {
        if ('serviceWorker' in navigator)
          navigator.serviceWorker
            .getRegistration()
            .then(r => (r && r.getNotifications ? r.getNotifications({ tag: 'nachricht' }) : []))
            .then(ns => ns.forEach(n => n.close()))
            .catch(() => {});
      };
      // Zeigt die erste offene Nachricht im Fenster (nach jedem Abgleich aufgerufen); ohne offene Nachricht Fenster schließen
      function showUnreadMessage() {
        if (gasDialog.open) return; // erst das Gaswarngerät bestätigen, danach kommen die Nachrichten
        const message = unreadMessages()[0];
        if (!message) {
          if (readDialog.open) {
            shownMessage = null;
            readDialog.close();
          }
          if (session.role === 'monteur') closeNotifications();
          return;
        }
        if (readDialog.open && shownMessage && shownMessage.id === message.id) return;
        shownMessage = message;
        readDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'mdt' },
            el('div', { class: 'dlg-t', id: 'mdt' }, '📣 Nachricht vom Disponenten'),
            el('p', { class: 'mtx' }, message.text),
            el(
              'p',
              { class: 'mu' },
              'Gesendet ' +
                formatDateTime(message.at) +
                '. Bitte bestätige, dass du die Nachricht gelesen hast.'
            ),
            el(
              'div',
              { class: 'ob' },
              el(
                'button',
                { class: 'sv', onclick: () => acknowledgeMessage(message) },
                '✓ Gelesen – bestätigen'
              )
            )
          )
        );

          try {
            readDialog.showModal();
            readDialog.querySelector('.sv').focus();
          } catch (e) {}
        }
      }
      // „Gelesen – bestätigen“: merkt die Bestätigung, schließt das Fenster und meldet sie dem Server
      function acknowledgeMessage(message) {
        message.ack = true;
        if (!ackQueue.includes(message.id)) ackQueue.push(message.id);
        try {
          localStorage.setItem('ackq', JSON.stringify(ackQueue));
        } catch (e) {}
        shownMessage = null;
        readDialog.close();
        closeNotifications();
        sendAcks();
        showUnreadMessage();
      }
      async function sendAcks() {
        // Bestätigungen senden (ohne Netz gemerkt, später automatisch)
        for (const id of [...ackQueue]) {
          try {
            await api('POST', '/api/msg/ack', { id, did: deviceId });
          } catch (e) {
            if (e.net) break;
          }
          ackQueue = ackQueue.filter(x => x !== id);
          try {
            localStorage.setItem('ackq', JSON.stringify(ackQueue));
          } catch (e) {}
        }
      }
      // ---- Gaswarngerät: tägliche Bestätigung je Team ----
      /**
       * Bevor ein Team arbeitet, muss es jeden Tag bestätigen, dass das Gaswarngerät ordnungsgemäß funktioniert. Solange das
       * Team heute nicht bestätigt hat, liegt ein Fenster über der App (nur „Bestätigen“ schließt es). Der Server hält
       * Tag, Team, Uhrzeit und Gerät fest (Tabelle gas); je Tag und Team zählt die erste Bestätigung, die anderen Geräte
       * des Teams sehen sie beim Abgleich. Ohne Netz wird sofort bestätigt und später gesendet (gasQueue, mit der echten Uhrzeit).
       * Der Disponent sieht im Tab „Fortschritt“ je Team die Uhrzeit oder „nicht bestätigt“ und kann das Protokoll als CSV laden.
       */
      // heutiger Tag (JJJJ-MM-TT): laut Server, solange er erreichbar ist, sonst nach der Geräteuhr
      const gasToday = () => (serverReachable && gasDay) || today();
      // Bestätigung des Servers für Team und Tag (heute, wenn kein Tag angegeben) oder null
      const gasRecord = (team, day = gasToday()) => gasRows.get(day + '|' + team) || null;
      // Bestätigung vom Server übernehmen (ältere Stände nie über neuere schreiben)
      function mergeGas(g) {
        const key = g.d + '|' + g.t,
          old = gasRows.get(key);
        if (!old || g.sq >= old.sq) gasRows.set(key, g);
      }
      // Zeitpunkt der Bestätigung des Teams heute (Server oder noch ungesendet im Gerät) oder 0
      function gasConfirmedAt(team) {
        const record = gasRecord(team);
        if (record) return record.at;
        const queued = gasQueue.find(
          x => x.team === team && new Date(x.at).toLocaleDateString('sv-SE') === today()
        );
        return queued ? queued.at : 0;
      }
      const saveGasQueue = () => {
        try {
          localStorage.setItem('gasq', JSON.stringify(gasQueue));
        } catch (e) {}
      };
      const timeText = t => new Date(t).toLocaleTimeString('de-AT', { hour: '2-digit', minute: '2-digit' });
      // Muss dieses Gerät jetzt die Bestätigung abfragen? (Monteur mit Team, erster Abgleich durch, heute noch nicht bestätigt)
      const gasNeeded = () =>
        session.role === 'monteur' && !!session.team && gasReady && !gasConfirmedAt(session.team);
      const gasDialog = el('dialog', { class: 'dlg mdlg' });
      document.body.append(gasDialog);
      gasDialog.addEventListener('cancel', e => e.preventDefault());
      // schließt der Browser das Fenster trotzdem, wird es wieder geöffnet
      gasDialog.addEventListener('close', () => {
        if (gasNeeded()) setTimeout(showGasCheck, 400);
      });
      // Zeigt das Fenster, solange das Team heute nicht bestätigt hat (nach jedem Abgleich aufgerufen); sonst schließt es
      function showGasCheck() {
        if (!gasNeeded()) {
          if (gasDialog.open) gasDialog.close();
          return;
        }
        if (gasDialog.open) return;
        gasDialog.replaceChildren(
          el(
            'div',
            { class: 'dlg-b', role: 'alertdialog', 'aria-labelledby': 'gdt' },
            el('div', { class: 'dlg-t', id: 'gdt' }, '⚠ Gaswarngerät prüfen'),
            el('p', { class: 'mtx' }, 'Funktioniert das Gaswarngerät ordnungsgemäß?'),
            el(
              'p',
              { class: 'mu' },
              `Bitte vor Arbeitsbeginn prüfen und für das Team „${session.team}“ bestätigen. Die Bestätigung wird mit Datum und Uhrzeit festgehalten. Funktioniert das Gerät nicht: nicht arbeiten und den Disponenten informieren.`
            ),
            el(
              'div',
              { class: 'ob' },
              el('button', { class: 'sv', onclick: confirmGas }, '✓ Funktioniert ordnungsgemäß'),
              !(userInfo && userInfo.lock) &&
                el(
                  'button',
                  {
                    onclick: () => {
                      gasDialog.close();
                      switchRole('monteur');
                    }
                  },
                  'Team wechseln'
                )
            )
          )
        );
        try {
          gasDialog.showModal();
          gasDialog.querySelector('.sv').focus();
        } catch (e) {}
      }
      // „Funktioniert ordnungsgemäß“: hält Team und Uhrzeit im Gerät fest (gilt sofort), meldet sie dem Server
      function confirmGas() {
        if (!session.team || gasConfirmedAt(session.team)) return;
        gasQueue.push({ team: session.team, at: Date.now() });
        saveGasQueue();
        gasDialog.close();
        sendGas();
        render();
        showUnreadMessage();
      }
      // Sendet gemerkte Bestätigungen (ohne Netz bleiben sie liegen und gehen später automatisch raus)
      async function sendGas() {
        if (gasSending) return;
        gasSending = true;
        try {
          for (const item of [...gasQueue]) {
            try {
              mergeGas((await api('POST', '/api/gas', { did: deviceId, team: item.team, at: item.at })).row);
            } catch (e) {
              if (e.status !== 400) break; // kein Netz oder Serverfehler: später erneut (400 = ungültig, verwerfen)
            }
            gasQueue = gasQueue.filter(x => x !== item);
            saveGasQueue();
          }
        } finally {
          gasSending = false;
        }
        clearTimeout(cacheSaveTimer);
        cacheSaveTimer = setTimeout(saveCache, 1500);
        render();
      }
      // Disponent: Karte „Gaswarngerät“ im Tab „Fortschritt“ – je Team die Uhrzeit der Bestätigung für den gewählten Tag
      function gasCard() {
        const todayDay = gasToday(),
          day = gasViewDay || todayDay,
          teams = new Set(teamCounts().map(([t]) => t));
        for (const g of gasRows.values()) if (g.d === day) teams.add(g.t); // auch Teams, die inzwischen keine Aufträge mehr haben
        const rows = [...teams]
            .map(t => [t, gasRecord(t, day)])
            .sort((a, b) => !b[1] - !a[1] || naturalCompare(a[0], b[0])),
          confirmed = rows.filter(r => r[1]).length;
        const shiftDay = n => {
          const d = new Date(day + 'T12:00:00');
          d.setDate(d.getDate() + n);
          gasViewDay = d.toLocaleDateString('sv-SE');
          if (gasViewDay >= todayDay) gasViewDay = '';
          render();
        };
        return el(
          'div',
          { class: 'card', 'data-k': 'gc' },
          el('b', {}, 'Gaswarngerät – Bestätigung je Team'),
          el(
            'div',
            { class: 'gasnav' },
            el('button', { 'aria-label': 'Vorheriger Tag', onclick: () => shiftDay(-1) }, '‹'),
            el('input', {
              type: 'date',
              value: day,
              max: todayDay,
              'aria-label': 'Tag',
              onchange: e => {
                gasViewDay = !e.target.value || e.target.value >= todayDay ? '' : e.target.value;
                render();
              }
            }),
            el(
              'button',
              {
                'aria-label': 'Nächster Tag',
                disabled: day >= todayDay ? 'disabled' : null,
                onclick: () => shiftDay(1)
              },
              '›'
            ),
            el('span', { class: 'mu' }, `${confirmed} von ${rows.length} Teams bestätigt`)
          ),
          rows.length
            ? el(
                'div',
                { class: 'gasg' },
                rows.map(([team, record]) =>
                  el(
                    'div',
                    { class: 'gast' + (record ? ' ok' : ' no') },
                    el('b', {}, team),
                    record
                      ? el(
                          'span',
                          {},
                          '✓ ' + timeText(record.at) + ' Uhr',
                          (record.un || record.u || record.n) &&
                            el('span', { class: 'mu' }, ' · ' + (record.un ? `${record.un} (${record.u})` : record.u || record.n))
                        )
                      : el('span', {}, '⚠ nicht bestätigt')
                  )
                )
              )
            : el('p', { class: 'mu' }, 'Noch keine Teams.'),
          el(
            'p',
            { class: 'mu' },
            'Jedes Team bestätigt vor der Arbeit einmal pro Tag, dass das Gaswarngerät ordnungsgemäß funktioniert. Angezeigt wird die erste Bestätigung des Tages.'
          ),
          el('button', { onclick: exportGasLog }, '⬇ Gesamtes Protokoll (CSV)')
        );
      }
      // Lädt das ganze Protokoll vom Server und speichert es als CSV (Semikolon, mit BOM: öffnet sich in Excel richtig)
      async function exportGasLog() {
        errorMsg = '';
        try {
          const rows = (await api('GET', '/api/gas')).rows;
          // Zellen, die mit = + - @ beginnen, würde Excel als Formel lesen
          const cell = v => '"' + String(v ?? '').replace(/^([=+\-@])/, "'$1").replace(/"/g, '""') + '"';
          const lines = [['Datum', 'Team', 'Bestätigt um', 'Benutzer', 'SAP-User', 'Gerät', 'Beim Server eingegangen um']].concat(
            rows.map(r => [
              r.day.split('-').reverse().join('.'),
              r.team,
              new Date(r.at).toLocaleTimeString('de-AT'),
              r.uname || '',
              r.usr || '',
              (r.name ? r.name + ' ' : '') + '(…' + (r.did || '') + ')',
              Math.abs(r.rec - r.at) > 120e3 ? new Date(r.rec).toLocaleString('de-AT') : ''
            ])
          );
          const url = URL.createObjectURL(
            new Blob(['﻿' + lines.map(l => l.map(cell).join(';')).join('\r\n')], {
              type: 'text/csv;charset=utf-8'
            })
          );
          const link = document.createElement('a');
          link.href = url;
          link.download = 'Gaswarngeraet_Protokoll_' + today() + '.csv';
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          infoMsg = `Protokoll exportiert: ${rows.length} Bestätigungen`;
        } catch (e) {
          infoMsg = '';
          errorMsg = e.net ? 'Keine Verbindung – Protokoll konnte nicht geladen werden' : errorMessageOf(e);
        }
        render();
      }
      // ---- Push-Benachrichtigungen (Monteur) ----
      // Push-Abo: Gerät + Team beim Server melden; ask=true nur nach Tipp auf „Aktivieren“ (der Browser verlangt das)
      // Browser kann Push (Service Worker + Push + Notifications)?
      const pushSupported = () =>
        'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
      // Base64URL-Schlüssel des Servers -> Bytes (für pushManager.subscribe)
      const base64UrlToBytes = s => {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        return Uint8Array.from(atob(s + '='.repeat((4 - (s.length % 4)) % 4)), c => c.charCodeAt(0));
      };
      /**
       * Meldet Gerät, Rolle (Monteur/Disponent/abgemeldet), Team und (wenn erlaubt) das Push-Abo beim Server
       * (POST /api/push/sub) – so merkt sich der Server, welches Gerät wo angemeldet ist (Geräteübersicht). Mit
       * ask = true wird die Berechtigung abgefragt. Gibt es neue Server-Schlüssel, wird neu abonniert. Fehler landen in pushError (Banner).
       */
      async function pushSync(ask) {
        const team = session.role === 'monteur' && session.team ? session.team : null,
          // Der Disponent zählt erst als angemeldet, wenn die PIN eingegeben wurde (nach dem Neuladen also wieder abgemeldet)
          role =
            session.role === 'monteur'
              ? 'monteur'
              : session.role === 'dispo' && dispoUnlocked
                ? 'dispo'
                : null;
        if (!team && !role && !registeredTeam && !registeredRole) return;
        let sub = null;
        pushError = '';
        if (team && pushSupported()) {
          try {
            if (ask && Notification.permission === 'default') await Notification.requestPermission();
            if (Notification.permission === 'granted') {
              const reg = await Promise.race([
                navigator.serviceWorker.ready,
                new Promise((_, no) => setTimeout(() => no(new Error('Service Worker nicht bereit')), 10000))
              ]);
              const key = (await api('GET', '/api/push/key')).key;
              let pk = '';
              try {
                pk = localStorage.getItem('pk') || '';
              } catch (e) {}
              sub = await reg.pushManager.getSubscription();
              // Server hat neue Schlüssel -> neu abonnieren
              if (sub && pk !== key) {
                await sub.unsubscribe();
                sub = null;
              }
              if (!sub)
                sub = await reg.pushManager.subscribe({
                  userVisibleOnly: true,
                  applicationServerKey: base64UrlToBytes(key)
                });
              try {
                localStorage.setItem('pk', key);
              } catch (e) {}
            }
          } catch (e) {
            if (!e.net) pushError = errorMessageOf(e) || 'unbekannter Fehler';
          }
        }
        try {
          await api('POST', '/api/push/sub', { did: deviceId, role, team, sub: sub ? sub.toJSON() : null });
          registeredTeam = team;
          registeredRole = role;
          try {
            team ? localStorage.setItem('regteam', team) : localStorage.removeItem('regteam');
            role ? localStorage.setItem('regrole', role) : localStorage.removeItem('regrole');
          } catch (e) {}
        } catch (e) {}
        render();
      }
      // Hinweise zu Benachrichtigungen lassen sich wegklicken; sie kommen erst mit der nächsten neuen Nachricht vom
      // Disponenten wieder (bannerHiddenUpTo = höchste Nachrichten-ID, bei der ausgeblendet wurde)
      let bannerHiddenUpTo = -1;
      try {
        const v = localStorage.getItem('pbhide');
        if (v != null) bannerHiddenUpTo = +v;
      } catch (e) {}
      // höchste Nachrichten-ID des Teams
      const latestTeamMessageId = () =>
        messages.reduce((a, m) => (m.team === session.team ? Math.max(a, m.id | 0) : a), 0);
      // Banner zu Benachrichtigungen (mit „✕“ zum Ausblenden) oder null. Einmal weggeklickt, bleibt er weg: dann gibt es nur die kleine
      // Schaltfläche „🔔 Benachrichtigungen“ (pushBell) neben dem Benutzernamen, über die man den Hinweis wieder öffnen kann.
      function pushBanner() {
        const banner = pushStatusBanner();
        if (!banner || bannerHiddenUpTo >= 0) return null;
        banner.classList.add('dx');
        banner.append(
          el(
            'button',
            {
              class: 'x',
              title: 'Ausblenden',
              'aria-label': 'Hinweis ausblenden',
              onclick: () => {
                bannerHiddenUpTo = latestTeamMessageId();
                try {
                  localStorage.setItem('pbhide', bannerHiddenUpTo);
                } catch (e) {}
                render();
              }
            },
            '✕'
          )
        );
        return banner;
      }
      // kleine Schaltfläche statt des weggeklickten Banners (⚠ bei einem Problem, sonst 🔔), null wenn es nichts zu melden gibt
      function pushBell() {
        if (bannerHiddenUpTo < 0) return null;
        const banner = pushStatusBanner();
        if (!banner) return null;
        return el(
          'button',
          {
            class: 'lk',
            title: 'Hinweis zu den Benachrichtigungen anzeigen',
            onclick: () => {
              bannerHiddenUpTo = -1;
              try {
                localStorage.removeItem('pbhide');
              } catch (e) {}
              render();
            }
          },
          (banner.classList.contains('er') ? '⚠' : '🔔') + ' Benachrichtigungen'
        );
      }
      // Passender Hinweis je Zustand: Browser kann kein Push (iPhone: „Zum Home-Bildschirm“, ohne HTTPS), Berechtigung blockiert,
      // Einrichtung fehlgeschlagen (mit Tipps je Browser) oder noch nicht aktiviert („Aktivieren“)
      function pushStatusBanner() {
        if (!pushSupported()) {
          if (/iPhone|iPad|iPod/.test(navigator.userAgent) && !navigator.standalone)
            return el(
              'div',
              { class: 'msg' },
              '🔔 Damit dich Nachrichten vom Disponenten erreichen: App über „Teilen → Zum Home-Bildschirm“ hinzufügen, von dort öffnen und Benachrichtigungen aktivieren.'
            );
          return window.isSecureContext === false
            ? el(
                'div',
                { class: 'msg' },
                '🔔 Benachrichtigungen sind nur über eine sichere Verbindung (HTTPS) möglich.'
              )
            : null;
        }
        if (Notification.permission === 'granted') {
          if (!pushError) return null;
          const hints = [],
            userAgent = navigator.userAgent;
          if (navigator.brave)
            hints.push(
              'Brave: Einstellungen → Datenschutz und Sicherheit → „Google-Dienste für Push-Messaging verwenden“ einschalten und Brave neu starten.'
            );
          else if (/push service|AbortError|network/i.test(pushError)) {
            hints.push(
              'Der Push-Dienst des Browsers (bei Chrome/Android: Google) ist nicht erreichbar. Häufig sperrt ein Firmen-WLAN oder Proxy ihn – mit mobilen Daten erneut versuchen.'
            );
            hints.push(
              /Android/.test(userAgent)
                ? 'Handy ohne Google-Dienste (z. B. neuere Huawei)? Dann Firefox verwenden.'
                : 'Private/Inkognito-Fenster und in andere Programme eingebaute Browser können keine Push-Benachrichtigungen – in Chrome, Edge oder Firefox öffnen.'
            );
          }
          return el(
            'div',
            { class: 'msg er' },
            el('b', {}, 'Benachrichtigungen konnten nicht eingerichtet werden.'),
            el('div', { class: 'mu' }, 'Meldung des Browsers: ' + pushError),
            hints.map(x => el('div', { class: 'mu' }, '• ' + x)),
            el(
              'div',
              { class: 'mu' },
              'Nachrichten vom Disponenten erscheinen trotzdem, solange die App offen ist.'
            ),
            el('button', { class: 'pri', onclick: () => pushSync(true) }, 'Erneut versuchen')
          );
        }
        if (Notification.permission === 'denied')
          return el(
            'div',
            { class: 'msg' },
            '🔕 Benachrichtigungen sind blockiert – Nachrichten vom Disponenten siehst du nur bei geöffneter App. Freigeben in den Einstellungen von Browser bzw. Handy.'
          );
        return el(
          'div',
          { class: 'msg pb' },
          el(
            'span',
            {},
            '🔔 Benachrichtigungen aktivieren, damit dich Nachrichten vom Disponenten auch bei geschlossener App erreichen.'
          ),
          el('button', { class: 'pri', onclick: () => pushSync(true) }, 'Aktivieren')
        );
      }
      // ---- Tooltip, Suche, Zurück ----
      // Tooltip (nur Maus) – alle Werte stehen zusätzlich in Beschriftung und Tabelle
      const tooltip = el('div', { class: 'tip' });
      document.body.append(tooltip);
      // zeigt die Werte eines Teams neben dem Mauszeiger (bleibt im sichtbaren Bereich)
      function showTooltip(event, stats, percentDone, openCount, perWeek) {
        if (event.pointerType !== 'mouse') return;
        tooltip.replaceChildren(
          el('div', { class: 'mu' }, stats.team),
          ...[
            ['g2', `${formatNumber(stats.done)} (${percentDone} %)`, 'Erledigt'],
            ['g1', formatNumber(stats.teil), 'In Arbeit'],
            ['g0', formatNumber(openCount), 'Offen']
          ].map(([k, v, l]) =>
            el(
              'div',
              { class: 'tr' },
              el('i', { class: 'lk ' + k }),
              el('b', {}, v),
              el('span', { class: 'mu' }, l)
            )
          ),
          stats.nok > 0 &&
            el(
              'div',
              { class: 'tr' },
              el('b', { class: 'er' }, '✗ ' + formatNumber(stats.nok)),
              el('span', { class: 'mu' }, 'Nicht OK')
            ),
          perWeek > 0 &&
            el(
              'div',
              { class: 'mu', style: 'margin-top:4px' },
              `≥ ${formatNumber(perWeek)} Prüfungen / Woche nötig`
            )
        );
        tooltip.style.display = 'block';
        const w = tooltip.offsetWidth,
          h = tooltip.offsetHeight;
        let x = event.clientX + 14,
          y = event.clientY + 14;
        if (x + w > innerWidth - 8) x = event.clientX - w - 14;
        if (y + h > innerHeight - 8) y = event.clientY - h - 14;
        tooltip.style.transform = `translate(${Math.max(8, x)}px,${Math.max(8, y)}px)`;

          d.node.style.transform = `translate(${(dMin / 60) * g.pxh}px, ${(row - d.row0) * g.rowH}px)`;
          document.querySelectorAll('.gt-row.tgt, .gt-name.tgt').forEach(n => n.classList.remove('tgt'));

      // ---- Tab „Disposition“ ----
      // Karte „noch offen“ in der Liste links. native: Karte im Extra-Fenster – sie lässt sich mit dem Ziehen des Browsers (HTML5) in das
      // Diagramm des Hauptfensters ziehen, auch auf einen anderen Bildschirm (das Ziehen mit Zeigerereignissen endet an der Fenstergrenze)
      function poolCard(o, native = false) {

          sug = suggestSlot(o),
          melds = bySeverity(meldungenOf(o)),

          late = lateInfo(o),
          title = (orderKind(o) === 'rep' && o.vtxt ? o.vtxt : o.kurz) || '–';
        return el(
          'div',
          {
            class: 'card gt-pc cl' + (gSel === o.auftrag ? ' sel' : '') + (gebrechen ? ' gb-c' + gebrechen.lvl : late ? ' due' : ''),
            'data-k': 'dp-' + o.auftrag,
            role: 'button',
            tabindex: '0',
            ...(native ? { draggable: 'true', ondragstart: e => startNativeDrag(e, o), ondragend: endNativeDrag } : { onpointerdown: e => startPoolDrag(e, o) }),
            onclick: () => {

            onkeydown: e => {

            { class: 'row' },

            el('span', { class: 'tag' }, sap.team),
            late && el('span', { class: 'tag st-nok' }, `⏰ im Verzug · ${late.days === 1 ? '1 Tag' : late.days + ' Tage'}`),
            gebrechen && gebrechenTag(gebrechen),
            (o.ext || []).length > 0 && el('span', { class: 'tag st-teil' }, '🏗 Externe Firma')
          ),
          el('div', { class: 'kt' }, title),
          (o.str || o.plz) && el('div', { class: 'mu' }, [o.plz, o.str].filter(Boolean).join(' ')),
          el('div', { class: 'gt-sap' }, isoOfDate(sap.start) ? '🕒 SAP: ' + termText({ start: sap.start, ende: sap.ende, uhr: sap.uhr, uhr2: sap.uhr2 }) + (o.arb ? ` · ${o.arb} Std geplant` : '') : el('span', { class: 'mu' }, 'SAP nennt keinen Termin')),
          el(

              onclick: e => {

      // Überschrift der Offen-Liste mit „Alle Vorschläge übernehmen“ (erst Rückfrage)
      const poolHead = (all, withSuggestion) =>
        el(
          'div',
          { class: 'gt-ph' },
          el('b', {}, `Noch nicht disponiert (${all.length})`),
          withSuggestion.length > 0 &&
            (gArmAll
              ? el('button', { class: 'pri', onclick: () => disposeAll(withSuggestion) }, `Wirklich ${withSuggestion.length} Aufträge disponieren?`)

      const poolMore = (all, shown) => shown.length < all.length && el('button', { class: 'dl', onclick: () => { gPoolMax += 20; render(); } }, `Weitere anzeigen (${all.length - shown.length})`);
      function ganttPool() {
        const all = poolOrders(),
          shown = all.slice(0, gPoolMax),
          withSuggestion = all.filter(suggestSlot),
          box = el('div', {});
        box.append(poolHead(all, withSuggestion));
        if (!all.length) box.append(poolEmpty());
        else {
          box.append(el('div', { class: 'gt-pool', 'data-list': '1' }, shown.map(o => poolCard(o))));

            more.style.marginTop = '10px';

          }
        }

      }
      // alle gelisteten Vorschläge auf einmal übernehmen
      function disposeAll(list) {

          gDraft = null;

          list.map(o => ({ a: o.auftrag, ...suggestSlot(o) })),

      }
      // ---- Extra-Fenster für die Offen-Liste (zwei Bildschirme: links die Aufträge, rechts das Diagramm) ----
      // Der Knopf „⧉ Extra-Fenster“ öffnet ein zweites Browserfenster mit der Liste der noch nicht disponierten Aufträge (Auftragsart,
      // Suche, „Vorschlag übernehmen“, „Alle Vorschläge übernehmen“, Antippen öffnet das Bearbeiten-Fenster im Hauptfenster). Das Hauptfenster
      // zeigt dann das Diagramm über die ganze Breite. Das Extra-Fenster ist kein zweites Programm: seinen Inhalt baut das Hauptfenster

      // die übrigen rücken weich nach (wie in der Seite, siehe animateRemoved).
      function poolWinSync() {

      // ---- Karte aus dem Extra-Fenster in das Diagramm ziehen (HTML5-Ziehen, auch auf einen anderen Bildschirm) ----

      function startNativeDrag(e, o) {

      function nativeSlot(team, clientX) {
        const o = gDrag && gDrag.native && ordersMap.get(gDrag.a);
        if (!o || o.dis || !gGeo) return null;

          von = snapStart(gGeo, laneTime(clientX), sug ? sug.von.slice(11) : '07:00');

        gTip.style.transform = `translate(${Math.min(e.clientX + 14, innerWidth - gTip.offsetWidth - 8)}px, ${Math.max(8, e.clientY - 38)}px)`;
        // am Rand scrollt die Zeitachse weiter (das Ereignis kommt etwa alle 50 ms, auch wenn die Maus stillsteht)
        const scroller = app.querySelector('.gt-scroll'),

          gDraft = null;

      }

      // Auswahl der Auftragsart (Alle / Reparaturen / Entstörungen) mit Zahlen – im Hauptfenster und im Extra-Fenster
      function dispatchKindChips() {
        const all = allOrders().filter(o => isDispatchKind(orderKind(o))),
          count = k => all.filter(o => orderKind(o) === k).length;
        return el(
          'div',
          { class: 'chips ksw' },
          [['', 'Alle', all.length], ...['rep', 'ent'].map(k => [k, `${kindInfo(k).icon} ${kindInfo(k).plural}`, count(k)])].map(([k, l, n]) =>
            el(
              'button',
              {
                class: 'chip' + (gKind === k ? ' on' : ''),
                onclick: () => {

                  gPoolMax = 20;

              `${l} (${n})`
            )
          )
        );
      }
      // Suchfeld der Offen-Liste
      const poolSearch = () =>
        el('input', {
          type: 'search',
          'data-keep': 'gs',
          placeholder: 'Offene suchen (Auftrag, Kurztext, Straße …)',
          value: gSearch,
          oninput: e => {

            gPoolMax = 20;

        });
      function drawDispoPlan() {
        if (!dataReady) {

        const solo = poolWinAlive();

          el(
            'div',

            dispatchKindChips(),
            // (die Zeile ist mit und ohne Extra-Fenster gleich hoch: nichts darunter springt)
            el(
              'div',
              { class: 'tools gtt' },
