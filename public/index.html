<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Aufträge nach Team</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#bb005d" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      try {
        var t = localStorage.getItem('thm');
        if (t == 'light' || t == 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      /* ===== Stile ====================================================================================
         Aufbau: Farben (Design-Tokens, hell/dunkel) → Grundelemente → Bausteine → Layout je Bildschirmgröße.
         Klassennamen sind bewusst kurz. Wichtigste Abkürzungen:
           .mu  = muted (gedämpfter Text)        .er  = error (Fehlerfarbe)       .tag = kleines Etikett
           .kt  = Kurztext (Titel einer Karte)   .cl  = clickable (Karte anklickbar)  .dn = done (erledigt, blasser)
           .it  = item (ein Prüfobjekt, Monteur) .li  = Listenzeile (ein Prüfobjekt, Dispo, nur Ansicht)
           .ob  = Button-Reihe (OK / Nicht OK)   .ed  = Editor für den Nicht-OK-Text   .cfm = Rückfrage „Alles OK“
           .zt  = Zeile der Zeitkarte            .qk  = Schnellwahl-Buttons            .flt = Filterleiste (Dispo)
           .mkr = Zeile „Abhaken“ (Dispo)        .g*  = Fortschrittsgrafik aller Teams (Dispo)
           .vg* = Vergleichsseite (Dispo)        .dlg = Dialog
         Farb-Variablen: --bg Hintergrund, --card Karte, --tx Text, --mu gedämpft, --ac/--act Akzent (Wiener-Netze-Magenta),
         --bd Rahmen, --er Fehler, --ok erledigt/OK, --nk Nicht OK, --g1/--g2/--gt Balken (in Arbeit/erledigt/offen).
         ================================================================================================= */
      /* ---- Farben: hell (Standard), dunkel per Systemeinstellung oder Schalter (data-theme am <html>) ---- */
      :root {
        --bg: #f5f5f6;
        --card: #fff;
        --tx: #1f1f23;
        --mu: #66656c;
        --ac: #bb005d;
        --act: #bb005d;
        --bd: #e4e3e7;
        --er: #c4320a;
        --ok: #067647;
        --nk: #c4320a;
        --g1: #5fb085;
        --g2: #067647;
        --gt: #e1e0e5;
        box-sizing: border-box;
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --bg: #141316;
          --card: #1e1c20;
          --tx: #ededf0;
          --mu: #a09fa6;
          --ac: #d1176f;
          --act: #f06baa;
          --bd: #2f2d33;
          --er: #f2704f;
          --ok: #15803d;
          --nk: #d0421a;
          --g1: #2e6e4c;
          --g2: #22a35a;
          --gt: #34323a;
        }
      }
      :root[data-theme='dark'] {
        --bg: #141316;
        --card: #1e1c20;
        --tx: #ededf0;
        --mu: #a09fa6;
        --ac: #d1176f;
        --act: #f06baa;
        --bd: #2f2d33;
        --er: #f2704f;
        --ok: #15803d;
        --nk: #d0421a;
        --g1: #2e6e4c;
        --g2: #22a35a;
        --gt: #34323a;
      }
      :root {
        color-scheme: light dark;
      }
      :root[data-theme='light'] {
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
      }
      /* ---- Grundlayout ---- */
      html {
        scroll-padding-top: calc(var(--toph, 52px) + 8px);
        overflow-anchor: none;
      }
      /* Schriftgröße ändern: alle rem-Größen wachsen/schrumpfen weich (Klasse nur kurz, siehe changeFontScale) */
      html.fz-anim {
        transition: font-size 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--tx);
        font:
          1rem/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      main {
        max-width: 1440px;
        margin: 0 auto;
        padding: 8px max(16px, env(safe-area-inset-right)) 40px max(16px, env(safe-area-inset-left));
      }
      body[data-w='n'] main {
        max-width: 560px;
      }
      h1 {
        font-size: 1.375rem;
        margin: 8px 0 16px;
      }
      .bar {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .bar h1 {
        margin: 0;
      }
      .bar button {
        white-space: nowrap;
        flex: 0 0 auto;
      }
      /* ---- Bedienelemente ---- */
      button,
      select,
      input[type='search'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 14px;
      }
      button {
        cursor: pointer;
        touch-action: manipulation;
      }
      button.pri {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      button.big {
        display: block;
        width: 100%;
        padding: 18px;
        font-size: 1.125rem;
        margin-bottom: 10px;
        text-align: left;
      }
      button.er {
        color: var(--er);
      }
      /* ---- Karten, Etiketten, Meldungen, Statusfarben ---- */
      .card {
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 12px;
        padding: 12px 14px;
        margin-bottom: 10px;
        overflow-wrap: break-word;
      }
      .row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .tag {
        font-size: 0.75rem;
        border: 1px solid var(--bd);
        border-radius: 20px;
        padding: 1px 8px;
        color: var(--mu);
      }
      .kt {
        font-size: 1.0625rem;
        font-weight: 600;
        margin: 6px 0 2px;
      }
      .mu {
        color: var(--mu);
        font-size: 0.875rem;
      }
      .msg {
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--bd);
        margin-bottom: 12px;
        background: var(--card);
      }
      .msg.er {
        color: var(--er);
      }
      .tools {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      .tools input {
        flex: 1;
        min-width: 0;
      }
      label.ck {
        display: block;
        margin: 10px 0;
        font-size: 0.875rem;
        color: var(--mu);
      }
      .card.cl {
        cursor: pointer;
      }
      .chev {
        margin-left: auto;
        color: var(--mu);
        font-size: 0.875rem;
      }
      .li {
        padding: 8px 0;
        border-top: 1px solid var(--bd);
      }
      .card button.pri {
        margin-top: 10px;
      }
      .mu.er {
        color: var(--er);
      }
      .tag.st-ok {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .tag.st-nok {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      .tag.st-teil {
        border-color: var(--ac);
        color: var(--act);
      }
      .tag.st-zf {
        background: rgba(196, 50, 10, 0.14);
        border-color: var(--nk);
        color: var(--er);
        font-weight: 700;
      }
      .nokbox {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--nk);
        font-size: 0.875rem;
      }
      .nokbox b {
        color: var(--er);
      }
      /* ---- Filter-Chips ---- */
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .chip {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      .chip.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .chip.nk.on {
        background: var(--nk);
        border-color: var(--nk);
      }
      .chips.ab {
        align-items: center;
      }
      /* ---- Prüfobjekte: Monteur (.it) mit OK / Nicht OK, Rückfrage „Alles OK“ (.cfm) ---- */
      .it {
        padding: 10px 0;
        border-top: 1px solid var(--bd);
      }
      .it .t {
        margin-bottom: 8px;
        word-break: break-word;
      }
      .it .t .orig {
        font-size: 0.75rem;
        color: var(--mu);
        opacity: 0.8;
        margin-top: 2px;
      }
      .ob {
        display: flex;
        gap: 8px;
      }
      .ob button {
        flex: 1;
        padding: 12px 8px;
      }
      .ob button.ok.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .ob button.nk.on {
        background: var(--nk);
        border-color: var(--nk);
        color: #fff;
      }
      button.allok {
        display: block;
        width: 100%;
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
        padding: 14px;
        font-size: 1.0625rem;
        margin: 10px 0;
      }
      .cfm {
        margin: 10px 0;
        padding: 12px;
        border: 2px solid var(--ok);
        border-radius: 10px;
      }
      .cfm .ob {
        margin-top: 10px;
      }
      .cfm button {
        padding: 14px 8px;
        font-size: 1rem;
      }
      .cfm button.yes {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .mk {
        display: inline-block;
        width: 1.4em;
      }
      /* ---- Tabs der Disponentenansicht, Texteingaben ---- */
      .tabs {
        display: flex;
        gap: 6px;
        margin-bottom: 12px;
      }
      .tabs button {
        flex: 1;
        min-width: 0;
        padding: 10px 2px;
        font-size: 0.875rem;
      }
      .tabs button.on {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .tools select {
        flex: 1;
        min-width: 0;
      }
      textarea {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
        margin: 8px 0;
      }
      .ed {
        margin-top: 8px;
      }
      .ob button.sv {
        background: var(--ac);
        border-color: var(--ac);
        color: #fff;
      }
      .nk1 {
        margin-top: 4px;
      }
      .it .nokbox {
        margin-top: 8px;
      }
      input[type='password'] {
        font: inherit;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 1.375rem;
        letter-spacing: 0.4em;
        width: 100%;
        box-sizing: border-box;
        margin: 10px 0;
      }
      button.dl {
        display: block;
        width: 100%;
        margin-bottom: 12px;
      }
      input.tm {
        font: inherit;
        font-size: 1.25rem;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 10px;
        width: 72px;
        text-align: center;
        box-sizing: border-box;
      }
      /* ---- Zeitkarte (Datum, Beginn, Dauer) ---- */
      .zt {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .qk {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .qk button {
        padding: 8px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      input.dt {
        font: inherit;
        font-size: 1.125rem;
        color: var(--tx);
        background: var(--card);
        border: 1px solid var(--bd);
        border-radius: 10px;
        padding: 9px 10px;
        box-sizing: border-box;
        flex: 1;
        min-width: 9.375rem;
      }
      /* ---- Filterleiste der Dispo-Übersicht ---- */
      .flt {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 8px 10px;
        align-items: center;
        margin-bottom: 12px;
      }
      .flt select {
        width: 100%;
        min-width: 0;
      }
      .flt .rg {
        grid-column: 1/-1;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .flt .rg .dt {
        min-width: 0;
        font-size: 1rem;
      }
      .flt .rs {
        grid-column: 1/-1;
        color: var(--er);
      }
      /* ---- Fortschrittskarte (Monteur-Teamansicht) ---- */
      .prg {
        display: flex;
        gap: 12px;
        align-items: stretch;
      }
      .prg .pb {
        flex: 1;
        min-width: 0;
      }
      .prg .pt {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 0 6px;
        white-space: nowrap;
      }
      .prg .pp {
        font-size: 1.625rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .pbar {
        height: 14px;
        border-radius: 7px;
        background: var(--bd);
        overflow: hidden;
        margin: 6px 0;
      }
      .pbar .pd {
        height: 100%;
        background: var(--ok);
        border-radius: 7px 0 0 7px;
      }
      .prg .ps {
        flex: 0 0 auto;
        width: 6rem;
        text-align: center;
        border-left: 1px solid var(--bd);
        padding-left: 12px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .prg .pn {
        font-size: 1.625rem;
        font-weight: 700;
        line-height: 1.1;
      }
      .prg .pn.ok {
        color: var(--ok);
      }
      .prg .ps.warn .pn {
        color: var(--er);
      }
      .prg .sm {
        font-size: 0.75rem;
        margin-top: 2px;
      }
      /* ---- „Abhaken“ durch den Disponenten ---- */
      .mkr {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .mkb {
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
      }
      .mkb.on {
        background: var(--ok);
        border-color: var(--ok);
        color: #fff;
      }
      .mkb.ch {
        border-color: var(--nk);
        color: var(--er);
        font-weight: 600;
      }
      .card.dn {
        opacity: 0.6;
      }
      .msg button {
        margin-left: 8px;
        padding: 4px 10px;
        font-size: 0.875rem;
      }
      /* ---- Kopfzeile: Logo + Hell/Dunkel-Schalter ---- */
      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--bg);
        transition: box-shadow 0.15s;
        padding: calc(12px + env(safe-area-inset-top, 0px))
          max(16px, env(safe-area-inset-right), calc((100% - 1440px) / 2 + 16px)) 8px
          max(16px, env(safe-area-inset-left), calc((100% - 1440px) / 2 + 16px));
        display: flex;
        align-items: center;
        gap: 12px;
        box-sizing: border-box;
      }
      .logo {
        height: 28px;
        width: auto;
        display: block;
        flex: 0 1 auto;
        min-width: 0;
        object-fit: contain;
        object-position: left center;
      }
      .dk .logo {
        background: #fff;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .thm {
        margin-left: auto;
        flex: 0 0 auto;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-color: transparent;
        background: none;
        color: var(--mu);
        font-size: 0.875rem;
      }
      .thm .sw {
        flex: 0 0 auto;
        width: 34px;
        height: 20px;
        border-radius: 10px;
        background: var(--mu);
        position: relative;
        transition: background 0.15s;
      }
      .thm .sw::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        transition: transform 0.15s;
      }
      .thm[aria-checked='true'] .sw {
        background: var(--ac);
      }
      .thm[aria-checked='true'] .sw::after {
        transform: translateX(14px);
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--ac);
        outline-offset: 1px;
      }
      input[type='checkbox'] {
        accent-color: var(--ac);
      }
      /* ---- Schriftgröße A− / A+ (Monteur) ---- */
      .fzg {
        display: flex;
        flex: 0 0 auto;
      }
      .fzg button {
        padding: 10px 12px;
        white-space: nowrap;
      }
      .fzg button:first-child {
        border-radius: 10px 0 0 10px;
      }
      .fzg button:last-child {
        border-radius: 0 10px 10px 0;
        margin-left: -1px;
      }
      .fzg button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .fzg.on button:not(:disabled) {
        border-color: var(--ac);
        color: var(--act);
        position: relative;
      }
      /* ---- Layout für Handy / Tablet / PC ---- */
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 20rem), 1fr));
        gap: 10px;
        margin-bottom: 10px;
      }
      .grid > .card {
        margin: 0;
        display: flex;
        flex-direction: column;
      }
      .grid > .card > .mkr {
        margin-top: auto;
        padding-top: 8px;
      }
      .tgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr));
        gap: 10px;
      }
      .ugrid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 26rem), 1fr));
        gap: 10px;
        align-items: start;
        margin-bottom: 10px;
      }
      .ugrid > .card {
        margin: 0;
      }
      .pinc {
        max-width: 28rem;
      }
      .bar.stk {
        position: sticky;
        top: var(--toph, 52px);
        z-index: 5;
        background: var(--bg);
        margin: -8px -16px 4px;
        padding: 8px 16px;
      }
      .det > * {
        min-width: 0;
      }
      .pcard {
        container-type: inline-size;
      }
      @container (min-width:35rem) {
        .pcard .it {
          display: grid;
          grid-template-columns: minmax(0, 1fr) 16rem;
          gap: 8px 12px;
          align-items: center;
        }
        .pcard .it .t {
          margin: 0;
        }
        .pcard .it > :nth-child(n + 3) {
          grid-column: 1/-1;
        }
      }
      @media (min-width: 900px) {
        .det {
          display: grid;
          grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
          gap: 16px;
          align-items: start;
        }
        .mtop {
          display: grid;
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr);
          gap: 16px;
          align-items: center;
          margin-bottom: 12px;
        }
        .mtop > .card {
          margin: 0;
        }
        .mtop .ctl > :last-child {
          margin-bottom: 0;
        }
      }
      @media (min-width: 700px) {
        .tabs {
          max-width: 36rem;
        }
        .flt {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 8px 10px;
        }
        .flt select {
          width: auto;
          min-width: 14rem;
          max-width: 24rem;
        }
        .flt > .mu:not(:first-child) {
          margin-left: 12px;
        }
        .flt .rg .dt {
          flex: 0 0 11rem;
        }
        .acts {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          margin-bottom: 12px;
        }
        .acts button.dl {
          width: auto;
          margin: 0;
        }
        .srow {
          display: flex;
          gap: 8px 16px;
          align-items: center;
          flex-wrap: wrap;
          margin-bottom: 12px;
        }
        .srow > * {
          margin-bottom: 0;
        }
        .srow .tools {
          flex: 1 1 20rem;
        }
      }
      @media (hover: hover) {
        .card.cl {
          transition: border-color 0.12s;
        }
        .card.cl:hover {
          border-color: var(--ac);
        }
        button:not(:disabled):hover {
          filter: brightness(0.96);
        }
        .dk button:not(:disabled):hover {
          filter: brightness(1.2);
        }
      }
      /* ---- Dialoge (Rückfrage beim Verlassen, Nachrichten) ---- */
      .dlg {
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 0;
        background: var(--card);
        color: var(--tx);
        width: min(calc(100vw - 32px), 26rem);
        max-width: none;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
      }
      .dlg::backdrop {
        background: rgba(0, 0, 0, 0.5);
      }
      .dlg-b {
        padding: 18px;
      }
      .dlg-t {
        font-size: 1.125rem;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .dlg p {
        margin: 8px 0;
      }
      .dlg ul {
        margin: 6px 0 10px;
        padding-left: 1.2em;
      }
      .dlg li {
        margin: 4px 0;

    <header class="top" id="top"></header>

    <div class="made">made by Clemens with ❤️</div>
    <script>
      /* =================================================================================================
       * Aufträge nach Team – Oberfläche (eine Datei, ohne Framework und ohne Build-Schritt)
       *
       * ROLLEN
       *   Monteur   bestätigt täglich vor der Arbeit das Gaswarngerät (Fenster, siehe showGasCheck), wählt sein Team, sieht
       *             dessen Aufträge, bewertet die Prüfobjekte (OK / Nicht OK mit Text) und meldet die Zeit zurück. Ein Auftrag gilt als „erledigt“, wenn alle Prüfobjekte bewertet sind UND
       *             die Zeit vollständig ist (Datum + Beginn + Dauer).
       *   Disponent PIN-geschützt: Übersicht (Filter, Excel-Export, Abhaken), Fortschritt aller Teams (+ Nachricht ans
       *             Team), Upload (eigener PIN), Vergleich (Aufträge-Excel gegen Export) und Geräte (wer ist wo
       *             angemeldet, Spitznamen, Geräte ausloggen, Standort der Monteur-Geräte).
       *
       * DATENFLUSS
       *   Server (SQLite) <-> poll(): holt nur Änderungen seit der Änderungsnummer `syncSeq`; der Server meldet Änderungen
       *   live per EventSource (listenForServerEvents). Der Stand liegt zusätzlich in IndexedDB (loadCache/saveCache) ->
       *   die App startet sofort und funktioniert offline. Eingaben des Monteurs landen zuerst im `outbox`
       *   (auch in localStorage) und werden von sendPending() gesendet – bei fehlendem Netz automatisch später erneut.
       *   Gleichzeitige Änderungen auf zwei Geräten: der Server gewinnt (HTTP 409, siehe sendPending).
       *
       * DARSTELLUNG
       *   Zustand steckt in den globalen Variablen unten. render() zeichnet die Seite mit draw() komplett neu
       *   (DOM-Aufbau über el()) und hält dabei Scroll-Position und Fokus fest.
       *
       * DATENFORMATE
       *   Auftrag        { auftrag, team, tp (Techn. Platz), art, plz, str, kurz, start, ende }
       *   Prüfobjekte    Liste von Kurztexten je Auftrag (aus dem Prüflos-Excel)
       *   Ergebnis-Doc   { a, team, n, ok, nx, s, nok, min?, tat?, dat?, von? } je Auftrag:
       *                    n = Anzahl Prüfobjekte, ok / nx = Anzahl OK / Nicht OK,
       *                    s = Status-String, ein Zeichen je Prüfobjekt: 'o' OK, 'x' Nicht OK, '-' offen,
       *                    nok = [{ i: Index, t: Kurztext, m: Text des Monteurs }],
       *                    min = Dauer in Minuten, tat = Zeitpunkt der Rückmeldung, dat = Datum (JJJJ-MM-TT), von = Beginn (HH:MM)
       *   Abhaken        marks: Auftrag -> { v: 1/0, at: Zeitpunkt, sq: Änderungsnummer } (nur Disponent)
       *
       * ABSCHNITTE (der Reihe nach)
       *   Zustand · Gerät/Schriftgröße/Theme · Upload · Prüfobjekt-Texte · Excel-Export · Ergebnisse & Status ·
       *   Zeitrückmeldung · Prüfobjekte bewerten · Outbox · Server-Zugriff & Cache · Skeleton-Platzhalter · Abgleich (poll) · Abhaken ·
       *   Filter & Karten · Fortschritt/Frist · Vergleich · Fortschritt aller Teams · Geräteübersicht · Update · Nachrichten & Push ·
       *   Tooltip & Suche · Verlassen-Warnung · Zeichnen (draw …) · Start
       * ================================================================================================= */
      // Wurzelelement der Seite (<main id="app">); draw() baut hier alles hinein
      const app = document.getElementById('app');
      const APPVER = '__APPVER__'; // setzt der Server beim Ausliefern ein; weicht die Server-Version ab, ist ein Update da
      // neue Server-Version (falls abweichend von APPVER) – zeigt das Update-Banner
      let newVersion = '';
      /**
       * Baut ein DOM-Element: el('div', { class: 'card', onclick: fn }, kind1, [kind2, …]).
       * props: `class`, `onXyz` (Event-Listener), `value` (Eigenschaft), sonst Attribute; null/false werden ignoriert.
       * Kinder: Text oder Elemente, Arrays werden flachgezogen, null/false übersprungen (praktisch für `bedingung && el(…)`).
       */
      const el = (tag, props, ...children) => {
        const node = document.createElement(tag);
        for (const k in props || {}) {
          const v = props[k];
          if (v == null || v === false) continue;
          if (k === 'class') node.className = v;
          else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
          else if (k === 'value') node.value = v;
          else node.setAttribute(k, v);

        node.append(...children.flat().filter(x => x != null && x !== false));
        return node;
      };
      // ---- Zustand (global; render() zeichnet die Seite daraus neu) ----
      // Server-Stand / Cache
      // syncSeq: letzte Änderungsnummer des Servers, die wir kennen (poll holt nur Neueres)
      let syncSeq = 0,
        // cacheKey: Schlüssel des geladenen lokalen Caches: 'dispo' oder 'm:<Team>'
        cacheKey = '',
        // teamList: [[Team, Anzahl Aufträge]] vom Server
        teamList = [],
        // ordersMap: Auftragsnummer -> Auftrag
        ordersMap = new Map(),
        // resultSeq: Auftragsnummer -> Änderungsnummer des Ergebnisses auf dem Server (Basis für Konflikterkennung)
        resultSeq = new Map(),
        // checklistDiskCache: { team, seq, map } – Prüfobjekt-Listen des eigenen Teams, in IndexedDB (siehe prefetchChecklists)
        checklistDiskCache = null,
        // pollAgain: während eines Abgleichs wurde ein weiterer angefordert -> danach genau einmal nachholen
        pollAgain = false,
        // dispoToken: Bearer-Token nach erfolgreicher PIN-Eingabe des Disponenten
        dispoToken = '',
        // serverReachable: false nach einem Netzwerkfehler (zeigt „Offline“)
        serverReachable = true,
        // isPolling: gerade läuft ein Abgleich
        isPolling = false,
        // cacheSaveTimer: Verzögerung, damit der Cache nicht bei jeder Änderung geschrieben wird
        cacheSaveTimer = null,
        // ordersByTeam: Team -> { team, rows } (aus ordersMap abgeleitet, siehe rebuildOrdersByTeam)
        ordersByTeam = new Map(),
        // uploadMeta: Infos zum letzten Auftrags-Upload { at, files, count }
        uploadMeta = null,
        // dataReady: erste Daten (Cache oder Server) sind da
        dataReady = false,
        // canWrite: Schreibzugriff (Upload/Löschen anzeigen)
        canWrite = true,
        // errorMsg / infoMsg: rote Fehlermeldung bzw. neutrale Meldung oben auf der Seite
        errorMsg = '',
        infoMsg = '',
        // busy: Upload oder Export läuft (Schaltflächen gesperrt)
        busy = false,
        // armWipeOrders / armWipeChecklists: erster Klick auf „Alle … löschen“ ist erfolgt, zweiter bestätigt
        armWipeOrders = false,
        // searchText: Suchfeld (Auftrag, Kurztext, Straße …)
        searchText = '',
        // teamFilter: Team-Filter in der Dispo-Übersicht ('' = alle)
        teamFilter = '',
        // openOrder: gerade geöffneter Auftrag (Detailansicht) oder null
        openOrder = null,
        // checklist: Prüfobjekte des offenen Auftrags: { st: 'load' | 'ok' | 'err', list, m (Fehlertext) }
        checklist = {},
        // checklistMeta: Infos zum letzten Prüflos-Upload { at, files, count, orders }
        checklistMeta = null,

        sendState = new Map(),

        dispoTab = 'ue',

        statusFilter = '',

        armAllOk = false,

        monteurFilter = 'open',

        reportedFilter = '',
        reportedFrom = '',

      // ---- Geräteübersicht (Disponent) ----

      let deviceTeamFilter = '',

        deviceId = '',
        ackQueue = [],
        // registeredTeam / registeredRole: Team und Rolle ('monteur' | 'dispo'), die der Server von diesem Gerät kennt
        registeredTeam = null,

      try {

      // ---- Gaswarngerät (tägliche Bestätigung je Team) ----
      // gasRows: „Tag|Team“ -> { d, t, at, rec, n, sq } (Bestätigungen vom Server, Monteur: nur eigenes Team) ·

      // gasQueue: [{ team, at }] Bestätigungen, die noch nicht beim Server sind (ohne Netz bestätigt, im Gerät gesichert)
      let gasRows = new Map(),

        gasReady = false,

      try {

      if (!/^[a-f0-9]{32}$/.test(deviceId)) {

      // session: { role: 'monteur' | 'dispo' | null, team } – wird im Gerät gespeichert

      // ---- Schriftgröße (nur Monteur) ----

      const applyFontScale = () => {

      // eine Stufe größer (+1) oder kleiner (-1), im Gerät gespeichert. Die Schrift gleitet in FONT_ANIM_MS auf die neue
      // Größe; währenddessen hält ein Anker die Liste an derselben Bildschirmstelle (sonst wandert sie beim Wachsen weg).
      const FONT_ANIM_MS = 300;
      let fontAnimTimer = null;
      const changeFontScale = direction => {
        const index = FONT_SCALES.indexOf(fontScale) + direction;
        if (index < 0 || index >= FONT_SCALES.length) return;
        fontScale = FONT_SCALES[index];
        try {
          localStorage.setItem('fz', fontScale);
        } catch (e) {}
        const animate = !matchMedia('(prefers-reduced-motion: reduce)').matches,

        if (animate) {
          document.documentElement.classList.add('fz-anim');
          clearTimeout(fontAnimTimer);
          fontAnimTimer = setTimeout(() => document.documentElement.classList.remove('fz-anim'), FONT_ANIM_MS + 50);
        }
        render();
        if (!anchors.length) return;
        let held = true;
        const stop = () => (held = false),
          end = performance.now() + FONT_ANIM_MS + 50;
        addEventListener('touchstart', stop, { once: true, passive: true });
        addEventListener('wheel', stop, { once: true, passive: true });
        const hold = () => {
          for (const [key, top] of anchors) {
            const n = app.querySelector('[data-k="' + key + '"]');
            if (n) {
              const d = n.getBoundingClientRect().top - top;
              if (Math.abs(d) >= 1) scrollBy(0, d);

      // ---- Hell/Dunkel ----
      // Hell/Dunkel: ohne eigene Wahl folgt die App der Einstellung des Handys; Wahl wird je Gerät gespeichert
      const darkMediaQuery = matchMedia('(prefers-color-scheme: dark)');

      // true, wenn gerade dunkel dargestellt wird (eigene Wahl, sonst Systemeinstellung)
      const isDark = () => (themeChoice ? themeChoice === 'dark' : darkMediaQuery.matches);
      // Schalter „Dunkel“ in der Kopfzeile

        'button',

      // wendet die Wahl an: data-theme am <html>, Klasse .dk (für Logo/Hover), Statusleistenfarbe des Browsers
      function applyTheme() {

      // ---- Hilfsfunktionen ----

      // Text aus einer Exception (oder beliebigem Wert)
      const errorMessageOf = e => (e && e.message ? e.message : String(e));

      // ---- Skeleton-Platzhalter (während etwas lädt) ----

      const skeletonBar = (width = '100%', height = '1em') =>

      // Platzhalter der Teamauswahl: count große Schaltflächen

      // Platzhalter der Prüfobjekte: je Eintrag eine Textzeile und zwei Schaltflächen

      const skeletonTable = () =>

        );

      // ---- Upload (Disponent) ----
      /**
       * Auftrags-Excel(s) lesen (im Web Worker) und hochladen. keep = true: nur ergänzen/aktualisieren,
       * sonst werden Aufträge der enthaltenen Teams durch die Datei ersetzt (Server: POST /api/orders).
       */
      async function uploadOrders(files, keep) {

        infoMsg = 'Lese Datei …';
        render();
        try {
          const rows = new Map();
          let skip = 0;
          for (const f of files) {

          infoMsg =

      async function uploadChecklists(files) {
        busy = true;

        render();

      // Alle Prüfobjekte löschen (DELETE /api/pruef)
      async function wipeChecklists() {

      }
      // ---- Prüfobjekt-Texte lesbar machen (nur Monteur-Ansicht; Dispo und Export zeigen den Originaltext) ----
      // Beispiele aus den Prüflosen:
      //   „VL 1210 Am Spitz DN125 RL“           -> Verteilleitung 1210 Am Spitz DN125 – Rücklauf
      //   „AL UHM001 1210 Am Spitz 8 VL“        -> Abzweigleitung Schacht UHM001 1210 Am Spitz 8 – Vorlauf
      //   „KH RL AL 1210 Am Spitz 8 SHM911“     -> Kugelhahn am Rücklauf der Abzweigleitung 1210 Am Spitz 8 im Schacht SHM911
      // Kürzel: VL/AL = Verteil-/Abzweigleitung (am Anfang), VL/RL = Vor-/Rücklauf (hinten), KH = Kugelhahn,
      // Ü = Überlauf, E = Entleerung. Schachtbezeichnung = 3 Buchstaben + 3 Ziffern (z. B. SHM911).
      const LINE_NAMES = { VL: 'Verteilleitung', AL: 'Abzweigleitung' },
        FLOW_NAMES = { VL: 'Vorlauf', RL: 'Rücklauf' },
        PART_NAMES = { KH: 'Kugelhahn', E: 'Entleerung', Ü: 'Überlauf' },
        SHAFT_PATTERN = /^[A-Z]{3}\d{3}$/;
      /**
       * Wandelt den Kurztext eines Prüfobjekts in einen lesbaren Satz um. Erkennt zwei Muster:
       *   1) Leitung:  <VL|AL> <Ort/Schacht …> <VL|RL>
       *   2) Bauteil:  <KH|Ü|E> <VL|RL> <VL|AL> <Ort …> [Schacht]
       * Alles andere kommt unverändert zurück (der Monteur sieht dann den Originaltext).
       */
      function humanizeChecklistText(text) {
        const words = String(text).trim().split(/\s+/),
          shaftLabel = x => (SHAFT_PATTERN.test(x) ? 'Schacht ' + x : x);
        // „VL 1210 Am Spitz DN125 RL“ / „AL UHM001 1210 Am Spitz 8 VL“
        if (LINE_NAMES[words[0]] && FLOW_NAMES[words[words.length - 1]] && words.length > 2)
          return `${LINE_NAMES[words[0]]} ${words.slice(1, -1).map(shaftLabel).join(' ')} – ${FLOW_NAMES[words[words.length - 1]]}`;
        // „KH RL AL 1210 Am Spitz 8 SHM911“ (Bauteil, Vor-/Rücklauf, Leitungsart, Ort, Schacht)
        const part = PART_NAMES[words[0].toUpperCase()],
          flow = FLOW_NAMES[words[1]],
          lineType = LINE_NAMES[words[2]];
        if (part && flow && lineType && words.length > 3) {
          const shaft = SHAFT_PATTERN.test(words[words.length - 1]) ? words.pop() : '',
            place = words.slice(3).join(' ');
          return `${part} am ${flow} der ${lineType}${place ? ' ' + place : ''}${shaft ? ' im Schacht ' + shaft : ''}`;
        }
        return text;
      }
      // ---- Excel-Export ----
      // Anzeigetexte der Status-Werte (siehe orderStatus)
      const STATUS_LABELS = { done: 'Erledigt', teil: 'In Arbeit', offen: 'Offen' };
      /**
       * Excel-Export der übergebenen Aufträge (Disponent): holt die Prüfobjekt-Listen vom Server, baut zwei Tabellen
       * (Blatt „Aufträge“: eine Zeile je Auftrag; Blatt „Prüfobjekte“: eine Zeile je Prüfobjekt) und lässt die Datei im
       * Web Worker erzeugen. Die Spalte „Abgehakt am“ wird auch vom Vergleich (drawComparison) gelesen.
       * Veraltete Bewertungen (Prüfliste wurde nach der Bewertung geändert) werden als „veraltet“ gekennzeichnet.
       */
      async function exportXlsx(rows) {
        busy = true;
        errorMsg = '';
        infoMsg = 'Erstelle Excel …';
        render();
        try {
          const lists = new Map(
            Object.entries(
              (await api('POST', '/api/pruef/get', { ids: rows.map(order => order.auftrag) }, 120000)).map
            )
          );
          const orderRows = [
            [
              'Auftrag',
              'Team (Verantw. Arb. Pl.)',
              'Techn. Platz',
              'Auftragsart',
              'PLZ',
              'Straße',
              'Kurztext',
              'Eckstarttermin',
              'Eckendtermin',
              'Status',
              'Prüfergebnis',
              'Prüfobjekte gesamt',
              'OK',
              'Nicht OK',
              'Offen',
              'Durchgeführt am',
              'Beginn (Uhrzeit)',
              'Dauer (Min)',
              'Dauer (Std)',
              'Zeit zurückgemeldet am',
              'Nicht OK – Prüfobjekt → Text',
              'Hinweis',
              'Abgehakt am'
            ]
          ];
          const checklistRows = [
            [
              'Auftrag',
              'Team',
              'Auftrag Kurztext',
              'Pos.',
              'Prüfobjekt (Kurztext)',
              'Ergebnis',
              'Text bei Nicht OK'
            ]
          ];
          for (const order of rows) {
            const items = lists.get(order.auftrag) || [],
              status = orderStatus(order),
              count = items.length,
              valid = !!(status.s && count > 0 && status.n === count && status.s.length === count),
              stale = !!(status.s && count > 0 && !valid),
              total = count || status.n;
            orderRows.push([
              order.auftrag,
              order.team,
              order.tp,
              order.art,
              order.plz,
              order.str,
              order.kurz,
              order.start,
              order.ende,
              STATUS_LABELS[stale && status.st === 'done' ? 'teil' : status.st],
              status.nx > 0
                ? status.op > 0
                  ? 'Nicht OK (unvollständig)'
                  : 'Nicht OK'
                : status.n > 0 && !status.op
                  ? 'OK'
                  : status.ok > 0
                    ? 'unvollständig'
                    : '',
              total,
              status.ok,
              status.nx,
              Math.max(0, total - status.ok - status.nx),
              isoToExcelDate(performedDate(status)),
              timeToExcelFraction(status.von),
              status.min != null ? status.min : null,
              status.min != null ? Math.round((status.min / 60) * 100) / 100 : null,
              status.tat ? new Date(status.tat).toLocaleString('de-AT') : null,
              status.nok.map(z => (z.m ? `${z.t} → ${z.m}` : z.t)).join(' | '),
              stale ? 'Prüfliste seit der Bewertung geändert' : '',
              markState(order.auftrag)
                ? new Date(marks.get(order.auftrag).at).toLocaleString('de-AT') +
                  (markState(order.auftrag) === 2 ? ' (danach geändert)' : '')
                : null
            ]);
            items.forEach((t, i) => {
              const itemMark = valid ? status.s[i] : '-',
                z = valid ? status.nok.find(z => z.i === i) : null;
              checklistRows.push([
                order.auftrag,
                order.team,
                order.kurz,
                i + 1,
                t,
                stale ? 'veraltet' : itemMark === 'o' ? 'OK' : itemMark === 'x' ? 'Nicht OK' : 'Offen',
                z ? z.m : ''
              ]);
            });
          }
          const out = await runExcelWorker({
            type: 'xlsx',
            A: orderRows,
            P: checklistRows,
            dc: orderRows[0].indexOf('Durchgeführt am'),
            tc: orderRows[0].indexOf('Beginn (Uhrzeit)')
          });
          const fileName =
            'Pruefergebnisse' +
            (teamFilter ? '_' + teamFilter.replace(/[^A-Za-z0-9_-]/g, '_') : '') +
            (statusFilter ? '_' + statusFilter : '') +
            (reportedRange()
              ? '_RM_' + (reportedRange()[0] || '') + '_bis_' + (reportedRange()[1] || '')
              : '') +
            '_' +
            new Date().toLocaleDateString('sv-SE') +
            '.xlsx';
          const url = URL.createObjectURL(
            new Blob([out], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })
          );
          const link = document.createElement('a');
          link.href = url;
          link.download = fileName;
          document.body.append(link);
          link.click();
          link.remove();
          setTimeout(() => URL.revokeObjectURL(url), 10000);
          infoMsg = `Export bereit: ${rows.length} Aufträge, ${checklistRows.length - 1} Prüfobjekte`;
        } catch (e) {
          infoMsg = '';
          if (e && e.code === 'declined') infoMsg = 'Download abgebrochen';
          else errorMsg = 'Export fehlgeschlagen: ' + (e.message || e);
        }
        busy = false;
        render();
      }
      // ---- Auftrag öffnen ----
      /** Öffnet die Detailansicht: Zeitfelder aus dem Ergebnis vorbelegen, Prüfobjekte aus dem Zwischenspeicher oder vom Server laden. */
      async function openOrderDetail(order) {
        openOrder = order;
        armAllOk = false;
        editIndex = null;
        checklist = { st: 'load' };
        const existingResult = resultOf(order.auftrag);
        timeHours =
          existingResult && existingResult.min != null ? String(Math.floor(existingResult.min / 60)) : '';
        timeMinutes = existingResult && existingResult.min != null ? String(existingResult.min % 60) : '';
        timeError = '';
        timeDate =
          existingResult && existingResult.min != null ? performedDate(existingResult) || today() : today();
        timeStart =
          existingResult && existingResult.min != null && existingResult.von ? existingResult.von : '';
        timeFormAtOpen = timeFormSnapshot();
        render();
        try {
          let items = checklistsByOrder.get(order.auftrag);
          if (!items) {
            items = (await api('GET', '/api/pruef?a=' + encodeURIComponent(order.auftrag))).list;
            checklistsByOrder.set(order.auftrag, items);
          }
          if (!openOrder || openOrder.auftrag !== order.auftrag) return;
          checklist = { st: 'ok', list: items };
        } catch (e) {
          if (!openOrder || openOrder.auftrag !== order.auftrag) return;
          checklist = {
            st: 'err',
            m: e.net ? 'Keine Verbindung – Prüfobjekte noch nicht geladen' : errorMessageOf(e)
          };
        }
        render();
      }

      // ---- Ergebnisse und Status ----
      // Ergebnis-Dokument eines Auftrags (Format siehe Kopfkommentar): erst die noch nicht gesendete Eingabe (outbox), sonst der Stand vom Server
      const resultOf = orderNo => outbox.get(orderNo) || results.get(orderNo);
      /**
       * Status eines Auftrags, abgeleitet aus dem Ergebnis-Dokument:
       *   st = 'done'  erledigt: alle Prüfobjekte bewertet UND Zeitrückmeldung vollständig
       *        'teil'  begonnen (etwas bewertet oder Zeit erfasst)
       *        'offen' noch nichts erfasst
       *   op = Anzahl noch offener Prüfobjekte; nx > 0 (Nicht OK) gilt unabhängig davon – ein Auftrag kann
       *   „Nicht OK“ UND erledigt (oder in Arbeit) sein.
       */
      const orderStatus = order => {
        const result = resultOf(order.auftrag);
        if (!result) return { st: 'offen', ok: 0, n: 0, nx: 0, op: 0, nok: [] };
        const openCount = Math.max(0, (result.n | 0) - (result.ok | 0) - (result.nx | 0));
        return {
          ...result,
          op: openCount,
          nok: (result.nok || []).map(z => (typeof z === 'string' ? { t: z, m: '' } : z)),
          st:
            result.n > 0 && !openCount && timeComplete(result)
              ? 'done'
              : result.ok + result.nx > 0 || result.min != null
                ? 'teil'
                : 'offen'
        };
      };
      // Etiketten („Nicht OK“, „Erledigt“, „x von y offen“) für die Auftragskarte
      const statusTags = order => {
        const status = orderStatus(order);
        return [
          status.nx > 0 && el('span', { class: 'tag st-nok' }, `✗ Nicht OK (${status.nx})`),
          status.st === 'done'
            ? el('span', { class: 'tag st-ok' }, '✓ Erledigt')
            : status.st === 'teil' && status.op > 0
              ? el('span', { class: 'tag st-teil' }, `◐ ${status.op} von ${status.n} offen`)
              : status.st === 'teil' && status.n > 0
                ? el('span', { class: 'tag st-teil' }, 'Alle geprüft')
                : null
        ];
      };
      // Zeitrückmeldung vollständig = Datum + Beginn + Dauer
      const timeComplete = result =>
        !!(result && result.min >= 1 && performedDate(result) && /^\d{2}:\d{2}$/.test(result.von || ''));
      // true, wenn der Auftrag erledigt ist
      const isFinished = order => orderStatus(order).st === 'done';
      // Zeile mit Filter-Chips: items = [[Schlüssel, Beschriftung, Anzahl]]; current = aktiver Schlüssel; select setzt ihn
      const filterChips = (items, cur, set) =>
        el(
          'div',
          { class: 'chips', 'data-k': 'fc' },
          items.map(([k, l, n]) =>
            el(
              'button',
              {
                class: 'chip' + (k === 'nok' ? ' nk' : '') + (cur === k ? ' on' : ''),
                onclick: () => {
                  set(k);
                  render();
                }
              },
              `${l} (${n})`
            )
          )
        );
      // Änderungsnummer (Stand vom Server), auf der eine Eingabe beruht. Läuft bei schnellen Folgeeingaben mit
      // (siehe sendPending); der Server lehnt Eingaben ab, wenn inzwischen ein anderes Gerät gespeichert hat.
      const serverBaseOf = a => {
        const p = outbox.get(a);
        return p && p._b != null ? p._b : resultSeq.get(a) || 0;
      };
      // entfernt das interne Feld _b, bevor ein Ergebnis als „Stand vom Server“ gemerkt wird
      const withoutBase = d => {
        const { _b, ...o } = d;
        return o;
      };
      /**
       * Speichert die Bewertung eines Auftrags: baut das Ergebnis-Dokument aus state (Status-String, 'o'/'x'/'-' je
       * Prüfobjekt) und nokTexts (Text je Index), legt es in die Outbox und stößt das Senden an. Bereits erfasste
       * Zeitfelder bleiben erhalten.
       */
      function saveChecklistState(order, items, state, nokTexts = {}) {
        const nokItems = [...state].flatMap((c, k) =>
          c === 'x' ? [{ i: k, t: items[k], m: nokTexts[k] || '' }] : []
        );
        const result = resultOf(order.auftrag);
        outbox.set(order.auftrag, {
          _b: serverBaseOf(order.auftrag),
          a: order.auftrag,
          team: order.team,
          n: state.length,
          ok: [...state].filter(c => c === 'o').length,
          nx: nokItems.length,
          s: state,
          nok: nokItems,
          ...(result && result.min != null
            ? {
                min: result.min,
                ...(result.tat ? { tat: result.tat } : {}),
                ...(result.dat ? { dat: result.dat } : {}),
                ...(result.von ? { von: result.von } : {})
              }
            : {})
        });
        errorMsg = '';
        saveOutbox();
        render();
        sendPending(order.auftrag);
      }
      /**
       * Aktueller Bewertungsstand für die übergebene Prüfliste: { s: Status-String, T: Text je Index }.
       * Ein veraltetes Ergebnis (andere Listenlänge als die aktuelle Prüfliste) zählt als leer.
       */
      function currentChecklistState(orderNo, items) {
        const result = resultOf(orderNo),
          count = items.length;
        if (!(result && result.s && result.n === count && result.s.length === count))
          return { s: '-'.repeat(count), T: {} };
        const nokTexts = {};
        for (const z of result.nok || []) if (z && z.i != null) nokTexts[z.i] = z.m || '';
        return { s: result.s, T: nokTexts };
      }
      // ---- Zeitrückmeldung: Felder min (Minuten), tat (Zeitpunkt), dat (Datum), von (Beginn) im selben Ergebnis-Dokument ----
      // Dauer als Text: 90 -> „1 Std 30 Min“
      const formatMinutes = m =>
        m >= 60 ? `${Math.floor(m / 60)} Std${m % 60 ? ' ' + (m % 60) + ' Min' : ''}` : `${m} Min`;
      // Zeit-Etikett: Dauer, oder Warnung, sobald am Auftrag gearbeitet wurde, die Zeitrückmeldung aber fehlt/unvollständig ist
      const timeTag = r => {
        const d = resultOf(r.auftrag);
        if (timeComplete(d)) return el('span', { class: 'tag' }, '⏱ ' + formatMinutes(d.min));
        if (d && d.min != null) return el('span', { class: 'tag st-zf' }, '⏱ Beginn fehlt');
        return d && d.ok + d.nx > 0 ? el('span', { class: 'tag st-zf' }, '⏱ Zeit fehlt') : null;
      };
      // Datums-/Zeit-Helfer. today() liefert JJJJ-MM-TT in Ortszeit (Locale „sv-SE“ liefert genau dieses Format)
      const today = () => new Date().toLocaleDateString('sv-SE');
      // JJJJ-MM-TT -> TT.MM.JJJJ
      const formatIsoDate = i => (i ? i.split('-').reverse().join('.') : '');
      // JJJJ-MM-TT -> Excel-Datumszahl (Tage seit 1900), für echte Datumszellen im Export
      const isoToExcelDate = v =>
        /^\d{4}-\d{2}-\d{2}$/.test(v || '')
          ? Math.round(Date.UTC(+v.slice(0, 4), +v.slice(5, 7) - 1, +v.slice(8, 10)) / 864e5) + 25569
          : null;
      // HH:MM -> Bruchteil eines Tages (Excel-Uhrzeit)
      const timeToExcelFraction = v =>
        /^\d{2}:\d{2}$/.test(v || '') ? (+v.slice(0, 2) * 60 + +v.slice(3, 5)) / 1440 : null;
      // „Durchgeführt am“: das gewählte Datum, sonst das Datum der Rückmeldung
      const performedDate = d => d.dat || (d.tat ? new Date(d.tat).toLocaleDateString('sv-SE') : '');
      /**
       * Speichert Zeitfelder im Ergebnis-Dokument (min > 0) bzw. löscht sie (min leer/0). Gibt es noch keine gültige
       * Bewertung, wird ein leeres Dokument angelegt – so kann die Zeit vor den Prüfobjekten erfasst werden.
       */
      function storeTime(order, items, minutes, date, start) {
        timeFormAtOpen = timeFormSnapshot();
        const result = resultOf(order.auftrag),
          count = items.length,
          listValid = !!(result && result.s && result.n === count && result.s.length === count);
        const doc = {
          ...(listValid
            ? result
            : { a: order.auftrag, team: order.team, n: count, ok: 0, nx: 0, s: '-'.repeat(count), nok: [] })
        };
        delete doc.min;
        delete doc.tat;
        delete doc.dat;
        delete doc.von;
        if (minutes > 0) {
          doc.min = minutes;
          doc.tat = Date.now();
          if (date) doc.dat = date;
          if (start) doc.von = start;
        }
        doc._b = serverBaseOf(order.auftrag);
        outbox.set(order.auftrag, doc);
        errorMsg = '';
        saveOutbox();
        render();
        sendPending(order.auftrag);
      }
      // Prüft die Eingaben der Zeitkarte (Datum nicht leer/zukünftig, Beginn, Dauer 1 Min – 24 Std) und speichert sie
      function validateAndStoreTime(order, items) {
        const minutes = (parseInt(timeHours || '0', 10) || 0) * 60 + (parseInt(timeMinutes || '0', 10) || 0);
        const fail = message => {
          timeError = message;
          playErrorSound();
          render();
        };
        if (!/^\d{4}-\d{2}-\d{2}$/.test(timeDate)) return fail('Bitte ein Datum wählen.');
        if (timeDate > today()) return fail('Das Datum liegt in der Zukunft.');
        if (!/^\d{2}:\d{2}$/.test(timeStart || '')) return fail('Bitte die Beginn-Uhrzeit angeben.');
        if (minutes < 1 || minutes > 1440)
          return fail('Bitte eine Dauer zwischen 1 Minute und 24 Stunden eingeben.');
        timeError = '';
        storeTime(order, items, minutes, timeDate, timeStart);
      }
      // Löscht die erfasste Zeit (Felder leeren und Zeitangaben im Ergebnis entfernen)
      function deleteTime(order, items) {
        timeHours = '';
        timeMinutes = '';
        timeError = '';
        timeStart = '';
        timeDate = today();
        storeTime(order, items, null);
      }
      /**
       * Karte „Zeit“: zeigt die erfasste Zeit mit Hinweisen, warum der Auftrag noch nicht „erledigt“ ist.
       * Für den Monteur (isMonteur) zusätzlich Eingabefelder: Datum (Heute/Gestern), Beginn (Jetzt), Dauer
       * (Schnellwahl + Stunden/Minuten) und Speichern/Löschen.
       */
      function timeCard(order, isMonteur) {
        const result = resultOf(order.auftrag),
          items = checklist.st === 'ok' ? checklist.list : null,
          hasTime = !!(result && result.min != null);
        const timePanel = el(
          'div',
          { class: 'card', 'data-zeit': '1', 'data-k': 'zc' },
          el('b', {}, 'Zeit'),
          el(
            'p',
            { class: 'mu' },
            hasTime
              ? `Durchgeführt am ${formatIsoDate(performedDate(result)) || '–'}${result.von ? ' · ab ' + result.von + ' Uhr' : ''} · Dauer ${formatMinutes(result.min)}`
              : 'Noch keine Zeit zurückgemeldet.'
          )
        );
        if (hasTime && !timeComplete(result))
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              'Zeitrückmeldung unvollständig (Beginn fehlt) – Auftrag zählt noch nicht als erledigt.'
            )
          );
        else if (!hasTime && result && result.n > 0 && result.ok + result.nx === result.n)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              'Alle Prüfobjekte bewertet – für „Erledigt“ fehlt noch die Zeitrückmeldung.'
            )
          );
        else if (hasTime && orderStatus(order).op > 0)
          timePanel.append(
            el(
              'p',
              { class: 'mu er' },
              `Zeit erfasst – für „Erledigt“ ${orderStatus(order).op === 1 ? 'fehlt noch 1 Prüfobjekt' : 'fehlen noch ' + orderStatus(order).op + ' Prüfobjekte'}.`
            )
          );
        if (!isMonteur) return timePanel;
        const numberInput = (k, v, set) =>
          el('input', {
            class: 'tm',
            type: 'text',
            inputmode: 'numeric',
            maxlength: '2',
            'data-keep': k,
            placeholder: '0',
            value: v,
            oninput: e => {
              set((e.target.value = e.target.value.replace(/\D/g, '')));
            }
          });
        const yesterday = () => {
          const g = new Date();
          g.setDate(g.getDate() - 1);
          return g.toLocaleDateString('sv-SE');
        };
        timePanel.append(
          el('div', { class: 'mu' }, 'Durchgeführt am'),
          el(
            'div',
            { class: 'zt', 'data-k': 'zd' },
            el('input', {
              class: 'dt',
              type: 'date',
              max: today(),
              'data-nr': '1',
              value: timeDate,
              oninput: e => {
                timeDate = e.target.value;
              },
              onchange: e => {
                timeDate = e.target.value;
              }
            }),
            el(
              'button',
              {
                onclick: () => {
                  timeDate = today();
                  timeError = '';
                  render();
                }
              },
              'Heute'
            ),
            el(
              'button',
              {
                onclick: () => {
                  timeDate = yesterday();
                  timeError = '';
                  render();
                }
              },
              'Gestern'
            )
          ),
          el('div', { class: 'mu' }, 'Beginn (Uhrzeit)'),
          el(
            'div',
            { class: 'zt', 'data-k': 'zv' },
            el('input', {
              class: 'dt',
              type: 'time',
              'data-nr': '1',
              value: timeStart,
              oninput: e => {
                timeStart = e.target.value;
              },
              onchange: e => {
                timeStart = e.target.value;
              }
            }),
            el(
              'button',
              {
                onclick: () => {
                  timeStart = new Date().toTimeString().slice(0, 5);
                  timeError = '';
                  render();
                }
              },
              'Jetzt'
            ),
            timeStart &&
              el(
                'button',
                {
                  onclick: () => {
                    timeStart = '';
                    render();
                  }
                },
                '✕'
              )
          ),
          el('div', { class: 'mu' }, 'Dauer'),
          el(
            'div',
            { class: 'qk', 'data-k': 'zq' },
            [15, 30, 60, 90, 120, 180].map(m =>
              el(
                'button',
                {
                  onclick: () => {
                    timeHours = String(Math.floor(m / 60));
                    timeMinutes = String(m % 60);
                    timeError = '';
                    render();
                  }
                },
                formatMinutes(m)
              )
            )
          ),
          el(
            'div',
            { class: 'zt', 'data-k': 'zh' },
            numberInput('h', timeHours, v => {
              timeHours = v;
            }),
            el('span', {}, 'Std'),
            numberInput('m', timeMinutes, v => {
              timeMinutes = v;
            }),
            el('span', {}, 'Min')
          ),
          timeError && el('p', { class: 'mu er' }, timeError),
          el(
            'div',
            { class: 'ob', 'data-k': 'zb' },
            el(
              'button',
              {
                class: 'sv',
                disabled: items ? null : 'disabled',
                onclick: () => validateAndStoreTime(order, items)
              },
              hasTime ? 'Zeit ändern' : 'Zeit speichern'
            ),
            hasTime && el('button', { class: 'er', onclick: () => deleteTime(order, items) }, 'Löschen')
          )
        );
        return timePanel;
      }
      // ---- Prüfobjekte bewerten (Monteur) ----
      // ersetzt ein Zeichen des Status-Strings (Index i -> c)
      const replaceCharAt = (s, i, c) => s.slice(0, i) + c + s.slice(i + 1);
      // „OK“ eines Prüfobjekts umschalten (OK <-> offen); ein vorhandener Nicht-OK-Text geht dabei verloren
      function toggleOk(order, items, index) {
        armAllOk = false;
        editIndex = null;
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        saveChecklistState(
          order,
          items,
          replaceCharAt(state, index, state[index] === 'o' ? '-' : 'o'),
          nokTexts
        );
      }
      // Öffnet das Eingabefeld für den „Nicht OK“-Text des Prüfobjekts index (text = bisheriger Text)
      function openNokEditor(index, text) {
        editIndex = index;
        editText = text || '';
        editTextMissing = false;
        render();
        const field = app.querySelector('[data-keep="e"]');
        if (field) field.focus();
      }
      // „Nicht OK“ speichern – der Text ist Pflicht
      function saveNokText(order, items, index) {
        const text = editText.trim();
        if (!text) {
          editTextMissing = true;
          playErrorSound();
          render();
          return;
        }
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        nokTexts[index] = text;
        editIndex = null;
        armAllOk = false;
        saveChecklistState(order, items, replaceCharAt(state, index, 'x'), nokTexts);
      }
      // Setzt ein Prüfobjekt zurück auf „offen“
      function resetItem(order, items, index) {
        const { s: state, T: nokTexts } = currentChecklistState(order.auftrag, items);
        editIndex = null;
        saveChecklistState(order, items, replaceCharAt(state, index, '-'), nokTexts);
      }
      // ---- Outbox: ungesendete Ergebnisse ----
      // Ungesendete Ergebnisse liegen in `outbox` (und in localStorage) und werden automatisch erneut gesendet.
      // outboxOffline: es gab vorübergehende Sendefehler; retryTimer: nächster Versuch; prefetching: Vorab-Laden läuft
      let outboxOffline = false,
        retryTimer = null,
        prefetching = false;
      // Outbox im Gerät sichern (übersteht Neuladen und App-Neustart)
      const saveOutbox = () => {
        try {
          localStorage.setItem('outbox', JSON.stringify([...outbox]));
        } catch (e) {}
      };
      // Outbox beim Start aus dem Gerät laden
      const loadOutbox = () => {
        try {
          for (const [a, d] of JSON.parse(localStorage.getItem('outbox') || '[]')) outbox.set(a, d);
        } catch (e) {}
      };
      // nächster Sendeversuch in 15 Sekunden
      const scheduleRetry = () => {
        clearTimeout(retryTimer);
        retryTimer = setTimeout(sendAllPending, 15000);
      };
      // alle noch ungesendeten Aufträge senden
      const sendAllPending = () => {
        for (const a of [...outbox.keys()]) sendPending(a);

      /**
       * Sendet das Ergebnis eines Auftrags (PUT /api/ergebnis/<Auftrag>). Pro Auftrag läuft nur eine Sendung gleichzeitig;
       * kommt währenddessen eine neue Eingabe, wird sie danach nachgesendet (schnelle Folgeeingaben).

      async function sendPending(orderNo) {
        const state = sendState.get(orderNo) || sendState.set(orderNo, {}).get(orderNo);
        if (state.busy) {
          state.dirty = true;
          return;
        }
        state.busy = true;
        try {
          let lastDoc = null,
            seq = 0,
            doc = outbox.get(orderNo);

            // nur erneut senden, wenn wirklich eine neue Eingabe dazukam
            lastDoc = doc;
            state.dirty = false;
            seq = (await api('PUT', '/api/ergebnis/' + encodeURIComponent(orderNo), doc)).sq;
            const newer = outbox.get(orderNo);
            if (!newer || newer === doc) break;
            newer._b = seq;
            saveOutbox();
            doc = newer; // eigene Folgeeingabe beruht jetzt auf diesem Stand
          }
          if (lastDoc) {
            results.set(orderNo, withoutBase(lastDoc));
            resultSeq.set(orderNo, seq);
          }
          outbox.delete(orderNo);
          saveOutbox();
          serverReachable = true;
          if (outboxOffline && !outbox.size) {
            outboxOffline = false;
            const m = (infoMsg = '✓ Alle Eingaben wurden übertragen');
            setTimeout(() => {
              if (infoMsg === m) {
                infoMsg = '';
                render();
              }

          }

          if (e && e.status === 409) {

            const conflict = e.data || {};

            saveOutbox();
            if (conflict.doc) {
              results.set(orderNo, conflict.doc);
              resultSeq.set(orderNo, conflict.sq | 0);
            } else {
              results.delete(orderNo);
              resultSeq.delete(orderNo);
            }
            toast(
              `⚠ Auftrag ${orderNo} wurde gleichzeitig auf einem anderen Gerät geändert. Es gilt der Stand vom Server – deine letzte Eingabe wurde nicht übernommen.`

          } else if (e && e.status >= 400 && e.status < 500 && e.status !== 408 && e.status !== 429) {
            // dauerhafter Fehler: Eingabe verwerfen und Fehler anzeigen
            outbox.delete(orderNo);

          } else {
            // vorübergehend (kein Netz, Serverfehler): behalten, später erneut senden
            outboxOffline = true;
            if (e && e.net) serverReachable = false;
            scheduleRetry();
          }
        }
        state.busy = false;
        render();
      }

      // Kurzmeldung unten am Bildschirm – sichtbar egal wie weit gescrollt ist; geht nach einigen Sekunden oder per Tipp weg
      const toastEl = el('div', { class: 'toast', role: 'status', 'aria-live': 'polite' });
      document.body.append(toastEl);
      let toastTimer = null;
      toastEl.addEventListener('click', () => toastEl.classList.remove('on'));

      }
      // ---- Fehlerton (nur Monteur) ----
      // Ein kurzer, tiefer Doppelton, wenn etwas fehlt oder schiefgeht (fehlende Zeitangabe, leerer Nicht-OK-Text, Auftrag
      // nicht vollständig ausgefüllt, Fehlermeldung oben). Der Klang wird im Browser erzeugt (Web Audio, keine Datei, geht auch
      // offline). Browser erlauben Ton erst nach der ersten Bedienung: darum wird der Ton bei Klick/Tipp/Taste freigeschaltet.
      // Ist das Gerät stummgeschaltet, bleibt er stumm. errorSoundAt: Zeitpunkt des letzten Tons (nie öfter als alle 700 ms).
      let audioCtx = null,
        errorSoundAt = 0;
      function unlockAudio() {
        try {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!audioCtx && AudioCtx) audioCtx = new AudioCtx();
          if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
        } catch (e) {}
      }
      for (const eventName of ['click', 'keydown', 'touchend']) addEventListener(eventName, unlockAudio, true);
      function playErrorSound() {
        if (session.role !== 'monteur' || !audioCtx || audioCtx.state !== 'running') return;
        if (Date.now() - errorSoundAt < 700) return;
        errorSoundAt = Date.now();
        try {
          const t0 = audioCtx.currentTime + 0.02,
            master = audioCtx.createGain();
          master.gain.value = 0.22;
          master.connect(audioCtx.destination);
          // zwei fallende Töne (G4, D4): [Frequenz in Hz, Beginn in s]
          for (const [freq, start] of [
            [392, 0],
            [294, 0.17]

            const osc = audioCtx.createOscillator(),
              env = audioCtx.createGain(),
              at = t0 + start;
            osc.type = 'triangle';
            osc.frequency.value = freq;
            env.gain.setValueAtTime(0.0001, at);
            env.gain.exponentialRampToValueAtTime(1, at + 0.02);
            env.gain.exponentialRampToValueAtTime(0.0001, at + 0.3);

            env.connect(master);
            osc.start(at);
            osc.stop(at + 0.32);

      // ---- Server-Zugriff ----
      /**
       * JSON-Aufruf an den Server (Standard-Timeout 20 s). Sendet Dispo-Token und Upload-Token, falls vorhanden.
       * Fehler: Netzwerkfehler -> Error mit `net = true`; HTTP-Fehler -> Error mit `status` und `data` (Antwort).
       * 401: abgelaufener Upload-PIN -> nur dessen Abfrage zurücksetzen; abgelaufene Anmeldung -> Disponent muss PIN neu eingeben.
       */
      async function api(method, url, body, timeout = 20000) {
        const abortController = new AbortController(),
          timer = setTimeout(() => abortController.abort(), timeout);
        let response;
        try {
          response = await fetch(url, {
            method,
            headers: {
              'Content-Type': 'application/json',

              ...(uploadToken ? { 'X-Upload-Token': uploadToken } : {})

            body: body === undefined ? undefined : JSON.stringify(body),

          throw n;

          payload = await response.json();

          e.data = payload;

            render();

          throw e;

        return payload;

      // Excel im Hintergrund lesen/schreiben (Web Worker /worker.js, damit die Oberfläche nicht einfriert).

      const runExcelWorker = (msg, tr) =>
        new Promise((ok, no) => {
          const w = new Worker('/worker.js');
          w.onmessage = e => {
            w.terminate();
            e.data.error ? no(new Error(e.data.error)) : ok(e.data.res);

      // Zwischenspeicher im Gerät (IndexedDB, keine 5-MB-Grenze): Objektspeicher „kv“ mit

      // get(key) liefert bei Fehlern undefined; set(key, value) wirft bei Fehlern.
      const idb = {
        p: null,
        open() {

            this.p ||

              const r = indexedDB.open('auftraege', 1);

      const cacheKeyForSession = () =>

            orders: [...ordersMap.values()],
            ergebnis: Object.fromEntries(

            meta: uploadMeta,
            pmeta: checklistMeta,

            gas: [...gasRows.values()]

      // ---- Abgleich mit dem Server ----

      async function poll() {

          return;
        }

        if (!key) return;
        isPolling = true;
        try {
          if (key !== cacheKey) {
            cacheKey = key;

            render();

            undefined,

          // danach neu auslöst (Geräteübersicht geöffnet oder „Standorte jetzt aktualisieren“), erscheint die Kurzmeldung.
          const announceLocate =

          locateRoundSeen = response.locate || 0;

            for (const r of response.orders || []) {

      // [[Team, Anzahl]] sortiert

      // ---- Abhaken (nur Disponent) ----

      /**

      const reportedRange = () =>

              : reportedFilter === 'm'

                : reportedFilter === 'z'

      // Tag, an dem die Zeit zurückgemeldet wurde (JJJJ-MM-TT) oder ''
      const reportedDate = r => {
